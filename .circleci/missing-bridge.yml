version: 2.1
jobs:
  missing-durable-bridge:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run:
          name: Refuse lossy 30-way harvest
          command: |
            echo 'FLEET_GITHUB_TOKEN is not configured in CircleCI.' >&2
            echo 'The 30-way compute pool is connected but will not harvest until it can persist every source pack durably back to GitHub Releases.' >&2
            exit 1
workflows:
  durability-gate:
    jobs:
      - missing-durable-bridge
