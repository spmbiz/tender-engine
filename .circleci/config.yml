version: 2.1

jobs:
  austender-rss-egress-smoke:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run:
          name: Fetch official AusTender Current ATM RSS from CircleCI egress
          command: |
            set -euo pipefail
            URL='https://www.tenders.gov.au/public_data/rss/rss.xml'
            CODE="$(curl -sS -L -o /tmp/austender-rss.xml -D /tmp/austender-headers.txt -w '%{http_code}' \
              --connect-timeout 15 --max-time 60 \
              -H 'Accept: application/rss+xml, application/xml, text/xml;q=0.9, */*;q=0.2' \
              -A 'Mozilla/5.0 (compatible; Tender-Engine-CircleCI-AusTender-Probe/1.0)' \
              "$URL")"
            echo "austender_http=${CODE}"
            sed -n '1,30p' /tmp/austender-headers.txt || true
            echo "bytes=$(wc -c </tmp/austender-rss.xml || echo 0)"
            test "$CODE" = '200'
            test -s /tmp/austender-rss.xml
            grep -Eqi '<rss|<channel|<item' /tmp/austender-rss.xml
            echo 'CIRCLE_AUSTENDER_RSS_EGRESS_PASS'

workflows:
  austender-egress-probe:
    jobs:
      - austender-rss-egress-smoke:
          filters:
            branches:
              only: circleci-austender-probe
