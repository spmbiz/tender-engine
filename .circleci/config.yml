version: 2.1

jobs:
  executor-smoke:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify Circle executor and checkout
          command: |
            set -euo pipefail
            echo "circle_build=${CIRCLE_BUILD_NUM:-unknown}"
            echo "cpu=$(getconf _NPROCESSORS_ONLN || true)"
            awk '/MemTotal/{print "memory_kb=" $2}' /proc/meminfo || true
            test -f .circleci/config.yml
            echo 'CIRCLE_EXECUTOR_SMOKE_PASS'

  github-egress-smoke:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify outbound GitHub API connectivity
          command: |
            set -euo pipefail
            curl -fsS --retry 3 --retry-all-errors --connect-timeout 10 https://api.github.com/rate_limit >/tmp/github-rate.json
            grep -q 'rate' /tmp/github-rate.json
            echo 'CIRCLE_GITHUB_EGRESS_PASS'

  contracts-finder-source-smoke:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify official Contracts Finder daily CSV route
          command: |
            set -euo pipefail
            Y="$(date -u -d 'yesterday' +%Y)"
            M="$(date -u -d 'yesterday' +%-m)"
            D="$(date -u -d 'yesterday' +%-d)"
            URL="https://www.contractsfinder.service.gov.uk/Harvester/Notices/Data/CSV/${Y}/${M}/${D}"
            CODE="$(curl -sS -o /tmp/contracts-finder.csv -w '%{http_code}' --connect-timeout 15 --max-time 90 "$URL")"
            echo "contracts_finder_http=${CODE}"
            if [ "$CODE" = '403' ]; then
              echo 'Contracts Finder source is rate-limiting this egress IP. Official cooldown is 5 minutes.' >&2
              exit 23
            fi
            test "$CODE" = '200'
            test -s /tmp/contracts-finder.csv
            head -n 1 /tmp/contracts-finder.csv | grep -qi 'releases/0/ocid'
            echo 'CONTRACTS_FINDER_DAILY_CSV_PASS'

  durable-bridge:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run:
          name: Verify durable GitHub persistence bridge and write permission
          command: |
            set -euo pipefail
            if [ -z "${FLEET_GITHUB_TOKEN:-}" ]; then
              echo 'FLEET_GITHUB_TOKEN is not configured in CircleCI.' >&2
              exit 20
            fi
            REPO="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            AUTH="Authorization: Bearer ${FLEET_GITHUB_TOKEN}"
            CODE="$(curl -sS -o /tmp/repo.json -w '%{http_code}' -H "$AUTH" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${REPO}")"
            test "$CODE" = '200'
            echo 'FLEET_GITHUB_TOKEN_CONTENTS_WRITE_READY'

  austender-rss-egress-smoke:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run:
          name: Fetch official AusTender Current ATM RSS and persist result
          command: |
            set -euo pipefail
            URL='https://www.tenders.gov.au/public_data/rss/rss.xml'
            CODE="$(curl -sS -L -o /tmp/austender-rss.xml -D /tmp/austender-headers.txt -w '%{http_code}' --connect-timeout 15 --max-time 60 -H 'Accept: application/rss+xml, application/xml, text/xml;q=0.9, */*;q=0.2' -A 'Mozilla/5.0 (compatible; Tender-Engine-CircleCI-AusTender-Probe/1.0)' "$URL" || true)"
            BYTES="$(wc -c </tmp/austender-rss.xml 2>/dev/null || echo 0)"
            XML=false
            if [ -s /tmp/austender-rss.xml ] && grep -Eqi '<rss|<channel|<item' /tmp/austender-rss.xml; then XML=true; fi
            SHA=''
            if [ -s /tmp/austender-rss.xml ]; then SHA="$(sha256sum /tmp/austender-rss.xml | awk '{print $1}')"; fi
            PASS=false
            if [ "$CODE" = '200' ] && [ "$XML" = true ]; then PASS=true; fi
            python3 - <<PY
            import json
            from datetime import datetime, timezone
            p={
              'schema':'AUSTENDER_CIRCLECI_EGRESS_PROBE_V1',
              'generated_at':datetime.now(timezone.utc).isoformat(),
              'source_url':'$URL',
              'http_status':'$CODE',
              'bytes':int('$BYTES' or 0),
              'xml_proven':'$XML'=='true',
              'sha256':'$SHA' or None,
              'pass': '$PASS'=='true',
              'circle_build':'${CIRCLE_BUILD_NUM:-unknown}',
              'circle_sha':'${CIRCLE_SHA1:-unknown}',
            }
            open('/tmp/austender_circleci_probe.json','w').write(json.dumps(p,indent=2)+'\n')
            print(json.dumps(p,indent=2))
            PY
            REPO="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            API="https://api.github.com/repos/${REPO}/contents/control/austender_circleci_probe.json"
            AUTH="Authorization: Bearer ${FLEET_GITHUB_TOKEN}"
            EXISTING_SHA="$(curl -fsS -H "$AUTH" -H 'Accept: application/vnd.github+json' "$API?ref=main" 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("sha", ""))' 2>/dev/null || true)"
            CONTENT="$(base64 -w0 /tmp/austender_circleci_probe.json)"
            python3 - <<PY >/tmp/payload.json
            import json
            p={'message':'diag: persist AusTender CircleCI egress probe','content':'$CONTENT','branch':'main'}
            sha='$EXISTING_SHA'
            if sha:p['sha']=sha
            print(json.dumps(p))
            PY
            WRITE_CODE="$(curl -sS -o /tmp/write.json -w '%{http_code}' -X PUT -H "$AUTH" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' "$API" --data-binary @/tmp/payload.json)"
            echo "persist_http=$WRITE_CODE"
            test "$WRITE_CODE" = '200' -o "$WRITE_CODE" = '201'
            test "$PASS" = true

  historical-worker-smoke:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    environment:
      CF_FAIL_FAST_ON_403: "1"
    steps:
      - checkout
      - run:
          name: Install worker dependency
          command: python -m pip install --disable-pip-version-check -q requests
      - run:
          name: Run one-day durable daily-CSV smoke on medium executor
          command: >-
            python pipeline/circleci_contracts_daily_worker.py --index 1 --total 1 --history-days 2 --max-days 1 --out circle-out/historical-smoke

  contracts-finder-daily-shards:
    parallelism: 30
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    environment:
      CF_403_COOLDOWN_SECONDS: "300"
    steps:
      - checkout
      - run:
          name: Install minimal worker dependency
          command: python -m pip install --disable-pip-version-check -q requests
      - run:
          name: Harvest non-overlapping official daily CSV dates
          command: >-
            python pipeline/circleci_contracts_daily_worker.py --index "$CIRCLE_NODE_INDEX" --total "$CIRCLE_NODE_TOTAL" --history-days 360 --out "circle-out/daily-shard-$CIRCLE_NODE_INDEX"

  live-search-worker-smoke:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    environment:
      CIRCLE_IO_WORKERS: "1"
      CF_FAIL_FAST_ON_403: "1"
    steps:
      - checkout
      - run:
          name: Install worker dependency
          command: python -m pip install --disable-pip-version-check -q requests
      - run:
          name: Smoke current Search API separately from historical harvest
          command: >-
            python pipeline/circleci_contracts_worker.py --index 0 --total 1 --history-days 1 --io-workers 1 --max-pages 3 --out circle-out/live-smoke

workflows:
  circleci-harvest:
    jobs:
      - executor-smoke:
          filters:
            branches:
              only: circleci-fleet
      - github-egress-smoke:
          requires: [executor-smoke]
          filters:
            branches:
              only: circleci-fleet
      - contracts-finder-source-smoke:
          requires: [executor-smoke]
          filters:
            branches:
              only: circleci-fleet
      - durable-bridge:
          requires: [github-egress-smoke]
          filters:
            branches:
              only: circleci-fleet
      - austender-rss-egress-smoke:
          requires: [durable-bridge]
          filters:
            branches:
              only: circleci-fleet
      - historical-worker-smoke:
          requires: [durable-bridge, contracts-finder-source-smoke]
          filters:
            branches:
              only: circleci-fleet
      - live-search-worker-smoke:
          requires: [durable-bridge]
          filters:
            branches:
              only: circleci-fleet
      - contracts-finder-daily-shards:
          requires: [historical-worker-smoke]
          filters:
            branches:
              only: circleci-fleet
