version: 2.1
jobs:
  contracts-finder-shards:
    parallelism: 30
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run: python -m pip install --disable-pip-version-check -q requests
      - run:
          name: Harvest non-overlapping Contracts Finder publication window
          command: >-
            python pipeline/circleci_contracts_worker.py
            --index "$CIRCLE_NODE_INDEX"
            --total "$CIRCLE_NODE_TOTAL"
            --history-days 360
            --out "circle-out/shard-$CIRCLE_NODE_INDEX"
  aggregate-circle-harvest:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run: python -m pip install --disable-pip-version-check -q requests
      - run: python pipeline/circleci_aggregate.py
workflows:
  circleci-harvest:
    jobs:
      - contracts-finder-shards
      - aggregate-circle-harvest:
          requires:
            - contracts-finder-shards
