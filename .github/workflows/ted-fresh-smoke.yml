name: TED Fresh Smoke (Manual Test)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q requests
      - name: Run TED freshness smoke
        env:
          TED_SCOPE: ACTIVE
          TED_MAX_PAGES: '2'
          TED_LOOKBACK_DAYS: '120'
          DISCOVERY_OUT: discovery/ted-smoke
        run: python pipeline/discover_ted.py
      - name: Require non-empty materialization
        run: |
          python - <<'PY'
          import json
          s=json.load(open('discovery/ted-smoke/stats.json'))
          print(json.dumps(s,indent=2))
          assert s['materialized_unique'] > 0, s
          assert not s['errors'], s
          PY
      - name: Persist smoke durably
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="ted-fresh-smoke-${GITHUB_RUN_ID}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "TED Fresh Smoke ${GITHUB_RUN_ID}" --notes "Durable validation of the TED freshness query."
          tar -C discovery/ted-smoke -czf ted-fresh-smoke.tar.gz .
          gh release upload "$tag" ted-fresh-smoke.tar.gz
