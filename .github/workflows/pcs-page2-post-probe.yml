name: PCS Page2 POST Probe

on:
  push:
    branches: [main]
    paths:
      - 'control/pcs_page2_post_probe_trigger.txt'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q playwright
      - name: Reuse runner Chrome
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$chrome" ]; then echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"; else python -m playwright install --with-deps chromium; fi
      - run: python tools/probe_pcs_page2_post.py
      - name: Persist probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f control/pcs_page2_post_probe.json || exit 1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/pcs_page2_post_probe.json
          git diff --cached --quiet && exit 0
          git commit -m "diag: persist PCS Page2 POST probe ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
