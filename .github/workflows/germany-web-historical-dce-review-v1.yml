name: Germany Web Historical DCE Review v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/germany-web-historical-dce-review-v1.yml'

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -q duckdb requests pypdf python-docx openpyxl python-pptx 'playwright>=1.46,<2'
          command -v 7z >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full)
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$chrome" ]; then echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"; else python -m playwright install --with-deps chromium; fi
      - name: Download canonical Germany facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source out review
          gh release download tender-normalized-global-core-v4 --repo walidgdg1-ai/coldemailtool --pattern historical_tenders.parquet --dir source --clobber
      - name: Build reconstructed official notice queue
        shell: bash
        run: |
          python - <<'PY'
          import duckdb,json,hashlib,re
          from pathlib import Path
          p='source/historical_tenders.parquet'; con=duckdb.connect()
          rows=con.execute(r'''SELECT Warehouse_Source,Historical_Tender_ID,Country,Buyer_Name,Title,Publication_Date,Official_Notice_ID
            FROM read_parquet(?)
            WHERE lower(cast(Warehouse_Source as varchar))='germany'
              AND Official_Notice_ID IS NOT NULL AND trim(cast(Official_Notice_ID as varchar))<>''
              AND (
                regexp_matches(lower(cast(Title as varchar)), '(website|webseite|internetauftritt|webauftritt).{0,90}(pflege|wartung|betreuung|support|hosting|betrieb)')
                OR regexp_matches(lower(cast(Title as varchar)), '(pflege|wartung|betreuung|support|hosting|betrieb).{0,90}(website|webseite|internetauftritt|webauftritt)')
                OR regexp_matches(lower(cast(Title as varchar)), '(relaunch|neugestaltung|entwicklung|redesign).{0,90}(website|webseite|internetauftritt|webportal)')
                OR regexp_matches(lower(cast(Title as varchar)), '(website|webseite|internetauftritt|webportal).{0,90}(relaunch|neugestaltung|entwicklung|redesign)')
                OR (regexp_matches(lower(cast(Title as varchar)), '(typo3|typo 3|drupal|wordpress)') AND regexp_matches(lower(cast(Title as varchar)), '(website|webseite|support|cms)'))
              )
            ORDER BY Publication_Date DESC, Historical_Tender_ID''',[p]).fetchall()
          chosen=[]; seen_buyers=set()
          for src,tid,country,buyer,title,pub,nid in rows:
            b=(buyer or '').strip().casefold()
            if b and b in seen_buyers: continue
            if b: seen_buyers.add(b)
            tl=(title or '').lower()
            if re.search(r'(typo3|typo 3|drupal|wordpress)',tl): niche='DE · TYPO3 / Drupal / WordPress CMS'
            elif re.search(r'(relaunch|neugestaltung|entwicklung|redesign)',tl): niche='DE · Website relaunch / development'
            else: niche='DE · Website maintenance / support'
            url='https://oeffentlichevergabe.de/ui/de/search/details?noticeId='+str(nid).strip()
            pub_s = pub.isoformat() if hasattr(pub,'isoformat') else str(pub or '')
            chosen.append({'candidate_id':'de-hist:'+hashlib.sha256(str(tid).encode()).hexdigest()[:18],'historical':True,'historical_sub_niche':niche,'source':'Germany','portal':'DE_DOE','country':'GERMANY','buyer':buyer or '', 'title':title or '', 'publication_date':pub_s, 'official_notice_id':str(nid),'primary_source_url':url,'notice_url':url,'route':{'detail_url':url},'final_verdict_allowed':False})
            if len(chosen)>=9: break
          assert len(chosen)>=6,len(chosen)
          with open('source/germany_queue.jsonl','w',encoding='utf-8') as f:
            for x in chosen:f.write(json.dumps(x,ensure_ascii=False,separators=(',',':'))+'\n')
          Path('source/queue_summary.json').write_text(json.dumps({'selected':len(chosen),'candidates':chosen},indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps({'selected':len(chosen),'titles':[x['title'] for x in chosen]},indent=2,ensure_ascii=False))
          PY
      - name: Resolve with live DCE worker
        env:
          DCE_LOCAL_CONCURRENCY: '3'
          DCE_ITEM_RETRIES: '1'
          DCE_ITEM_TIMEOUT_SECONDS: '180'
        shell: bash
        run: |
          n="$(wc -l < source/germany_queue.jsonl)"; lines="$(seq -s, 1 "$n")"
          python pipeline/dce_batch_worker.py --queue source/germany_queue.jsonl --lines "$lines" --out out --concurrency 3 --retries 1 --timeout-seconds 180
      - name: Extract evidence
        run: |
          python pipeline/extract_corpus.py --root out
          python pipeline/dce_evidence_quality.py --root out
          python pipeline/extract_gates.py --root out
          python pipeline/summarize_historical_subniche_dce.py --root out --out review
          python pipeline/extract_historical_gate_evidence_pack.py --root out --out review/evidence --per-category 3
      - name: Persist Germany review
        shell: bash
        run: |
          mkdir -p control/germany_web_historical_dce_review_v1
          cp source/queue_summary.json control/germany_web_historical_dce_review_v1/queue_summary.json
          cp review/summary.json control/germany_web_historical_dce_review_v1/summary.json
          cp review/REPORT.md control/germany_web_historical_dce_review_v1/REPORT.md
          cp review/candidate_dce_review.jsonl control/germany_web_historical_dce_review_v1/candidate_dce_review.jsonl
          cp -r review/evidence control/germany_web_historical_dce_review_v1/evidence
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/germany_web_historical_dce_review_v1/
          git commit -m 'tenders: persist Germany web historical DCE review v1' || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; git rebase --abort >/dev/null 2>&1 || true; sleep $((i*3)); done
          exit 1
