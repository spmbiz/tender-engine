name: DCE Hotfix Smoke

on:
  push:
    branches: [main]
    paths:
      - 'control/dce_hotfix_smoke.json'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Dispatch small live DCE smoke on current Qwen selection
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_run="$(python - <<'PY'
          import json
          print(json.load(open('control/qwen_live/selection_summary.json',encoding='utf-8'))['source_run'])
          PY
          )"
          gh workflow run dce-fanout-v2.yml --ref main \
            -f selection_path=queues/qwen_live_selection_latest.jsonl \
            -f source_discovery_run="$source_run" \
            -f max_jobs=24 \
            -f max_parallel=2 \
            -f max_shards=12 \
            -f jobs_per_shard=0
          echo "smoke dispatched source_run=$source_run"
