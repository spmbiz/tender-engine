name: Qwen Live Continuous Conveyor

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Qwen Live Notice Classification"]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'control/dce_attempt_ledger.jsonl'
      - 'pipeline/build_qwen_dce_selection.py'
      - '.github/workflows/qwen-live-conveyor.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: qwen-live-continuous-conveyor
  cancel-in-progress: true

env:
  QWEN_CLASSIFIER_VERSION: qwen3-4b-q4km-batch-selfheal-v1

jobs:
  conveyor:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ingest completed Qwen shards without racing the authoritative state writer
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tender-engine-bot'
          git config user.email 'tender-engine-bot@users.noreply.github.com'
          mkdir -p control/qwen_live conveyor-cache
          marker='control/qwen_live/incremental_processed.json'
          if [ ! -s "$marker" ]; then
            printf '{"schema":"QWEN_INCREMENTAL_SHARDS_V1","processed":{}}\n' > "$marker"
          fi

          pull_main() {
            for n in 1 2 3 4; do
              if git pull --rebase origin main; then return 0; fi
              git rebase --abort >/dev/null 2>&1 || true
              sleep "$((n * 2))"
            done
            return 1
          }

          push_checkpoint() {
            git add queues/qwen_live_selection_latest.jsonl control/qwen_live/ "$marker" 2>/dev/null || true
            if git diff --cached --quiet; then return 0; fi
            git commit -m "qwen: rolling unseen DCE conveyor ${GITHUB_RUN_ID}"
            for n in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then return 0; fi
              git rebase --abort >/dev/null 2>&1 || true
              sleep "$((n * 2))"
            done
            return 1
          }

          ensure_qwen_running() {
            local active
            active="$(gh run list --workflow qwen-live-classification.yml --limit 20 --json status --jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending")] | length')"
            if [ "$active" -eq 0 ]; then
              gh workflow run qwen-live-classification.yml --ref main \
                -f per_shard=192 \
                -f auto_continue=false \
                -f dce_limit=160
              echo 'Dispatched next 192-row bounded Qwen realtime pass.'
            else
              echo "Qwen realtime pass already active/queued: $active"
            fi
          }

          ensure_run_input() {
            local rid="$1"
            local root="conveyor-cache/run-$rid"
            if find "$root" -type f -name 'notice-intelligence-ledger-latest.jsonl.gz' -print -quit 2>/dev/null | grep -q .; then
              return 0
            fi
            rm -rf "$root"
            mkdir -p "$root"
            if ! gh run download "$rid" -n "qwen-live-input-$rid" -D "$root"; then
              rm -rf "$root"
              return 1
            fi
            find "$root" -type f -name 'notice-intelligence-ledger-latest.jsonl.gz' -print -quit | grep -q .
          }

          source_run_for_input() {
            local rid="$1"
            local manifest
            manifest="$(find "conveyor-cache/run-$rid" -type f -name 'snapshot-manifest-latest.json' -print -quit)"
            [ -n "$manifest" ] || return 1
            MANIFEST="$manifest" python - <<'PY'
          import json, os
          x=json.load(open(os.environ['MANIFEST'],encoding='utf-8'))
          print(x.get('source_discovery_run') or '')
          PY
          }

          stable_source_run() {
            local body
            body="$(gh release view qwen-classification-state-latest --json body --jq '.body' 2>/dev/null || true)"
            grep -oE 'source_run=[0-9]+' <<< "$body" | head -n1 | cut -d= -f2 || true
          }

          mark_names() {
            local rid="$1" names_file="$2"
            RID="$rid" NAMES_FILE="$names_file" MARKER="$marker" python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['MARKER'])
          try: d=json.loads(p.read_text(encoding='utf-8'))
          except Exception: d={'schema':'QWEN_INCREMENTAL_SHARDS_V1','processed':{}}
          proc=d.setdefault('processed',{})
          rid=str(os.environ['RID'])
          cur=set(proc.get(rid) or [])
          for line in Path(os.environ['NAMES_FILE']).read_text(encoding='utf-8').splitlines():
              if line.strip(): cur.add(line.strip())
          proc[rid]=sorted(cur)
          keys=sorted(proc,key=lambda x:int(x) if str(x).isdigit() else 0,reverse=True)
          d['processed']={k:proc[k] for k in keys[:12]}
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          }

          already_processed() {
            local rid="$1" name="$2"
            RID="$rid" NAME="$name" MARKER="$marker" python - <<'PY'
          import json,os
          try:d=json.load(open(os.environ['MARKER'],encoding='utf-8'))
          except Exception:d={}
          print('1' if os.environ['NAME'] in ((d.get('processed') or {}).get(str(os.environ['RID'])) or []) else '0')
          PY
          }

          # Merge completed shard artifacts locally. This function NEVER writes the
          # stable qwen-classification-state-latest Release. The main Qwen aggregate
          # is the only stable-state writer, eliminating asset clobber races and
          # metadata/asset divergence. The local merged state is still used below
          # for immediate DCE selection, preserving low latency.
          merge_incremental_state() {
            local rid="$1" source_run="$2" names_file="$3"
            local root="conveyor-cache/run-$rid"
            local ledger queue prev current_source local_source
            ledger="$(find "$root" -type f -name 'notice-intelligence-ledger-latest.jsonl.gz' -print -quit)"
            queue="$(find "$root" -type f -name 'notice-classification-queue-latest.jsonl.gz' -print -quit)"
            [ -n "$ledger" ] && [ -n "$queue" ] || return 1

            current_source="$(stable_source_run)"
            if [[ "$current_source" =~ ^[0-9]+$ ]] && [[ "$source_run" =~ ^[0-9]+$ ]] && [ "$current_source" -gt "$source_run" ]; then
              echo "Skipping obsolete incremental shard: artifact source=$source_run stable source=$current_source"
              return 2
            fi

            mkdir -p conveyor-cache/stable conveyor-cache/results conveyor-cache/publish
            local_source="$(cat conveyor-cache/publish/source_run.txt 2>/dev/null || true)"
            if [ "$local_source" = "$source_run" ] && [ -s conveyor-cache/publish/qwen-classification-state-latest.jsonl.gz ]; then
              prev='conveyor-cache/publish/qwen-classification-state-latest.jsonl.gz'
            else
              rm -rf conveyor-cache/stable conveyor-cache/publish
              mkdir -p conveyor-cache/stable conveyor-cache/publish
              gh release download qwen-classification-state-latest \
                --pattern qwen-classification-state-latest.jsonl.gz \
                --dir conveyor-cache/stable --clobber || true
              prev='conveyor-cache/stable/qwen-classification-state-latest.jsonl.gz'
              if [ ! -s "$prev" ]; then
                prev="$(find "$root" -type f \( -name 'qwen-state-current.jsonl.gz' -o -name 'qwen-classification-state-latest.jsonl.gz' \) -print -quit)"
              fi
            fi
            [ -n "$prev" ] && [ -s "$prev" ] || return 1

            rm -rf conveyor-cache/results/new
            mkdir -p conveyor-cache/results/new
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              mkdir -p "conveyor-cache/results/new/$name"
              gh run download "$rid" -n "$name" -D "conveyor-cache/results/new/$name"
            done < "$names_file"

            result_args=()
            while IFS= read -r f; do result_args+=(--results "$f"); done < <(find conveyor-cache/results/new -type f -name 'qwen-live-*-guarded.jsonl' -size +0c | sort)
            [ "${#result_args[@]}" -gt 0 ] || return 1

            python pipeline/merge_qwen_classification_state.py \
              --ledger "$ledger" \
              --classification-queue "$queue" \
              --previous-state "$prev" \
              "${result_args[@]}" \
              --target-classifier-version "$QWEN_CLASSIFIER_VERSION" \
              --state-out conveyor-cache/publish/qwen-classification-state-next.jsonl.gz \
              --queue-out conveyor-cache/publish/qwen-classification-remaining-latest.jsonl.gz \
              --summary-out conveyor-cache/publish/qwen-classification-merge-summary-latest.json
            mv conveyor-cache/publish/qwen-classification-state-next.jsonl.gz conveyor-cache/publish/qwen-classification-state-latest.jsonl.gz
            printf '%s\n' "$source_run" > conveyor-cache/publish/source_run.txt
            state_rows="$(python -c "import json;print(json.load(open('conveyor-cache/publish/qwen-classification-merge-summary-latest.json'))['state_rows_after_merge'])")"
            remaining="$(python -c "import json;print(json.load(open('conveyor-cache/publish/qwen-classification-merge-summary-latest.json'))['remaining_classification_queue'])")"
            echo "Incremental Qwen state merged locally only: qwen_run=$rid source=$source_run state=$state_rows remaining=$remaining"
            return 0
          }

          refresh_selection() {
            pull_main
            rm -rf conveyor-cache/selection-input conveyor-cache/selection-state
            mkdir -p conveyor-cache/selection-input conveyor-cache/selection-state control/qwen_live queues

            gh release download notice-intelligence-ledger-latest \
              --pattern notice-intelligence-ledger-latest.jsonl.gz \
              --pattern notice-classification-queue-latest.jsonl.gz \
              --pattern notice-ledger-summary-latest.json \
              --dir conveyor-cache/selection-input --clobber
            notes="$(gh release view notice-intelligence-ledger-latest --json body --jq '.body')"
            source_run="$(grep -oE 'run=[0-9]+' <<< "$notes" | head -n1 | cut -d= -f2)"
            if ! [[ "$source_run" =~ ^[0-9]+$ ]]; then
              name="$(gh release view notice-intelligence-ledger-latest --json name --jq '.name')"
              source_run="$(grep -oE '[0-9]{8,}' <<< "$name" | tail -n1)"
            fi
            [[ "$source_run" =~ ^[0-9]+$ ]] || { echo 'Cannot resolve current notice ledger source run'; return 1; }
            snapshot_tag="live-world-snapshot-${source_run}"
            gh release download "$snapshot_tag" \
              --pattern "live-open-tenders-${source_run}.jsonl.gz" \
              --pattern "snapshot-manifest-${source_run}.json" \
              --dir conveyor-cache/selection-input --clobber
            mv "conveyor-cache/selection-input/live-open-tenders-${source_run}.jsonl.gz" conveyor-cache/selection-input/live-open-tenders-latest.jsonl.gz

            local_source="$(cat conveyor-cache/publish/source_run.txt 2>/dev/null || true)"
            if [ "$local_source" = "$source_run" ] && [ -s conveyor-cache/publish/qwen-classification-state-latest.jsonl.gz ]; then
              cp conveyor-cache/publish/qwen-classification-state-latest.jsonl.gz conveyor-cache/selection-state/qwen-classification-state-latest.jsonl.gz
              echo "Selection uses local incremental state for source $source_run"
            else
              gh release download qwen-classification-state-latest \
                --pattern qwen-classification-state-latest.jsonl.gz \
                --dir conveyor-cache/selection-state --clobber
              echo "Selection uses authoritative stable state for source $source_run"
            fi
            test -s conveyor-cache/selection-state/qwen-classification-state-latest.jsonl.gz

            git show origin/main:control/controller_state_checkpoint.json > conveyor-cache/latest-controller-state.json 2>/dev/null || printf '{}\n' > conveyor-cache/latest-controller-state.json
            python pipeline/build_qwen_dce_selection.py \
              --state conveyor-cache/selection-state/qwen-classification-state-latest.jsonl.gz \
              --ledger conveyor-cache/selection-input/notice-intelligence-ledger-latest.jsonl.gz \
              --snapshot conveyor-cache/selection-input/live-open-tenders-latest.jsonl.gz \
              --blocked-state conveyor-cache/latest-controller-state.json \
              --attempt-ledger control/dce_attempt_ledger.jsonl \
              --out queues/qwen_live_selection_latest.jsonl \
              --summary control/qwen_live/selection_summary.json \
              --source-run "$source_run" \
              --limit 160
            if [ "$local_source" = "$source_run" ] && [ -s conveyor-cache/publish/qwen-classification-merge-summary-latest.json ]; then
              cp conveyor-cache/publish/qwen-classification-merge-summary-latest.json control/qwen_live/classification_summary.json
            fi

            selected="$(python -c "import json;print(json.load(open('control/qwen_live/selection_summary.json'))['selected'])")"
            attempted="$(python -c "import json;print(json.load(open('control/qwen_live/selection_summary.json')).get('durable_attempted_exact_versions_ignored',0))")"
            echo "Rolling selection refreshed: source=$source_run selected=$selected already_attempted_excluded=$attempted"
            push_checkpoint
            if [ "$selected" -gt 0 ]; then
              gh workflow run dce-queue-drainer.yml --ref main
            fi
          }

          refresh_selection
          ensure_qwen_running

          # Poll completed worker artifacts. Per-request Release checkpoints are no
          # longer required: each completed worker publishes one immutable Actions
          # artifact, which is enough for low-latency DCE handoff and dramatically
          # reduces GitHub API pressure.
          for cycle in $(seq 1 18); do
            rid="$(gh run list --workflow qwen-live-classification.yml --limit 8 --json databaseId,status,createdAt --jq '[.[] | select(.status=="in_progress" or .status=="completed")] | sort_by(.createdAt) | reverse | .[0].databaseId // empty')"
            if [[ "$rid" =~ ^[0-9]+$ ]] && ensure_run_input "$rid"; then
              source_run="$(source_run_for_input "$rid" || true)"
              if [[ "$source_run" =~ ^[0-9]+$ ]]; then
                : > /tmp/new-qwen-artifacts.txt
                while IFS= read -r name; do
                  [ -n "$name" ] || continue
                  if [ "$(already_processed "$rid" "$name")" = '0' ]; then
                    echo "$name" >> /tmp/new-qwen-artifacts.txt
                  fi
                done < <(gh api "repos/${REPO}/actions/runs/${rid}/artifacts?per_page=100" --jq '.artifacts[] | select(.expired==false) | .name' | grep "^qwen-live-result-.*-${rid}$" || true)

                if [ -s /tmp/new-qwen-artifacts.txt ]; then
                  echo "New completed Qwen shard artifacts detected for run $rid:"
                  cat /tmp/new-qwen-artifacts.txt
                  set +e
                  merge_incremental_state "$rid" "$source_run" /tmp/new-qwen-artifacts.txt
                  rc=$?
                  set -e
                  if [ "$rc" -eq 0 ]; then
                    mark_names "$rid" /tmp/new-qwen-artifacts.txt
                    refresh_selection
                  elif [ "$rc" -eq 2 ]; then
                    mark_names "$rid" /tmp/new-qwen-artifacts.txt
                    push_checkpoint || true
                  else
                    echo "Incremental merge failed rc=$rc; artifact remains unmarked for retry." >&2
                  fi
                fi
              fi
            fi
            ensure_qwen_running
            sleep 30
          done

          ensure_qwen_running
