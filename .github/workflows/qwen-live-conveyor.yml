name: Qwen Live Continuous Conveyor

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Qwen Live Notice Classification"]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'control/dce_attempt_ledger.jsonl'
      - 'pipeline/build_qwen_dce_selection.py'
      - 'pipeline/merge_qwen_classification_state.py'
      - '.github/workflows/qwen-live-conveyor.yml'

permissions:
  contents: write
  actions: write

# Single writer for qwen-incremental-state-latest and the durable live summary.
concurrency:
  group: qwen-live-state-writer
  cancel-in-progress: false

env:
  QWEN_CLASSIFIER_VERSION: qwen3-4b-q4km-batch-selfheal-v1
  INCREMENTAL_RELEASE: qwen-incremental-state-latest

jobs:
  conveyor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - id: select
        name: Select semantic generation and immutable input
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/run work/base work/checkpoints work/results work/publish control/qwen_live queues
          runs_json="$(gh run list --workflow qwen-live-classification.yml --limit 30 --json databaseId,status,conclusion,createdAt,event)"
          active_rid="$(jq -r '([.[] | select(.status=="in_progress" and .event=="workflow_dispatch")] | sort_by(.createdAt) | reverse | .[0].databaseId) // empty' <<< "$runs_json")"
          success_rid="$(jq -r '([.[] | select(.status=="completed" and .conclusion=="success" and .event=="workflow_dispatch")] | sort_by(.createdAt) | reverse | .[0].databaseId) // empty' <<< "$runs_json")"
          rid="${active_rid:-$success_rid}"
          if ! [[ "$rid" =~ ^[0-9]+$ ]]; then
            echo 'usable=false' >> "$GITHUB_OUTPUT"
            echo 'No active/successful controller-authorized semantic generation.'
            exit 0
          fi

          if ! gh run download "$rid" -n "qwen-live-input-$rid" -D work/run; then
            echo 'usable=false' >> "$GITHUB_OUTPUT"
            echo "Qwen run $rid has no immutable input artifact yet."
            exit 0
          fi
          manifest="$(find work/run -type f -name snapshot-manifest-latest.json -print -quit)"
          ledger="$(find work/run -type f -name notice-intelligence-ledger-latest.jsonl.gz -print -quit)"
          queue="$(find work/run -type f -name notice-classification-queue-latest.jsonl.gz -print -quit)"
          snapshot="$(find work/run -type f -name live-open-tenders-latest.jsonl.gz -print -quit)"
          [ -n "$manifest" ] && [ -n "$ledger" ] && [ -n "$queue" ] && [ -n "$snapshot" ] || { echo 'Incomplete Qwen input transport' >&2; exit 1; }
          source_run="$(MANIFEST="$manifest" python - <<'PY'
          import json,os
          print(json.load(open(os.environ['MANIFEST'],encoding='utf-8')).get('source_discovery_run') or '')
          PY
          )"
          [[ "$source_run" =~ ^[0-9]+$ ]] || { echo 'Invalid semantic source run' >&2; exit 1; }

          stable_body="$(gh release view qwen-classification-state-latest --json body --jq '.body' 2>/dev/null || true)"
          stable_source="$(grep -oE 'source_run=[0-9]+' <<< "$stable_body" | head -n1 | cut -d= -f2 || true)"
          if [[ "$stable_source" =~ ^[0-9]+$ ]] && [ "$stable_source" -gt "$source_run" ]; then
            echo 'usable=false' >> "$GITHUB_OUTPUT"
            echo "Selected source $source_run is obsolete versus stable $stable_source."
            exit 0
          fi

          if gh api "repos/${REPO}/contents/control/qwen_live/incremental_processed.json?ref=main" --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d > work/marker.json 2>/dev/null; then :; else
            printf '%s\n' '{"schema":"QWEN_INCREMENTAL_SHARDS_V2","processed":{}}' > work/marker.json
          fi

          gh api "repos/${REPO}/actions/runs/${rid}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired==false) | .name' \
            | grep "^qwen-live-result-.*-${rid}$" | sort > work/all-final-artifacts.txt || true
          RID="$rid" MARKER=work/marker.json ALL=work/all-final-artifacts.txt OUT=work/new-final-artifacts.txt python - <<'PY'
          import json,os
          from pathlib import Path
          try:d=json.loads(Path(os.environ['MARKER']).read_text(encoding='utf-8'))
          except Exception:d={}
          done=set(((d.get('processed') or {}).get(str(os.environ['RID'])) or []))
          names=[x.strip() for x in Path(os.environ['ALL']).read_text().splitlines() if x.strip()]
          Path(os.environ['OUT']).write_text(''.join(x+'\n' for x in names if x not in done),encoding='utf-8')
          PY
          final_count="$(grep -cve '^\s*$' work/new-final-artifacts.txt || true)"

          echo 'usable=true' >> "$GITHUB_OUTPUT"
          echo "rid=$rid" >> "$GITHUB_OUTPUT"
          echo "source_run=$source_run" >> "$GITHUB_OUTPUT"
          echo "ledger=$ledger" >> "$GITHUB_OUTPUT"
          echo "queue=$queue" >> "$GITHUB_OUTPUT"
          echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"
          echo "final_count=$final_count" >> "$GITHUB_OUTPUT"

      - id: collect
        name: Collect novel guarded rows from checkpoints and final artifacts
        if: steps.select.outputs.usable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ steps.select.outputs.rid }}
          SOURCE_RUN: ${{ steps.select.outputs.source_run }}
        shell: bash
        run: |
          set -euo pipefail
          base='work/base/qwen-state-base.jsonl.gz'
          inc_body="$(gh release view "$INCREMENTAL_RELEASE" --json body --jq '.body' 2>/dev/null || true)"
          inc_source="$(grep -oE 'source_run=[0-9]+' <<< "$inc_body" | head -n1 | cut -d= -f2 || true)"
          inc_run="$(grep -oE 'qwen_run=[0-9]+' <<< "$inc_body" | head -n1 | cut -d= -f2 || true)"
          if [ "$inc_source" = "$SOURCE_RUN" ] && [ "$inc_run" = "$RID" ]; then
            gh release download "$INCREMENTAL_RELEASE" --pattern qwen-incremental-state-latest.jsonl.gz --dir work/base --clobber
            mv work/base/qwen-incremental-state-latest.jsonl.gz "$base"
          else
            gh release download qwen-classification-state-latest --pattern qwen-classification-state-latest.jsonl.gz --dir work/base --clobber
            mv work/base/qwen-classification-state-latest.jsonl.gz "$base"
          fi
          test -s "$base"

          # Guarded live checkpoints are the only external worker heartbeat. They
          # contain only exact-context post-guarded rows and are safe to ingest.
          tag="qwen-live-progress-$RID"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release download "$tag" --pattern 'qwen-live-*-guarded-checkpoint.jsonl' --dir work/checkpoints --clobber >/dev/null 2>&1 || true
          fi

          if [ '${{ steps.select.outputs.final_count }}' != '0' ]; then
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              mkdir -p "work/results/$name"
              gh run download "$RID" -n "$name" -D "work/results/$name"
            done < work/new-final-artifacts.txt
          fi

          BASE="$base" ROOT=work OUT=work/novel-results.jsonl python - <<'PY'
          import gzip,json,os
          from pathlib import Path
          def cid(r):
              n=r.get('notice') if isinstance(r.get('notice'),dict) else {}
              return str(r.get('canonical_notice_id') or r.get('candidate_id') or r.get('id') or n.get('candidate_id') or n.get('i') or '').strip()
          def mh(r): return str(r.get('input_material_fields_hash') or r.get('material_fields_hash') or '').strip()
          known=set()
          with gzip.open(os.environ['BASE'],'rt',encoding='utf-8') as f:
              for raw in f:
                  raw=raw.strip()
                  if raw:
                      r=json.loads(raw); known.add((cid(r),mh(r)))
          files=list(Path(os.environ['ROOT']).glob('checkpoints/qwen-live-*-guarded-checkpoint.jsonl'))
          files+=list(Path(os.environ['ROOT']).glob('results/**/qwen-live-*-guarded.jsonl'))
          rows=[]
          for p in sorted(files):
              for lineno,raw in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
                  raw=raw.strip()
                  if not raw: continue
                  r=json.loads(raw); key=(cid(r),mh(r))
                  if not key[0] or not key[1]: raise SystemExit(f'missing id/hash {p}:{lineno}')
                  if key in known: continue
                  rows.append(r)
          Path(os.environ['OUT']).write_text(''.join(json.dumps(r,ensure_ascii=False,separators=(',',':'))+'\n' for r in rows),encoding='utf-8')
          print(json.dumps({'known_state_keys':len(known),'candidate_files':len(files),'novel_rows_including_equivalent_duplicates':len(rows)},sort_keys=True))
          PY
          novel="$(grep -cve '^\s*$' work/novel-results.jsonl || true)"
          echo "novel=$novel" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - id: merge
        name: Merge only when novel semantic rows exist
        if: steps.select.outputs.usable == 'true'
        env:
          LEDGER: ${{ steps.select.outputs.ledger }}
          QUEUE: ${{ steps.select.outputs.queue }}
          SNAPSHOT: ${{ steps.select.outputs.snapshot }}
          BASE: ${{ steps.collect.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ steps.collect.outputs.novel }}' = '0' ]; then
            cp "$BASE" work/publish/qwen-incremental-state-latest.jsonl.gz
            current='control/qwen_live/classification_summary.json'
            if [ -s "$current" ]; then cp "$current" work/publish/classification_summary.json; else printf '%s\n' '{}' > work/publish/classification_summary.json; fi
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'accepted=0' >> "$GITHUB_OUTPUT"
            echo "remaining=$(python -c "import json;d=json.load(open('work/publish/classification_summary.json'));print(int(d.get('remaining_classification_queue') or 0))")" >> "$GITHUB_OUTPUT"
            echo "state_rows=$(python -c "import json;d=json.load(open('work/publish/classification_summary.json'));print(int(d.get('state_rows_after_merge') or 0))")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python pipeline/merge_qwen_classification_state.py \
            --ledger "$LEDGER" \
            --classification-queue "$QUEUE" \
            --previous-state "$BASE" \
            --snapshot "$SNAPSHOT" \
            --results work/novel-results.jsonl \
            --target-classifier-version "$QWEN_CLASSIFIER_VERSION" \
            --state-out work/publish/qwen-incremental-state-latest.jsonl.gz \
            --queue-out work/publish/qwen-classification-remaining-latest.jsonl.gz \
            --summary-out work/publish/classification_summary.json
          accepted="$(python -c "import json;d=json.load(open('work/publish/classification_summary.json'));print(int((d.get('stats') or {}).get('results_accepted') or 0))")"
          remaining="$(python -c "import json;d=json.load(open('work/publish/classification_summary.json'));print(int(d['remaining_classification_queue']))")"
          state_rows="$(python -c "import json;d=json.load(open('work/publish/classification_summary.json'));print(int(d['state_rows_after_merge']))")"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "accepted=$accepted" >> "$GITHUB_OUTPUT"
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
          echo "state_rows=$state_rows" >> "$GITHUB_OUTPUT"

      - name: Advance final-artifact marker after successful collection
        if: steps.select.outputs.usable == 'true' && steps.select.outputs.final_count != '0'
        env:
          RID: ${{ steps.select.outputs.rid }}
        shell: bash
        run: |
          set -euo pipefail
          RID="$RID" MARKER=work/marker.json NAMES=work/new-final-artifacts.txt python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['MARKER'])
          try:d=json.loads(p.read_text(encoding='utf-8'))
          except Exception:d={'schema':'QWEN_INCREMENTAL_SHARDS_V2','processed':{}}
          proc=d.setdefault('processed',{}); rid=str(os.environ['RID']); cur=set(proc.get(rid) or [])
          cur.update(x.strip() for x in Path(os.environ['NAMES']).read_text().splitlines() if x.strip())
          proc[rid]=sorted(cur)
          keys=sorted(proc,key=lambda x:int(x) if str(x).isdigit() else 0,reverse=True)
          d['processed']={k:proc[k] for k in keys[:8]}
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Publish cumulative semantic state
        if: steps.select.outputs.usable == 'true' && steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ steps.select.outputs.rid }}
          SOURCE_RUN: ${{ steps.select.outputs.source_run }}
        shell: bash
        run: |
          set -euo pipefail
          notes="source_run=$SOURCE_RUN qwen_run=$RID writer=qwen-live-unified-conveyor-v3 authoritative=false exact_hash_merge=true"
          if gh release view "$INCREMENTAL_RELEASE" >/dev/null 2>&1; then gh release edit "$INCREMENTAL_RELEASE" --notes "$notes"; else gh release create "$INCREMENTAL_RELEASE" --target main --title 'Qwen Incremental State Latest' --notes "$notes"; fi
          gh release upload "$INCREMENTAL_RELEASE" \
            work/publish/qwen-incremental-state-latest.jsonl.gz \
            work/publish/qwen-classification-remaining-latest.jsonl.gz \
            work/publish/classification_summary.json --clobber

      - id: selection
        name: Refresh DCE selection from the single cumulative state
        if: steps.select.outputs.usable == 'true'
        env:
          SOURCE_RUN: ${{ steps.select.outputs.source_run }}
          SNAPSHOT: ${{ steps.select.outputs.snapshot }}
          LEDGER: ${{ steps.select.outputs.ledger }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:control/controller_state_checkpoint.json > work/controller-state.json 2>/dev/null || printf '{}\n' > work/controller-state.json
          git show origin/main:control/dce_attempt_ledger.jsonl > work/dce-attempt-ledger.jsonl 2>/dev/null || : > work/dce-attempt-ledger.jsonl
          python pipeline/build_qwen_dce_selection.py \
            --state work/publish/qwen-incremental-state-latest.jsonl.gz \
            --ledger "$LEDGER" \
            --snapshot "$SNAPSHOT" \
            --blocked-state work/controller-state.json \
            --attempt-ledger work/dce-attempt-ledger.jsonl \
            --out work/publish/qwen_live_selection_latest.jsonl \
            --summary work/publish/selection_summary.json \
            --source-run "$SOURCE_RUN" \
            --limit 160
          echo "selected=$(python -c "import json;print(int(json.load(open('work/publish/selection_summary.json')).get('selected') or 0))")" >> "$GITHUB_OUTPUT"

      - name: Persist durable summaries and selection
        if: steps.select.outputs.usable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          persist_file() {
            local path="$1" file="$2" message="$3" sha
            for delay in 0 2 5 10 20; do
              [ "$delay" -eq 0 ] || sleep "$delay"
              sha="$(gh api "repos/${REPO}/contents/${path}?ref=main" --jq '.sha' 2>/dev/null || true)"
              TARGET="$path" FILE="$file" SHA="$sha" MESSAGE="$message" python - <<'PY'
          import base64,json,os
          from pathlib import Path
          b={'message':os.environ['MESSAGE'],'content':base64.b64encode(Path(os.environ['FILE']).read_bytes()).decode(),'branch':'main'}
          if os.environ.get('SHA','').strip(): b['sha']=os.environ['SHA'].strip()
          Path('/tmp/qwen-put.json').write_text(json.dumps(b),encoding='utf-8')
          PY
              gh api --method PUT "repos/${REPO}/contents/${path}" --input /tmp/qwen-put.json >/dev/null 2>&1 && return 0
            done
            echo "Failed to persist $path" >&2; return 1
          }
          if [ '${{ steps.merge.outputs.changed }}' = 'true' ]; then
            persist_file control/qwen_live/classification_summary.json work/publish/classification_summary.json "qwen: persist unified classification ${GITHUB_RUN_ID}"
          fi
          persist_file control/qwen_live/selection_summary.json work/publish/selection_summary.json "qwen: persist unified selection ${GITHUB_RUN_ID}"
          persist_file queues/qwen_live_selection_latest.jsonl work/publish/qwen_live_selection_latest.jsonl "qwen: persist unified live selection ${GITHUB_RUN_ID}"
          if [ '${{ steps.select.outputs.final_count }}' != '0' ]; then
            persist_file control/qwen_live/incremental_processed.json work/marker.json "qwen: persist unified artifact marker ${GITHUB_RUN_ID}"
          fi

      - name: Wake bounded DCE after semantic publication
        if: steps.select.outputs.usable == 'true' && steps.selection.outputs.selected != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run dce-queue-drainer.yml --ref main || true

      - name: Summary
        if: always()
        run: |
          echo '### Qwen unified conveyor' >> "$GITHUB_STEP_SUMMARY"
          echo "- qwen run: ${{ steps.select.outputs.rid }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- source: ${{ steps.select.outputs.source_run }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- novel guarded rows: ${{ steps.collect.outputs.novel }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- accepted: ${{ steps.merge.outputs.accepted }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- remaining: ${{ steps.merge.outputs.remaining }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- DCE selection: ${{ steps.selection.outputs.selected }}" >> "$GITHUB_STEP_SUMMARY"
          echo '- one state writer; no checkpoint-vs-final writer race; no no-op semantic merge.' >> "$GITHUB_STEP_SUMMARY"
