name: Apply PCS Postback V4

on:
  push:
    branches: [main]
    paths:
      - 'control/pcs_postback_v4_trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact PCS V4 patch
        run: python tools/apply_pcs_postback_v4.py
      - name: Validate
        run: |
          python -m py_compile pipeline/discover_uk_pcs_current.py
          python - <<'PY'
          from pathlib import Path
          text=Path('pipeline/discover_uk_pcs_current.py').read_text(encoding='utf-8')
          assert 'PCS_CURRENT_OPPORTUNITIES_BROWSER_V4_POSTBACK' in text
          assert 'FORM_FALLBACK' in text
          assert 'Showing\\s+page' in text
          assert 'form.submit()' in text
          print('PCS V4 validation OK')
          PY
      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pipeline/discover_uk_pcs_current.py
          git diff --cached --quiet && exit 0
          git commit -m 'discovery: submit PCS filters and pager through public form'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
