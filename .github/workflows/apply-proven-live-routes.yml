name: Apply Proven Live Routes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-proven-live-routes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests pytest
      - name: Verify durable proofs and safe adapters before routing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          it=json.load(open('control/it_anac_pvl_full_reconcile_proof.json'))
          assert it.get('schema')=='IT_ANAC_PVL_FULL_HISTORY_PROOF_V4',it
          assert it.get('pass') is True,it
          assert it.get('enumeration_complete') is True,it
          assert it.get('live_coverage_credit_allowed') is True,it
          assert it.get('windows_expected')==it.get('windows_completed'),it

          pcs=json.load(open('control/pcs_full_reconcile_proof.json'))
          assert pcs.get('pass') is True,pcs
          assert pcs.get('enumeration_complete') is True,pcs
          assert pcs.get('live_coverage_credit_allowed') is True,pcs
          PY
          python -m py_compile pipeline/discover_it_anac_pvl.py pipeline/discover_it_anac_pvl_v4.py pipeline/discover_austender_production.py pipeline/austender_bridge_transport.py pipeline/discover_uk_pcs_current.py pipeline/discover_za_etenders_ocds.py
          pytest -q tests/test_it_anac_pvl_v4.py tests/test_austender_bridge_transport.py
      - name: Patch only proven or fail-closed-safe global routes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          wf=Path('.github/workflows/supergreen-discovery-v2.yml')
          s=wf.read_text()
          replacements={
              'AU_AUSTENDER) python pipeline/discover_austender_browser.py ;;':
                  'AU_AUSTENDER) python pipeline/discover_austender_production.py ;;',
              'IT_ANAC_DELTA) if [ "$DISCOVERY_MODE" = reconcile ]; then export ANAC_PVL_LOOKBACK_DAYS=1095; else export ANAC_PVL_LOOKBACK_DAYS=730; fi; python pipeline/discover_it_anac_pvl.py ;;':
                  'IT_ANAC_DELTA) python pipeline/discover_it_anac_pvl_v4.py ;;',
          }
          for old,new in replacements.items():
              if old in s:
                  s=s.replace(old,new,1)
              elif new not in s:
                  raise SystemExit(f'global route marker missing: {old}')
          # Assert already-correct routes rather than rewriting them.
          required=(
              'UK_PCS_OCDS) python pipeline/discover_uk_pcs_current.py ;;',
              'ZA_ETENDERS_OCDS) if [ "$DISCOVERY_MODE" = reconcile ]; then days=365; pages=80; else days=90; pages=20; fi; python pipeline/discover_za_etenders_ocds.py',
          )
          for marker in required:
              if marker not in s:
                  raise SystemExit(f'expected proven route missing: {marker}')
          wf.write_text(s)

          guard=Path('pipeline/source_coverage_guard.py')
          g=guard.read_text()
          marker='STRICT_EXHAUSTION_SOURCES={'
          start=g.index(marker)
          end=g.index('}',start)
          block=g[start:end]
          if '"IT_ANAC_PVL"' not in block:
              block=block.replace('{','{"IT_ANAC_PVL",',1)
              g=g[:start]+block+g[end:]
              guard.write_text(g)
          PY
          grep -F 'AU_AUSTENDER) python pipeline/discover_austender_production.py ;;' .github/workflows/supergreen-discovery-v2.yml
          grep -F 'IT_ANAC_DELTA) python pipeline/discover_it_anac_pvl_v4.py ;;' .github/workflows/supergreen-discovery-v2.yml
          grep -F '"IT_ANAC_PVL"' pipeline/source_coverage_guard.py
      - name: Commit proven routing
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/supergreen-discovery-v2.yml pipeline/source_coverage_guard.py; then
            echo 'proven routes already applied'
            exit 0
          fi
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add .github/workflows/supergreen-discovery-v2.yml pipeline/source_coverage_guard.py
          git commit -m 'coverage: apply proven Italy and secure AusTender routes'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
