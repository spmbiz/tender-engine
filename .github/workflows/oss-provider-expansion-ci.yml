name: OSS Provider Expansion CI

on:
  pull_request:
    paths:
      - 'pipeline/entity_resolution_shadow.py'
      - 'pipeline/docling_deep_parser.py'
      - 'pipeline/extract_corpus.py'
      - 'pipeline/provider_contract.py'
      - 'pipeline/audit_oss_provider_registry.py'
      - 'pipeline/discover_ee_rhr.py'
      - 'pipeline/patch_live_national_lanes.py'
      - 'pipeline/source_coverage_guard.py'
      - '.github/workflows/apply-live-national-lanes.yml'
      - 'control/oss_provider_registry.json'
      - 'control/national_expansion_patch_trigger.txt'
      - 'requirements-oss-expansion.txt'
      - 'tests/test_entity_resolution_shadow.py'
      - 'tests/test_docling_deep_parser.py'
      - 'tests/test_oss_provider_registry.py'
      - 'tests/test_discover_ee_rhr.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-fail-closed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile additive adapters
        run: |
          python -m py_compile \
            pipeline/entity_resolution_shadow.py \
            pipeline/docling_deep_parser.py \
            pipeline/extract_corpus.py \
            pipeline/provider_contract.py \
            pipeline/audit_oss_provider_registry.py \
            pipeline/discover_ee_rhr.py \
            pipeline/patch_live_national_lanes.py \
            pipeline/source_coverage_guard.py
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check -q pytest
      - name: Test BCE and Splink shadow semantics
        run: pytest -q tests/test_entity_resolution_shadow.py
      - name: Test Docling fallback semantics
        run: pytest -q tests/test_docling_deep_parser.py
      - name: Test provider registry integrity
        run: pytest -q tests/test_oss_provider_registry.py
      - name: Test Estonia eForms parser
        run: pytest -q tests/test_discover_ee_rhr.py
      - name: Audit machine-readable provider coverage
        run: python pipeline/audit_oss_provider_registry.py --output oss-provider-audit.json
      - name: Dry-run national lane patcher and validate resulting workflow
        run: |
          cp .github/workflows/supergreen-discovery-v2.yml /tmp/supergreen-before.yml
          python pipeline/patch_live_national_lanes.py
          python -m pip install --disable-pip-version-check -q pyyaml
          python - <<'PY'
          import yaml
          from pathlib import Path
          body=Path('.github/workflows/supergreen-discovery-v2.yml').read_text()
          for token in ('EE_RHR','discover_ee_rhr.py'):
              assert token in body, token
          parsed=yaml.safe_load(body)
          assert isinstance(parsed,dict) and 'jobs' in parsed
          print('national patch dry-run OK')
          PY
          mv /tmp/supergreen-before.yml .github/workflows/supergreen-discovery-v2.yml

  estonia-rhr-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate previous-month official bulk XML route
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pipeline.discover_ee_rhr import BULK_BASE, fetch_bytes, month_pairs, parse_bulk
          year, month = month_pairs(2, datetime.now(timezone.utc))[1]
          url = f'{BULK_BASE}/{year}/month/{month}/xml'
          payload = fetch_bytes(url)
          rows = parse_bulk(payload, datetime.now(timezone.utc).isoformat())
          assert len(payload) > 1000, len(payload)
          assert rows, 'no active/biddable notice subtypes parsed from previous-month dump'
          assert all(r['candidate_id'].startswith('EE-RHR:') for r in rows[:25])
          print({'url': url, 'bytes': len(payload), 'parsed': len(rows)})
          PY

  splink-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install stable Splink line only
        run: python -m pip install --disable-pip-version-check -q 'splink>=4.0.16,<5' pandas duckdb
      - name: Exercise shadow adapter import and strict BCE path
        run: |
          python - <<'PY'
          from pipeline.entity_resolution_shadow import normalize_be_enterprise_number, splink_shadow_links
          assert normalize_be_enterprise_number('BE 1001.050.094') == '1001050094'
          import splink
          rows=[]
          for i in range(24):
              rows.append({'id':str(i),'country':'BE','buyer':f'Buyer {i//2}','postcode':str(1000+i//2),'website':f'https://buyer{i//2}.example'})
          result=splink_shadow_links(rows, threshold=0.80)
          assert result['status'] in {'OK','SPLINK_MODEL_ERROR'}, result
          if result['status']=='OK':
              assert all(link['auto_merge_allowed'] is False for link in result['links'])
          print('splink', getattr(splink, '__version__', 'unknown'), result['status'], len(result.get('links',[])))
          PY

  docling-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install current Docling v2 line
        run: python -m pip install --disable-pip-version-check -q 'docling>=2.115,<3'
      - name: Verify DocumentConverter API used by fallback
        run: |
          python - <<'PY'
          from docling.document_converter import DocumentConverter
          from pipeline.docling_deep_parser import should_deep_parse
          assert DocumentConverter is not None
          assert should_deep_parse('pdf', 0, mode='auto')
          print('docling API smoke OK')
          PY
