name: DCE Resolver Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  resolve-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'playwright>=1.46,<2'
      - run: python -m playwright install --with-deps chromium
      - name: Probe all shortlisted DCEs
        run: python batch_probe.py
      - name: Upload batch output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dce-batch-${{ github.run_id }}
          path: |
            batch_store/
            dce_store/
          if-no-files-found: ignore
          retention-days: 7
