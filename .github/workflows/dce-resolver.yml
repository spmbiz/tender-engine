name: DCE Resolver Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  resolve-procontract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'playwright>=1.46,<2'
      - run: python -m playwright install --with-deps chromium
      - name: Resolve ProContract shortlist
        run: python procontract_probe.py
      - name: Upload resolver output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procontract-${{ github.run_id }}
          path: procontract_store/
          if-no-files-found: ignore
          retention-days: 7
