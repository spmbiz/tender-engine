name: DCE Resolver Test (Legacy)

on:
  workflow_dispatch:

jobs:
  route-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate portal route registry
        run: python route_matrix_probe.py
      - name: TED Search API route fallback
        run: python ted_search_probe.py
      - name: Extract TED BT-15 routes
        run: python ted_bt15_probe.py
      - name: Upload TED route output only for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ted-routes-${{ github.run_id }}
          path: |
            ted_routes/
            ted_search/
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 9

  browser-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q 'playwright>=1.46,<2'
      - name: Reuse runner Chrome
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$chrome" ]; then
            echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: UNGM public documents
        run: python ungm_probe.py
      - name: Ireland eTenders anonymous documents
        run: python ireland_probe.py
      - name: Public Contracts Scotland documents
        run: python pcs_probe.py
      - name: German e-Vergabe public documents
        run: python evergabe_probe.py
      - name: Resolve ProContract shortlist
        run: python procontract_probe.py
      - name: Upload resolver output only on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dce-routes-${{ github.run_id }}
          path: |
            adapter_store/
            procontract_store/
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 9
