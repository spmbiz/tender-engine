name: DCE Resolver Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  route-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate portal route registry
        run: python route_matrix_probe.py
      - name: Extract TED BT-15 routes
        run: python ted_bt15_probe.py
      - name: Upload TED route output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ted-routes-${{ github.run_id }}
          path: ted_routes/
          if-no-files-found: ignore
          retention-days: 7

  resolve-procontract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'playwright>=1.46,<2'
      - run: python -m playwright install --with-deps chromium
      - name: Resolve ProContract shortlist
        run: python procontract_probe.py
      - name: Upload resolver output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procontract-${{ github.run_id }}
          path: procontract_store/
          if-no-files-found: ignore
          retention-days: 7
