name: Promote Italy ANAC PVL V4

on:
  push:
    branches: [main]
    paths:
      - 'control/it_anac_pvl_full_reconcile_proof.json'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1, fetch-tags: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests pytest
      - name: Require passing full-history proof
        run: |
          python - <<'PY'
          import json
          p=json.load(open('control/it_anac_pvl_full_reconcile_proof.json'))
          assert p.get('schema')=='IT_ANAC_PVL_FULL_HISTORY_PROOF_V4',p
          assert p.get('pass') is True,p
          assert p.get('pvl_launch_date')=='2024-01-02',p
          assert p.get('enumeration_complete') is True,p
          PY
          pytest -q tests/test_it_anac_pvl_v4.py
      - name: Route global Italy lane to V4
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/supergreen-discovery-v2.yml')
          s=p.read_text()
          old='python pipeline/discover_it_anac_pvl.py'
          new='python pipeline/discover_it_anac_pvl_v4.py'
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('Italy ANAC PVL route marker missing')
          PY
          grep -F 'python pipeline/discover_it_anac_pvl_v4.py' .github/workflows/supergreen-discovery-v2.yml
      - name: Commit promotion
        shell: bash
        run: |
          git diff --quiet -- .github/workflows/supergreen-discovery-v2.yml && exit 0
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add .github/workflows/supergreen-discovery-v2.yml
          git commit -m 'it: promote full-history ANAC PVL lane after reconcile proof'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
