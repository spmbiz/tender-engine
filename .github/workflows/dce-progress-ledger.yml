name: DCE Progress Ledger

on:
  workflow_dispatch:
    inputs:
      dce_run_id:
        description: Successful DCE Fanout V2 run to persist and continue
        required: false
        default: ''
  # Bootstrap only when this workflow itself changes. Future normal operation is
  # dispatched explicitly by DCE Fanout V2, avoiding unreliable workflow_run gaps.
  push:
    branches: [main]
    paths:
      - '.github/workflows/dce-progress-ledger.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: dce-progress-ledger
  cancel-in-progress: false

jobs:
  persist-and-continue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover exact successful DCE queue
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_DCE_RUN_ID: ${{ github.event.inputs.dce_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          rid="${INPUT_DCE_RUN_ID:-}"
          if ! [[ "$rid" =~ ^[0-9]+$ ]]; then
            rid="$(gh run list --workflow dce-fanout-v2.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          [[ "$rid" =~ ^[0-9]+$ ]] || { echo 'No successful DCE run available for progress ledger.' >&2; exit 1; }
          tag="dce-harvest-$rid"
          asset="dce-candidate-queue-$rid.jsonl"
          mkdir -p recovered
          gh release view "$tag" >/dev/null
          gh release download "$tag" --pattern "$asset" --dir recovered
          test -f "recovered/$asset"
          source_run="$(QUEUE="recovered/$asset" python - <<'PY'
          import json,os
          p=os.environ['QUEUE']
          out=''
          for line in open(p,encoding='utf-8',errors='replace'):
              if not line.strip(): continue
              r=json.loads(line)
              out=r.get('wide_read_run_id') or r.get('source_discovery_run') or r.get('source_run_id') or ''
              if out: break
          print(out)
          PY
          )"
          echo "dce_run_id=$rid" >> "$GITHUB_OUTPUT"
          echo "queue=recovered/$asset" >> "$GITHUB_OUTPUT"
          echo "source_run=$source_run" >> "$GITHUB_OUTPUT"
          echo "Recovered durable queue for successful DCE run $rid"

      - name: Persist exact-version attempts to main
        id: ledger
        env:
          DCE_RUN_ID: ${{ steps.recover.outputs.dce_run_id }}
          QUEUE: ${{ steps.recover.outputs.queue }}
          SOURCE_RUN: ${{ steps.recover.outputs.source_run }}
        shell: bash
        run: |
          set -euo pipefail

          # One-time migration wave: materializer produced 152 rows while this run
          # was already carrying the old max_jobs=60 dispatch input. Do not mark
          # the unprocessed tail as consumed. The next full wave uses max_jobs=160.
          if [ "$DCE_RUN_ID" = '31970904558' ]; then
            echo 'Migration wave detected; deliberately not ledgering its oversized pre-truncation queue.'
            echo 'added=0' >> "$GITHUB_OUTPUT"
            echo 'transition_skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main

          python pipeline/dce_attempt_ledger.py update \
            --queue "$QUEUE" \
            --ledger control/dce_attempt_ledger.jsonl \
            --dce-run-id "$DCE_RUN_ID" \
            --source-run-id "$SOURCE_RUN" | tee ledger-update.json

          added="$(python - <<'PY'
          import json
          print(json.load(open('ledger-update.json'))['added'])
          PY
          )"
          echo "added=$added" >> "$GITHUB_OUTPUT"
          echo 'transition_skip=false' >> "$GITHUB_OUTPUT"

          if [ "$added" -gt 0 ]; then
            git add control/dce_attempt_ledger.jsonl
            git commit -m "tender: persist DCE progress for run $DCE_RUN_ID"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No new candidate versions to persist.'
          fi

      - name: Continue Qwen pre-read and next unseen DCE wave immediately
        env:
          GH_TOKEN: ${{ github.token }}
          ADDED: ${{ steps.ledger.outputs.added }}
          TRANSITION_SKIP: ${{ steps.ledger.outputs.transition_skip }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run qwen-dce-drainer.yml --ref main
          if [ "${ADDED:-0}" -gt 0 ] || [ "${TRANSITION_SKIP:-false}" = 'true' ]; then
            gh workflow run dce-queue-drainer.yml --ref main
            echo "Progress advanced; next unseen DCE wave dispatched (added=${ADDED:-0} transition_skip=${TRANSITION_SKIP:-false})."
          else
            echo 'No progress delta; DCE self-loop stopped cleanly until the persisted selection changes.'
          fi
