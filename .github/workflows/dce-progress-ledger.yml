name: DCE Progress Ledger

on:
  workflow_dispatch:
    inputs:
      dce_run_id:
        description: Successful DCE Fanout V2 run to persist and continue
        required: false
        default: ''
  workflow_run:
    workflows: ["DCE Fanout V2"]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  # Bootstrap the latest successful durable run when this workflow changes.
  push:
    branches: [main]
    paths:
      - '.github/workflows/dce-progress-ledger.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: dce-progress-ledger
  cancel-in-progress: false

jobs:
  persist-and-continue:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recover exact successful DCE queue and selection accounting
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_DCE_RUN_ID: ${{ github.event.inputs.dce_run_id || github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          rid="${INPUT_DCE_RUN_ID:-}"
          if ! [[ "$rid" =~ ^[0-9]+$ ]]; then
            rid=''
            mapfile -t successful < <(gh run list --workflow dce-fanout-v2.yml --status success --limit 20 --json databaseId,createdAt --jq 'sort_by(.createdAt) | reverse | .[].databaseId')
            for candidate in "${successful[@]}"; do
              if gh release view "dce-harvest-$candidate" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "dce-candidate-queue-$candidate.jsonl"; then
                rid="$candidate"
                break
              fi
            done
          fi
          [[ "$rid" =~ ^[0-9]+$ ]] || { echo 'No successful durable DCE run available for progress ledger.' >&2; exit 1; }
          tag="dce-harvest-$rid"
          asset="dce-candidate-queue-$rid.jsonl"
          summary="${asset}.summary.json"
          selection="dce-selection-$rid.jsonl"
          mkdir -p recovered
          gh release view "$tag" >/dev/null
          gh release download "$tag" --pattern "$asset" --dir recovered
          gh release download "$tag" --pattern "$summary" --dir recovered
          gh release download "$tag" --pattern "$selection" --dir recovered
          test -f "recovered/$asset"
          test -f "recovered/$summary"
          test -f "recovered/$selection"
          source_run="$(QUEUE="recovered/$asset" SELECTION="recovered/$selection" python - <<'PY'
          import json,os
          for p in (os.environ['QUEUE'],os.environ['SELECTION']):
              for line in open(p,encoding='utf-8',errors='replace'):
                  if not line.strip(): continue
                  r=json.loads(line)
                  out=r.get('wide_read_run_id') or r.get('source_discovery_run') or r.get('source_run_id') or r.get('source_run') or ''
                  if out:
                      print(out)
                      raise SystemExit
          print('')
          PY
          )"
          echo "dce_run_id=$rid" >> "$GITHUB_OUTPUT"
          echo "queue=recovered/$asset" >> "$GITHUB_OUTPUT"
          echo "summary=recovered/$summary" >> "$GITHUB_OUTPUT"
          echo "selection=recovered/$selection" >> "$GITHUB_OUTPUT"
          echo "source_run=$source_run" >> "$GITHUB_OUTPUT"
          echo "Recovered durable queue, materializer summary and original selection for successful DCE run $rid"

      - name: Persist exact-version attempts and source-scoped terminal skips to main
        id: ledger
        env:
          DCE_RUN_ID: ${{ steps.recover.outputs.dce_run_id }}
          QUEUE: ${{ steps.recover.outputs.queue }}
          SUMMARY: ${{ steps.recover.outputs.summary }}
          SELECTION: ${{ steps.recover.outputs.selection }}
          SOURCE_RUN: ${{ steps.recover.outputs.source_run }}
        shell: bash
        run: |
          set -euo pipefail

          # One-time migration wave: materializer produced 152 rows while this run
          # was already carrying the old max_jobs=60 dispatch input. Do not mark
          # the unprocessed tail as consumed. The next full wave uses max_jobs=160.
          if [ "$DCE_RUN_ID" = '31970904558' ]; then
            echo 'Migration wave detected; deliberately not ledgering its oversized pre-truncation queue.'
            echo 'added=0' >> "$GITHUB_OUTPUT"
            echo 'transition_skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main

          python pipeline/dce_attempt_ledger.py update \
            --queue "$QUEUE" \
            --ledger control/dce_attempt_ledger.jsonl \
            --dce-run-id "$DCE_RUN_ID" \
            --source-run-id "$SOURCE_RUN" | tee ledger-update.json

          # An unresolved source-scoped terminal skip is deliberately left retryable.
          # It must not discard already materialized successful attempts from this run.
          set +e
          python pipeline/dce_attempt_ledger.py update-terminal-skips \
            --selection "$SELECTION" \
            --summary "$SUMMARY" \
            --ledger control/dce_attempt_ledger.jsonl \
            --dce-run-id "$DCE_RUN_ID" \
            --source-run-id "$SOURCE_RUN" > ledger-skips.json 2> ledger-skips.err
          skip_rc=$?
          set -e
          if [ "$skip_rc" -ne 0 ]; then
            if grep -q '^terminal skip rows could not be resolved safely:' ledger-skips.err; then
              cat ledger-skips.err >&2
              printf '%s\n' '{"added":0,"unresolved_terminal_skips_left_retryable":true}' > ledger-skips.json
            else
              cat ledger-skips.err >&2
              exit "$skip_rc"
            fi
          else
            cat ledger-skips.json
          fi

          added="$(python - <<'PY'
          import json
          a=json.load(open('ledger-update.json'))['added']
          b=json.load(open('ledger-skips.json'))['added']
          print(int(a)+int(b))
          PY
          )"
          echo "added=$added" >> "$GITHUB_OUTPUT"
          echo 'transition_skip=false' >> "$GITHUB_OUTPUT"

          if [ "$added" -gt 0 ]; then
            git add control/dce_attempt_ledger.jsonl
            git commit -m "tender: persist DCE progress for run $DCE_RUN_ID"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No new candidate versions or source-scoped terminal skips to persist.'
          fi

      - name: Continue Qwen pre-read and refresh unseen selection before the next DCE wave
        env:
          GH_TOKEN: ${{ github.token }}
          ADDED: ${{ steps.ledger.outputs.added }}
          TRANSITION_SKIP: ${{ steps.ledger.outputs.transition_skip }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run qwen-dce-drainer.yml --ref main
          if [ "${ADDED:-0}" -gt 0 ] || [ "${TRANSITION_SKIP:-false}" = 'true' ]; then
            # Do NOT wake DCE against the stale selection. First force the rolling
            # conveyor to rebuild the queue from the newly persisted attempt ledger;
            # the conveyor itself dispatches DCE only after already-attempted exact
            # notice versions have disappeared.
            gh workflow run qwen-live-conveyor.yml --ref main
            echo "Progress advanced; unseen-selection conveyor dispatched first (added=${ADDED:-0} transition_skip=${TRANSITION_SKIP:-false})."
          else
            echo 'No progress delta; DCE self-loop stopped cleanly until the persisted selection changes.'
          fi
