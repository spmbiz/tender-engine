name: Qwen Realtime Restart (Legacy Disabled)

# Legacy one-shot repair retained only as an audit marker.
# The live path is now owned by:
# - qwen-live-classification.yml
# - qwen-live-conveyor.yml
# - qwen-live-recovery-drainer.yml
#
# Do not cancel active semantic passes or rewrite the live workflow from here.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain retired legacy repair
        run: |
          echo 'LEGACY_RESTART_RETIRED'
          echo 'No Qwen run was cancelled and no live workflow was modified.'
          echo 'Continuous classification/recovery owns self-healing now.'
