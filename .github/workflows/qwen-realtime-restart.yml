name: Qwen Realtime Restart (Legacy Drain No-op)

# One harmless push-triggered run uses the legacy concurrency group to evict any
# previously queued/in-progress legacy repair created before retirement. It never
# cancels Qwen classification and never rewrites a live workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qwen-realtime-restart.yml'

permissions:
  contents: read

concurrency:
  group: qwen-realtime-restart
  cancel-in-progress: true

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Drain legacy concurrency group safely
        run: |
          echo 'LEGACY_RESTART_DRAIN_NOOP'
          echo 'No Qwen classification run is cancelled.'
          echo 'No live workflow is modified.'
