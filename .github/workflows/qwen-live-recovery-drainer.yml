name: Qwen Live Recovery Drainer (Retired)

# Retained as an audit marker. qwen-live-conveyor.yml has its own five-minute
# schedule and classification-completion trigger; qwen-backlog-watchdog.yml owns
# semantic recovery directly. A third workflow that only woke both was redundant.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo 'QWEN_RECOVERY_DRAINER_RETIRED'
          echo 'Conveyor schedule owns ingestion; backlog watchdog owns semantic recovery.'
          echo 'No workflow dispatch or state write occurs here.'
