name: Live World Snapshot for GPT

on:
  workflow_run:
    workflows: ["SuperGreen Discovery V2"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_discovery_run:
        description: Canonical discovery run whose consolidated wide-read assets should be snapshotted
        required: true
  push:
    branches: [main]
    paths:
      - 'control/live_snapshot_trigger.json'

permissions:
  contents: write

concurrency:
  group: live-world-snapshot-publisher
  cancel-in-progress: true

jobs:
  publish:
    # Deliberately do NOT gate on the parent workflow's overall conclusion.
    # SuperGreen Discovery is source-fail-soft: isolated national lanes may fail
    # while the canonical wide-read pack + measured coverage are valid. The
    # durable Release assets below are the source of truth.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - id: source
        name: Resolve canonical discovery run
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = 'workflow_run' ]; then
            run='${{ github.event.workflow_run.id }}'
          elif [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            run='${{ github.event.inputs.source_discovery_run }}'
          else
            run="$(python - <<'PY'
          import json
          x=json.load(open('control/live_snapshot_trigger.json'))
          print(x['source_discovery_run'])
          PY
          )"
          fi
          [[ "$run" =~ ^[0-9]+$ ]] || { echo "Invalid discovery run: $run" >&2; exit 1; }
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Using canonical discovery run $run"

      - name: Verify and download canonical consolidated discovery assets
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.source.outputs.run }}
        shell: bash
        run: |
          set -euo pipefail
          tag="discovery-harvest-${SOURCE_RUN}"
          mkdir -p source-release source-discovery
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          repaired="supergreen-wide-read-${SOURCE_RUN}-repaired.tar.gz"
          normal="supergreen-wide-read-${SOURCE_RUN}.tar.gz"
          coverage="discovery-coverage-${SOURCE_RUN}.json"
          summary="discovery-summary-${SOURCE_RUN}.json"
          if grep -Fxq "$repaired" <<< "$assets"; then
            asset="$repaired"
          elif grep -Fxq "$normal" <<< "$assets"; then
            asset="$normal"
          else
            echo "Canonical wide-read asset missing from $tag" >&2
            exit 1
          fi
          grep -Fxq "$coverage" <<< "$assets" || { echo "Measured coverage manifest missing from $tag" >&2; exit 1; }
          grep -Fxq "$summary" <<< "$assets" || { echo "Discovery summary missing from $tag" >&2; exit 1; }
          gh release download "$tag" --pattern "$asset" --dir source-release
          gh release download "$tag" --pattern "$coverage" --dir source-release
          gh release download "$tag" --pattern "$summary" --dir source-release
          tar -xzf "source-release/$asset" -C source-discovery
          candidates="$(find source-discovery -type f -name current_candidates.jsonl -print -quit)"
          [ -n "$candidates" ] || { echo 'current_candidates.jsonl missing' >&2; exit 1; }
          echo "CANDIDATES_PATH=$candidates" >> "$GITHUB_ENV"
          echo "COVERAGE_PATH=source-release/$coverage" >> "$GITHUB_ENV"
          echo "DISCOVERY_SUMMARY_PATH=source-release/$summary" >> "$GITHUB_ENV"
          echo "WIDE_READ_ASSET=$asset" >> "$GITHUB_ENV"

          # Read the previous stable snapshot before this generation replaces it.
          # It is continuity evidence only: carried rows remain visibly stale and
          # never upgrade a missing/degraded source into successful current coverage.
          mkdir -p previous-snapshot
          echo "PREVIOUS_SNAPSHOT_PATH=" >> "$GITHUB_ENV"
          echo "PREVIOUS_SNAPSHOT_MANIFEST=" >> "$GITHUB_ENV"
          if gh release view live-world-snapshot-latest >/dev/null 2>&1; then
            latest_assets="$(gh release view live-world-snapshot-latest --json assets --jq '.assets[].name')"
            if grep -Fxq live-open-tenders-latest.jsonl.gz <<< "$latest_assets" && grep -Fxq snapshot-manifest-latest.json <<< "$latest_assets"; then
              gh release download live-world-snapshot-latest \
                --pattern live-open-tenders-latest.jsonl.gz \
                --pattern snapshot-manifest-latest.json \
                --dir previous-snapshot --clobber
              echo "PREVIOUS_SNAPSHOT_PATH=previous-snapshot/live-open-tenders-latest.jsonl.gz" >> "$GITHUB_ENV"
              echo "PREVIOUS_SNAPSHOT_MANIFEST=previous-snapshot/snapshot-manifest-latest.json" >> "$GITHUB_ENV"
            fi
          fi

      - name: Build fail-closed open-tender snapshot and GPT packets
        env:
          SOURCE_RUN: ${{ steps.source.outputs.run }}
        shell: bash
        run: |
          set -euo pipefail
          previous=()
          if [ -n "${PREVIOUS_SNAPSHOT_PATH:-}" ] && [ -s "$PREVIOUS_SNAPSHOT_PATH" ]; then
            previous+=(--previous "$PREVIOUS_SNAPSHOT_PATH")
            if [ -n "${PREVIOUS_SNAPSHOT_MANIFEST:-}" ] && [ -s "$PREVIOUS_SNAPSHOT_MANIFEST" ]; then
              previous+=(--previous-manifest "$PREVIOUS_SNAPSHOT_MANIFEST")
            fi
          fi
          python pipeline/build_live_world_snapshot.py \
            --input "$CANDIDATES_PATH" \
            --out-dir live-snapshot \
            --source-run "$SOURCE_RUN" \
            --packet-size 500 \
            "${previous[@]}"

          # Attach measured discovery-coverage truth to every snapshot. Carry-
          # forward preserves recall only; it never repairs the coverage claim.
          python - <<'PY'
          import json, os
          from pathlib import Path
          cov=json.load(open(os.environ['COVERAGE_PATH'],encoding='utf-8'))
          ds=json.load(open(os.environ['DISCOVERY_SUMMARY_PATH'],encoding='utf-8'))
          mpath=Path('live-snapshot/snapshot_manifest.json')
          m=json.loads(mpath.read_text(encoding='utf-8'))
          status=(cov.get('coverage_status') or cov.get('world_coverage_status') or cov.get('status') or ds.get('coverage_status') or 'UNKNOWN_COVERAGE')
          failed=[]
          for key in ('missing_packs','degraded_packs','external_missing_lanes'):
              vals=cov.get(key)
              if isinstance(vals,list):
                  failed.extend(str(x) for x in vals if str(x).strip())
          for container_key in ('sources','source_status','source_coverage','measurements','lanes'):
              obj=cov.get(container_key)
              if isinstance(obj,dict):
                  iterable=[dict(v, _source=k) if isinstance(v,dict) else {'_source':k,'value':v} for k,v in obj.items()]
              elif isinstance(obj,list): iterable=obj
              else: continue
              for row in iterable:
                  if not isinstance(row,dict): continue
                  st=str(row.get('status') or row.get('coverage_status') or row.get('result') or '').upper()
                  if any(x in st for x in ('FAIL','ERROR','BROKEN','UNAVAILABLE','DEGRADED','MISSING')):
                      failed.append(str(row.get('source') or row.get('name') or row.get('lane') or row.get('_source') or 'UNKNOWN'))
          m['discovery_coverage_status']=status
          m['discovery_failed_sources']=sorted(set(failed))
          m['discovery_coverage_file']=f"discovery-coverage-{os.environ['SOURCE_RUN']}.json"
          m['discovery_summary_file']=f"discovery-summary-{os.environ['SOURCE_RUN']}.json"
          m['wide_read_source_asset']=os.environ['WIDE_READ_ASSET']
          m['world_exhaustive_claim_allowed']=str(status).upper() in {'COMPLETE','FULL','FULL_WORLD_COVERAGE','COMPLETE_WORLD_COVERAGE'}
          m['coverage_rule']='Snapshot completeness is bounded by measured discovery coverage. Failed/unknown lanes remain explicit. High-recall carry-forward may preserve previously observed still-live rows, but never converts a missing/degraded source into successful current coverage.'
          mpath.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          Path('live-snapshot/discovery_coverage.json').write_text(json.dumps(cov,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          Path('live-snapshot/discovery_summary.json').write_text(json.dumps(ds,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          ipath=Path('live-snapshot/GPT_WIDE_READ_INSTRUCTIONS.md')
          text=ipath.read_text(encoding='utf-8')
          text += f"\n## Discovery coverage\nCoverage status: **{status}**.\n\nRead `discovery_coverage.json` before making worldwide or source-completeness claims. A failed/unknown source lane is missing coverage, never zero opportunities. Rows marked `carried_forward_from_previous_snapshot=true` are continuity rows, not proof that the source succeeded in this generation.\n"
          ipath.write_text(text,encoding='utf-8')
          print(json.dumps({'coverage_status':status,'failed_sources':m['discovery_failed_sources'],'snapshot_rows':m['snapshot_rows'],'carried_forward_rows':m.get('carried_forward_rows',0)},indent=2))
          PY

          tar -C live-snapshot/gpt-packets -czf "gpt-wide-read-packets-${SOURCE_RUN}.tar.gz" .
          cp live-snapshot/live_open_tenders.jsonl.gz "live-open-tenders-${SOURCE_RUN}.jsonl.gz"
          cp live-snapshot/snapshot_manifest.json "snapshot-manifest-${SOURCE_RUN}.json"
          cp live-snapshot/GPT_WIDE_READ_INSTRUCTIONS.md "GPT-WIDE-READ-${SOURCE_RUN}.md"
          cp live-snapshot/discovery_coverage.json "discovery-coverage-snapshot-${SOURCE_RUN}.json"
          cp live-snapshot/discovery_summary.json "discovery-summary-snapshot-${SOURCE_RUN}.json"

      - name: Publish immutable run-specific snapshot Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.source.outputs.run }}
        shell: bash
        run: |
          set -euo pipefail
          coverage_status="$(python -c "import json;print(json.load(open('live-snapshot/snapshot_manifest.json')).get('discovery_coverage_status','UNKNOWN'))")"
          tag="live-world-snapshot-${SOURCE_RUN}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --target main \
            --title "Live World Snapshot ${SOURCE_RUN}" \
            --notes "GPT-readable snapshot derived from canonical consolidated discovery assets. Measured coverage: ${coverage_status}. No lexical business-fit ranking removes candidates. Parseable expired deadlines are excluded; unknown deadlines remain explicit. Continuity rows may be carried from the prior snapshot when a source regresses, without upgrading coverage truth."
          gh release upload "$tag" \
            "live-open-tenders-${SOURCE_RUN}.jsonl.gz" \
            "gpt-wide-read-packets-${SOURCE_RUN}.tar.gz" \
            "snapshot-manifest-${SOURCE_RUN}.json" \
            "GPT-WIDE-READ-${SOURCE_RUN}.md" \
            "discovery-coverage-snapshot-${SOURCE_RUN}.json" \
            "discovery-summary-snapshot-${SOURCE_RUN}.json" --clobber

      - name: Update stable latest snapshot Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.source.outputs.run }}
        shell: bash
        run: |
          set -euo pipefail
          cp "live-open-tenders-${SOURCE_RUN}.jsonl.gz" live-open-tenders-latest.jsonl.gz
          cp "gpt-wide-read-packets-${SOURCE_RUN}.tar.gz" gpt-wide-read-packets-latest.tar.gz
          cp "snapshot-manifest-${SOURCE_RUN}.json" snapshot-manifest-latest.json
          cp "GPT-WIDE-READ-${SOURCE_RUN}.md" GPT-WIDE-READ-LATEST.md
          cp "discovery-coverage-snapshot-${SOURCE_RUN}.json" discovery-coverage-latest.json
          coverage_status="$(python -c "import json;print(json.load(open('live-snapshot/snapshot_manifest.json')).get('discovery_coverage_status','UNKNOWN'))")"
          tag='live-world-snapshot-latest'
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target main --title 'Live World Snapshot — LATEST' --notes 'Stable pointer to the newest asset-verified GPT-readable live tender snapshot.'
          gh release edit "$tag" --title "Live World Snapshot — LATEST (${SOURCE_RUN})" --notes "Stable pointer. Current canonical discovery run: ${SOURCE_RUN}. Measured coverage: ${coverage_status}."
          gh release upload "$tag" \
            live-open-tenders-latest.jsonl.gz \
            gpt-wide-read-packets-latest.tar.gz \
            snapshot-manifest-latest.json \
            GPT-WIDE-READ-LATEST.md \
            discovery-coverage-latest.json --clobber

      - name: Publish directly-readable snapshot branch without history growth
        env:
          SOURCE_RUN: ${{ steps.source.outputs.run }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf branch-publish
          mkdir -p branch-publish
          cp -R live-snapshot/gpt-packets branch-publish/
          cp live-snapshot/snapshot_manifest.json branch-publish/
          cp live-snapshot/GPT_WIDE_READ_INSTRUCTIONS.md branch-publish/
          cp live-snapshot/discovery_coverage.json branch-publish/
          cp live-snapshot/discovery_summary.json branch-publish/
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.load(open('live-snapshot/snapshot_manifest.json'))
          text = '# Live Tender Snapshot\n\n'
          text += f"Source discovery run: `{m['source_discovery_run']}`  \nRows: **{m['snapshot_rows']:,}**  \nGPT packets: **{m['packet_count']}**  \nCoverage: **{m.get('discovery_coverage_status','UNKNOWN')}**\n\n"
          text += f"Carried forward for recall: **{m.get('carried_forward_rows',0):,}**. These rows are explicitly marked and do not repair coverage.\n\n"
          text += 'This branch is force-replaced on every snapshot so the repository does not accumulate hourly snapshot history. Read `discovery_coverage.json` and `GPT_WIDE_READ_INSTRUCTIONS.md`, then scan `gpt-packets/packet-*.jsonl`.\n'
          Path('branch-publish/README.md').write_text(text, encoding='utf-8')
          PY
          cd branch-publish
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan live-snapshot
          git add .
          git commit -m "Live snapshot ${SOURCE_RUN}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:live-snapshot

      - name: Persist tiny latest pointer on main
        env:
          SOURCE_RUN: ${{ steps.source.outputs.run }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=json.load(open('live-snapshot/snapshot_manifest.json'))
          run=str(os.environ['SOURCE_RUN'])
          pointer={
            'schema':'LIVE_WORLD_SNAPSHOT_POINTER_V2',
            'source_discovery_run':m['source_discovery_run'],
            'generated_at':m['generated_at'],
            'snapshot_rows':m['snapshot_rows'],
            'current_materialized_rows':m.get('current_materialized_rows',m['snapshot_rows']),
            'carried_forward_rows':m.get('carried_forward_rows',0),
            'carried_forward_by_source':m.get('carried_forward_by_source',{}),
            'open_state_counts':m['open_state_counts'],
            'packet_count':m['packet_count'],
            'coverage_status':m.get('discovery_coverage_status','UNKNOWN'),
            'failed_sources':m.get('discovery_failed_sources',[]),
            'world_exhaustive_claim_allowed':m.get('world_exhaustive_claim_allowed',False),
            'direct_read_branch':'live-snapshot',
            'packet_path_template':'gpt-packets/packet-XXXX.jsonl',
            'coverage_path':'discovery_coverage.json',
            'stable_release_tag':'live-world-snapshot-latest',
            'immutable_release_tag':f'live-world-snapshot-{run}',
            'dce_request_path':'control/gpt_dce_request.json',
            'rule':'GPT selects candidate IDs semantically; GitHub retrieves DCE only after selection. Coverage gaps stay explicit even when prior still-live rows are carried forward for recall. No notice-only FINAL_SUPER_GREEN.'
          }
          Path('control').mkdir(exist_ok=True)
          Path('control/live_snapshot_latest.json').write_text(json.dumps(pointer,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/live_snapshot_latest.json
          git commit -m "tenders: point GPT to asset-verified live snapshot ${SOURCE_RUN}" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*3))
          done
          exit 1