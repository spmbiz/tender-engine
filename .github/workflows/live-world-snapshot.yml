name: Live World Snapshot for GPT

on:
  workflow_run:
    workflows: ["SuperGreen Discovery V2"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_discovery_run:
        description: Successful canonical discovery run to snapshot
        required: true
  push:
    branches: [main]
    paths:
      - 'control/live_snapshot_trigger.json'

permissions:
  contents: write

concurrency:
  group: live-world-snapshot-publisher
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - id: source
        name: Resolve canonical discovery run
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = 'workflow_run' ]; then
            run='${{ github.event.workflow_run.id }}'
          elif [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            run='${{ github.event.inputs.source_discovery_run }}'
          else
            run="$(python - <<'PY'
          import json
          x=json.load(open('control/live_snapshot_trigger.json'))
          print(x['source_discovery_run'])
          PY
          )"
          fi
          [[ "$run" =~ ^[0-9]+$ ]] || { echo "Invalid discovery run: $run" >&2; exit 1; }
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Using canonical discovery run $run"

      - name: Download complete canonical discovery snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.source.outputs.run }}
        shell: bash
        run: |
          set -euo pipefail
          tag="discovery-harvest-${SOURCE_RUN}"
          mkdir -p source-release source-discovery
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          repaired="supergreen-wide-read-${SOURCE_RUN}-repaired.tar.gz"
          normal="supergreen-wide-read-${SOURCE_RUN}.tar.gz"
          if grep -Fxq "$repaired" <<< "$assets"; then
            asset="$repaired"
          elif grep -Fxq "$normal" <<< "$assets"; then
            asset="$normal"
          else
            echo "Canonical wide-read asset missing from $tag" >&2
            exit 1
          fi
          gh release download "$tag" --pattern "$asset" --dir source-release
          tar -xzf "source-release/$asset" -C source-discovery
          candidates="$(find source-discovery -type f -name current_candidates.jsonl -print -quit)"
          [ -n "$candidates" ] || { echo 'current_candidates.jsonl missing' >&2; exit 1; }
          echo "CANDIDATES_PATH=$candidates" >> "$GITHUB_ENV"

      - name: Build fail-closed open-tender snapshot and GPT packets
        env:
          SOURCE_RUN: ${{ steps.source.outputs.run }}
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/build_live_world_snapshot.py \
            --input "$CANDIDATES_PATH" \
            --out-dir live-snapshot \
            --source-run "$SOURCE_RUN" \
            --packet-size 500
          tar -C live-snapshot/gpt-packets -czf "gpt-wide-read-packets-${SOURCE_RUN}.tar.gz" .
          cp live-snapshot/live_open_tenders.jsonl.gz "live-open-tenders-${SOURCE_RUN}.jsonl.gz"
          cp live-snapshot/snapshot_manifest.json "snapshot-manifest-${SOURCE_RUN}.json"
          cp live-snapshot/GPT_WIDE_READ_INSTRUCTIONS.md "GPT-WIDE-READ-${SOURCE_RUN}.md"

      - name: Publish immutable run-specific snapshot Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.source.outputs.run }}
        shell: bash
        run: |
          set -euo pipefail
          tag="live-world-snapshot-${SOURCE_RUN}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --target main \
            --title "Live World Snapshot ${SOURCE_RUN}" \
            --notes "Exhaustive GPT-readable snapshot derived from canonical discovery run ${SOURCE_RUN}. No lexical business-fit ranking is used to remove candidates. Parseable expired deadlines are excluded; unknown deadlines remain explicit and unverified."
          gh release upload "$tag" \
            "live-open-tenders-${SOURCE_RUN}.jsonl.gz" \
            "gpt-wide-read-packets-${SOURCE_RUN}.tar.gz" \
            "snapshot-manifest-${SOURCE_RUN}.json" \
            "GPT-WIDE-READ-${SOURCE_RUN}.md" --clobber

      - name: Update stable latest snapshot Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.source.outputs.run }}
        shell: bash
        run: |
          set -euo pipefail
          cp "live-open-tenders-${SOURCE_RUN}.jsonl.gz" live-open-tenders-latest.jsonl.gz
          cp "gpt-wide-read-packets-${SOURCE_RUN}.tar.gz" gpt-wide-read-packets-latest.tar.gz
          cp "snapshot-manifest-${SOURCE_RUN}.json" snapshot-manifest-latest.json
          cp "GPT-WIDE-READ-${SOURCE_RUN}.md" GPT-WIDE-READ-LATEST.md
          tag='live-world-snapshot-latest'
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target main --title 'Live World Snapshot — LATEST' --notes 'Stable pointer to the newest complete GPT-readable live tender snapshot.'
          gh release edit "$tag" --title "Live World Snapshot — LATEST (${SOURCE_RUN})" --notes "Stable pointer. Current canonical discovery run: ${SOURCE_RUN}."
          gh release upload "$tag" \
            live-open-tenders-latest.jsonl.gz \
            gpt-wide-read-packets-latest.tar.gz \
            snapshot-manifest-latest.json \
            GPT-WIDE-READ-LATEST.md --clobber

      - name: Publish directly-readable snapshot branch without history growth
        env:
          SOURCE_RUN: ${{ steps.source.outputs.run }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf branch-publish
          mkdir -p branch-publish
          cp -R live-snapshot/gpt-packets branch-publish/
          cp live-snapshot/snapshot_manifest.json branch-publish/
          cp live-snapshot/GPT_WIDE_READ_INSTRUCTIONS.md branch-publish/
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.load(open('live-snapshot/snapshot_manifest.json'))
          text = '# Live Tender Snapshot\n\n'
          text += f"Source discovery run: `{m['source_discovery_run']}`  \nRows: **{m['snapshot_rows']:,}**  \nGPT packets: **{m['packet_count']}**\n\n"
          text += 'This branch is force-replaced on every snapshot so the repository does not accumulate hourly snapshot history. Read `GPT_WIDE_READ_INSTRUCTIONS.md`, then scan `gpt-packets/packet-*.jsonl`.\n'
          Path('branch-publish/README.md').write_text(text, encoding='utf-8')
          PY
          cd branch-publish
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan live-snapshot
          git add .
          git commit -m "Live snapshot ${SOURCE_RUN}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:live-snapshot

      - name: Persist tiny latest pointer on main
        env:
          SOURCE_RUN: ${{ steps.source.outputs.run }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          m=json.load(open('live-snapshot/snapshot_manifest.json'))
          run=str(os.environ['SOURCE_RUN'])
          pointer={
            'schema':'LIVE_WORLD_SNAPSHOT_POINTER_V1',
            'source_discovery_run':m['source_discovery_run'],
            'generated_at':m['generated_at'],
            'snapshot_rows':m['snapshot_rows'],
            'open_state_counts':m['open_state_counts'],
            'packet_count':m['packet_count'],
            'direct_read_branch':'live-snapshot',
            'packet_path_template':'gpt-packets/packet-XXXX.jsonl',
            'stable_release_tag':'live-world-snapshot-latest',
            'immutable_release_tag':f'live-world-snapshot-{run}',
            'dce_request_path':'control/gpt_dce_request.json',
            'rule':'GPT selects candidate IDs semantically; GitHub retrieves DCE only after selection. No notice-only FINAL_SUPER_GREEN.'
          }
          Path('control').mkdir(exist_ok=True)
          Path('control/live_snapshot_latest.json').write_text(json.dumps(pointer,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/live_snapshot_latest.json
          git commit -m "tenders: point GPT to live snapshot ${SOURCE_RUN}" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*3))
          done
          exit 1
