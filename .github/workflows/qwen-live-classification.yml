name: Qwen Live Notice Classification

on:
  workflow_dispatch:
    inputs:
      per_shard:
        description: Maximum notices classified by each worker in this pass
        required: false
        default: '240'
      auto_continue:
        description: Continue bounded passes while valid unclassified notices remain
        required: false
        default: 'true'
      dce_limit:
        description: Maximum Qwen-ranked candidates exposed to DCE in this pass
        required: false
        default: '160'
  workflow_run:
    workflows: ["Notice Intelligence Ledger"]
    types: [completed]
  schedule:
    - cron: '43 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/qwen-live-classification.yml'
      - 'pipeline/global_admission.py'
      - 'pipeline/apply_qwen_state_to_ledger.py'
      - 'pipeline/build_qwen_dce_selection.py'
      - 'pipeline/merge_qwen_classification_state.py'
      - 'pipeline/qwen_notice_batch_selfheal.py'
      - 'pipeline/qwen_notice_post_guard.py'
      - 'control/qwen_batch_runtime_config.json'

permissions:
  actions: write
  contents: write

concurrency:
  group: qwen-live-notice-classification-${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && format('noop-{0}', github.run_id) || 'active' }}
  # Only real active passes share the live group. Non-success workflow_run no-ops get a unique group and cannot replace a pending real pass.
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  QWEN_WORKERS_REQUESTED: '60'
  QWEN_BATCH_SIZE: '8'
  QWEN_CLASSIFIER_VERSION: 'qwen3-4b-q4km-batch-selfheal-v1'

jobs:
  plan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_run: ${{ steps.plan.outputs.source_run }}
      remaining: ${{ steps.plan.outputs.remaining }}
      per_shard: ${{ steps.plan.outputs.per_shard }}
      allowed_workers: ${{ steps.plan.outputs.allowed_workers }}
      matrix: ${{ steps.plan.outputs.matrix }}
      batch_size: ${{ steps.plan.outputs.batch_size }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download current ledger, matching immutable snapshot and previous exact-hash Qwen state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input previous shards
          gh release download notice-intelligence-ledger-latest \
            --pattern notice-intelligence-ledger-latest.jsonl.gz \
            --pattern notice-classification-queue-latest.jsonl.gz \
            --pattern notice-ledger-summary-latest.json \
            --dir input --clobber
          ledger_notes="$(gh release view notice-intelligence-ledger-latest --json body --jq '.body')"
          source_run="$(grep -oE 'run=[0-9]+' <<< "$ledger_notes" | head -n1 | cut -d= -f2)"
          if [[ ! "$source_run" =~ ^[0-9]+$ ]]; then
            ledger_name="$(gh release view notice-intelligence-ledger-latest --json name --jq '.name')"
            source_run="$(grep -oE '[0-9]{8,}' <<< "$ledger_name" | tail -n1)"
          fi
          [[ "$source_run" =~ ^[0-9]+$ ]] || { echo 'Cannot resolve ledger source run' >&2; exit 1; }
          snapshot_tag="live-world-snapshot-${source_run}"
          gh release download "$snapshot_tag" \
            --pattern "live-open-tenders-${source_run}.jsonl.gz" \
            --pattern "snapshot-manifest-${source_run}.json" \
            --dir input --clobber
          mv "input/live-open-tenders-${source_run}.jsonl.gz" input/live-open-tenders-latest.jsonl.gz
          mv "input/snapshot-manifest-${source_run}.json" input/snapshot-manifest-latest.json
          echo "LEDGER_SOURCE_RUN=$source_run" >> "$GITHUB_ENV"
          test -s input/notice-intelligence-ledger-latest.jsonl.gz
          test -s input/notice-classification-queue-latest.jsonl.gz
          test -s input/live-open-tenders-latest.jsonl.gz
          test -s input/snapshot-manifest-latest.json
          if gh release view qwen-classification-state-latest >/dev/null 2>&1; then
            assets="$(gh release view qwen-classification-state-latest --json assets --jq '.assets[].name')"
            if grep -Fxq qwen-classification-state-latest.jsonl.gz <<< "$assets"; then
              gh release download qwen-classification-state-latest \
                --pattern qwen-classification-state-latest.jsonl.gz \
                --dir previous --clobber
            fi
          fi
          if [ ! -s previous/qwen-classification-state-latest.jsonl.gz ]; then
            python - <<'PY'
          import gzip
          with gzip.open('previous/qwen-classification-state-latest.jsonl.gz','wt',encoding='utf-8') as f:
              pass
          PY
          fi

      - id: plan
        name: Admit fair-share capacity, filter exact hashes and create lossless worker shards
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PER_SHARD: ${{ github.event.inputs.per_shard || '240' }}
        run: |
          set -euo pipefail
          source_run="$LEDGER_SOURCE_RUN"
          manifest_run="$(python - <<'PY'
          import json
          print(json.load(open('input/snapshot-manifest-latest.json',encoding='utf-8'))['source_discovery_run'])
          PY
          )"
          [ "$manifest_run" = "$source_run" ] || { echo "Ledger/snapshot generation mismatch: ledger=$source_run snapshot=$manifest_run" >&2; exit 1; }
          python pipeline/merge_qwen_classification_state.py \
            --ledger input/notice-intelligence-ledger-latest.jsonl.gz \
            --classification-queue input/notice-classification-queue-latest.jsonl.gz \
            --previous-state previous/qwen-classification-state-latest.jsonl.gz \
            --target-classifier-version "$QWEN_CLASSIFIER_VERSION" \
            --state-out previous/qwen-state-current.jsonl.gz \
            --queue-out input/qwen-work-queue.jsonl.gz \
            --summary-out input/qwen-prefilter-summary.json
          remaining="$(python - <<'PY'
          import json
          print(json.load(open('input/qwen-prefilter-summary.json'))['remaining_classification_queue'])
          PY
          )"
          per_shard="$(python - <<'PY'
          import os
          try: n=int(os.environ.get('REQUESTED_PER_SHARD') or 240)
          except Exception: n=240
          print(max(16,min(480,n)))
          PY
          )"

          python - <<'PY' > input/qwen-capacity-admission.json
          import json, os
          from pipeline.global_admission import dynamic_tender_parallel
          requested=max(1,min(60,int(os.environ.get('QWEN_WORKERS_REQUESTED') or 60)))
          allowed, report=dynamic_tender_parallel(requested)
          report['lane']='qwen-live-classification'
          report['requested_workers']=requested
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
          allowed="$(python -c "import json;print(int(json.load(open('input/qwen-capacity-admission.json')).get('allowed') or 0))")"
          if [ "$remaining" = '0' ]; then allowed=0; fi

          if [ "$allowed" -gt 0 ]; then
            python pipeline/build_qwen_shadow_shards.py \
              --input input/qwen-work-queue.jsonl.gz \
              --out-dir shards \
              --source-run "$source_run" \
              --shards "$allowed" \
              --manifest-out input/qwen-live-shard-manifest.json
          else
            printf '{"source_run":"%s","shards":0,"reason":"no_admitted_capacity_or_empty_queue"}\n' "$source_run" > input/qwen-live-shard-manifest.json
          fi

          matrix="$(ALLOWED="$allowed" python - <<'PY'
          import json,os
          n=int(os.environ['ALLOWED'])
          padded=f'{n:03d}'
          print(json.dumps({'include':[{'shard':i,'shard_count_padded':padded} for i in range(n)]},separators=(',',':')))
          PY
          )"
          batch_size="$(python - <<'PYBATCH'
          import json
          from pathlib import Path
          fallback=8
          p=Path('control/qwen_batch_runtime_config.json')
          try:
              cfg=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          except Exception:
              cfg={}
          champ=cfg.get('champion') if cfg.get('status') == 'PASS' else None
          if isinstance(champ,dict) and champ.get('safe_for_shadow_scale_out'):
              try: n=int(champ.get('initial_batch_size') or fallback)
              except Exception: n=fallback
          else:
              n=fallback
          print(max(1,min(32,n)))
          PYBATCH
          )"
          echo "batch_size=$batch_size" >> "$GITHUB_OUTPUT"
          echo "source_run=$source_run" >> "$GITHUB_OUTPUT"
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
          echo "per_shard=$per_shard" >> "$GITHUB_OUTPUT"
          echo "allowed_workers=$allowed" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          cat input/qwen-capacity-admission.json

      - name: Upload immutable input transport for this pass
        uses: actions/upload-artifact@v4
        with:
          name: qwen-live-input-${{ github.run_id }}
          path: |
            input/
            previous/
            shards/
          retention-days: 7
          if-no-files-found: error

      - name: Plan summary
        run: |
          echo "Source discovery: ${{ steps.plan.outputs.source_run }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact-hash queue remaining before this pass: ${{ steps.plan.outputs.remaining }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Workers requested from shared Tender pool: $QWEN_WORKERS_REQUESTED; workers admitted: ${{ steps.plan.outputs.allowed_workers }}; max notices/worker: ${{ steps.plan.outputs.per_shard }}; batch size: ${{ steps.plan.outputs.batch_size }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat input/qwen-capacity-admission.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  classify:
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.remaining != '0' && needs.plan.outputs.allowed_workers != '0'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.allowed_workers) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: qwen-live-input-${{ github.run_id }}
          path: work

      - id: shard
        name: Resolve shard and row count
        shell: bash
        run: |
          set -euo pipefail
          idx='${{ matrix.shard }}'
          printf -v padded '%03d' "$idx"
          shard="$(find work/shards -type f -name "qwen-shadow-${{ needs.plan.outputs.source_run }}-shard-${padded}-of-${{ matrix.shard_count_padded }}.jsonl.gz" -print -quit)"
          test -n "$shard"
          rows="$(python - "$shard" <<'PY'
          import gzip,sys
          with gzip.open(sys.argv[1],'rt',encoding='utf-8') as f:
              print(sum(1 for line in f if line.strip()))
          PY
          )"
          echo "path=$shard" >> "$GITHUB_OUTPUT"
          echo "rows=$rows" >> "$GITHUB_OUTPUT"
          if [ "$rows" -gt 0 ]; then echo 'has_work=true' >> "$GITHUB_OUTPUT"; else echo 'has_work=false' >> "$GITHUB_OUTPUT"; fi

      - name: Cache Qwen GGUF
        if: steps.shard.outputs.has_work == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: qwen3-4b-q4-k-m-hf-v1

      - name: Install llama.cpp CPU runtime
        if: steps.shard.outputs.has_work == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p llama-dist
          gh api 'repos/ggml-org/llama.cpp/releases?per_page=20' > /tmp/releases.json
          readarray -t picked < <(python - <<'PY'
          import json,re
          for rel in json.load(open('/tmp/releases.json')):
              if rel.get('draft') or rel.get('prerelease'): continue
              for a in rel.get('assets',[]):
                  if re.fullmatch(r'llama-.*-bin-ubuntu-x64\.tar\.gz',a.get('name','')):
                      print(rel['tag_name']); print(a['name']); raise SystemExit
          raise SystemExit('no llama.cpp Ubuntu x64 asset found')
          PY
          )
          gh release download "${picked[0]}" --repo ggml-org/llama.cpp --pattern "${picked[1]}" --dir llama-dist
          tar -xzf "llama-dist/${picked[1]}" -C llama-dist
          server="$(find llama-dist -type f -name llama-server -perm -u+x -print -quit)"
          test -n "$server"
          echo "LLAMA_SERVER=$server" >> "$GITHUB_ENV"

      - name: Start Qwen3 4B CPU server
        if: steps.shard.outputs.has_work == 'true'
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          "$LLAMA_SERVER" -hf Qwen/Qwen3-4B-GGUF:Q4_K_M \
            --host 127.0.0.1 --port 8080 --jinja -c 8192 -t 4 > qwen-server.log 2>&1 &
          echo $! > qwen-server.pid
          ready=0
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then ready=1; break; fi
            kill -0 "$(cat qwen-server.pid)" >/dev/null 2>&1 || { tail -200 qwen-server.log; exit 1; }
            sleep 3
          done
          [ "$ready" = 1 ] || { tail -200 qwen-server.log; exit 1; }
          echo "QWEN_STARTUP_SECONDS=$(($(date +%s)-start))" >> "$GITHUB_ENV"

      - name: Classify bounded shard with recursive self-healing
        if: steps.shard.outputs.has_work == 'true'
        shell: bash
        run: |
          set -euo pipefail
          idx='${{ matrix.shard }}'
          python pipeline/qwen_notice_batch_selfheal.py \
            --queue '${{ steps.shard.outputs.path }}' \
            --out "qwen-live-${idx}-raw.jsonl" \
            --summary "qwen-live-${idx}-summary.json" \
            --batch-size '${{ needs.plan.outputs.batch_size }}' \
            --sample-size '${{ needs.plan.outputs.per_shard }}' \
            --source-ledger-generation '${{ needs.plan.outputs.source_run }}' \
            --description-chars 500 \
            --timeout 75 \
            --max-tokens 1100 \
            --max-runtime-seconds 7800 \
            --startup-seconds "$QWEN_STARTUP_SECONDS"
          python pipeline/qwen_notice_post_guard.py \
            --input "qwen-live-${idx}-raw.jsonl" \
            --output "qwen-live-${idx}-guarded.jsonl" \
            --summary "qwen-live-${idx}-guard-summary.json"

      - name: Stop model
        if: always() && steps.shard.outputs.has_work == 'true'
        shell: bash
        run: |
          [ -s qwen-server.pid ] && kill "$(cat qwen-server.pid)" >/dev/null 2>&1 || true

      - name: Create empty conserved output for an empty shard
        if: steps.shard.outputs.has_work != 'true'
        shell: bash
        run: |
          idx='${{ matrix.shard }}'
          : > "qwen-live-${idx}-guarded.jsonl"
          printf '{"rows":0,"empty_shard":true}\n' > "qwen-live-${idx}-summary.json"

      - name: Upload shard results immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-live-result-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            qwen-live-${{ matrix.shard }}-guarded.jsonl
            qwen-live-${{ matrix.shard }}-raw.jsonl
            qwen-live-${{ matrix.shard }}-summary.json
            qwen-live-${{ matrix.shard }}-guard-summary.json
            qwen-server.log
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    needs: [plan, classify]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: qwen-live-input-${{ github.run_id }}
          path: work
      - name: Download all completed shard outputs
        if: needs.plan.outputs.remaining != '0' && needs.plan.outputs.allowed_workers != '0'
        uses: actions/download-artifact@v4
        with:
          pattern: qwen-live-result-*-${{ github.run_id }}
          path: results
          merge-multiple: true

      - id: merge
        name: Hash-safe merge and prove monotonic queue progress
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish results
          result_args=()
          while IFS= read -r f; do result_args+=(--results "$f"); done < <(find results -type f -name 'qwen-live-*-guarded.jsonl' -size +0c 2>/dev/null | sort || true)
          python pipeline/merge_qwen_classification_state.py \
            --ledger work/input/notice-intelligence-ledger-latest.jsonl.gz \
            --classification-queue work/input/notice-classification-queue-latest.jsonl.gz \
            --previous-state work/previous/qwen-state-current.jsonl.gz \
            "${result_args[@]}" \
            --target-classifier-version "$QWEN_CLASSIFIER_VERSION" \
            --state-out publish/qwen-classification-state-latest.jsonl.gz \
            --queue-out publish/qwen-classification-remaining-latest.jsonl.gz \
            --summary-out publish/qwen-classification-merge-summary-latest.json
          python - <<'PY'
          import json,os
          s=json.load(open('publish/qwen-classification-merge-summary-latest.json'))
          before=int(s['input_queue_rows']); after=int(s['remaining_classification_queue'])
          accepted=int((s.get('stats') or {}).get('results_accepted') or 0)
          if after > before: raise SystemExit(f'queue grew unexpectedly: {before}->{after}')
          print(json.dumps({'before':before,'after':after,'accepted':accepted,'classified_fraction':s['classified_fraction_of_ledger']},indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"remaining={after}\naccepted={accepted}\nstate_rows={s['state_rows_after_merge']}\n")
          PY

      - name: Publish durable state with immutable and stable pointers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_run='${{ needs.plan.outputs.source_run }}'
          immutable="qwen-classification-state-${source_run}-${GITHUB_RUN_ID}"
          gh release view "$immutable" >/dev/null 2>&1 || gh release create "$immutable" --target main \
            --title "Qwen classification state ${source_run}/${GITHUB_RUN_ID}" \
            --notes 'Shadow-safe semantic notice classification. Exact material hash required; DCE remains authoritative; no notice is deleted.'
          gh release upload "$immutable" publish/* --clobber
          stable=qwen-classification-state-latest
          gh release view "$stable" >/dev/null 2>&1 || gh release create "$stable" --target main \
            --title 'Qwen Classification State — LATEST' \
            --notes 'Stable pointer to exact-hash Qwen semantic state.'
          gh release edit "$stable" --title "Qwen Classification State — LATEST (${source_run}/${GITHUB_RUN_ID})" \
            --notes "source_run=${source_run} run=${GITHUB_RUN_ID} state_rows=${{ steps.merge.outputs.state_rows }} remaining=${{ steps.merge.outputs.remaining }} accepted_this_pass=${{ steps.merge.outputs.accepted }} admitted_workers=${{ needs.plan.outputs.allowed_workers }}"
          gh release upload "$stable" publish/* --clobber

      - id: selection
        name: Build direct Qwen semantic DCE lane outside legacy keyword gate
        shell: bash
        env:
          REQUESTED_DCE_LIMIT: ${{ github.event.inputs.dce_limit || '160' }}
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:control/controller_state_checkpoint.json > latest-controller-state.json 2>/dev/null || printf '{}\n' > latest-controller-state.json
          limit="$(python - <<'PY'
          import os
          try:n=int(os.environ.get('REQUESTED_DCE_LIMIT') or 160)
          except Exception:n=160
          print(max(32,min(320,n)))
          PY
          )"
          python pipeline/build_qwen_dce_selection.py \
            --state publish/qwen-classification-state-latest.jsonl.gz \
            --ledger work/input/notice-intelligence-ledger-latest.jsonl.gz \
            --snapshot work/input/live-open-tenders-latest.jsonl.gz \
            --blocked-state latest-controller-state.json \
            --out qwen-live-selection.jsonl \
            --summary qwen-live-selection.summary.json \
            --source-run '${{ needs.plan.outputs.source_run }}' \
            --limit "$limit"
          count="$(python -c "import json;print(json.load(open('qwen-live-selection.summary.json'))['selected'])")"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Persist current Qwen DCE selection for DCE Fanout V2
        if: steps.selection.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p queues control/qwen_live
          cp qwen-live-selection.jsonl queues/qwen_live_selection_latest.jsonl
          cp qwen-live-selection.summary.json control/qwen_live/selection_summary.json
          cp publish/qwen-classification-merge-summary-latest.json control/qwen_live/classification_summary.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add queues/qwen_live_selection_latest.jsonl control/qwen_live/
          git commit -m "qwen: publish live semantic DCE lane ${GITHUB_RUN_ID}" || true
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$((attempt * 4))"
          done
          exit 1

      - name: Dispatch Qwen-ranked DCE work when DCE fleet is free
        if: steps.selection.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          active="$(gh run list --workflow dce-fanout-v2.yml --limit 30 --json status --jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending")] | length')"
          if [ "$active" -gt 0 ]; then
            echo "DCE fleet busy ($active active/queued); semantic queue is persisted and will remain available."
            exit 0
          fi
          jobs='${{ steps.selection.outputs.count }}'
          if [ "$jobs" -gt 120 ]; then jobs=120; fi
          dce_parallel="$(DCE_SELECTION_PATH=queues/qwen_live_selection_latest.jsonl python - <<'PYADMIT'
          from pipeline.global_admission import dynamic_tender_parallel
          allowed,_=dynamic_tender_parallel(60)
          print(allowed)
          PYADMIT
          )"
          if [ "${dce_parallel:-0}" -le 0 ]; then
            echo "No shared Tender capacity available for DCE; persisted queue will be picked up by the drainer."
            exit 0
          fi
          gh workflow run dce-fanout-v2.yml --ref main \
            -f selection_path=queues/qwen_live_selection_latest.jsonl \
            -f source_discovery_run='${{ needs.plan.outputs.source_run }}' \
            -f max_jobs="$jobs" \
            -f max_parallel="$dce_parallel" \
            -f jobs_per_shard=0
          echo "Dispatched Qwen semantic DCE lane: candidates=$jobs source=${{ needs.plan.outputs.source_run }} shared_tender_parallel=$dce_parallel."

      - name: Continue bounded backfill only after real accepted progress
        if: steps.merge.outputs.remaining != '0' && steps.merge.outputs.accepted != '0' && (github.event.inputs.auto_continue || 'true') == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run qwen-live-classification.yml --ref main \
            -f per_shard='${{ needs.plan.outputs.per_shard }}' \
            -f auto_continue=true \
            -f dce_limit='${{ github.event.inputs.dce_limit || '160' }}'
          echo "Queued next bounded Qwen pass; remaining=${{ steps.merge.outputs.remaining }}"

      - name: End-to-end summary
        if: always()
        shell: bash
        run: |
          echo "### Qwen live mainline" >> "$GITHUB_STEP_SUMMARY"
          echo "- source discovery: ${{ needs.plan.outputs.source_run }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- queue before pass: ${{ needs.plan.outputs.remaining }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- workers requested/admitted from shared Tender pool: $QWEN_WORKERS_REQUESTED/${{ needs.plan.outputs.allowed_workers }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- accepted this pass: ${{ steps.merge.outputs.accepted }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- remaining exact-hash classification queue: ${{ steps.merge.outputs.remaining }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- cumulative classified state rows: ${{ steps.merge.outputs.state_rows }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Qwen-ranked DCE candidates published: ${{ steps.selection.outputs.count }}" >> "$GITHUB_STEP_SUMMARY"
          echo '- safety: notice ranking only; no destructive rejection; DCE remains authoritative.' >> "$GITHUB_STEP_SUMMARY"
