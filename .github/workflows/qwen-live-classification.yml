name: Qwen Live Notice Classification

on:
  workflow_dispatch:
    inputs:
      per_shard:
        description: Maximum notices classified by each worker in this pass
        required: false
        default: '480'
      auto_continue:
        description: Retained for compatibility; semantic controller owns continuation
        required: false
        default: 'true'
      dce_limit:
        description: Retained for compatibility; conveyor owns DCE handoff
        required: false
        default: '160'

permissions:
  actions: write
  contents: write

concurrency:
  group: qwen-live-notice-classification-active
  cancel-in-progress: false

env:
  QWEN_WORKERS_REQUESTED: '20'
  QWEN_OPERATIONAL_ROWS_PER_SHARD: '480'
  QWEN_CLASSIFIER_VERSION: 'qwen3-4b-q4km-batch-selfheal-v1'
  QWEN_RICH_MIN_CONTEXT_CHARS: '1200'
  QWEN_TRANSPORT_RETRIES: '0'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source_run: ${{ steps.plan.outputs.source_run }}
      remaining: ${{ steps.plan.outputs.remaining }}
      per_shard: ${{ steps.plan.outputs.per_shard }}
      allowed_workers: ${{ steps.plan.outputs.allowed_workers }}
      matrix: ${{ steps.plan.outputs.matrix }}
      batch_size: ${{ steps.plan.outputs.batch_size }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download current ledger, exact snapshot and previous semantic state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input previous shards
          gh release download notice-intelligence-ledger-latest \
            --pattern notice-intelligence-ledger-latest.jsonl.gz \
            --pattern notice-classification-queue-latest.jsonl.gz \
            --pattern notice-ledger-summary-latest.json \
            --dir input --clobber
          ledger_notes="$(gh release view notice-intelligence-ledger-latest --json body --jq '.body')"
          source_run="$(grep -oE 'run=[0-9]+' <<< "$ledger_notes" | head -n1 | cut -d= -f2)"
          if [[ ! "$source_run" =~ ^[0-9]+$ ]]; then
            ledger_name="$(gh release view notice-intelligence-ledger-latest --json name --jq '.name')"
            source_run="$(grep -oE '[0-9]{8,}' <<< "$ledger_name" | tail -n1)"
          fi
          [[ "$source_run" =~ ^[0-9]+$ ]] || { echo 'Cannot resolve ledger source run' >&2; exit 1; }
          snapshot_tag="live-world-snapshot-${source_run}"
          gh release download "$snapshot_tag" \
            --pattern "live-open-tenders-${source_run}.jsonl.gz" \
            --pattern "snapshot-manifest-${source_run}.json" \
            --dir input --clobber
          mv "input/live-open-tenders-${source_run}.jsonl.gz" input/live-open-tenders-latest.jsonl.gz
          mv "input/snapshot-manifest-${source_run}.json" input/snapshot-manifest-latest.json
          echo "LEDGER_SOURCE_RUN=$source_run" >> "$GITHUB_ENV"

          mkdir -p previous/candidates
          gh release download qwen-incremental-state-latest \
            --pattern qwen-incremental-state-latest.jsonl.gz \
            --dir previous/candidates --clobber >/dev/null 2>&1 || true
          gh release download qwen-classification-state-latest \
            --pattern qwen-classification-state-latest.jsonl.gz \
            --dir previous/candidates --clobber >/dev/null 2>&1 || true
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          candidates=[]
          for p in Path('previous/candidates').glob('*.jsonl.gz'):
              try:
                  with gzip.open(p,'rt',encoding='utf-8') as f:
                      rows=sum(1 for line in f if line.strip())
                  candidates.append((rows,p))
              except Exception:
                  pass
          if candidates:
              rows,p=max(candidates,key=lambda x:(x[0],x[1].name.startswith('qwen-classification-state')))
              Path('previous/qwen-classification-state-latest.jsonl.gz').write_bytes(p.read_bytes())
              print(f'Using previous semantic state {p.name} rows={rows}')
          else:
              expected=0
              summary=Path('control/qwen_live/classification_summary.json')
              if summary.exists():
                  try: expected=int(json.loads(summary.read_text(encoding='utf-8')).get('state_rows_after_merge') or 0)
                  except Exception: expected=0
              if expected > 0:
                  raise SystemExit(f'FAIL_CLOSED: semantic releases unavailable while main records {expected} rows')
              with gzip.open('previous/qwen-classification-state-latest.jsonl.gz','wt',encoding='utf-8'):
                  pass
          PY

      - id: plan
        name: Build one bounded high-throughput semantic wave
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PER_SHARD: ${{ github.event.inputs.per_shard || '480' }}
        shell: bash
        run: |
          set -euo pipefail
          source_run="$LEDGER_SOURCE_RUN"
          manifest_run="$(python -c "import json;print(json.load(open('input/snapshot-manifest-latest.json'))['source_discovery_run'])")"
          [ "$manifest_run" = "$source_run" ] || { echo "Ledger/snapshot mismatch: ledger=$source_run snapshot=$manifest_run" >&2; exit 1; }

          python pipeline/merge_qwen_classification_state.py \
            --ledger input/notice-intelligence-ledger-latest.jsonl.gz \
            --classification-queue input/notice-classification-queue-latest.jsonl.gz \
            --previous-state previous/qwen-classification-state-latest.jsonl.gz \
            --snapshot input/live-open-tenders-latest.jsonl.gz \
            --target-classifier-version "$QWEN_CLASSIFIER_VERSION" \
            --state-out previous/qwen-state-current.jsonl.gz \
            --queue-out input/qwen-work-queue.jsonl.gz \
            --summary-out input/qwen-prefilter-summary.json

          remaining="$(python -c "import json;print(json.load(open('input/qwen-prefilter-summary.json'))['remaining_classification_queue'])")"
          per_shard="$(python - <<'PY'
          import os
          try: n=int(os.environ.get('REQUESTED_PER_SHARD') or 480)
          except Exception: n=480
          print(max(16,min(480,n)))
          PY
          )"

          python - <<'PY' > input/qwen-capacity-admission.json
          import json, os
          from pipeline.global_admission import dynamic_tender_parallel
          requested=max(1,min(20,int(os.environ.get('QWEN_WORKERS_REQUESTED') or 20)))
          allowed, report=dynamic_tender_parallel(requested)
          report['lane']='qwen-live-classification'
          report['requested_workers']=requested
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
          allowed="$(python -c "import json;print(int(json.load(open('input/qwen-capacity-admission.json')).get('allowed') or 0))")"
          if [ "$remaining" = '0' ]; then allowed=0; fi

          if [ "$allowed" -gt 0 ]; then
            REQUESTED_PER_SHARD="$per_shard" python pipeline/build_qwen_shadow_shards.py \
              --input input/qwen-work-queue.jsonl.gz \
              --out-dir shards \
              --source-run "$source_run" \
              --shards "$allowed" \
              --manifest-out input/qwen-live-shard-manifest.json
          else
            printf '%s\n' "{\"source_run\":\"$source_run\",\"shards\":0,\"reason\":\"no_admitted_capacity_or_empty_queue\"}" > input/qwen-live-shard-manifest.json
          fi

          matrix="$(ALLOWED="$allowed" python - <<'PY'
          import json,os
          n=int(os.environ['ALLOWED']); padded=f'{n:03d}'
          print(json.dumps({'include':[{'shard':i,'shard_count_padded':padded} for i in range(n)]},separators=(',',':')))
          PY
          )"
          batch_size="$(python - <<'PY'
          import json
          from pathlib import Path
          fallback=1
          try: cfg=json.loads(Path('control/qwen_batch_runtime_config.json').read_text(encoding='utf-8'))
          except Exception: cfg={}
          champ=cfg.get('champion') if cfg.get('status') == 'PASS' else None
          if isinstance(champ,dict) and champ.get('safe_for_shadow_scale_out'):
              try: n=int(champ.get('initial_batch_size') or fallback)
              except Exception: n=fallback
          else: n=fallback
          print(max(1,min(16,n)))
          PY
          )"

          echo "source_run=$source_run" >> "$GITHUB_OUTPUT"
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
          echo "per_shard=$per_shard" >> "$GITHUB_OUTPUT"
          echo "allowed_workers=$allowed" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "batch_size=$batch_size" >> "$GITHUB_OUTPUT"
          cat input/qwen-live-shard-manifest.json

      - name: Upload control-plane input for conveyors and aggregate
        uses: actions/upload-artifact@v4
        with:
          name: qwen-live-input-${{ github.run_id }}
          path: |
            input/
            previous/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload worker-only shards
        uses: actions/upload-artifact@v4
        with:
          name: qwen-live-shards-${{ github.run_id }}
          path: shards/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Plan summary
        run: |
          echo "Source discovery: ${{ steps.plan.outputs.source_run }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Queue remaining: ${{ steps.plan.outputs.remaining }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Workers: ${{ steps.plan.outputs.allowed_workers }}; rows/worker: ${{ steps.plan.outputs.per_shard }}; batch: ${{ steps.plan.outputs.batch_size }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Workers download shards only; ledger/snapshot/state are not replicated to every runner.' >> "$GITHUB_STEP_SUMMARY"

  classify:
    needs: plan
    if: needs.plan.result == 'success' && needs.plan.outputs.remaining != '0' && needs.plan.outputs.allowed_workers != '0'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.allowed_workers) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: qwen-live-shards-${{ github.run_id }}
          path: work

      - id: shard
        name: Resolve this worker shard
        shell: bash
        run: |
          set -euo pipefail
          idx='${{ matrix.shard }}'; printf -v padded '%03d' "$idx"
          shard="$(find work -type f -name "qwen-shadow-${{ needs.plan.outputs.source_run }}-shard-${padded}-of-${{ matrix.shard_count_padded }}.jsonl.gz" -print -quit)"
          test -n "$shard"
          rows="$(python - "$shard" <<'PY'
          import gzip,sys
          with gzip.open(sys.argv[1],'rt',encoding='utf-8') as f: print(sum(1 for line in f if line.strip()))
          PY
          )"
          echo "path=$shard" >> "$GITHUB_OUTPUT"
          echo "rows=$rows" >> "$GITHUB_OUTPUT"
          [ "$rows" -gt 0 ] && echo 'has_work=true' >> "$GITHUB_OUTPUT" || echo 'has_work=false' >> "$GITHUB_OUTPUT"

      - name: Cache Qwen GGUF
        if: steps.shard.outputs.has_work == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: qwen3-4b-q4-k-m-hf-v1

      - name: Install llama.cpp CPU runtime
        if: steps.shard.outputs.has_work == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p llama-dist
          gh api 'repos/ggml-org/llama.cpp/releases?per_page=20' > /tmp/releases.json
          readarray -t picked < <(python - <<'PY'
          import json,re
          for rel in json.load(open('/tmp/releases.json')):
              if rel.get('draft') or rel.get('prerelease'): continue
              for a in rel.get('assets',[]):
                  if re.fullmatch(r'llama-.*-bin-ubuntu-x64\.tar\.gz',a.get('name','')):
                      print(rel['tag_name']); print(a['name']); raise SystemExit
          raise SystemExit('no llama.cpp Ubuntu x64 asset found')
          PY
          )
          gh release download "${picked[0]}" --repo ggml-org/llama.cpp --pattern "${picked[1]}" --dir llama-dist
          tar -xzf "llama-dist/${picked[1]}" -C llama-dist
          server="$(find llama-dist -type f -name llama-server -perm -u+x -print -quit)"
          test -n "$server"
          echo "LLAMA_SERVER=$server" >> "$GITHUB_ENV"

      - name: Start Qwen3 4B CPU server
        if: steps.shard.outputs.has_work == 'true'
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          "$LLAMA_SERVER" -hf Qwen/Qwen3-4B-GGUF:Q4_K_M \
            --host 127.0.0.1 --port 8080 --jinja -c 4096 -t 4 > qwen-server.log 2>&1 &
          echo $! > qwen-server.pid
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "QWEN_STARTUP_SECONDS=$(($(date +%s)-start))" >> "$GITHUB_ENV"; exit 0
            fi
            kill -0 "$(cat qwen-server.pid)" >/dev/null 2>&1 || { tail -200 qwen-server.log; exit 1; }
            sleep 3
          done
          tail -200 qwen-server.log; exit 1

      - name: Classify shard on validated singleton fast path
        if: steps.shard.outputs.has_work == 'true'
        shell: bash
        run: |
          set -euo pipefail
          idx='${{ matrix.shard }}'
          python pipeline/qwen_notice_batch_selfheal.py \
            --queue '${{ steps.shard.outputs.path }}' \
            --out "qwen-live-${idx}-raw.jsonl" \
            --summary "qwen-live-${idx}-summary.json" \
            --batch-size '${{ needs.plan.outputs.batch_size }}' \
            --sample-size '${{ needs.plan.outputs.per_shard }}' \
            --source-ledger-generation '${{ needs.plan.outputs.source_run }}' \
            --description-chars 1200 \
            --timeout 30 \
            --max-tokens 900 \
            --max-runtime-seconds 7200 \
            --startup-seconds "$QWEN_STARTUP_SECONDS"
          python pipeline/qwen_notice_post_guard.py \
            --input "qwen-live-${idx}-raw.jsonl" \
            --output "qwen-live-${idx}-guarded.jsonl" \
            --summary "qwen-live-${idx}-guard-summary.json" \
            --queue '${{ steps.shard.outputs.path }}'

      - name: Stop model
        if: always() && steps.shard.outputs.has_work == 'true'
        shell: bash
        run: |
          [ -s qwen-server.pid ] && kill "$(cat qwen-server.pid)" >/dev/null 2>&1 || true

      - name: Create conserved empty output
        if: steps.shard.outputs.has_work != 'true'
        shell: bash
        run: |
          idx='${{ matrix.shard }}'
          : > "qwen-live-${idx}-guarded.jsonl"
          printf '%s\n' '{"sample_resolved":0,"sample_completed":0,"sample_fallback":0,"empty_shard":true}' > "qwen-live-${idx}-summary.json"

      - name: Upload worker result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-live-result-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            qwen-live-${{ matrix.shard }}-guarded.jsonl
            qwen-live-${{ matrix.shard }}-summary.json
            qwen-live-${{ matrix.shard }}-guard-summary.json
            qwen-server.log
          compression-level: 0
          if-no-files-found: warn
          retention-days: 14

  aggregate:
    needs: [plan, classify]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: qwen-live-input-${{ github.run_id }}
          path: work
      - name: Download completed worker outputs
        if: needs.plan.outputs.remaining != '0' && needs.plan.outputs.allowed_workers != '0'
        uses: actions/download-artifact@v4
        with:
          pattern: qwen-live-result-*-${{ github.run_id }}
          path: results
          merge-multiple: true

      - id: merge
        name: Hash-safe aggregate merge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish results
          result_args=()
          while IFS= read -r f; do result_args+=(--results "$f"); done < <(find results -type f -name 'qwen-live-*-guarded.jsonl' -size +0c 2>/dev/null | sort || true)
          python pipeline/merge_qwen_classification_state.py \
            --ledger work/input/notice-intelligence-ledger-latest.jsonl.gz \
            --classification-queue work/input/notice-classification-queue-latest.jsonl.gz \
            --previous-state work/previous/qwen-state-current.jsonl.gz \
            --snapshot work/input/live-open-tenders-latest.jsonl.gz \
            "${result_args[@]}" \
            --target-classifier-version "$QWEN_CLASSIFIER_VERSION" \
            --state-out publish/qwen-classification-state-latest.jsonl.gz \
            --queue-out publish/qwen-classification-remaining-latest.jsonl.gz \
            --summary-out publish/qwen-classification-merge-summary-latest.json
          python - <<'PY'
          import json,os
          s=json.load(open('publish/qwen-classification-merge-summary-latest.json'))
          before=int(s['input_queue_rows']); after=int(s['remaining_classification_queue'])
          accepted=int((s.get('stats') or {}).get('results_accepted') or 0)
          if after > before: raise SystemExit(f'queue grew unexpectedly: {before}->{after}')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"remaining={after}\naccepted={accepted}\nstate_rows={s['state_rows_after_merge']}\n")
          print(json.dumps({'before':before,'after':after,'accepted':accepted},indent=2))
          PY

      - name: Preserve aggregate state artifact
        if: steps.merge.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: qwen-live-aggregate-state-${{ github.run_id }}
          path: publish/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - id: mirror
        name: Mirror aggregate to stable release
        if: steps.merge.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u -o pipefail
          stable='qwen-classification-state-latest'
          notes="source_run=${{ needs.plan.outputs.source_run }} run=${GITHUB_RUN_ID} state_rows=${{ steps.merge.outputs.state_rows }} remaining=${{ steps.merge.outputs.remaining }} accepted_this_pass=${{ steps.merge.outputs.accepted }}"
          retry_cmd() { local label="$1"; shift; for delay in 0 15 45 120; do [ "$delay" -eq 0 ] || sleep "$delay"; "$@" && return 0; done; echo "::warning::$label deferred"; return 1; }
          retry_cmd 'stable metadata' gh release edit "$stable" --title "Qwen Classification State — LATEST (${{ needs.plan.outputs.source_run }}/${GITHUB_RUN_ID})" --notes "$notes" || { echo 'mirror=deferred' >> "$GITHUB_OUTPUT"; exit 0; }
          retry_cmd 'stable assets' gh release upload "$stable" publish/* --clobber || { echo 'mirror=deferred' >> "$GITHUB_OUTPUT"; exit 0; }
          echo 'mirror=ok' >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          echo '### Qwen live mainline' >> "$GITHUB_STEP_SUMMARY"
          echo "- source: ${{ needs.plan.outputs.source_run }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- accepted: ${{ steps.merge.outputs.accepted }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- remaining: ${{ steps.merge.outputs.remaining }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- state rows: ${{ steps.merge.outputs.state_rows }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- stable mirror: ${{ steps.mirror.outputs.mirror || 'not-run' }}" >> "$GITHUB_STEP_SUMMARY"
          echo '- final bid truth still requires DCE; semantic routing never auto-approves a bid.' >> "$GITHUB_STEP_SUMMARY"
