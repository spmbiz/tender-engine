name: Cyprus ePPS OCDS Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cy-epps-ocds-probe.yml'
      - 'pipeline/probe_cy_epps_ocds.py'
      - 'control/cy_epps_ocds_probe_trigger.txt'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1, fetch-tags: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests
      - name: Probe official Cyprus government ePPS OCDS endpoints
        shell: bash
        run: |
          set +e
          python pipeline/probe_cy_epps_ocds.py
          rc=$?
          echo "probe_rc=$rc"
          exit 0
      - name: Persist probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f control/cy_epps_ocds_probe.json || printf '%s\n' '{"schema":"CY_EPPS_OCDS_PROBE_WORKFLOW_FAILURE","pass":false}' > control/cy_epps_ocds_probe.json
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add control/cy_epps_ocds_probe.json
          git diff --cached --quiet && exit 0
          git commit -m "diag: persist Cyprus ePPS OCDS probe ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
