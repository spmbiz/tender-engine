name: Qwen API Patch Formatting Fix Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qwen-api-patch-fix-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair literal newline escapes in Qwen checkpoint gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('pipeline/qwen_notice_batch_selfheal.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('    # Release uploads are intentionally opt-in.')
          end=s.index('    live_release_repo = os.environ.get("GITHUB_REPOSITORY")', start)
          fixed='''    # Release uploads are intentionally opt-in. Publishing after every recursive
    # split/output can consume hundreds of GitHub API calls per pass and starve
    # the authoritative aggregate writer. Local checkpoints and final workflow
    # artifacts remain enabled regardless.
    external_progress_enabled = str(os.environ.get("QWEN_EXTERNAL_PROGRESS_RELEASES") or "").strip().lower() in {"1", "true", "yes"}
    live_release_tag = (
        f"qwen-live-progress-{run_id}"
        if external_progress_enabled and os.environ.get("GITHUB_ACTIONS") == "true" and run_id != "local"
        else None
    )
'''
          p.write_text(s[:start]+fixed+s[end:],encoding='utf-8')
          PY
          python -m py_compile pipeline/qwen_notice_batch_selfheal.py
          python - <<'PY'
          import ast
          from pathlib import Path
          tree=ast.parse(Path('pipeline/qwen_notice_batch_selfheal.py').read_text())
          names={n.id for n in ast.walk(tree) if isinstance(n,ast.Name)}
          assert 'external_progress_enabled' in names
          assert 'live_release_tag' in names
          print('AST gate variables present')
          PY
      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tender-engine-bot'
          git config user.email 'tender-engine-bot@users.noreply.github.com'
          git add pipeline/qwen_notice_batch_selfheal.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(qwen): repair checkpoint gate source formatting'
          for n in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$((n*2))"
          done
          exit 1
