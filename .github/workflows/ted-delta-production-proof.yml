name: TED Delta Production Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ted-delta-production-proof.yml'
      - 'control/ted_delta_production_trigger.txt'

permissions:
  contents: write

jobs:
  delta-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        shell: bash
        run: python -m pip install --disable-pip-version-check -q requests pytest
      - name: Focused regression gate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile pipeline/discover_ted.py pipeline/ted_production.py
          pytest -q tests/test_ted_transport_resilience.py tests/test_ted_production_orchestrator.py
      - name: Create durable proof Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="ted-delta-proof-${GITHUB_RUN_ID}"
          gh release create "$tag" --title "TED delta production proof ${GITHUB_RUN_ID}" --notes "Full production delta: future-deadline universe plus recent-publication recall lane. Durable proof pack; not a full ACTIVE-universe coverage claim."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Run production delta end to end
        id: run
        shell: bash
        env:
          DISCOVERY_MODE: delta
          DISCOVERY_OUT: ted-delta
          TED_REQUEST_RETRIES: '8'
          TED_PAGE_DELAY_SECONDS: '0.08'
          TED_DELTA_RECENT_DAYS: '3'
        run: |
          set +e
          python pipeline/discover_ted.py
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build compact verdict
        if: always()
        shell: bash
        env:
          ADAPTER_RC: ${{ steps.run.outputs.rc }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          stats_path=Path('ted-delta/stats.json')
          s=json.loads(stats_path.read_text()) if stats_path.exists() else {'errors':[{'type':'TED_DELTA_STATS_MISSING'}]}
          lanes=s.get('lanes') if isinstance(s.get('lanes'),list) else []
          by_label={str(x.get('label')):x for x in lanes if isinstance(x,dict)}
          future=by_label.get('future-deadline') or {}
          recent=by_label.get('recent-publication') or {}
          payload={
            'schema':'TED_DELTA_PRODUCTION_PROOF_V1',
            'release_tag':os.environ.get('RELEASE_TAG'),
            'adapter_exit_code':int(os.environ.get('ADAPTER_RC') or 99),
            'listing_contract':s.get('listing_contract'),
            'enumeration_mode':s.get('enumeration_mode'),
            'delta_recent_days':s.get('delta_recent_days'),
            'enumeration_complete':s.get('enumeration_complete'),
            'enumeration_exhausted':s.get('enumeration_exhausted'),
            'live_coverage_credit_allowed':s.get('live_coverage_credit_allowed'),
            'source_items_seen_across_overlapping_lanes':s.get('source_items_seen'),
            'materialized_unique':s.get('materialized_unique'),
            'current_materialized':s.get('current_materialized'),
            'open_confirmed_by_future_deadline':s.get('open_confirmed_by_future_deadline'),
            'open_unverified_no_parseable_deadline':s.get('open_unverified_no_parseable_deadline'),
            'future_deadline_lane':future,
            'recent_publication_lane':recent,
            'errors':s.get('errors') or [],
          }
          payload['pass']=(
            payload['adapter_exit_code']==0
            and payload['enumeration_complete'] is True
            and payload['enumeration_exhausted'] is True
            and payload['live_coverage_credit_allowed'] is False
            and future.get('complete') is True
            and recent.get('complete') is True
            and int(future.get('total_reported') or 0)>0
            and int(future.get('source_items_seen') or 0)>=int(future.get('total_reported') or 0)
            and int(payload['current_materialized'] or 0)>0
            and not payload['errors']
          )
          Path('control').mkdir(exist_ok=True)
          Path('control/ted_delta_production_proof.json').write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(payload,indent=2,ensure_ascii=False))
          PY
      - name: Preserve full proof pack in Release
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p durable-proof
          [ -d ted-delta ] && cp -a ted-delta durable-proof/
          [ -d ted-delta-lanes ] && cp -a ted-delta-lanes durable-proof/
          [ -f control/ted_delta_production_proof.json ] && cp control/ted_delta_production_proof.json durable-proof/
          tar -C durable-proof -czf ted-delta-production-proof.tar.gz .
          gh release upload "$RELEASE_TAG" ted-delta-production-proof.tar.gz --clobber
      - name: Persist compact verdict to main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f control/ted_delta_production_proof.json || printf '%s\n' '{"schema":"TED_DELTA_PRODUCTION_WORKFLOW_FAILURE","pass":false}' > control/ted_delta_production_proof.json
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add control/ted_delta_production_proof.json
          git diff --cached --quiet && exit 0
          git commit -m "diag: persist TED delta production proof ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*3))
          done
          exit 1
