name: Promote Germany Official OCDS Lane

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Germany DOE Full Reconcile Proof']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'control/de_doe_promote_trigger.txt'

permissions:
  contents: write

jobs:
  patch-test-publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests pytest
      - name: Require green full reconcile proof
        run: |
          python - <<'PY'
          import json
          p=json.load(open('control/de_doe_reconcile_proof.json'))
          assert p.get('schema')=='DE_DOE_FULL_RECONCILE_PROOF_V1',p
          assert p.get('pass') is True,p
          assert p.get('enumeration_complete') is True,p
          assert p.get('live_coverage_credit_allowed') is True,p
          assert p.get('months_requested')==p.get('months_completed'),p
          PY
      - name: Validate Germany collector contract
        run: |
          python -m py_compile pipeline/discover_de_doe_ocds.py pipeline/ocds_release_normalizer.py
          pytest -q tests/test_de_doe_ocds.py
      - name: Route global Germany lane and enforce reconcile exhaustion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/supergreen-discovery-v2.yml')
          s=wf.read_text()
          old='DE_DOE) python pipeline/discover_de_doe_csv.py ;;'
          new='DE_DOE) python pipeline/discover_de_doe_ocds.py ;;'
          if old in s:
              s=s.replace(old,new,1)
              wf.write_text(s)
          elif new not in s:
              raise SystemExit('Germany route marker missing')

          guard=Path('pipeline/source_coverage_guard.py')
          g=guard.read_text()
          marker='STRICT_EXHAUSTION_SOURCES={'
          if marker not in g:
              raise SystemExit('strict exhaustion marker missing')
          start=g.index(marker)
          end=g.index('}', start)
          block=g[start:end]
          if '"DE_DOE"' not in block:
              block=block.replace('{', '{"DE_DOE",', 1)
              g=g[:start]+block+g[end:]
              guard.write_text(g)
          PY
          grep -F 'DE_DOE) python pipeline/discover_de_doe_ocds.py ;;' .github/workflows/supergreen-discovery-v2.yml
          grep -F '"DE_DOE"' pipeline/source_coverage_guard.py
      - name: Commit routing if changed
        shell: bash
        run: |
          if git diff --quiet -- .github/workflows/supergreen-discovery-v2.yml pipeline/source_coverage_guard.py; then
            echo 'Germany route already applied'
            exit 0
          fi
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add .github/workflows/supergreen-discovery-v2.yml pipeline/source_coverage_guard.py
          git commit -m 'de: promote official monthly OCDS lane into global discovery'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
