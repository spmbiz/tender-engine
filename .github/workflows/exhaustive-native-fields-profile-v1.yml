name: SPM Exhaustive Native Fields Profile v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exhaustive-native-fields-profile-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q duckdb
      - name: Download canonical Global Core v4 notice-first file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source out
          gh release download tender-normalized-global-core-v4 --repo walidgdg1-ai/coldemailtool --pattern historical_tenders.parquet --dir source --clobber
      - name: Profile all native business/eligibility fields without sampling
        run: |
          python - <<'PY'
          import duckdb,csv,json
          from pathlib import Path
          p='source/historical_tenders.parquet';out=Path('out')
          con=duckdb.connect();con.execute("SET threads=4")
          n=con.execute("select count(*) from read_parquet(?)",[p]).fetchone()[0]
          assert n==2250547,n
          cols=[r[0] for r in con.execute("describe select * from read_parquet(?)",[p]).fetchall()]
          wanted=['Category','Subcategory','Lean_Fit','Automation_Potential','Onsite_Requirement','Minimum_Turnover','References_Required','Required_Certifications','Subcontracting_Status','Threshold_Level','Award_Criteria','Price_Weight','Quality_Weight','Competition_Type','Contract_Type','Procedure_Type','Raw_Spend_Category','Evidence_Confidence','Source_Grain_Status']
          present=[x for x in wanted if x in cols]
          profiles={}
          for c in present:
            q=f'''select coalesce(nullif(trim(cast("{c}" as varchar)),''),'__NULL_OR_EMPTY__') as field_value,count(*) as n_rows
                  from read_parquet(?) group by 1 order by n_rows desc limit 200'''
            rows=con.execute(q,[p]).fetchall()
            profiles[c]=[{'value':r[0],'n':r[1],'pct':round(100*r[1]/n,6)} for r in rows]
          Path('out/native_field_profiles.json').write_text(json.dumps({'version':'NATIVE_FIELDS_PROFILE_V1','rows':n,'present_fields':present,'profiles':profiles},ensure_ascii=False,indent=2),encoding='utf-8')

          rows=con.execute('''select Warehouse_Source,Country,coalesce(nullif(trim(cast(Category as varchar)),''),'UNKNOWN') as category_value,
              coalesce(nullif(trim(cast(Subcategory as varchar)),''),'UNKNOWN') as subcategory_value,count(*) as n_rows,
              count(distinct Buyer_Name) as buyers,
              median(try_cast(Official_Estimated_Value as double)) filter(where try_cast(Official_Estimated_Value as double)>=0) as median_est,
              median(try_cast(Official_Bidder_Count as double)) filter(where try_cast(Official_Bidder_Count as double)>=0) as median_bidders,
              count(*) filter(where try_cast(Official_Bidder_Count as double)=1) as one_bidder_rows
            from read_parquet(?) group by 1,2,3,4 order by n_rows desc''',[p]).fetchall()
          with open('out/category_subcategory_census.csv','w',newline='',encoding='utf-8') as f:
            w=csv.writer(f);w.writerow(['warehouse_source','country','category','subcategory','records','buyers','median_estimated_value','median_bidders','one_bidder_rows']);w.writerows(rows)

          rows2=con.execute('''select
              coalesce(nullif(trim(cast(Lean_Fit as varchar)),''),'UNKNOWN') as lean_fit,
              coalesce(nullif(trim(cast(Automation_Potential as varchar)),''),'UNKNOWN') as automation_potential,
              coalesce(nullif(trim(cast(Onsite_Requirement as varchar)),''),'UNKNOWN') as onsite_requirement,
              coalesce(nullif(trim(cast(Subcontracting_Status as varchar)),''),'UNKNOWN') as subcontracting_status,
              coalesce(nullif(trim(cast(References_Required as varchar)),''),'UNKNOWN') as references_required,
              coalesce(nullif(trim(cast(Required_Certifications as varchar)),''),'UNKNOWN') as required_certifications,
              count(*) as n_rows
            from read_parquet(?) group by 1,2,3,4,5,6 order by n_rows desc''',[p]).fetchall()
          with open('out/native_strategy_combinations.csv','w',newline='',encoding='utf-8') as f:
            w=csv.writer(f);w.writerow(['lean_fit','automation_potential','onsite_requirement','subcontracting_status','references_required','required_certifications','records']);w.writerows(rows2)

          rows3=con.execute('''select Warehouse_Source,Country,Category,Subcategory,
              coalesce(nullif(trim(cast(Lean_Fit as varchar)),''),'UNKNOWN') as lean_fit,
              coalesce(nullif(trim(cast(Automation_Potential as varchar)),''),'UNKNOWN') as automation_potential,
              coalesce(nullif(trim(cast(Onsite_Requirement as varchar)),''),'UNKNOWN') as onsite_requirement,
              count(*) as n_rows,count(distinct Buyer_Name) as buyers,
              median(try_cast(Official_Estimated_Value as double)) filter(where try_cast(Official_Estimated_Value as double)>=0) as median_est,
              median(try_cast(Official_Bidder_Count as double)) filter(where try_cast(Official_Bidder_Count as double)>=0) as median_bidders
            from read_parquet(?) group by 1,2,3,4,5,6,7 order by n_rows desc limit 20000''',[p]).fetchall()
          with open('out/native_business_cells.csv','w',newline='',encoding='utf-8') as f:
            w=csv.writer(f);w.writerow(['warehouse_source','country','category','subcategory','lean_fit','automation_potential','onsite_requirement','records','buyers','median_estimated_value','median_bidders']);w.writerows(rows3)

          completeness=[]
          for c in present:
            nonempty=con.execute(f'''select count(*) from read_parquet(?) where nullif(trim(cast("{c}" as varchar)),'') is not null''',[p]).fetchone()[0]
            completeness.append((c,nonempty,n-nonempty,round(100*nonempty/n,6)))
          with open('out/native_field_completeness.csv','w',newline='',encoding='utf-8') as f:
            w=csv.writer(f);w.writerow(['field','nonempty','empty_or_null','coverage_pct']);w.writerows(completeness)
          Path('out/REPORT.md').write_text('# Exhaustive native-field profile\n\n'+f'- Rows scanned: **{n:,}**\n- Fields profiled: **{len(present)}**\n- No row sampling/filtering used.\n\nNative strategic fields are profiled as source evidence; missing/UNKNOWN is never converted into PASS.\n',encoding='utf-8')
          PY
      - name: Persist compact profile
        run: |
          mkdir -p control/exhaustive_every_record_v1/native_fields
          cp out/* control/exhaustive_every_record_v1/native_fields/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/exhaustive_every_record_v1/native_fields/
          git commit -m 'tenders: persist exhaustive native-field profile' || exit 0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*3))
          done
          exit 1
