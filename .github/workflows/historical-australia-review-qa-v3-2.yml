name: Historical Australia Review QA v3.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - historical_lab/australia_review_qa_v3_1.py
      - .github/workflows/historical-australia-review-qa-v3-2.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download Australia v3.2 detailed evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input out
          TAG=historical-australia-review-evaluation-v3-2
          for f in examples.csv top_winners.csv market_matrix.csv; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$f" --dir input --clobber
          done
      - name: Build corrected semantic business QA
        run: python historical_lab/australia_review_qa_v3_1.py --examples input/examples.csv --winners input/top_winners.csv --matrix input/market_matrix.csv --out out
      - name: Persist QA v3.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=historical-australia-review-qa-v3-2
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main --title 'Historical Australia Review QA v3.2' --notes 'QA of corrected policy/program evaluation, technical test evaluation, assurance and independent review buckets.'
          gh release upload "$TAG" out/summary.json out/QA_PACKET.md out/qa_scorecard.csv --repo "$GITHUB_REPOSITORY" --clobber
          mkdir -p control/historical_australia_review_qa_v3_2
          cp out/summary.json out/QA_PACKET.md control/historical_australia_review_qa_v3_2/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/historical_australia_review_qa_v3_2/
          git commit -m 'historical: persist Australia review QA v3.2' || exit 0
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*3))
          done
          exit 1
