name: GPT Bulk Prefilter Preview

on:
  workflow_run:
    workflows: ["GPT Gate Stress Surface"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpt-bulk-prefilter-preview
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt-stress-current
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build conservative exhaustive preview and explicit deep batches
        run: |
          set -euo pipefail
          python pipeline/gpt_bulk_prefilter.py \
            --root control/gpt_gate_stress_batches \
            --out control/gpt_bulk_prefilter_preview.json \
            --priority-out-dir control/gpt_priority_deep_batches \
            --priority-digest-dir control/gpt_priority_review_digest \
            --preserved-out-dir control/gpt_preserved_low_deep_batches
      - name: Persist derived review surface on contention-free branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tender-engine-bot'
          git config user.email 'tender-engine-bot@users.noreply.github.com'
          git add control/gpt_bulk_prefilter_preview.json control/gpt_priority_deep_batches control/gpt_priority_review_digest control/gpt_preserved_low_deep_batches
          git commit -m "gpt: persist exhaustive review surface ${GITHUB_RUN_ID}" || true
          git push --force origin HEAD:refs/heads/gpt-review-current
