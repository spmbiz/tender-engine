name: Apply Realtime Conveyor Patch (Legacy Disabled)

# Retired patch-and-restart workflow. The realtime conveyor is now canonical in
# main. Keeping this manual no-op prevents an old patch from cancelling active
# Qwen passes or restoring obsolete 48-row settings.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo 'REALTIME_CONVEYOR_PATCH_RETIRED'
          echo 'No Qwen run is cancelled and no workflow is rewritten.'
