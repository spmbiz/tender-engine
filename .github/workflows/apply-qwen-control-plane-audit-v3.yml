name: Apply Qwen Control Plane Audit V3

on:
  pull_request:
    paths:
      - 'pipeline/qwen_semantic_controller.py'
      - 'pipeline/freshness_conveyor_watchdog.py'
      - 'tests/test_qwen_semantic_controller.py'
      - 'tools/apply_qwen_control_plane_audit_v3.py'
      - '.github/workflows/qwen-live-classification.yml'
      - '.github/workflows/qwen-live-conveyor.yml'
      - '.github/workflows/qwen-live-checkpoint-conveyor.yml'
      - '.github/workflows/qwen-live-recovery-drainer.yml'
      - '.github/workflows/qwen-dce-triage.yml'
      - '.github/workflows/dce-fanout-v2.yml'
      - '.github/workflows/qwen-batch-autotune-selfheal.yml'
      - '.github/workflows/pipeline-ab-live-canary-v2.yml'
      - '.github/workflows/qwen-backlog-watchdog.yml'
      - '.github/workflows/apply-qwen-control-plane-audit-v3.yml'
  push:
    branches: [main]
    paths:
      - 'pipeline/qwen_semantic_controller.py'
      - 'tools/apply_qwen_control_plane_audit_v3.py'
      - '.github/workflows/qwen-live-classification.yml'
      - '.github/workflows/qwen-live-conveyor.yml'
      - '.github/workflows/qwen-live-checkpoint-conveyor.yml'
      - '.github/workflows/qwen-live-recovery-drainer.yml'
      - '.github/workflows/qwen-dce-triage.yml'
      - '.github/workflows/dce-fanout-v2.yml'
      - '.github/workflows/qwen-backlog-watchdog.yml'
      - '.github/workflows/apply-qwen-control-plane-audit-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apply-qwen-control-plane-audit-v4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate canonical control plane twice without mutation
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_qwen_control_plane_audit_v3.py
          python tools/apply_qwen_control_plane_audit_v3.py
          git diff --exit-code

      - name: Run semantic-controller regression tests
        run: python -m unittest tests.test_qwen_semantic_controller -v

      - name: Enforce simplified semantic invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          # One semantic dispatch owner and one incremental state writer.
          ! grep -q 'gh workflow run qwen-live-classification.yml' .github/workflows/qwen-live-conveyor.yml
          ! grep -q 'gh workflow run qwen-live-classification.yml' .github/workflows/qwen-live-recovery-drainer.yml
          grep -q "default: '480'" .github/workflows/qwen-live-classification.yml
          grep -q "QWEN_OPERATIONAL_ROWS_PER_SHARD: '480'" .github/workflows/qwen-live-classification.yml
          grep -q "QWEN_RICH_MIN_CONTEXT_CHARS: '2200'" .github/workflows/qwen-live-classification.yml
          grep -q "QWEN_TRANSPORT_RETRIES: '0'" .github/workflows/qwen-live-classification.yml
          grep -q 'fallback=1' .github/workflows/qwen-live-classification.yml
          grep -q -- '--timeout 30' .github/workflows/qwen-live-classification.yml
          grep -q -- '--description-chars 2200' .github/workflows/qwen-live-classification.yml
          grep -q 'group: qwen-live-state-writer' .github/workflows/qwen-live-conveyor.yml
          grep -q 'cancel-in-progress: false' .github/workflows/qwen-live-conveyor.yml

          # Duplicate Qwen state writers/recovery wakes are retired and manual-only.
          python - <<'PY'
          from pathlib import Path
          for name,marker in (
              ('qwen-live-checkpoint-conveyor.yml','QWEN_CHECKPOINT_CONVEYOR_RETIRED'),
              ('qwen-live-recovery-drainer.yml','QWEN_RECOVERY_DRAINER_RETIRED'),
          ):
              text=Path('.github/workflows',name).read_text(encoding='utf-8')
              trigger=text.split('permissions:',1)[0]
              assert 'workflow_dispatch:' in trigger, name
              assert 'schedule:' not in trigger, name
              assert 'push:' not in trigger, name
              assert 'workflow_run:' not in trigger, name
              assert 'contents: write' not in text, name
              assert marker in text, name
          PY

          # Qwen DCE remains behind shared admission and canonical drainer ownership.
          ! grep -q 'workflows: \["DCE Fanout V2"\]' .github/workflows/qwen-dce-triage.yml
          ! grep -q 'gh workflow run qwen-dce-triage.yml' .github/workflows/dce-fanout-v2.yml
          grep -q 'gh workflow run qwen-dce-drainer.yml' .github/workflows/dce-fanout-v2.yml
          grep -q 'dynamic_tender_parallel' .github/workflows/qwen-dce-triage.yml

          # CPU benchmarking cannot steal production backfill slots automatically.
          python - <<'PY'
          from pathlib import Path
          for name in ('qwen-batch-autotune-selfheal.yml','pipeline-ab-live-canary-v2.yml'):
              text=Path('.github/workflows',name).read_text(encoding='utf-8')
              trigger=text.split('permissions:',1)[0]
              assert 'workflow_dispatch:' in trigger
              assert 'schedule:' not in trigger
              assert 'push:' not in trigger
              assert 'workflow_run:' not in trigger
          PY

          echo 'QWEN_CONTROL_PLANE_V4_INVARIANTS_PASS'
