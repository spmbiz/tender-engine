name: Apply Qwen Control Plane Audit V3

on:
  pull_request:
    paths:
      - 'pipeline/qwen_semantic_controller.py'
      - 'tests/test_qwen_semantic_controller.py'
      - 'tools/apply_qwen_control_plane_audit_v3.py'
      - '.github/workflows/qwen-backlog-watchdog.yml'
      - '.github/workflows/qwen-backfill-kick.yml'
      - '.github/workflows/qwen-live-recovery-drainer.yml'
      - '.github/workflows/apply-qwen-control-plane-audit-v3.yml'
  push:
    branches: [main]
    paths:
      - 'tools/apply_qwen_control_plane_audit_v3.py'
      - '.github/workflows/apply-qwen-control-plane-audit-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-qwen-control-plane-audit-v3
  cancel-in-progress: true

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic migration in the worktree
        run: python tools/apply_qwen_control_plane_audit_v3.py

      - name: Run semantic-controller regression tests
        run: python -m unittest tests.test_qwen_semantic_controller -v

      - name: Enforce migration invariants
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! grep -q 'gh workflow run qwen-live-classification.yml' .github/workflows/qwen-live-conveyor.yml
          ! grep -q 'workflows: \["DCE Fanout V2"\]' .github/workflows/qwen-dce-triage.yml
          ! grep -q 'gh workflow run qwen-dce-triage.yml' .github/workflows/dce-fanout-v2.yml
          grep -q "default: '96'" .github/workflows/qwen-live-classification.yml
          grep -q 'dynamic_tender_parallel' .github/workflows/qwen-dce-triage.yml
          echo 'QWEN_CONTROL_PLANE_INVARIANTS_PASS'

      - name: Persist migration to main after merge
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/qwen-live-classification.yml \
            .github/workflows/qwen-live-conveyor.yml \
            .github/workflows/qwen-dce-triage.yml \
            .github/workflows/dce-fanout-v2.yml
          if git diff --cached --quiet; then
            echo 'Control-plane migration already present on main.'
            exit 0
          fi
          git commit -m 'qwen: enforce audited single-owner control plane'
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$((attempt * 2))"
          done
          echo 'Failed to persist audited control-plane migration.' >&2
          exit 1
