name: PCS Stateful Filtered Pager Probe

on:
  push:
    branches: [main]
    paths:
      - 'control/pcs_stateful_pager_probe_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests beautifulsoup4 playwright
      - name: Reuse runner Chrome
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$chrome" ]; then echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"; else python -m playwright install --with-deps chromium; fi
      - name: Run stateful filtered pager probe
        shell: bash
        run: |
          set +e
          python tools/probe_pcs_stateful_filtered_pager.py
          rc=$?
          if [ ! -f control/pcs_stateful_pager_probe.json ]; then
            python - <<PY
            import json
            from pathlib import Path
            Path('control/pcs_stateful_pager_probe.json').write_text(json.dumps({
              'schema':'PCS_STATEFUL_FILTERED_PAGER_PROBE_WORKFLOW_FAILURE',
              'runner_exit_code':$rc,
              'progress_proven':False,
              'stateful_filter_stable':False,
            },indent=2)+'\n')
            PY
          fi
          exit 0
      - name: Persist probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add control/pcs_stateful_pager_probe.json
          git diff --cached --quiet && exit 0
          git commit -m "diag: persist PCS stateful pager probe ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; git rebase --abort >/dev/null 2>&1 || true; sleep $((i*2)); done
          exit 1
