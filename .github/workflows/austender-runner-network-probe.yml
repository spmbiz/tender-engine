name: AusTender Runner Network Probe

on:
  push:
    branches: [main]
    paths:
      - 'control/austender_runner_probe_trigger.txt'

permissions:
  contents: write

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests
      - name: Probe official AusTender current sources
        shell: bash
        run: |
          python - <<'PY'
          import json,os,platform,requests
          from pathlib import Path
          urls={
            'listing':'https://www.tenders.gov.au/?event=public.ATM.list',
            'rss':'https://www.tenders.gov.au/public_data/rss/rss.xml',
          }
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'application/rss+xml,application/xml,text/html,*/*'})
          out={'runner_os':os.environ.get('RUNNER_OS'),'platform':platform.platform(),'sources':{}}
          for name,url in urls.items():
            try:
              r=s.get(url,timeout=40,allow_redirects=True)
              out['sources'][name]={'status':r.status_code,'final_url':r.url,'content_type':r.headers.get('content-type'),'bytes':len(r.content),'prefix':r.text[:500]}
            except Exception as exc:
              out['sources'][name]={'error':repr(exc)}
          Path('austender-probe.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: austender-probe-${{ matrix.os }}
          path: austender-probe.json
          retention-days: 1

  aggregate:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: austender-probe-*
          path: probes
      - name: Aggregate network results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in sorted(Path('probes').rglob('austender-probe.json')):
            try: rows.append(json.loads(p.read_text(encoding='utf-8')))
            except Exception as exc: rows.append({'path':str(p),'error':repr(exc)})
          payload={'schema':'AUSTENDER_GITHUB_RUNNER_NETWORK_PROBE_V1','results':rows,'any_rss_200':any((x.get('sources') or {}).get('rss',{}).get('status')==200 for x in rows),'any_listing_200':any((x.get('sources') or {}).get('listing',{}).get('status')==200 for x in rows)}
          Path('control/austender_runner_probe.json').write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(payload,indent=2,ensure_ascii=False))
          PY
      - name: Persist probe summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/austender_runner_probe.json
          git diff --cached --quiet && exit 0
          git commit -m "diag: persist AusTender runner network probe ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
