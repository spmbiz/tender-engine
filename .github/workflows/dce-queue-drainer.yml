name: DCE Queue Drainer

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - 'queues/spm_rescue_selection_latest.jsonl'
      - 'queues/qwen_live_selection_latest.jsonl'
      - 'pipeline/authority_conflicts.py'
      - 'pipeline/auto_adjudicate_dce.py'
      - 'pipeline/materialize_dce_selection.py'
      - 'pipeline/dce_attempt_ledger.py'
      - '.github/workflows/dce-queue-drainer.yml'
      - '.github/workflows/dce-progress-ledger.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: dce-queue-drainer
  cancel-in-progress: true

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch freshest unseen DCE work when fleet is free
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          active="$(gh run list --workflow dce-fanout-v2.yml --limit 40 --json status --jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending")] | length')"
          if [ "$active" -gt 0 ]; then
            echo "DCE fleet busy: $active active/queued. Durable progress will retrigger the drainer after completion."
            exit 0
          fi

          source_run_for() {
            local p="$1"
            PATH_IN="$p" python - <<'PY'
          import json,os
          p=os.environ['PATH_IN']
          for line in open(p,encoding='utf-8',errors='replace'):
              if not line.strip():
                  continue
              r=json.loads(line)
              v=r.get('wide_read_run_id') or r.get('source_discovery_run') or r.get('source_run')
              if v is not None:
                  print(v)
                  break
          PY
          }

          unseen_for() {
            python pipeline/dce_attempt_ledger.py count \
              --queue "$1" \
              --ledger control/dce_attempt_ledger.jsonl
          }

          rescue='queues/spm_rescue_selection_latest.jsonl'
          qwen='queues/qwen_live_selection_latest.jsonl'
          rescue_run=''
          qwen_run=''
          rescue_unseen=0
          qwen_unseen=0
          if [ -s "$rescue" ]; then
            rescue_run="$(source_run_for "$rescue")"
            rescue_unseen="$(unseen_for "$rescue")"
          fi
          if [ -s "$qwen" ]; then
            qwen_run="$(source_run_for "$qwen")"
            qwen_unseen="$(unseen_for "$qwen")"
          fi

          echo "Unseen queue state: qwen=$qwen_unseen rescue=$rescue_unseen"

          path=''
          unseen=0
          max_jobs=0
          reason=''

          # Qwen live selection is already bounded (currently 160 rows) and is the
          # high-recall admission set. Drain every unseen selected version rather
          # than recycling a tiny prefix. Rescue remains the urgent/newer fallback.
          if [ "$qwen_unseen" -gt 0 ] && [[ "$qwen_run" =~ ^[0-9]+$ ]]; then
            if [ "$rescue_unseen" -eq 0 ] || ! [[ "$rescue_run" =~ ^[0-9]+$ ]] || [ "$qwen_run" -ge "$rescue_run" ]; then
              path="$qwen"
              unseen="$qwen_unseen"
              max_jobs=160
              reason="fresh-qwen-unseen-first"
            fi
          fi
          if [ -z "$path" ] && [ "$rescue_unseen" -gt 0 ]; then
            path="$rescue"
            unseen="$rescue_unseen"
            max_jobs=60
            reason="curated-rescue-unseen-fallback"
          fi
          if [ -z "$path" ] && [ "$qwen_unseen" -gt 0 ]; then
            path="$qwen"
            unseen="$qwen_unseen"
            max_jobs=160
            reason="qwen-unseen-fallback"
          fi
          if [ -z "$path" ]; then
            echo 'No unseen persisted DCE work. Waiting for the next Qwen/live selection refresh.'
            exit 0
          fi

          source_run="$(source_run_for "$path")"
          [[ "$source_run" =~ ^[0-9]+$ ]] || { echo "Cannot resolve source run from $path" >&2; exit 1; }
          rows="$(grep -cve '^\s*$' "$path" || true)"
          jobs="$unseen"
          if [ "$jobs" -gt "$max_jobs" ]; then jobs="$max_jobs"; fi
          if [ "$jobs" -lt 1 ]; then exit 0; fi

          gh workflow run dce-fanout-v2.yml --ref main \
            -f selection_path="$path" \
            -f source_discovery_run="$source_run" \
            -f max_jobs="$jobs" \
            -f max_parallel=10 \
            -f max_shards=80 \
            -f jobs_per_shard=0
          echo "Dispatched $jobs unseen candidate versions from $path (rows=$rows unseen=$unseen source=$source_run policy=$reason)."
