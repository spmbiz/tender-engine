name: Italy ANAC PVL Network Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'control/it_anac_pvl_network_trigger.txt'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1, fetch-tags: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q 'playwright>=1.46,<2'
      - name: Reuse runner Chrome
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$chrome" ]; then echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"; else python -m playwright install --with-deps chromium; fi
      - name: Capture official public ANAC JSON network contract
        shell: bash
        run: |
          set +e
          python pipeline/probe_it_anac_pvl_network.py
          rc=$?
          echo "probe_rc=$rc"
          exit 0
      - name: Persist probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f control/it_anac_pvl_network_probe.json || printf '%s\n' '{"schema":"IT_ANAC_PVL_NETWORK_PROBE_WORKFLOW_FAILURE","pass":false}' > control/it_anac_pvl_network_probe.json
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add control/it_anac_pvl_network_probe.json
          git diff --cached --quiet && exit 0
          git commit -m "diag: persist ANAC PVL network probe ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
