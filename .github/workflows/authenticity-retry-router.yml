name: DCE Authenticity Retry Router

on:
  workflow_dispatch:
    inputs:
      limit_per_source:
        description: Maximum exact candidates replayed per supported source
        required: false
        default: '12'
  schedule:
    - cron: '13 */12 * * *'
  push:
    branches: [main]
    paths:
      - 'control/authenticity_retry_router_trigger.txt'

permissions:
  contents: write
  actions: write

concurrency:
  group: dce-authenticity-retry-router
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - id: plan
        name: Select only cooldown-safe exact-ID retries
        env:
          LIMIT: ${{ github.event.inputs.limit_per_source || '12' }}
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/build_authenticity_retry_router.py \
            --inbox control/gpt_supergreen_inbox.json \
            --state control/authenticity_retry_router_state.json \
            --plan control/authenticity_retry_router_plan.json \
            --limit-per-source "$LIMIT" \
            --max-attempts 2 \
            --cooldown-days 7
          source_run="$(python - <<'PY'
          import json
          x=json.load(open('control/live_snapshot_latest.json',encoding='utf-8'))
          print(x.get('source_discovery_run') or '')
          PY
          )"
          [[ "$source_run" =~ ^[0-9]+$ ]] || { echo "invalid live discovery run: $source_run" >&2; exit 1; }
          echo "source_run=$source_run" >> "$GITHUB_OUTPUT"
      - name: Persist exact retry queues before dispatch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add control/authenticity_retry_router_plan.json \
            queues/ireland_auth_retry_router.jsonl \
            queues/za_auth_retry_router.jsonl \
            queues/estonia_auth_retry_router.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "retry: materialize stateful authenticity queues ${GITHUB_RUN_ID}"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              git rebase --abort >/dev/null 2>&1 || true
              [ "$i" -eq 5 ] && exit 1
              sleep "$((i*3))"
            done
          fi
      - id: dispatch
        name: Dispatch supported exact-ID queues through canonical DCE
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.plan.outputs.source_run }}
        shell: bash
        run: |
          set -uo pipefail
          git pull --rebase origin main || true
          success=()
          failed=0
          while IFS=$'\t' read -r source queue count; do
            [ "$count" -gt 0 ] || continue
            if gh workflow run dce-fanout-v2.yml --ref main \
              -f selection_path="$queue" \
              -f source_discovery_run="$SOURCE_RUN" \
              -f max_jobs="$count" \
              -f max_parallel='8' \
              -f max_shards='32' \
              -f jobs_per_shard='1'; then
              success+=("$source")
            else
              echo "dispatch failed source=$source queue=$queue" >&2
              failed=1
            fi
          done < <(python - <<'PY'
          import json
          x=json.load(open('control/authenticity_retry_router_plan.json',encoding='utf-8'))
          for source,count in (x.get('selected_counts') or {}).items():
              print(f"{source}\t{(x.get('queue_paths') or {}).get(source,'')}\t{int(count or 0)}")
          PY
          )
          joined="$(IFS=,; echo "${success[*]}")"
          echo "success_sources=$joined" >> "$GITHUB_OUTPUT"
          echo "dispatch_failed=$failed" >> "$GITHUB_OUTPUT"
      - name: Mark only successfully dispatched candidates in cooldown state
        if: steps.dispatch.outputs.success_sources != ''
        env:
          SOURCES: ${{ steps.dispatch.outputs.success_sources }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main || true
          python pipeline/mark_authenticity_retry_dispatched.py \
            --plan control/authenticity_retry_router_plan.json \
            --state control/authenticity_retry_router_state.json \
            --sources "$SOURCES"
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add control/authenticity_retry_router_state.json
          git diff --cached --quiet && exit 0
          git commit -m "retry: persist authenticity cooldown state ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$((i*3))"
          done
          exit 1
      - name: Fail visibly if any supported dispatch failed
        if: steps.dispatch.outputs.dispatch_failed == '1'
        run: exit 1
