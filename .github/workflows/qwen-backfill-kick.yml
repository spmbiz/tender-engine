name: Qwen Backfill Kick

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: qwen-backfill-kick
  cancel-in-progress: true

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake the canonical Qwen semantic controller
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run qwen-backlog-watchdog.yml --ref main
          echo 'Qwen Backfill Kick no longer dispatches semantic workers directly.'
          echo 'The tested backlog watchdog is the single dispatch owner.'

      - name: Summary
        run: |
          echo '### Qwen backfill safety wake' >> "$GITHUB_STEP_SUMMARY"
          echo '- semantic worker dispatch owner: Qwen Backlog Watchdog only' >> "$GITHUB_STEP_SUMMARY"
          echo '- this workflow is a redundant 10-minute controller wake, not a worker dispatcher' >> "$GITHUB_STEP_SUMMARY"
