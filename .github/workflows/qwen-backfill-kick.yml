name: Qwen Backfill Kick

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - 'control/qwen_live/classification_summary.json'
      - '.github/workflows/qwen-backfill-kick.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: qwen-backfill-kick
  cancel-in-progress: true

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - id: backlog
        name: Read durable Qwen backlog
        shell: bash
        run: |
          set -euo pipefail
          remaining="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path('control/qwen_live/classification_summary.json')
          try:
              payload=json.loads(p.read_text(encoding='utf-8'))
              print(max(0,int(payload.get('remaining_classification_queue') or 0)))
          except Exception:
              print(0)
          PY
          )"
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
          echo "Qwen classification backlog: $remaining"

      - name: Recover stale queue and dispatch high-throughput Qwen when idle
        if: steps.backlog.outputs.remaining != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Never preempt healthy inference. A genuinely running Qwen pass owns
          # semantic capacity until it completes.
          in_progress="$(gh run list --workflow qwen-live-classification.yml --limit 40 --json status --jq '[.[] | select(.status=="in_progress")] | length')"
          if [ "$in_progress" -gt 0 ]; then
            echo "Qwen has $in_progress healthy in-progress pass(es); no duplicate dispatch."
            exit 0
          fi

          # A queued/waiting run with no in-progress sibling can become a zombie
          # when an older concurrency generation or runner-starvation event never
          # advances it. Do not let such a run block the backfill forever.
          now_epoch="$(date -u +%s)"
          mapfile -t waiting_runs < <(gh run list --workflow qwen-live-classification.yml --limit 40 --json databaseId,status,createdAt --jq '.[] | select(.status=="queued" or .status=="waiting" or .status=="pending") | "\(.databaseId)|\(.createdAt)"')
          for entry in "${waiting_runs[@]}"; do
            rid="${entry%%|*}"
            created="${entry#*|}"
            created_epoch="$(date -u -d "$created" +%s 2>/dev/null || echo "$now_epoch")"
            age="$((now_epoch-created_epoch))"
            if [ "$age" -gt 2700 ]; then
              echo "Cancelling stale queued Qwen run $rid age=${age}s"
              gh run cancel "$rid" || true
            fi
          done

          queued="$(gh run list --workflow qwen-live-classification.yml --limit 40 --json status --jq '[.[] | select(.status=="queued" or .status=="waiting" or .status=="pending")] | length')"
          if [ "$queued" -gt 0 ]; then
            echo "Qwen already has $queued fresh queued pass(es); no duplicate dispatch."
            exit 0
          fi

          gh workflow run qwen-live-classification.yml --ref main \
            -f per_shard=480 \
            -f auto_continue=true \
            -f dce_limit=160
          echo "Dispatched Qwen pass at per_shard=480; remaining=${{ steps.backlog.outputs.remaining }}"

      - name: Summary
        if: always()
        run: |
          echo "### Qwen backfill kick" >> "$GITHUB_STEP_SUMMARY"
          echo "- remaining classification backlog: ${{ steps.backlog.outputs.remaining }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- requested max notices per worker when idle: 480" >> "$GITHUB_STEP_SUMMARY"
          echo "- stale queued/waiting/pending runs older than 45m are cancelled only when no Qwen pass is in progress" >> "$GITHUB_STEP_SUMMARY"
