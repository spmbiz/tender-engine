name: Fresh France PLACE Hunt

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'place_probe.py'
      - '.github/workflows/place-fresh.yml'

jobs:
  place:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'playwright>=1.46,<2'
      - run: python -m playwright install --with-deps chromium
      - name: Download current PLACE DCEs
        run: python place_probe.py
      - name: Unpack nested PLACE archives
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full unzip
          find fresh_store/FRANCE_PLACE -type f -name '*.zip' -print0 | while IFS= read -r -d '' f; do
            out="${f%.zip}_unpacked"
            mkdir -p "$out"
            unzip -oq "$f" -d "$out" || true
          done
          find fresh_store/FRANCE_PLACE -type f -name '*.7z' -print0 | while IFS= read -r -d '' f; do
            out="${f%.7z}_unpacked"
            mkdir -p "$out"
            7z x -y "$f" -o"$out"
          done
      - name: Upload PLACE output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-place-${{ github.run_id }}
          path: fresh_store/FRANCE_PLACE/
          if-no-files-found: ignore
          retention-days: 7
