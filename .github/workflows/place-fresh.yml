name: Fresh France PLACE Hunt (Legacy Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  place:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q 'playwright>=1.46,<2'
      - name: Reuse runner Chrome
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$chrome" ]; then
            echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Download current PLACE DCEs
        run: python place_probe.py
      - name: Unpack nested PLACE archives using runner tools
        shell: bash
        run: |
          command -v 7z >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full)
          find fresh_store/FRANCE_PLACE -type f -name '*.zip' -print0 | while IFS= read -r -d '' f; do
            out="${f%.zip}_unpacked"; mkdir -p "$out"; unzip -oq "$f" -d "$out" || true
          done
          find fresh_store/FRANCE_PLACE -type f -name '*.7z' -print0 | while IFS= read -r -d '' f; do
            out="${f%.7z}_unpacked"; mkdir -p "$out"; 7z x -y "$f" -o"$out" || true
          done
      - name: Persist harvested output durably
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [ -d fresh_store/FRANCE_PLACE ] || exit 0
          tag="legacy-place-${GITHUB_RUN_ID}"
          tar -czf "$tag.tar.gz" fresh_store/FRANCE_PLACE
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes "Durable legacy PLACE harvest."
          gh release upload "$tag" "$tag.tar.gz"
