name: Historical Open World Broker QA v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - historical_lab/open_world_broker_qa_v4.py
      - .github/workflows/historical-open-world-broker-qa-v4.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download economic archetype evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input out
          gh release download historical-open-world-economic-archetypes-v4 --repo "$GITHUB_REPOSITORY" --pattern classified_clusters.csv --dir input --clobber
      - name: Review broker/reseller friction
        run: python historical_lab/open_world_broker_qa_v4.py --input input/classified_clusters.csv --out out
      - name: Persist broker QA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=historical-open-world-broker-qa-v4
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main --title 'Historical Open World Broker QA v4' --notes 'Historical friction QA of open-world broker/reseller candidates.'
          gh release upload "$TAG" out/summary.json out/REPORT.md out/broker_candidates_qa.csv --repo "$GITHUB_REPOSITORY" --clobber
          mkdir -p control/historical_open_world_broker_qa_v4
          cp out/summary.json out/REPORT.md control/historical_open_world_broker_qa_v4/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/historical_open_world_broker_qa_v4/
          git commit -m 'historical: persist open-world broker QA v4' || exit 0
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*3))
          done
          exit 1
