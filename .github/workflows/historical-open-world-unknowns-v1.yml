name: Historical Open World Unknowns v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - historical_lab/open_world_unknowns_v1.py
      - .github/workflows/historical-open-world-unknowns-v1.yml

permissions:
  contents: write

concurrency:
  group: historical-open-world-unknowns-v1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download historical commercial miner review assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          for p in \
            global_core_high_signal_clusters.csv global_core_cluster_examples.csv \
            usa_high_signal_clusters.csv usa_cluster_examples.csv \
            australia_high_signal_clusters.csv australia_cluster_examples.csv; do
            gh release download historical-commercial-miner-v1 --repo "$GITHUB_REPOSITORY" --pattern "$p" --dir input --clobber
          done
      - name: Build not-yet-named review queue
        run: python historical_lab/open_world_unknowns_v1.py --input input --out out
      - name: Publish durable historical release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=historical-open-world-unknowns-v1
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Historical Open World Unknowns v1" --notes "Historical-only not-yet-named cluster review queue. No records deleted; no live/DCE evidence."
          gh release upload "$TAG" out/summary.json out/review_queue.jsonl out/REVIEW_PACKET.md --repo "$GITHUB_REPOSITORY" --clobber
      - name: Persist compact authority pointer
        run: |
          mkdir -p control/historical_open_world_unknowns_v1
          cp out/summary.json out/REVIEW_PACKET.md control/historical_open_world_unknowns_v1/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/historical_open_world_unknowns_v1/
          git commit -m 'historical: persist open-world unknown-domain review v1' || exit 0
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*3))
          done
          exit 1
