name: Bridge Global Core v4 to Drive

on:
  push:
    paths:
      - '.github/workflows/bridge-global-core-v4-to-drive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  small-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        asset:
          - buyers.csv.gz
          - country_summary.csv
          - data_quality.json
          - evidence_lanes.json
          - market_cohorts.csv
          - run_manifest.json
          - source_priority.json
          - suppliers.csv.gz
          - suppliers.parquet
    steps:
      - name: Download canonical release asset
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          mkdir -p bundle
          gh release download tender-normalized-global-core-v4 --repo walidgdg1-ai/coldemailtool --pattern "$ASSET" --dir bundle
          test -s "bundle/$ASSET"
          sha256sum "bundle/$ASSET" > "bundle/$ASSET.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: core-v4-small-${{ matrix.asset }}
          path: bundle/*
          compression-level: 0
          retention-days: 1

  large-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        asset:
          - historical_tenders.csv.gz
          - historical_tenders.parquet
          - awards.csv.gz
          - awards.parquet
          - award_suppliers.csv.gz
          - award_suppliers.parquet
          - buyers.parquet
    steps:
      - name: Download split and hash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          mkdir -p original parts manifests
          gh release download tender-normalized-global-core-v4 --repo walidgdg1-ai/coldemailtool --pattern "$ASSET" --dir original
          sha256sum "original/$ASSET" > "manifests/$ASSET.sha256"
          split -b 80M -d -a 3 "original/$ASSET" "parts/$ASSET.part-"
          (cd parts && sha256sum "$ASSET".part-*) > "manifests/$ASSET.parts.sha256"
          ls -lh parts/
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles(format('parts/{0}.part-000', matrix.asset)) != '' }}
        with: {name: "core-v4-${{ matrix.asset }}-part-000", path: "parts/${{ matrix.asset }}.part-000", compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles(format('parts/{0}.part-001', matrix.asset)) != '' }}
        with: {name: "core-v4-${{ matrix.asset }}-part-001", path: "parts/${{ matrix.asset }}.part-001", compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles(format('parts/{0}.part-002', matrix.asset)) != '' }}
        with: {name: "core-v4-${{ matrix.asset }}-part-002", path: "parts/${{ matrix.asset }}.part-002", compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles(format('parts/{0}.part-003', matrix.asset)) != '' }}
        with: {name: "core-v4-${{ matrix.asset }}-part-003", path: "parts/${{ matrix.asset }}.part-003", compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles(format('parts/{0}.part-004', matrix.asset)) != '' }}
        with: {name: "core-v4-${{ matrix.asset }}-part-004", path: "parts/${{ matrix.asset }}.part-004", compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles(format('parts/{0}.part-005', matrix.asset)) != '' }}
        with: {name: "core-v4-${{ matrix.asset }}-part-005", path: "parts/${{ matrix.asset }}.part-005", compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles(format('parts/{0}.part-006', matrix.asset)) != '' }}
        with: {name: "core-v4-${{ matrix.asset }}-part-006", path: "parts/${{ matrix.asset }}.part-006", compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles(format('parts/{0}.part-007', matrix.asset)) != '' }}
        with: {name: "core-v4-${{ matrix.asset }}-part-007", path: "parts/${{ matrix.asset }}.part-007", compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles(format('parts/{0}.part-008', matrix.asset)) != '' }}
        with: {name: "core-v4-${{ matrix.asset }}-part-008", path: "parts/${{ matrix.asset }}.part-008", compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles(format('parts/{0}.part-009', matrix.asset)) != '' }}
        with: {name: "core-v4-${{ matrix.asset }}-part-009", path: "parts/${{ matrix.asset }}.part-009", compression-level: 0, retention-days: 1}
      - uses: actions/upload-artifact@v4
        with:
          name: core-v4-${{ matrix.asset }}-hashes
          path: manifests/*
          compression-level: 0
          retention-days: 1

  provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Write provenance and reconstruction instructions
        run: |
          cat > DRIVE_BRIDGE_PROVENANCE.txt <<'EOF'
          Canonical source: walidgdg1-ai/coldemailtool release tender-normalized-global-core-v4
          Drive mirror: Public Tender Intelligence — Archive / Releases / tender-normalized-global-core-v4
          Files <=100 MB are mirrored natively.
          Files >100 MB are split into byte-exact 80 MiB parts because the Drive connector transport caps uploads at 100 MB.
          Reconstruct on Linux/macOS: cat FILE.part-* > FILE
          Reconstruct on PowerShell: cmd /c copy /b FILE.part-000+FILE.part-001+... FILE
          Verify the reconstructed file against FILE.sha256.
          The GitHub Release remains untouched as canonical backup.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: core-v4-drive-provenance
          path: DRIVE_BRIDGE_PROVENANCE.txt
          compression-level: 0
          retention-days: 1
