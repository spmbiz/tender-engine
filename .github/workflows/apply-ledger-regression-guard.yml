name: Apply Ledger Regression Guard

on:
  push:
    branches: [main]
    paths:
      - 'control/ledger_regression_guard_trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q pytest
      - run: python tools/apply_ledger_regression_guard.py
      - run: |
          python -m py_compile pipeline/build_notice_intelligence_ledger.py
          python -m pytest -q tests/test_ledger_generation_qualification.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pipeline/build_notice_intelligence_ledger.py
          git diff --cached --quiet && exit 0
          git commit -m 'ledger: refuse catastrophic snapshot regressions'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
