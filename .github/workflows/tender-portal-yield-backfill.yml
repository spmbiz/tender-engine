name: Tender Portal Yield Backfill

on:
  workflow_dispatch:
    inputs:
      dce_run_id:
        description: Completed DCE Fanout run ID whose durable aggregate should be measured
        required: true
  push:
    branches: [main]
    paths:
      - 'control/portal_yield_backfill.txt'

permissions:
  actions: read
  contents: write

concurrency:
  group: tender-portal-performance-writer
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: resolve
        env:
          INPUT_RUN: ${{ github.event.inputs.dce_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ] && [[ "${INPUT_RUN:-}" =~ ^[0-9]+$ ]]; then
            rid="$INPUT_RUN"
          else
            rid="$(sed -nE 's/^dce_run_id=([0-9]+).*$/\1/p' control/portal_yield_backfill.txt | tail -1)"
          fi
          [[ "$rid" =~ ^[0-9]+$ ]] || { echo "Invalid DCE run id: $rid" >&2; exit 1; }
          echo "id=$rid" >> "$GITHUB_OUTPUT"
      - name: Rehydrate compact durable aggregate only
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ steps.resolve.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          tag="dce-harvest-$RID"
          archive="dce-deep-review-$RID.tar.gz"
          mkdir -p release-aggregate backfill
          gh release download "$tag" --pattern "$archive" --dir release-aggregate
          tar -xzf "release-aggregate/$archive" -C backfill
          test -s backfill/summary.json
          test -s backfill/portal_yield.json
          cp backfill/portal_yield.json "portal-yield-$RID.json"
          cp backfill/summary.json "dce-yield-summary-$RID.json"
      - name: Measure exact GitHub shard runner-minutes
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ steps.resolve.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q requests
          python pipeline/dce_runner_metrics.py \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$RID" \
            --summary "dce-yield-summary-$RID.json" \
            --portal-yield "portal-yield-$RID.json" \
            --out "runner-yield-$RID.json"
      - name: Update bounded rolling portal performance
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ steps.resolve.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p performance
          existing=""
          if gh release view fleet-state --json assets --jq '.assets[].name' | grep -Fxq 'portal-performance.json'; then
            gh release download fleet-state --pattern portal-performance.json --dir performance
            existing="--existing performance/portal-performance.json"
          fi
          python pipeline/update_portal_performance.py \
            $existing \
            --portal-yield "portal-yield-$RID.json" \
            --runner-yield "runner-yield-$RID.json" \
            --run-id "$RID" \
            --max-runs 8 \
            --out portal-performance.json
      - name: Evidence-based batch-size autotune
        env:
          RID: ${{ steps.resolve.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/autotune_dce_batch.py \
            --desired control/desired_state.json \
            --runner-yield "runner-yield-$RID.json" \
            --out control/desired_state.json \
            --decision-out "dce-batch-autotune-$RID.json"
      - name: Persist scheduler/autotune state transactionally
        env:
          RID: ${{ steps.resolve.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/desired_state.json
          if git diff --cached --quiet; then
            echo 'No batch-size state change to commit'
            exit 0
          fi
          git commit -m "throughput: autotune DCE batch after $RID"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'Autotuned desired state persisted'
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$((attempt * 5))"
          done
          echo 'Could not persist autotuned desired state' >&2
          exit 1
      - name: Persist immutable run metrics and mutable scheduler state
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ steps.resolve.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          tag="dce-harvest-$RID"
          gh release upload "$tag" \
            "portal-yield-$RID.json" \
            "dce-yield-summary-$RID.json" \
            "runner-yield-$RID.json" \
            "dce-batch-autotune-$RID.json" --clobber
          gh release upload fleet-state portal-performance.json --clobber
          echo '### Exact runner yield' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "runner-yield-$RID.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### Batch autotune' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "dce-batch-autotune-$RID.json" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '### Rolling portal performance' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat portal-performance.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
