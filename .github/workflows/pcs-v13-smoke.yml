name: PCS V13 Filtered Pager Smoke

on:
  push:
    branches: [main]
    paths:
      - 'control/pcs_v13_smoke_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q requests beautifulsoup4 playwright
      - name: Reuse runner Chrome
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$chrome" ]; then echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"; else python -m playwright install --with-deps chromium; fi
      - name: Probe first 4 filtered pages
        env:
          DISCOVERY_OUT: lane-out/UK_PCS_OCDS
          PCS_DIRECT_HARD_MAX_PAGES: '4'
        shell: bash
        run: |
          set +e
          python pipeline/discover_uk_pcs_current_v13.py
          rc=$?
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('lane-out/UK_PCS_OCDS/stats.json')
          s=json.loads(p.read_text()) if p.exists() else {'errors':[{'type':'STATS_MISSING'}]}
          pages=[x.get('page') for x in (s.get('telemetry') or {}).get('pages',[])]
          out={
            'schema':'PCS_V13_SMOKE_V1',
            'adapter_exit_code':None,
            'listing_contract':s.get('listing_contract'),
            'pages':pages,
            'total_pages':s.get('total_pages'),
            'total_reported':s.get('total_reported'),
            'current_materialized':s.get('current_materialized'),
            'filtered_total_stable':(s.get('telemetry') or {}).get('filtered_total_stable'),
            'errors':s.get('errors') or [],
            'progress_proven':pages[:4]==[1,2,3,4] and bool((s.get('telemetry') or {}).get('filtered_total_stable')),
          }
          Path('control/pcs_v13_smoke.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
          exit 0
      - name: Persist smoke
        run: |
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add control/pcs_v13_smoke.json
          git diff --cached --quiet && exit 0
          git commit -m "diag: persist PCS v13 filtered pager smoke ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; git rebase --abort >/dev/null 2>&1 || true; sleep $((i*2)); done
          exit 1
