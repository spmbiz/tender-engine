name: Temporary Capacity Trim 2026-08-16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-capacity-trim-20260816.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trim:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Cancel only pre-cap Tender runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for run in 31927134312 31927599694; do
            status="$(gh api "repos/$REPO/actions/runs/$run" --jq '.status' 2>/dev/null || echo missing)"
            echo "run=$run status=$status"
            case "$status" in
              queued|in_progress|waiting|pending|requested)
                gh api --method POST "repos/$REPO/actions/runs/$run/cancel" >/dev/null
                echo "cancel_requested=$run"
                ;;
              *)
                echo "no_cancel_needed=$run"
                ;;
            esac
          done
