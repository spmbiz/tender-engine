name: TED Transport Regression

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/discover_ted.py'
      - 'tests/test_ted_transport_resilience.py'
      - '.github/workflows/ted-transport-regression.yml'
      - 'control/ted_transport_regression_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests pytest
      - name: Run regression and persist local verdict
        shell: bash
        run: |
          set +e
          python -m py_compile pipeline/discover_ted.py
          compile_rc=$?
          pytest -q tests/test_ted_transport_resilience.py | tee /tmp/ted-transport-pytest.txt
          test_rc=${PIPESTATUS[0]}
          export COMPILE_RC="$compile_rc" TEST_RC="$test_rc"
          python - <<'PY'
          import json,os
          from pathlib import Path
          txt=Path('/tmp/ted-transport-pytest.txt').read_text(errors='replace') if Path('/tmp/ted-transport-pytest.txt').exists() else ''
          payload={
            'schema':'TED_TRANSPORT_REGRESSION_V1',
            'compile_exit_code':int(os.environ['COMPILE_RC']),
            'pytest_exit_code':int(os.environ['TEST_RC']),
            'pass':int(os.environ['COMPILE_RC'])==0 and int(os.environ['TEST_RC'])==0,
            'pytest_tail':txt[-2000:],
          }
          Path('control').mkdir(exist_ok=True)
          Path('control/ted_transport_regression.json').write_text(json.dumps(payload,indent=2)+'\n')
          print(json.dumps(payload,indent=2))
          PY
          exit 0
      - name: Persist verdict to main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add control/ted_transport_regression.json
          git diff --cached --quiet && exit 0
          git commit -m "diag: persist TED transport regression ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
