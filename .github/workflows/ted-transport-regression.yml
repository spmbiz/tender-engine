name: TED Transport Regression

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/discover_ted.py'
      - 'tests/test_ted_transport_resilience.py'
      - '.github/workflows/ted-transport-regression.yml'
      - 'control/ted_transport_regression_trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests pytest
      - run: python -m py_compile pipeline/discover_ted.py
      - run: pytest -q tests/test_ted_transport_resilience.py
