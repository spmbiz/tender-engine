name: Historical Office Consumables QA v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - historical_lab/office_consumables_semantic_qa_v1.py
      - .github/workflows/historical-office-consumables-qa-v1.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download office-consumables evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input out
          TAG=historical-office-consumables-broker-v1
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern candidate_cohorts.csv --dir input --clobber
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern examples.csv --dir input --clobber
      - name: Review strongest structural cohorts
        run: python historical_lab/office_consumables_semantic_qa_v1.py --candidates input/candidate_cohorts.csv --examples input/examples.csv --out out
      - name: Persist QA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=historical-office-consumables-qa-v1
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main --title 'Historical Office Consumables QA v1' --notes 'Representative semantic QA of strongest historical toner, stationery, paper and office-consumable broker cohorts.'
          gh release upload "$TAG" out/summary.json out/QA_PACKET.md out/qa_scorecard.csv --repo "$GITHUB_REPOSITORY" --clobber
          mkdir -p control/historical_office_consumables_qa_v1
          cp out/summary.json out/QA_PACKET.md control/historical_office_consumables_qa_v1/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/historical_office_consumables_qa_v1/
          git commit -m 'historical: persist office consumables QA v1' || exit 0
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*3))
          done
          exit 1
