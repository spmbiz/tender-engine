name: Promote Malta ePPS OCDS

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Malta ePPS OCDS Full Reconcile Proof']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'control/mt_epps_ocds_promote_trigger.txt'

permissions:
  contents: write

jobs:
  promote:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1, fetch-tags: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests pytest
      - name: Require green Malta OCDS proof
        run: |
          python - <<'PY'
          import json
          p=json.load(open('control/mt_epps_ocds_reconcile_proof.json'))
          assert p.get('schema')=='MALTA_EPPS_OCDS_FULL_RECONCILE_PROOF_V1',p
          assert p.get('pass') is True,p
          assert p.get('enumeration_complete') is True,p
          assert p.get('live_coverage_credit_allowed') is True,p
          assert p.get('packages_requested')==p.get('packages_completed'),p
          PY
          pytest -q tests/test_mt_epps_ocds.py
      - name: Route Malta ePPS job through official OCDS packages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/supergreen-discovery-v2.yml')
          s=wf.read_text()
          marker='          python pipeline/discover_epps_public.py\n          primary_rc=$?'
          routed='''          if [ "${{ matrix.source }}" = "MALTA_EPPS" ]; then
            python pipeline/discover_mt_epps_ocds.py
            exit $?
          fi
          python pipeline/discover_epps_public.py
          primary_rc=$?'''
          if routed not in s:
              if marker not in s:
                  raise SystemExit('ePPS primary route marker missing')
              s=s.replace(marker,routed,1)
              wf.write_text(s)

          guard=Path('pipeline/source_coverage_guard.py')
          g=guard.read_text()
          for marker_name in ('STRICT_NONZERO_SOURCES={','STRICT_EXHAUSTION_SOURCES={'):
              start=g.index(marker_name)
              end=g.index('}',start)
              block=g[start:end]
              if '"MALTA_EPPS_OCDS"' not in block:
                  block=block.replace('{','{"MALTA_EPPS_OCDS",',1)
                  g=g[:start]+block+g[end:]
          guard.write_text(g)
          PY
          grep -F 'python pipeline/discover_mt_epps_ocds.py' .github/workflows/supergreen-discovery-v2.yml
          grep -F '"MALTA_EPPS_OCDS"' pipeline/source_coverage_guard.py
      - name: Commit promotion
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/supergreen-discovery-v2.yml pipeline/source_coverage_guard.py; then
            echo 'Malta OCDS route already promoted'
            exit 0
          fi
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add .github/workflows/supergreen-discovery-v2.yml pipeline/source_coverage_guard.py
          git commit -m 'mt: promote official ePPS OCDS record-package lane'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
