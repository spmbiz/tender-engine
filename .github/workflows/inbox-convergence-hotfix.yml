name: Inbox Convergence Hotfix

on:
  push:
    branches: [agent/inbox-convergence-hotfix]
    paths:
      - '.github/workflows/inbox-convergence-hotfix.yml'

permissions:
  contents: write

concurrency:
  group: inbox-convergence-hotfix
  cancel-in-progress: false

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/inbox-convergence-hotfix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch stale-payload race
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap
          p=Path('pipeline/publish_supergreen_hot.py')
          s=p.read_text(encoding='utf-8')
          start=s.index('def publish_live_inbox(')
          end=s.index('\n\ndef main() -> None:', start)
          new=textwrap.dedent(r'''def publish_live_inbox(repo: str, branch: str, token: str, run_id: str, shard: str, attempts: int):
              """Rebuild the user-facing inbox transactionally from freshest state."""
              import subprocess
              import sys
              import tempfile

              script = str(Path(__file__).with_name("refresh_gpt_inbox_live.py"))

              def builder(current_existing: dict[str, Any]) -> dict[str, Any]:
                  with tempfile.TemporaryDirectory(prefix="tender-inbox-") as td:
                      local: dict[str, str] = {}
                      sources: dict[str, dict[str, Any]] = {"existing": current_existing}
                      for name, remote in {
                          "final_bank": "control/final_supergreen_bank.json",
                          "hot_green": "control/supergreen_hot.json",
                          "hot_review": "control/gpt_review_hot.json",
                      }.items():
                          obj, _ = gh_get(repo, remote, branch, token)
                          sources[name] = obj
                      for name, obj in sources.items():
                          lp = Path(td) / f"{name}.json"
                          lp.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                          local[name] = str(lp)
                      out = str(Path(td) / "inbox.json")
                      subprocess.run(
                          [sys.executable, script,
                           "--existing", local["existing"],
                           "--final-bank", local["final_bank"],
                           "--hot-green", local["hot_green"],
                           "--hot-review", local["hot_review"],
                           "--out", out, "--max-items", "60"],
                          check=True,
                      )
                      return json.loads(Path(out).read_text(encoding="utf-8"))

              return publish(
                  repo, "control/gpt_supergreen_inbox.json", branch, token, builder,
                  f"inbox: direct live DCE {run_id} shard {shard}", attempts,
              )''')
          patched=s[:start]+new+s[end:]
          if 'lambda _existing: payload' in patched:
              raise SystemExit('stale payload lambda still present')
          p.write_text(patched,encoding='utf-8')
          PY
          python -m py_compile pipeline/publish_supergreen_hot.py pipeline/refresh_gpt_inbox_live.py
      - name: Add and run stale-overwrite regression
        shell: bash
        run: |
          cat > tests/test_inbox_convergence.py <<'PY'
          import sys
          from pathlib import Path
          ROOT=Path(__file__).resolve().parents[1]
          sys.path.insert(0,str(ROOT/'pipeline'))
          import publish_supergreen_hot as p

          def row():
              return {'candidate_id':'X:1','title':'Web development services','deadline':'2099-09-21T12:00:00+00:00','review_stage':'BUSINESS_GATES','gate_readiness':True,'evidence_gate_coverage':2,'evidence_by_gate':{'deliverables_scope':[{'text':'website development'}],'submission':[{'text':'tenders due 21 September 2099'}]},'source_dce_run_id':42,'priority_score':60}

          def test_rebases_on_latest_existing(monkeypatch):
              latest={'schema':'GPT_WEB_REVIEW_INBOX_V2','review_queue':[row()],'pending_final_review':[row()],'counts':{'pending_gpt_web_review':1}}
              def fake_get(repo,path,branch,token):
                  if path.endswith('final_supergreen_bank.json'): return {'items':[]},'a'
                  if path.endswith('supergreen_hot.json'): return {'final_supergreens':[],'greens':[]},'b'
                  if path.endswith('gpt_review_hot.json'): return {'latest_dce_run_id':42,'items':[]},'c'
                  raise AssertionError(path)
              captured={}
              def fake_publish(repo,path,branch,token,builder,msg,attempts):
                  captured['payload']=builder(latest)
                  return {'published':True}
              monkeypatch.setattr(p,'gh_get',fake_get)
              monkeypatch.setattr(p,'publish',fake_publish)
              p.publish_live_inbox('owner/repo','main','token','42','7',2)
              assert captured['payload']['counts']['pending_gpt_web_review']==1
              assert captured['payload']['review_queue'][0]['candidate_id']=='X:1'
          PY
          python -m pip install --disable-pip-version-check -q pytest requests
          pytest -q tests/test_inbox_convergence.py
      - name: Commit validated patch on hotfix branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add pipeline/publish_supergreen_hot.py tests/test_inbox_convergence.py
          git diff --cached --check
          git commit -m 'fix: make direct GPT inbox rebuild race-safe'
          git push origin HEAD:agent/inbox-convergence-hotfix
