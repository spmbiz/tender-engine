name: GPT Web Full Batch Compact

on:
  push:
    paths:
      - '.github/workflows/gpt-web-full-batch-compact.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpt-web-full-batch-compact
  cancel-in-progress: false

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build compact adjudication batch
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, re
          from datetime import datetime, timezone

          src = pathlib.Path('control/gpt_supergreen_inbox.json')
          data = json.loads(src.read_text(encoding='utf-8'))
          queue = data.get('review_queue') or []

          def clip(s, n=360):
              s = re.sub(r'\s+', ' ', str(s or '')).strip()
              return s if len(s) <= n else s[:n-1] + '…'

          gates_keep = [
              'entity_geography','turnover_financial','references_experience',
              'certifications_partner','staffing_team','insurance_bonds',
              'subcontracting_consortium','deliverables_scope','sla_onsite',
              'term_value','award_criteria','forms_signatures','submission','ip_data_security'
          ]
          rows=[]
          for q in queue:
              ev=q.get('evidence_by_gate') or {}
              gate_digest={}
              for gate in gates_keep:
                  vals=ev.get(gate) or []
                  if vals:
                      gate_digest[gate]=[clip((v or {}).get('text'), 360) for v in vals[:2]]
              da=q.get('deadline_authority') or {}
              eq=q.get('evidence_quality_summary') or {}
              rows.append({
                  'candidate_id': q.get('candidate_id'),
                  'title': q.get('title'),
                  'buyer': q.get('buyer'),
                  'portal': q.get('portal'),
                  'notice_url': q.get('notice_url'),
                  'deadline': q.get('deadline'),
                  'estimated_value': q.get('estimated_value'),
                  'currency': q.get('currency'),
                  'priority_score': q.get('priority_score'),
                  'gpt_priority_score': q.get('gpt_priority_score'),
                  'review_stage': q.get('review_stage'),
                  'spm_post_dce_score': q.get('spm_post_dce_score'),
                  'spm_fit_band': q.get('spm_fit_band'),
                  'spm_fit_reasons': q.get('spm_fit_reasons') or [],
                  'spm_friction_signals': q.get('spm_friction_signals') or [],
                  'upstream_classification': q.get('upstream_classification'),
                  'content_quality': q.get('content_quality'),
                  'gate_readiness': q.get('gate_readiness'),
                  'evidence_gate_coverage': q.get('evidence_gate_coverage'),
                  'deadline_authority_status': q.get('deadline_authority_status'),
                  'deadline_conflict': bool(da.get('conflict')),
                  'authoritative_submission_date': da.get('authoritative_submission_date'),
                  'dce_deadline_candidates': da.get('dce_deadline_candidates') or [],
                  'source_dce_run_id': q.get('source_dce_run_id'),
                  'source_shard': q.get('source_shard'),
                  'review_key': q.get('review_key'),
                  'raw_status': eq.get('raw_status'),
                  'documents_with_text': eq.get('documents_with_text'),
                  'text_chars': eq.get('text_chars'),
                  'evidence': gate_digest,
              })

          meta={
              'schema':'GPT_WEB_FULL_BATCH_COMPACT_V1',
              'generated_at':datetime.now(timezone.utc).isoformat(),
              'source_inbox_updated_at':data.get('updated_at'),
              'latest_source_dce_run_id':data.get('latest_source_dce_run_id'),
              'count':len(rows),
          }
          p=pathlib.Path('control/gpt_web_full_batch_compact.json')
          p.write_text(json.dumps({**meta,'items':rows},ensure_ascii=False,indent=2),encoding='utf-8')

          idx=pathlib.Path('control/gpt_web_full_batch_index.jsonl')
          with idx.open('w',encoding='utf-8') as f:
              f.write(json.dumps({'_meta':meta},ensure_ascii=False,separators=(',',':'))+'\n')
              for r in rows:
                  small={k:r.get(k) for k in [
                      'candidate_id','title','buyer','portal','notice_url','deadline','estimated_value','currency',
                      'gpt_priority_score','review_stage','spm_post_dce_score','spm_fit_band','spm_fit_reasons',
                      'spm_friction_signals','content_quality','gate_readiness','evidence_gate_coverage',
                      'deadline_authority_status','deadline_conflict','source_dce_run_id','source_shard','review_key'
                  ]}
                  f.write(json.dumps(small,ensure_ascii=False,separators=(',',':'))+'\n')
          print(json.dumps({'count':len(rows),'output':str(p),'index':str(idx)},indent=2))
          PY
      - name: Persist compact batch
        shell: bash
        run: |
          git config user.name 'tender-engine-bot'
          git config user.email 'tender-engine-bot@users.noreply.github.com'
          git add control/gpt_web_full_batch_compact.json control/gpt_web_full_batch_index.jsonl
          if git diff --cached --quiet; then
            echo 'No compact batch change.'
            exit 0
          fi
          git commit -m 'gpt-web: compact full pending batch [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep $((attempt*2)); continue; }
            sleep $((attempt*2))
          done
          exit 1
