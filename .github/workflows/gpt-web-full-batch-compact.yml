name: GPT Web Full Batch Compact

on:
  push:
    paths:
      - '.github/workflows/gpt-web-full-batch-compact.yml'
      - 'control/gpt_full_batch_trigger.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpt-web-full-batch-compact
  cancel-in-progress: true

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Build uncapped compact adjudication catalogs from durable index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          from collections import Counter
          from datetime import datetime, timezone

          src=pathlib.Path('control/gpt_review_index.json')
          data=json.loads(src.read_text(encoding='utf-8'))
          rows=[x for x in (data.get('items') or []) if isinstance(x,dict) and x.get('candidate_id')]
          expected=int(data.get('count') or len(rows))
          assert len(rows)==expected,(len(rows),expected)
          ids=[str(x['candidate_id']).strip().casefold() for x in rows]
          assert len(ids)==len(set(ids)), 'duplicate candidate IDs in durable index'

          keep=[
            'candidate_id','title','buyer','portal','notice_url','deadline','estimated_value','currency',
            'review_stage','gate_readiness','content_quality','deadline_resolved','deadline_authority_status',
            'evidence_gate_coverage','priority_score','spm_post_dce_score','spm_fit_band','spm_fit_reasons',
            'spm_friction_signals','source_dce_run_id','source_shard','procedure_aliases','artifact_locator','hot_ready_at'
          ]
          compact=[{k:r.get(k) for k in keep} for r in rows]
          priority=[r for r in compact if str(r.get('spm_fit_band') or '').upper() in {'HOT','GOOD','MAYBE'}]
          now=datetime.now(timezone.utc).isoformat()
          meta={
            'schema':'GPT_WEB_UNCAPPED_INDEX_COMPACT_V2',
            'generated_at':now,
            'source_index_updated_at':data.get('updated_at'),
            'count':len(compact),
            'priority_count':len(priority),
            'by_stage':dict(Counter(str(r.get('review_stage') or 'UNKNOWN') for r in compact)),
            'by_band':dict(Counter(str(r.get('spm_fit_band') or 'UNKNOWN') for r in compact)),
            'contract':'Exact uncapped durable GPT review index. No hot-window cap. Presence is work, never a GREEN verdict.'
          }

          out=pathlib.Path('control/gpt_web_uncapped_index.jsonl')
          with out.open('w',encoding='utf-8') as f:
            f.write(json.dumps({'_meta':meta},ensure_ascii=False,separators=(',',':'))+'\n')
            for r in compact:
              f.write(json.dumps(r,ensure_ascii=False,separators=(',',':'))+'\n')

          pout=pathlib.Path('control/gpt_web_priority_uncapped.jsonl')
          with pout.open('w',encoding='utf-8') as f:
            f.write(json.dumps({'_meta':{**meta,'count':len(priority),'scope':'HOT_GOOD_MAYBE_ONLY'}},ensure_ascii=False,separators=(',',':'))+'\n')
            for r in priority:
              f.write(json.dumps(r,ensure_ascii=False,separators=(',',':'))+'\n')

          pathlib.Path('control/gpt_web_uncapped_manifest.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(meta,ensure_ascii=False,indent=2))
          PY
      - name: Persist uncapped catalogs transactionally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tender-engine-bot'
          git config user.email 'tender-engine-bot@users.noreply.github.com'
          git add control/gpt_web_uncapped_index.jsonl control/gpt_web_priority_uncapped.jsonl control/gpt_web_uncapped_manifest.json
          if git diff --cached --quiet; then
            echo 'Uncapped catalogs already current.'
            exit 0
          fi
          git commit -m "gpt-web: persist uncapped full pending batch ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep $((attempt*2)); continue; }
            sleep $((attempt*2))
          done
          exit 1
