name: GPT Auth Uncapped Surface

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/build_uncapped_authenticity_surface.py'
      - '.github/workflows/gpt-auth-uncapped-surface.yml'
      - 'control/gpt_auth_uncapped_trigger.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpt-auth-uncapped-surface
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize every authenticity row
        run: |
          set -euo pipefail
          python pipeline/build_uncapped_authenticity_surface.py \
            --index control/gpt_review_index.json \
            --out control/gpt_auth_uncapped.json \
            --supported-out control/gpt_auth_supported_retry_pool.jsonl
      - name: Persist transactionally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tender-engine-bot'
          git config user.email 'tender-engine-bot@users.noreply.github.com'
          git add control/gpt_auth_uncapped.json control/gpt_auth_supported_retry_pool.jsonl
          git commit -m "auth: persist uncapped authenticity surface ${GITHUB_RUN_ID}" || exit 0
          for n in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; }
            sleep "$((n*2))"
          done
          exit 1
