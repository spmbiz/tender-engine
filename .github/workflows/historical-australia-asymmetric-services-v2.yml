name: Historical Australia Asymmetric Services v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - historical_lab/australia_asymmetric_services_v2.py
      - .github/workflows/historical-australia-asymmetric-services-v2.yml

permissions:
  contents: write

concurrency:
  group: historical-australia-asymmetric-services-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q duckdb
      - name: Download canonical AusTender facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source out
          for f in historical_tenders.csv.gz awards.csv.gz; do gh release download tender-normalized-austender-v1 --repo walidgdg1-ai/coldemailtool --pattern "$f" --dir source --clobber; done
      - name: Run v2 decomposition
        run: |
          python historical_lab/australia_asymmetric_services_v2.py --historical source/historical_tenders.csv.gz --awards source/awards.csv.gz --out out
      - name: Persist v2 outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=historical-australia-asymmetric-services-v2
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main --title 'Historical Australia Asymmetric Services v2' --notes 'Historical award-first decomposition with description excerpts and heuristic supplier-name normalization. v1 preserved.'
          for f in summary.json REPORT.md market_matrix.csv top_winners_normalized.csv top_buyers.csv examples.csv; do gh release upload "$TAG" "out/$f" --repo "$GITHUB_REPOSITORY" --clobber; done
          mkdir -p control/historical_australia_asymmetric_services_v2
          cp out/summary.json out/REPORT.md control/historical_australia_asymmetric_services_v2/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/historical_australia_asymmetric_services_v2/
          git commit -m 'historical: persist Australia asymmetric services v2' || exit 0
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*3))
          done
          exit 1
