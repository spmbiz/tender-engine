name: TED Partition Query Probe

on:
  push:
    branches: [main]
    paths:
      - 'control/ted_partition_probe_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1, fetch-tags: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests
      - name: Probe official TED query partitions
        shell: bash
        run: |
          set +e
          python tools/probe_ted_partition_queries.py
          rc=$?
          if [ ! -f control/ted_partition_probe.json ]; then
            printf '{"schema":"TED_PARTITION_QUERY_PROBE_WORKFLOW_FAILURE","exit_code":%s}\n' "$rc" > control/ted_partition_probe.json
          fi
          exit 0
      - name: Persist probe
        if: always()
        run: |
          set -euo pipefail
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add control/ted_partition_probe.json
          git diff --cached --quiet && exit 0
          git commit -m "diag: persist TED partition probe ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
