name: Qwen Control Plane Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qwen-control-plane-repair.yml'

permissions:
  contents: write

concurrency:
  group: qwen-control-plane-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Qwen control plane
        shell: bash
        run: |
          set -euo pipefail
          python -c "import base64;exec(base64.b64decode(''))"
          git diff --check
          grep -F 'GOLDEN_SOURCE_GENERATION' .github/workflows/qwen-batch-autotune-selfheal.yml
          grep -F 'batch_size: $' .github/workflows/qwen-live-classification.yml

      - name: Persist repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/qwen-batch-autotune-selfheal.yml .github/workflows/qwen-live-classification.yml
          if git diff --cached --quiet; then
            echo 'Repair already applied.'
            exit 0
          fi
          git commit -m 'qwen: anchor autotune goldens and consume safe champion'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$((attempt * 3))"
          done
          exit 1
