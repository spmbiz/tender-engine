name: Apply Proven Live Routes V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-proven-live-routes-v2.yml'
      - 'control/apply_proven_live_routes_v2_trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1, fetch-tags: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests pytest
      - name: Validate proofs, patch routes, and build observable verdict
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import json,subprocess,traceback
          from pathlib import Path

          verdict={
              'schema':'APPLY_PROVEN_LIVE_ROUTES_V2',
              'proofs':{},
              'tests_ok':False,
              'routes_patched':False,
              'error':None,
          }
          try:
              it=json.load(open('control/it_anac_pvl_full_reconcile_proof.json'))
              es=json.load(open('control/es_placsp_live_proof.json'))
              pcs=json.load(open('control/pcs_full_reconcile_proof.json'))
              checks={
                  'IT_ANAC_PVL': bool(it.get('pass') is True and it.get('enumeration_complete') is True and it.get('live_coverage_credit_allowed') is True and it.get('windows_expected')==it.get('windows_completed')),
                  'ES_PLACSP': bool(es.get('pass') is True and es.get('publication_window_enumeration_complete') is True and not (es.get('errors') or [])),
                  'UK_PCS_OCDS': bool(pcs.get('pass') is True and pcs.get('enumeration_complete') is True and pcs.get('live_coverage_credit_allowed') is True),
              }
              verdict['proofs']=checks
              if not all(checks.values()):
                  raise RuntimeError(f'PROOF_GATE_FAILED:{checks!r}')

              commands=[
                  ['python','-m','py_compile','pipeline/discover_it_anac_pvl_v4.py','pipeline/discover_es_placsp_atom_v2.py','pipeline/discover_austender_production.py','pipeline/austender_bridge_transport.py'],
                  ['pytest','-q','tests/test_it_anac_pvl_v4.py','tests/test_es_placsp_atom_v2.py','tests/test_austender_bridge_transport.py'],
              ]
              for cmd in commands:
                  subprocess.run(cmd,check=True)
              verdict['tests_ok']=True

              wf=Path('.github/workflows/supergreen-discovery-v2.yml')
              s=wf.read_text()
              replacements={
                  'AU_AUSTENDER) python pipeline/discover_austender_browser.py ;;':
                      'AU_AUSTENDER) python pipeline/discover_austender_production.py ;;',
                  'ES_PLACSP) python pipeline/discover_es_placsp_atom.py ;;':
                      'ES_PLACSP) python pipeline/discover_es_placsp_atom_v2.py ;;',
                  'IT_ANAC_DELTA) if [ "$DISCOVERY_MODE" = reconcile ]; then export ANAC_PVL_LOOKBACK_DAYS=1095; else export ANAC_PVL_LOOKBACK_DAYS=730; fi; python pipeline/discover_it_anac_pvl.py ;;':
                      'IT_ANAC_DELTA) python pipeline/discover_it_anac_pvl_v4.py ;;',
              }
              applied={}
              for old,new in replacements.items():
                  if old in s:
                      s=s.replace(old,new,1)
                      applied[new]=True
                  elif new in s:
                      applied[new]='already'
                  else:
                      raise RuntimeError(f'ROUTE_MARKER_MISSING:{old}')
              for marker in (
                  'UK_PCS_OCDS) python pipeline/discover_uk_pcs_current.py ;;',
                  'python pipeline/discover_za_etenders_ocds.py',
              ):
                  if marker not in s:
                      raise RuntimeError(f'PROVEN_ROUTE_MISSING:{marker}')
              wf.write_text(s)

              guard=Path('pipeline/source_coverage_guard.py')
              g=guard.read_text()
              marker='STRICT_EXHAUSTION_SOURCES={'
              start=g.index(marker); end=g.index('}',start)
              block=g[start:end]
              if '"IT_ANAC_PVL"' not in block:
                  block=block.replace('{','{"IT_ANAC_PVL",',1)
                  g=g[:start]+block+g[end:]
              guard.write_text(g)
              verdict['routes_patched']=True
              verdict['applied']=applied
          except Exception as exc:
              verdict['error']=repr(exc)
              verdict['traceback']=traceback.format_exc()[-8000:]
          Path('control/apply_proven_live_routes_v2_status.json').write_text(json.dumps(verdict,indent=2)+'\n')
          print(json.dumps(verdict,indent=2))
          raise SystemExit(0 if verdict['routes_patched'] else 3)
          PY
          patch_rc=$?
          echo "patch_rc=$patch_rc"
          # Deliberately continue so the verdict is durable even when a gate fails.
          exit 0
      - name: Commit route changes and durable verdict atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add .github/workflows/supergreen-discovery-v2.yml pipeline/source_coverage_guard.py control/apply_proven_live_routes_v2_status.json
          git diff --cached --quiet && exit 0
          ok="$(python - <<'PY'
          import json
          p=json.load(open('control/apply_proven_live_routes_v2_status.json'))
          print('1' if p.get('routes_patched') is True else '0')
          PY
          )"
          if [ "$ok" = 1 ]; then msg='coverage: apply proven Italy Spain and secure AusTender routes'; else msg='diag: persist proven-route apply failure'; fi
          git commit -m "$msg"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
      - name: Enforce observable verdict
        run: python -c "import json; p=json.load(open('control/apply_proven_live_routes_v2_status.json')); raise SystemExit(0 if p.get('routes_patched') is True else 3)"
