name: Fix Aggregate Evidence V2 Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-aggregate-evidence-v2-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-aggregate-evidence-v2-once
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Accept only validated evidence contract V1/V2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('pipeline/aggregate_dce.py')
          s=p.read_text(encoding='utf-8')
          old='    if isinstance(evidence, dict) and evidence.get("contract") == "DCE_EVIDENCE_QUALITY_V1":\n'
          new='    if isinstance(evidence, dict) and str(evidence.get("contract") or "").upper() in {"DCE_EVIDENCE_QUALITY_V1", "DCE_EVIDENCE_QUALITY_V2"}:\n'
          if old not in s:
              if new in s:
                  print('aggregate evidence V2 compatibility already present')
              else:
                  raise SystemExit('expected V1-only guard not found; refusing blind patch')
          else:
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          cat > tests/test_aggregate_dce_evidence_contract.py <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path(__file__).resolve().parents[1] / 'pipeline'))
          from aggregate_dce import resolve_evidence


          def ev(contract, ready=True):
              return {
                  'contract': contract,
                  'derived_status': 'DOWNLOADED_PUBLIC',
                  'content_quality': 'SUBSTANTIVE_DCE_PRESENT',
                  'gate_readiness': ready,
              }


          def test_v1_remains_authoritative():
              assert resolve_evidence('DOWNLOADED_PUBLIC', [{'name':'rft.pdf'}], ev('DCE_EVIDENCE_QUALITY_V1')) == (
                  'DOWNLOADED_PUBLIC','SUBSTANTIVE_DCE_PRESENT',True
              )


          def test_v2_is_authoritative_and_gate_ready():
              assert resolve_evidence('DOWNLOADED_PUBLIC', [{'name':'rft.pdf'}], ev('DCE_EVIDENCE_QUALITY_V2')) == (
                  'DOWNLOADED_PUBLIC','SUBSTANTIVE_DCE_PRESENT',True
              )


          def test_unknown_future_contract_does_not_auto_promote():
              status, quality, ready = resolve_evidence(
                  'DOWNLOADED_PUBLIC', [{'name':'rft.pdf'}], ev('DCE_EVIDENCE_QUALITY_V3')
              )
              assert status == 'DCE_CONTENT_UNVERIFIED'
              assert quality == 'UNKNOWN_RETRIEVED_DOCUMENT'
              assert ready is False
          PY
          python -m py_compile pipeline/aggregate_dce.py tests/test_aggregate_dce_evidence_contract.py
          python -m pytest -q tests/test_aggregate_dce_evidence_contract.py
      - name: Commit focused fix and regression
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tender-engine-bot'
          git config user.email 'tender-engine-bot@users.noreply.github.com'
          git add pipeline/aggregate_dce.py tests/test_aggregate_dce_evidence_contract.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(dce): preserve evidence-quality V2 through fast aggregate'
          for n in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$((n*2))"
          done
          exit 1
