name: Fresh UK Contracts Finder (Legacy Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q requests
      - run: python contracts_finder_fresh.py
      - name: Persist harvested output durably
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [ -d uk_fresh ] || exit 0
          tag="legacy-uk-fresh-${GITHUB_RUN_ID}"
          tar -czf "$tag.tar.gz" uk_fresh
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes "Durable legacy Contracts Finder harvest."
          gh release upload "$tag" "$tag.tar.gz"
