name: GPT Inbox Live Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'control/gpt_review_hot.json'
      - 'control/supergreen_hot.json'
      - 'control/qwen_dce_triage_latest.jsonl'
      - 'control/final_supergreen_bank.json'
      - 'control/gpt_web_review_ledger.json'
      - 'pipeline/refresh_gpt_inbox_live.py'
      - 'pipeline/gpt_web_tick.py'
      - '.github/workflows/gpt-inbox-live-refresh.yml'

permissions:
  contents: write

concurrency:
  group: gpt-inbox-live-refresh
  cancel-in-progress: true

jobs:
  refresh:
    # Event-driven only: DCE shards publish directly, GPT Web ticks trigger a push
    # refresh, and workflow_dispatch is the fallback if a direct shard publish fails.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild GPT Web work inbox from DCE evidence and durable ticks
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python pipeline/refresh_gpt_inbox_live.py \
            --existing control/gpt_supergreen_inbox.json \
            --final-bank control/final_supergreen_bank.json \
            --hot-green control/supergreen_hot.json \
            --hot-review control/gpt_review_hot.json \
            --review-ledger control/gpt_web_review_ledger.json \
            --out control/gpt_supergreen_inbox.json \
            --max-items 60

      - name: Persist only when the GPT Web work surface changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tender-engine-bot'
          git config user.email 'tender-engine-bot@users.noreply.github.com'
          git add control/gpt_supergreen_inbox.json
          if git diff --cached --quiet; then
            echo 'Inbox already current.'
            exit 0
          fi
          git commit -m "inbox: GPT Web queue refresh ${GITHUB_RUN_ID}"
          for n in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$((n * 2))"
          done
          exit 1
