name: Apply Live National Lanes

on:
  push:
    branches: [main]
    paths: ['control/national_expansion_patch_trigger.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -q pytest requests pyyaml
      - name: Preserve national lanes patch
        run: python pipeline/patch_live_national_lanes.py
      - name: Apply recall hardening P1
        run: python tools/apply_recall_hardening_p1.py
      - name: Validate Python and workflow YAML
        run: |
          python -m py_compile \
            pipeline/discover_si_ejn_browser.py \
            pipeline/discover_sk_uvo.py \
            pipeline/discover_ee_rhr.py \
            pipeline/dce_worker_v6.py \
            pipeline/source_coverage_guard.py \
            pipeline/discover_ted.py \
            pipeline/build_live_world_snapshot.py \
            pipeline/qwen_notice_batch_selfheal_core.py \
            pipeline/qwen_notice_batch_selfheal_rich.py \
            pipeline/qwen_notice_batch_selfheal.py
          python - <<'PY'
          import yaml
          from pathlib import Path
          for rel in ('.github/workflows/supergreen-discovery-v2.yml','.github/workflows/qwen-live-classification.yml'):
              p=Path(rel)
              x=yaml.safe_load(p.read_text(encoding='utf-8'))
              assert isinstance(x,dict) and isinstance(x.get('jobs'),dict), rel
          body=Path('.github/workflows/supergreen-discovery-v2.yml').read_text(encoding='utf-8')
          for token in ('SI_EJN','SK_UVO','EE_RHR','discover_si_ejn_browser.py','discover_sk_uvo.py','discover_ee_rhr.py'):
              assert token in body, token
          print('workflow validation OK')
          PY
      - name: Run recall regression suite
        run: |
          python -m pytest -q \
            tests/test_recall_hardening_p1.py \
            tests/test_live_universe_contract.py \
            tests/test_snapshot_carry_forward.py \
            tests/test_ted_checkpoint.py \
            tests/test_recall_workflow_contract.py
      - name: Commit only verified operational changes
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            .github/workflows/supergreen-discovery-v2.yml
            .github/workflows/qwen-live-classification.yml
            pipeline/discover_ted.py
            pipeline/build_live_world_snapshot.py
            pipeline/qwen_notice_batch_selfheal_rich.py
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo 'Already patched'; exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${paths[@]}"
          git commit -m 'tenders: enrich geography and semantic recall context'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*3))
          done
          exit 1
