name: Actions Artifact Inventory

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inventory Actions artifacts without deleting data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id,.name,.size_in_bytes,.workflow_run.id,.created_at,.expires_at] | @tsv' > /tmp/artifacts.tsv
          count=$(wc -l < /tmp/artifacts.tsv | tr -d ' ')
          bytes=$(awk -F '\t' '{s+=$3} END{printf "%.0f",s}' /tmp/artifacts.tsv)
          echo "Actions artifact inventory only. NO DELETE performed."
          echo "artifact_count=$count"
          echo "artifact_bytes=$bytes"
          {
            echo "## Actions artifact inventory"
            echo
            echo "- artifacts: $count"
            echo "- bytes: $bytes"
            echo "- deletion policy: **disabled unless a separate migration workflow proves durable canonical copies first**"
          } >> "$GITHUB_STEP_SUMMARY"
