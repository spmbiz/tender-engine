name: Persist GPT Adjudications

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'control/adjudications/*.json'
      - 'pipeline/merge_gpt_adjudications_into_final_bank.py'
      - 'pipeline/gpt_web_tick.py'
      - '.github/workflows/persist-gpt-adjudications.yml'

permissions:
  contents: write

concurrency:
  group: persist-gpt-adjudications
  cancel-in-progress: false

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Persist durable GPT bank and review ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tender-engine-bot'
          git config user.email 'tender-engine-bot@users.noreply.github.com'

          # IMPORTANT CONCURRENCY RULE:
          # Live DCE/inbox workflows write review-index/inbox/metrics files very often.
          # Do NOT include those high-churn derived surfaces in this transaction.
          # Persist only the two durable GPT truths here:
          #   1) final_supergreen_bank.json
          #   2) gpt_web_review_ledger.json
          # The next live inbox refresh consumes the durable ledger and naturally
          # removes reviewed candidates/rebuilds the derived index and read batches.
          # This makes adjudication persistence rebase-safe against unrelated live
          # harvester commits instead of starving on repeated non-fast-forward pushes.

          for attempt in $(seq 1 30); do
            git fetch origin main
            git reset --hard origin/main

            python pipeline/merge_gpt_adjudications_into_final_bank.py

            python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          applied=[]
          for p in sorted(Path('control/adjudications').glob('*.json')):
              try:
                  obj=json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if not isinstance(obj,dict) or obj.get('persist_to_final_bank') is not True:
                  continue
              results=[x for x in (obj.get('results') or []) if isinstance(x,dict) and x.get('candidate_id')]
              if not results:
                  continue
              subprocess.run([
                  sys.executable,
                  'pipeline/gpt_web_tick.py',
                  '--reviews', str(p),
                  '--ledger', 'control/gpt_web_review_ledger.json',
                  '--pass-id', f'persisted-adjudication:{p.stem}',
              ], check=True)
              applied.append({'file':str(p),'results':len(results)})
          print(json.dumps({'persisted_adjudication_files_ticked':applied},indent=2))
          PY

            git add \
              control/final_supergreen_bank.json \
              control/gpt_web_review_ledger.json

            if git diff --cached --quiet; then
              echo 'Durable final bank and review ledger already agree with all adjudication files.'
              exit 0
            fi

            git commit -m 'gpt: persist durable verdict bank and review ledger'

            # Other live jobs normally touch only derived inbox/index files, so this
            # rebase is expected to be clean. If a rare race still occurs, recompute
            # from the newest main and retry instead of overwriting anyone's work.
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi

            git rebase --abort >/dev/null 2>&1 || true
            sleep 2
          done

          echo 'Failed to persist durable GPT adjudications after retries.' >&2
          exit 1
