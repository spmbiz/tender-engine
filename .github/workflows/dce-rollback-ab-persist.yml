name: Persist DCE Rollback A/B Evidence

on:
  workflow_run:
    workflows: ["DCE Rollback A/B V15"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: dce-rollback-ab-persist
  cancel-in-progress: false

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Download rollback and expansion artifacts from triggering run
        uses: actions/download-artifact@v4
        with:
          pattern: dce-*-${{ github.event.workflow_run.id }}
          path: evidence
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Build durable combined evidence record
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_CREATED_AT: ${{ github.event.workflow_run.created_at }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt,json,os
          from pathlib import Path

          rollback=None
          expansion=None
          rollback_path=None
          expansion_path=None
          for p in Path('evidence').rglob('report.json'):
              if 'ab-report' in str(p):
                  rollback=json.loads(p.read_text(encoding='utf-8'))
                  rollback_path=str(p)
                  break
          for p in Path('evidence').rglob('expansion-summary.json'):
              expansion=json.loads(p.read_text(encoding='utf-8'))
              expansion_path=str(p)
              break

          errors=[]
          if rollback is None:
              errors.append('rollback_report_missing')
          if expansion is None:
              errors.append('expansion_summary_missing')

          hard=int((rollback or {}).get('hard_regression_count') or 0)
          expansion_bad=list((expansion or {}).get('bad') or [])
          source_conclusion=os.environ.get('SOURCE_CONCLUSION') or 'unknown'
          if hard:
              errors.append(f'rollback_hard_regressions:{hard}')
          if expansion_bad:
              errors.append(f'expansion_bad_routes:{len(expansion_bad)}')
          if source_conclusion != 'success':
              errors.append(f'source_workflow_conclusion:{source_conclusion}')

          payload={
              'schema':'DCE_ROLLBACK_AB_DURABLE_EVIDENCE_V1',
              'generated_at':dt.datetime.now(dt.timezone.utc).isoformat(),
              'status':'PASS' if not errors else 'FAIL',
              'errors':errors,
              'source_workflow':{
                  'name':'DCE Rollback A/B V15',
                  'run_id':os.environ.get('SOURCE_RUN_ID'),
                  'conclusion':source_conclusion,
                  'head_sha':os.environ.get('SOURCE_HEAD_SHA'),
                  'created_at':os.environ.get('SOURCE_CREATED_AT'),
              },
              'rollback_report':rollback,
              'expansion_summary':expansion,
              'artifact_paths':{'rollback':rollback_path,'expansion':expansion_path},
              'gate':{
                  'current_may_not_lose_baseline_downloaded_public':True,
                  'hard_regression_count':hard,
                  'expansion_bad_route_count':len(expansion_bad),
                  'safe_to_keep_current_resolver':not errors,
              },
          }
          Path('dce-rollback-ab-latest.json').write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps({
              'status':payload['status'],
              'errors':errors,
              'hard_regressions':hard,
              'expansion_bad_routes':len(expansion_bad),
              'source_run_id':payload['source_workflow']['run_id'],
          },indent=2))
          PY

      - name: Persist combined record transactionally on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          path='control/dce_rollback_ab_latest.json'
          content="$(base64 -w0 dce-rollback-ab-latest.json)"
          for attempt in 1 2 3 4 5 6; do
            sha="$(gh api "repos/$REPO/contents/$path?ref=main" --jq '.sha' 2>/dev/null || true)"
            args=(--method PUT "repos/$REPO/contents/$path" -f message="ci: persist DCE rollback A/B evidence $SOURCE_RUN_ID" -f content="$content" -f branch=main)
            [ -n "$sha" ] && args+=(-f sha="$sha")
            if gh api "${args[@]}" >/dev/null; then
              echo "persisted $path"
              exit 0
            fi
            sleep "$((attempt*2))"
          done
          exit 1

      - name: Fail closed when rollback/expansion evidence failed
        run: |
          python - <<'PY'
          import json
          d=json.load(open('dce-rollback-ab-latest.json'))
          if d.get('status') != 'PASS':
              raise SystemExit(json.dumps(d.get('errors') or []))
          PY
