name: Historical Commercial Miner v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical-commercial-miner-v1.yml'
      - 'historical_lab/**'

permissions:
  contents: write

concurrency:
  group: historical-commercial-miner-v1
  cancel-in-progress: false

env:
  TAG: historical-commercial-miner-v1

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure historical-only derived release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" --repo walidgdg1-ai/tender-engine >/dev/null 2>&1; then
            gh release create "$TAG" --repo walidgdg1-ai/tender-engine --target main \
              --title 'Historical Commercial Miner v1' \
              --notes 'Historical-only market structure mining across canonical Global Core, USAspending, and AusTender archives. No live discovery, no DCE retrieval, no bid/no-bid decisions. Currency-isolated empirical cohort discovery.'
          fi

  global_core:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q duckdb
      - name: Download canonical Global Core facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source out
          for a in historical_tenders.parquet awards.parquet award_suppliers.parquet; do
            gh release download tender-normalized-global-core-v4 --repo walidgdg1-ai/coldemailtool --pattern "$a" --dir source --clobber
          done
      - name: Mine every notice-first procurement
        run: |
          python historical_lab/historical_commercial_miner_v1.py \
            --label GLOBAL_CORE_V4 --grain NOTICE_FIRST_TENDER \
            --historical source/historical_tenders.parquet --awards source/awards.parquet --bridge source/award_suppliers.parquet \
            --expected-tenders 2250547 --expected-awards 4286784 --expected-links 3937663 --out out
      - name: Publish derived Global Core intelligence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf out/work.duckdb* out/ducktmp
          for f in summary.json REPORT.md native_code_market.csv high_signal_clusters.csv repeat_buyer_cluster_matrix.csv winner_cluster_matrix.csv cluster_examples.csv; do
            cp "out/$f" "global_core_$f"
            gh release upload "$TAG" "global_core_$f" --repo walidgdg1-ai/tender-engine --clobber
          done

  australia:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q duckdb
      - name: Download canonical AusTender facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source out
          for a in historical_tenders.csv.gz awards.csv.gz award_suppliers.csv.gz; do
            gh release download tender-normalized-austender-v1 --repo walidgdg1-ai/coldemailtool --pattern "$a" --dir source --clobber
          done
      - name: Mine every award-first procurement
        run: |
          python historical_lab/historical_commercial_miner_v1.py \
            --label AUSTENDER_V1 --grain AWARD_FIRST_PROCUREMENT \
            --historical source/historical_tenders.csv.gz --awards source/awards.csv.gz --bridge source/award_suppliers.csv.gz \
            --expected-tenders 178211 --expected-awards 178211 --expected-links 178211 --out out
      - name: Publish derived AusTender intelligence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf out/work.duckdb* out/ducktmp
          for f in summary.json REPORT.md native_code_market.csv high_signal_clusters.csv repeat_buyer_cluster_matrix.csv winner_cluster_matrix.csv cluster_examples.csv; do
            cp "out/$f" "australia_$f"
            gh release upload "$TAG" "australia_$f" --repo walidgdg1-ai/tender-engine --clobber
          done

  usa:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q duckdb
      - name: Download canonical USAspending facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source out
          for a in historical_tenders.csv.gz awards.csv.gz award_suppliers.csv.gz; do
            gh release download tender-normalized-usa-awards-v1 --repo walidgdg1-ai/coldemailtool --pattern "$a" --dir source --clobber
          done
      - name: Mine all 15.8M award-first procurements
        run: |
          python historical_lab/historical_commercial_miner_v1.py \
            --label USASPENDING_V1 --grain AWARD_FIRST_PROCUREMENT \
            --historical source/historical_tenders.csv.gz --awards source/awards.csv.gz --bridge source/award_suppliers.csv.gz \
            --expected-tenders 15842317 --expected-awards 15842317 --expected-links 15842312 --out out
      - name: Publish derived USA intelligence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf out/work.duckdb* out/ducktmp
          for f in summary.json REPORT.md native_code_market.csv high_signal_clusters.csv repeat_buyer_cluster_matrix.csv winner_cluster_matrix.csv cluster_examples.csv; do
            cp "out/$f" "usa_$f"
            gh release upload "$TAG" "usa_$f" --repo walidgdg1-ai/tender-engine --clobber
          done

  consolidate:
    needs: [global_core, australia, usa]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download summaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p all
          for p in global_core_summary.json australia_summary.json usa_summary.json; do
            gh release download "$TAG" --repo walidgdg1-ai/tender-engine --pattern "$p" --dir all --clobber
          done
      - name: Build master historical-commercial manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('all')
          src=[json.load(open(root/f'{p}_summary.json',encoding='utf-8')) for p in ('global_core','australia','usa')]
          total_proc=sum(x['counts']['procurement_records_scanned'] for x in src)
          total_awards=sum(x['counts']['award_rows_scanned'] for x in src)
          total_links=sum(x['counts']['award_supplier_links_scanned'] for x in src)
          assert total_proc==18271075,total_proc
          assert total_awards==20307312,total_awards
          assert total_links==19958186,total_links
          out={
            'version':'SPM_HISTORICAL_COMMERCIAL_MINER_MASTER_V1',
            'status':'PASS',
            'scope':'HISTORICAL_ONLY_NO_LIVE_NO_DCE',
            'procurement_records_scanned':total_proc,
            'award_rows_scanned':total_awards,
            'award_supplier_links_scanned':total_links,
            'sources':src,
            'interpretation':'Empirical market-structure discovery. Cohort scores are historical triage, never live eligibility or bid/no-bid.'
          }
          Path('MASTER_SUMMARY.json').write_text(json.dumps(out,indent=2,ensure_ascii=False),encoding='utf-8')
          lines=['# Historical Commercial Miner v1 — MASTER','', '**STATUS: PASS**','',
                 f'- Procurement records scanned: **{total_proc:,}**',
                 f'- Award rows scanned: **{total_awards:,}**',
                 f'- Award↔supplier links scanned: **{total_links:,}**','',
                 'This program is historical-only. It does not query live tenders or DCEs. It discovers recurring empirical commercial cohorts before SPM feasibility QA.','']
          for x in src:
            c=x['counts']
            lines += [f"## {x['label']}", '',
                      f"- records: {c['procurement_records_scanned']:,}",
                      f"- clusters: {c['commercial_clusters']:,}",
                      f"- clusters ≥3 records: {c['clusters_with_3plus_records']:,}",
                      f"- multi-buyer repeat markets: {c['multi_buyer_repeat_markets']:,}",'']
          Path('MASTER_REPORT.md').write_text('\n'.join(lines),encoding='utf-8')
          PY
      - name: Persist master authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" MASTER_SUMMARY.json MASTER_REPORT.md --repo walidgdg1-ai/tender-engine --clobber
          mkdir -p control/historical_commercial_miner_v1
          cp MASTER_SUMMARY.json MASTER_REPORT.md control/historical_commercial_miner_v1/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/historical_commercial_miner_v1/
          git commit -m 'historical: persist commercial miner v1 master' || exit 0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*3))
          done
          exit 1
