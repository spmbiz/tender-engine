name: Historical BOAMP DCE Deep Review v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical-boamp-dce-deep-review-v2.yml'
      - 'pipeline/dce_evidence_quality.py'
      - 'control/historical_boamp_dce_routes_v1/resolved_candidates.jsonl'

permissions:
  contents: write

concurrency:
  group: historical-boamp-dce-deep-review-v2
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate resolved BOAMP queue
        run: |
          set -euo pipefail
          test -s control/historical_boamp_dce_routes_v1/resolved_candidates.jsonl
          n="$(wc -l < control/historical_boamp_dce_routes_v1/resolved_candidates.jsonl)"
          test "$n" -eq 19
          echo "RESOLVED_BOAMP=$n"
      - name: Install live DCE resolver dependencies
        run: |
          python -m pip install --disable-pip-version-check -q \
            requests pypdf python-docx openpyxl python-pptx 'playwright>=1.46,<2'
          command -v 7z >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full)
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$chrome" ]; then echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"; else python -m playwright install --with-deps chromium; fi
      - name: Resolve exact downstream BOAMP DCE routes with live worker
        env:
          DCE_LOCAL_CONCURRENCY: '4'
          DCE_ITEM_RETRIES: '1'
          DCE_ITEM_TIMEOUT_SECONDS: '180'
        run: |
          set -euo pipefail
          mkdir -p out review
          n="$(wc -l < control/historical_boamp_dce_routes_v1/resolved_candidates.jsonl)"
          lines="$(seq -s, 1 "$n")"
          python pipeline/dce_batch_worker.py \
            --queue control/historical_boamp_dce_routes_v1/resolved_candidates.jsonl \
            --lines "$lines" --out out --concurrency 4 --retries 1 --timeout-seconds 180
      - name: Extract corpora and fail-closed evidence quality
        env:
          DCE_EXTRACT_WORKERS: '4'
          DCE_GATE_WORKERS: '4'
        run: |
          python pipeline/extract_corpus.py --root out
          python pipeline/dce_evidence_quality.py --root out
          python pipeline/extract_gates.py --root out
      - name: Aggregate BOAMP route DCE reality
        run: python pipeline/summarize_historical_subniche_dce.py --root out --out review
      - name: Validate research output
        run: |
          python - <<'PY'
          import json,os
          s=json.load(open('review/summary.json',encoding='utf-8'))
          assert s['contract']=='HISTORICAL_SUBNICHE_DCE_GATE_RESEARCH_V1',s
          assert s['total_candidates']==19,s
          assert s['final_verdict_allowed'] is False
          assert os.path.getsize('review/candidate_dce_review.jsonl')>0
          print(json.dumps({k:v for k,v in s.items() if k!='subniches'},indent=2,ensure_ascii=False))
          PY
      - name: Persist compact v2 reality check
        run: |
          set -euo pipefail
          mkdir -p control/historical_boamp_dce_review_v2
          cp review/REPORT.md control/historical_boamp_dce_review_v2/REPORT.md
          cp review/summary.json control/historical_boamp_dce_review_v2/summary.json
          cp review/candidate_dce_review.jsonl control/historical_boamp_dce_review_v2/candidate_dce_review.jsonl
          cp out/batch_summary.json control/historical_boamp_dce_review_v2/batch_summary.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/historical_boamp_dce_review_v2/
          git commit -m 'tenders: persist downstream BOAMP historical DCE review v2' || true
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then break; fi
            git rebase --abort >/dev/null 2>&1 || true
            if [ "$i" = 5 ]; then exit 1; fi
            sleep $((i*3))
          done
      - name: Publish durable v2 evidence bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar -C out -czf historical-boamp-dce-worker-v2.tar.gz .
          tar -C review -czf historical-boamp-dce-review-v2.tar.gz .
          tag='historical-boamp-dce-review-v2'
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target main \
            --title 'Historical BOAMP DCE Reality Check v2' \
            --notes 'Deep public-DCE retrieval from official BOAMP-resolved downstream routes. BOAMP publication PDFs are explicitly notice-only and cannot become gate-ready DCE evidence.'
          gh release upload "$tag" historical-boamp-dce-worker-v2.tar.gz historical-boamp-dce-review-v2.tar.gz review/summary.json review/REPORT.md --clobber
