name: Germany OpenData DCE Recovery v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/recover_germany_opendata_dce_routes.py'
      - '.github/workflows/germany-opendata-dce-recovery-v1.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q requests pypdf python-docx openpyxl python-pptx

      - name: Recover authoritative eForms routes from daily OpenData exports
        run: |
          mkdir -p recovery out review
          python pipeline/recover_germany_opendata_dce_routes.py \
            --queue-summary control/germany_web_historical_dce_review_v1/queue_summary.json \
            --out recovery --timeout 120

      - name: Validate notice matching before resolver
        shell: bash
        run: |
          python - <<'PY'
          import json
          s=json.load(open('recovery/summary.json',encoding='utf-8'))
          assert s['contract']=='GERMANY_OPENDATA_DCE_ROUTE_RECOVERY_V1',s
          assert s['candidates']==9,s
          assert s['matched_notices']>=2,s
          assert s['candidates_with_positive_urls']>=2,s
          print(json.dumps(s,indent=2,ensure_ascii=False))
          PY

      - name: Resolve recovered public document/platform URLs
        shell: bash
        run: |
          set -euo pipefail
          n="$(wc -l < recovery/resolver_queue.jsonl)"
          lines="$(seq -s, 1 "$n")"
          python pipeline/dce_batch_worker.py \
            --queue recovery/resolver_queue.jsonl --lines "$lines" --out out \
            --concurrency 3 --retries 1 --timeout-seconds 150

      - name: Extract authoritative evidence
        run: |
          python pipeline/extract_corpus.py --root out
          python pipeline/dce_evidence_quality.py --root out
          python pipeline/extract_gates.py --root out
          python pipeline/summarize_historical_subniche_dce.py --root out --out review
          python pipeline/extract_historical_gate_evidence_pack.py --root out --out review/evidence --per-category 3

      - name: Persist Germany OpenData recovery evidence even when docs are expired
        shell: bash
        run: |
          rm -rf control/germany_opendata_dce_recovery_v1
          mkdir -p control/germany_opendata_dce_recovery_v1
          cp recovery/summary.json control/germany_opendata_dce_recovery_v1/recovery_summary.json
          cp recovery/recovery_results.json control/germany_opendata_dce_recovery_v1/recovery_results.json
          cp recovery/resolver_queue.jsonl control/germany_opendata_dce_recovery_v1/resolver_queue.jsonl
          cp review/summary.json control/germany_opendata_dce_recovery_v1/dce_summary.json
          cp review/REPORT.md control/germany_opendata_dce_recovery_v1/REPORT.md
          cp review/candidate_dce_review.jsonl control/germany_opendata_dce_recovery_v1/candidate_dce_review.jsonl
          cp -r review/evidence control/germany_opendata_dce_recovery_v1/evidence
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/germany_opendata_dce_recovery_v1/
          git commit -m 'tenders: persist Germany OpenData DCE recovery v1' || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*3))
          done
          exit 1
