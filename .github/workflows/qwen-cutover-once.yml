name: Qwen Cutover Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qwen-cutover-once.yml'

permissions:
  actions: write
  contents: read

# Deliberately share Qwen's active concurrency group once: creation of this run
# evicts the last pre-patch semantic pass before any runner is required.
concurrency:
  group: qwen-live-notice-classification-active
  cancel-in-progress: true

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch first patched bounded Qwen pass
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run qwen-live-classification.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f per_shard=48 \
            -f auto_continue=true \
            -f dce_limit=160
          echo 'Patched 48-row Qwen pass dispatched. Durable exact-hash state remains authoritative.'
