name: SuperGreen Discovery V2

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ted-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q requests
      - name: Enumerate TED without keyword prefilter
        env:
          TED_SCOPE: ACTIVE
          TED_MAX_PAGES: '24'
        run: python pipeline/discover_ted.py
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-${{ github.run_id }}-ted
          path: discovery/ted/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  contracts-finder-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q requests
      - name: Enumerate Contracts Finder
        run: python pipeline/discover_contracts_finder.py
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-${{ github.run_id }}-contracts-finder
          path: discovery/contracts_finder/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  etenders-ireland:
    name: ie-pages-${{ matrix.start }}-${{ matrix.end }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {shard: 0, start: 1, end: 5}
          - {shard: 1, start: 6, end: 10}
          - {shard: 2, start: 11, end: 15}
          - {shard: 3, start: 16, end: 20}
          - {shard: 4, start: 21, end: 25}
          - {shard: 5, start: 26, end: 30}
          - {shard: 6, start: 31, end: 35}
          - {shard: 7, start: 36, end: 40}
          - {shard: 8, start: 41, end: 45}
          - {shard: 9, start: 46, end: 50}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q 'playwright>=1.46,<2' beautifulsoup4
      - name: Reuse runner Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$chrome" ]; then
            echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Enumerate independent eTenders page shard
        env:
          DISCOVERY_OUT: discovery/ireland/shard-${{ matrix.shard }}
          PAGE_START: ${{ matrix.start }}
          PAGE_END: ${{ matrix.end }}
          IE_PAGE_CONCURRENCY: '1'
        run: python pipeline/discover_etenders_ie_async.py
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-${{ github.run_id }}-ie-${{ matrix.shard }}
          path: discovery/ireland/shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  wide-read-pack:
    needs: [ted-discovery, contracts-finder-discovery, etenders-ireland]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: discovery-${{ github.run_id }}-*
          path: discovery-download
          merge-multiple: true
      - name: Canonical merge and dedupe
        run: python pipeline/merge_discovery.py --root discovery-download --out merged
      - name: Build mandatory GPT wide-read packets
        run: python pipeline/wide_read_packets.py --input merged/current_candidates.jsonl --out wide_read_packets --packet-size 250
      - uses: actions/upload-artifact@v4
        with:
          name: supergreen-wide-read-${{ github.run_id }}
          path: |
            merged/
            wide_read_packets/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
      - name: Delete discovery handoff artifacts after consolidation
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.workflow_run.id == (env.GITHUB_RUN_ID | tonumber)) | [.id,.name] | @tsv' > /tmp/current.tsv
          while IFS=$'\t' read -r id name; do
            case "$name" in
              discovery-${GITHUB_RUN_ID}-*)
                gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" >/dev/null
                ;;
            esac
          done < /tmp/current.tsv
