name: SuperGreen Discovery V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'control/global_discovery_trigger.txt'

permissions:
  contents: write

jobs:
  init-release:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs: {release_tag: '${{ steps.release.outputs.tag }}'}
    steps:
      - id: release
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          tag="discovery-harvest-${GITHUB_RUN_ID}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Discovery Harvest ${GITHUB_RUN_ID}" --notes "Canonical durable discovery harvest. Source datasets and consolidated wide-read outputs are persisted as Release assets; Actions artifacts are not canonical. Coverage status is measured explicitly and PARTIAL_WORLD_COVERAGE must never be represented as exhaustive worldwide coverage."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  ted-discovery:
    needs: init-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests
      - name: Enumerate complete recent TED competition window without keyword prefilter
        env: {TED_SCOPE: ACTIVE, TED_MAX_PAGES: '80', TED_LOOKBACK_DAYS: '10', TED_REQUEST_RETRIES: '7', TED_PAGE_DELAY_SECONDS: '0.25'}
        run: python pipeline/discover_ted.py
      - name: Persist TED discovery durably BEFORE completeness validation
        env: {GH_TOKEN: '${{ github.token }}', RELEASE_TAG: '${{ needs.init-release.outputs.release_tag }}'}
        shell: bash
        run: |
          set -euo pipefail
          tar -C discovery/ted -czf discovery-ted.tar.gz .
          gh release upload "$RELEASE_TAG" discovery-ted.tar.gz --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq discovery-ted.tar.gz
      - name: Verify TED coverage integrity
        run: |
          python - <<'PY'
          import json
          s=json.load(open('discovery/ted/stats.json'));print(json.dumps(s,indent=2))
          assert not s.get('errors'),s
          assert not s.get('truncated_by_page_cap'),s
          if s.get('total_reported') is not None: assert s.get('source_items_seen',0)>=s['total_reported'],s
          PY

  contracts-finder-discovery:
    needs: init-release
    name: cf-window-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy: {fail-fast: false, max-parallel: 8, matrix: {shard: [0,1,2,3,4,5,6,7]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests
      - name: Enumerate recent Contracts Finder window only
        env: {DISCOVERY_OUT: 'discovery/contracts_finder/shard-${{ matrix.shard }}', CF_WINDOW_INDEX: '${{ matrix.shard }}', CF_WINDOW_TOTAL: '8', LOOKBACK_DAYS: '30', CF_REQUEST_RETRIES: '4', CF_403_COOLDOWN_SECONDS: '300'}
        run: python pipeline/discover_contracts_finder.py
      - name: Persist Contracts Finder shard durably
        env: {GH_TOKEN: '${{ github.token }}', RELEASE_TAG: '${{ needs.init-release.outputs.release_tag }}'}
        run: |
          archive="discovery-contracts-finder-${{ matrix.shard }}.tar.gz";tar -C "discovery/contracts_finder/shard-${{ matrix.shard }}" -czf "$archive" .;gh release upload "$RELEASE_TAG" "$archive" --clobber

  etenders-ireland:
    needs: init-release
    name: ie-pages-${{ matrix.start }}-${{ matrix.end }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {shard: 0, start: 1, end: 5}
          - {shard: 1, start: 6, end: 10}
          - {shard: 2, start: 11, end: 15}
          - {shard: 3, start: 16, end: 20}
          - {shard: 4, start: 21, end: 25}
          - {shard: 5, start: 26, end: 30}
          - {shard: 6, start: 31, end: 35}
          - {shard: 7, start: 36, end: 40}
          - {shard: 8, start: 41, end: 45}
          - {shard: 9, start: 46, end: 50}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q 'playwright>=1.46,<2' beautifulsoup4
      - name: Reuse runner Chrome
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)";if [ -n "$chrome" ]; then echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"; else python -m playwright install --with-deps chromium; fi
      - name: Enumerate independent eTenders page shard
        env: {DISCOVERY_OUT: 'discovery/ireland/shard-${{ matrix.shard }}', PAGE_START: '${{ matrix.start }}', PAGE_END: '${{ matrix.end }}', IE_PAGE_CONCURRENCY: '1'}
        run: python pipeline/discover_etenders_ie_async.py
      - name: Persist Ireland shard durably
        env: {GH_TOKEN: '${{ github.token }}', RELEASE_TAG: '${{ needs.init-release.outputs.release_tag }}'}
        run: |
          archive="discovery-ie-${{ matrix.shard }}.tar.gz";tar -C "discovery/ireland/shard-${{ matrix.shard }}" -czf "$archive" .;gh release upload "$RELEASE_TAG" "$archive" --clobber

  global-official-discovery:
    needs: init-release
    name: official-${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        source: [CA_CANADABUYS, FR_BOAMP, QC_SEAO, AU_AUSTENDER, NZ_GETS, DE_DOE, ES_PLACSP, US_SAM_BULK, NL_TENDERNED_RSS, GR_KHMDHS, PL_BZP, LV_IUB, CH_SIMAP, NO_DOFFIN, IT_ANAC_DELTA]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests beautifulsoup4 playwright
      - name: Syntax gate
        run: python -m py_compile pipeline/discover_*.py pipeline/dce_worker_v4.py
      - name: Harvest official national source
        env: {GLOBAL_SOURCE: '${{ matrix.source }}', DISCOVERY_OUT: 'discovery/global/${{ matrix.source }}', LOOKBACK_DAYS: '14'}
        shell: bash
        run: |
          set +e
          case '${{ matrix.source }}' in
            QC_SEAO) python pipeline/discover_qc_seao_latest.py ;;
            DE_DOE) python pipeline/discover_de_doe_csv.py ;;
            AU_AUSTENDER) python pipeline/discover_austender_browser.py ;;
            ES_PLACSP) python pipeline/discover_es_placsp_atom.py ;;
            US_SAM_BULK) python pipeline/discover_us_sam_bulk.py ;;
            NL_TENDERNED_RSS) python pipeline/discover_nl_tenderned_rss.py ;;
            GR_KHMDHS) python pipeline/discover_gr_khmdhs.py ;;
            PL_BZP) python pipeline/discover_pl_bzp.py ;;
            LV_IUB) python pipeline/discover_lv_iub.py ;;
            CH_SIMAP) python pipeline/discover_ch_simap.py ;;
            NO_DOFFIN) python pipeline/discover_no_doffin.py ;;
            IT_ANAC_DELTA) python pipeline/discover_it_anac_delta.py ;;
            *) python pipeline/discover_global_official.py ;;
          esac
          rc=$?;echo "source_exit_code=$rc"
          test -f "discovery/global/${{ matrix.source }}/stats.json" || exit "$rc"
          exit 0
      - name: Persist official source durably
        env: {GH_TOKEN: '${{ github.token }}', RELEASE_TAG: '${{ needs.init-release.outputs.release_tag }}'}
        run: |
          set -euo pipefail
          slug="$(echo '${{ matrix.source }}' | tr '[:upper:]' '[:lower:]' | tr '_' '-')";archive="discovery-global-${slug}.tar.gz";tar -C "discovery/global/${{ matrix.source }}" -czf "$archive" .;gh release upload "$RELEASE_TAG" "$archive" --clobber

  wide-read-pack:
    needs: [init-release, ted-discovery, contracts-finder-discovery, etenders-ireland, global-official-discovery]
    if: always() && needs.init-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download durable discovery source packs
        env: {GH_TOKEN: '${{ github.token }}', RELEASE_TAG: '${{ needs.init-release.outputs.release_tag }}'}
        run: |
          set -euo pipefail
          mkdir -p release-download discovery-download;gh release download "$RELEASE_TAG" --pattern 'discovery-*.tar.gz' --dir release-download
          count=0;for archive in release-download/discovery-*.tar.gz; do [ -e "$archive" ] || continue;base="$(basename "$archive" .tar.gz)";mkdir -p "discovery-download/$base";tar -xzf "$archive" -C "discovery-download/$base";count=$((count + 1));done
          echo "source_packs=$count";[ "$count" -ge 2 ]
      - name: Measure configured world-source coverage before claiming worldwide scope
        run: python pipeline/source_coverage_guard.py --root discovery-download --out merged/source_coverage.json
      - name: Canonical merge and dedupe
        run: python pipeline/merge_discovery.py --root discovery-download --out merged
      - name: Build mandatory GPT wide-read packets
        run: python pipeline/wide_read_packets.py --input merged/current_candidates.jsonl --out wide_read_packets --packet-size 250
      - name: Publish coverage truth to job summary
        shell: bash
        run: |
          echo '### Source coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat merged/source_coverage.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Persist consolidated discovery durably
        env: {GH_TOKEN: '${{ github.token }}', RELEASE_TAG: '${{ needs.init-release.outputs.release_tag }}'}
        run: |
          set -euo pipefail
          tar -czf "supergreen-wide-read-${GITHUB_RUN_ID}.tar.gz" merged wide_read_packets
          cp merged/stats.json "discovery-summary-${GITHUB_RUN_ID}.json"
          cp merged/source_coverage.json "discovery-coverage-${GITHUB_RUN_ID}.json"
          gh release upload "$RELEASE_TAG" "supergreen-wide-read-${GITHUB_RUN_ID}.tar.gz" "discovery-summary-${GITHUB_RUN_ID}.json" "discovery-coverage-${GITHUB_RUN_ID}.json" --clobber
