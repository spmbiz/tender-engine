name: SuperGreen Discovery V2

on:
  workflow_dispatch:

concurrency:
  group: supergreen-discovery-v2
  cancel-in-progress: true

jobs:
  api-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Enumerate TED and Contracts Finder concurrently without keyword prefilter
        shell: bash
        run: |
          set +e
          TED_SCOPE=ACTIVE TED_MAX_PAGES=24 python pipeline/discover_ted.py > ted.log 2>&1 &
          p1=$!
          python pipeline/discover_contracts_finder.py > contracts_finder.log 2>&1 &
          p2=$!
          wait $p1; s1=$?
          wait $p2; s2=$?
          echo '--- TED ---'; cat ted.log
          echo '--- Contracts Finder ---'; cat contracts_finder.log
          if [ $s1 -ne 0 ] || [ $s2 -ne 0 ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-api
          path: |
            discovery/ted/
            discovery/contracts_finder/
            ted.log
            contracts_finder.log
          if-no-files-found: error
          retention-days: 7

  etenders-ireland:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'playwright>=1.46,<2' beautifulsoup4
      - name: Reuse runner Chrome or install Playwright Chromium as fallback
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$chrome" ]; then
            echo "Using preinstalled browser: $chrome"
            echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          else
            echo "No compatible system browser found; installing Playwright Chromium"
            python -m playwright install --with-deps chromium
          fi
      - name: Enumerate 50 eTenders pages with one warm Chromium
        env:
          PAGE_START: 1
          PAGE_END: 50
          IE_PAGE_CONCURRENCY: 6
        run: python pipeline/discover_etenders_ie_async.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-ie
          path: discovery/ireland/
          if-no-files-found: error
          retention-days: 7

  wide-read-pack:
    needs: [api-discovery, etenders-ireland]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: discovery-*
          path: discovery-download
          merge-multiple: true
      - name: Canonical merge and dedupe
        run: python pipeline/merge_discovery.py --root discovery-download --out merged
      - name: Build mandatory GPT wide-read packets
        run: python pipeline/wide_read_packets.py --input merged/current_candidates.jsonl --out wide_read_packets --packet-size 250
      - uses: actions/upload-artifact@v4
        with:
          name: supergreen-wide-read-${{ github.run_id }}
          path: |
            merged/
            wide_read_packets/
          if-no-files-found: error
          retention-days: 7
