name: SuperGreen Discovery V2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'delta = frequent short-window harvest; reconcile = deep completeness window'
        required: false
        default: delta
        type: choice
        options: [delta, reconcile]
  schedule:
    - cron: '17 2 * * *'
  push:
    branches: [main]
    paths:
      - 'control/global_discovery_trigger.txt'

permissions:
  contents: write

jobs:
  init-release:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      mode: ${{ steps.release.outputs.mode }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = 'schedule' ]; then
            mode='reconcile'
          elif [ "${INPUT_MODE:-}" = 'reconcile' ]; then
            mode='reconcile'
          else
            mode='delta'
          fi
          tag="discovery-harvest-${GITHUB_RUN_ID}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Discovery Harvest ${GITHUB_RUN_ID} [$mode]" \
            --notes "Canonical durable discovery harvest. mode=$mode. DELTA uses bounded recent windows for hourly freshness; RECONCILE runs daily with deep windows to catch late/index-shifted publications. Coverage status is measured explicitly and PARTIAL_WORLD_COVERAGE must never be represented as exhaustive worldwide coverage."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  ted-discovery:
    needs: init-release
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests
      - name: Enumerate complete TED ACTIVE registry
        timeout-minutes: 55
        env:
          DISCOVERY_MODE: ${{ needs.init-release.outputs.mode }}
          TED_SCOPE: ACTIVE
          TED_MAX_PAGES: '80'
          TED_REQUEST_RETRIES: '7'
          TED_PAGE_DELAY_SECONDS: '0.05'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DISCOVERY_MODE" = reconcile ]; then export TED_LOOKBACK_DAYS=10; else export TED_LOOKBACK_DAYS=3; fi
          echo "TED mode=$DISCOVERY_MODE ACTIVE scope; publication lookback is ignored by FULL_ACTIVE"
          python pipeline/discover_ted.py
      - name: Persist TED discovery durably BEFORE completeness validation
        if: always()
        env: {GH_TOKEN: '${{ github.token }}', RELEASE_TAG: '${{ needs.init-release.outputs.release_tag }}'}
        shell: bash
        run: |
          set -euo pipefail
          test -s discovery/ted/stats.json
          test -f discovery/ted/current.jsonl
          tar -C discovery/ted -czf discovery-ted.tar.gz .
          gh release upload "$RELEASE_TAG" discovery-ted.tar.gz --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq discovery-ted.tar.gz
      - name: Verify TED coverage integrity
        if: always()
        run: |
          python - <<'PY'
          import json
          s=json.load(open('discovery/ted/stats.json'));print(json.dumps(s,indent=2))
          assert not s.get('errors'),s
          assert not s.get('truncated_by_page_cap'),s
          assert s.get('enumeration_complete') is True,s
          if s.get('total_reported') is not None: assert s.get('source_items_seen',0)>=s['total_reported'],s
          PY

  contracts-finder-discovery:
    needs: init-release
    name: cf-window-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy: {fail-fast: false, max-parallel: 8, matrix: {shard: [0,1,2,3,4,5,6,7]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests
      - name: Enumerate Contracts Finder with delta/reconcile window
        env:
          DISCOVERY_MODE: ${{ needs.init-release.outputs.mode }}
          DISCOVERY_OUT: discovery/contracts_finder/shard-${{ matrix.shard }}
          CF_WINDOW_INDEX: ${{ matrix.shard }}
          CF_WINDOW_TOTAL: '8'
          CF_REQUEST_RETRIES: '4'
          CF_403_COOLDOWN_SECONDS: '300'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DISCOVERY_MODE" = reconcile ]; then export LOOKBACK_DAYS=30; else export LOOKBACK_DAYS=5; fi
          python pipeline/discover_contracts_finder.py
      - name: Persist Contracts Finder shard durably
        env: {GH_TOKEN: '${{ github.token }}', RELEASE_TAG: '${{ needs.init-release.outputs.release_tag }}'}
        run: |
          archive="discovery-contracts-finder-${{ matrix.shard }}.tar.gz";tar -C "discovery/contracts_finder/shard-${{ matrix.shard }}" -czf "$archive" .;gh release upload "$RELEASE_TAG" "$archive" --clobber

  etenders-ireland-delta:
    needs: init-release
    if: needs.init-release.outputs.mode == 'delta'
    name: ie-delta-pages-${{ matrix.start }}-${{ matrix.end }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {shard: 0, start: 1, end: 5}
          - {shard: 1, start: 6, end: 10}
          - {shard: 2, start: 11, end: 15}
          - {shard: 3, start: 16, end: 20}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q 'playwright>=1.46,<2' beautifulsoup4
      - name: Reuse runner Chrome
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)";if [ -n "$chrome" ]; then echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"; else python -m playwright install --with-deps chromium; fi
      - name: Enumerate independent eTenders delta page shard
        env: {DISCOVERY_OUT: 'discovery/ireland/shard-${{ matrix.shard }}', PAGE_START: '${{ matrix.start }}', PAGE_END: '${{ matrix.end }}', IE_PAGE_CONCURRENCY: '1'}
        run: python pipeline/discover_etenders_ie_async.py
      - name: Persist Ireland delta shard durably
        env: {GH_TOKEN: '${{ github.token }}', RELEASE_TAG: '${{ needs.init-release.outputs.release_tag }}'}
        run: |
          archive="discovery-ie-${{ matrix.shard }}.tar.gz";tar -C "discovery/ireland/shard-${{ matrix.shard }}" -czf "$archive" .;gh release upload "$RELEASE_TAG" "$archive" --clobber

  etenders-ireland-reconcile:
    needs: init-release
    if: needs.init-release.outputs.mode == 'reconcile'
    name: ie-reconcile-pages-${{ matrix.start }}-${{ matrix.end }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {shard: 0, start: 1, end: 5}
          - {shard: 1, start: 6, end: 10}
          - {shard: 2, start: 11, end: 15}
          - {shard: 3, start: 16, end: 20}
          - {shard: 4, start: 21, end: 25}
          - {shard: 5, start: 26, end: 30}
          - {shard: 6, start: 31, end: 35}
          - {shard: 7, start: 36, end: 40}
          - {shard: 8, start: 41, end: 45}
          - {shard: 9, start: 46, end: 50}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q 'playwright>=1.46,<2' beautifulsoup4
      - name: Reuse runner Chrome
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)";if [ -n "$chrome" ]; then echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"; else python -m playwright install --with-deps chromium; fi
      - name: Enumerate independent eTenders reconcile page shard
        env: {DISCOVERY_OUT: 'discovery/ireland/shard-${{ matrix.shard }}', PAGE_START: '${{ matrix.start }}', PAGE_END: '${{ matrix.end }}', IE_PAGE_CONCURRENCY: '1'}
        run: python pipeline/discover_etenders_ie_async.py
      - name: Persist Ireland reconcile shard durably
        env: {GH_TOKEN: '${{ github.token }}', RELEASE_TAG: '${{ needs.init-release.outputs.release_tag }}'}
        run: |
          archive="discovery-ie-${{ matrix.shard }}.tar.gz";tar -C "discovery/ireland/shard-${{ matrix.shard }}" -czf "$archive" .;gh release upload "$RELEASE_TAG" "$archive" --clobber

  epps-national-discovery:
    needs: init-release
    name: official-${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {source: CYPRUS_EPPS, base: 'https://www.eprocurement.gov.cy', prefix: 'CY-EPPS', tz: 'Asia/Nicosia'}
          - {source: MALTA_EPPS, base: 'https://www.etenders.gov.mt', prefix: 'MT-EPPS', tz: 'Europe/Malta'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests beautifulsoup4
      - name: Enumerate public ePPS live registry with Published Notices recall fallback
        env:
          EPPS_SOURCE: ${{ matrix.source }}
          EPPS_BASE_URL: ${{ matrix.base }}
          EPPS_ID_PREFIX: ${{ matrix.prefix }}
          EPPS_TIMEZONE: ${{ matrix.tz }}
          DISCOVERY_OUT: discovery/global/${{ matrix.source }}
          DISCOVERY_MODE: ${{ needs.init-release.outputs.mode }}
        shell: bash
        run: |
          set +e
          if [ "$DISCOVERY_MODE" = reconcile ]; then export PAGE_END=20; else export PAGE_END=5; fi
          python pipeline/discover_epps_public.py
          primary_rc=$?
          if [ "$primary_rc" -ne 0 ]; then
            echo "ePPS current registry incomplete rc=$primary_rc; invoking official Published Notices recall fallback"
            if [ "$DISCOVERY_MODE" = reconcile ]; then
              export EPPS_PUBLISHED_LOOKBACK_DAYS=730 EPPS_PUBLISHED_MAX_PAGES=400
            else
              export EPPS_PUBLISHED_LOOKBACK_DAYS=240 EPPS_PUBLISHED_MAX_PAGES=160
            fi
            python pipeline/discover_epps_published_fallback.py
            fallback_rc=$?
            test -s "discovery/global/${{ matrix.source }}/current.jsonl"
            exit $fallback_rc
          fi
          exit 0
      - name: Persist ePPS source durably
        if: always()
        env: {GH_TOKEN: '${{ github.token }}', RELEASE_TAG: '${{ needs.init-release.outputs.release_tag }}'}
        run: |
          set -euo pipefail
          slug="$(echo '${{ matrix.source }}' | tr '[:upper:]' '[:lower:]' | tr '_' '-')"
          archive="discovery-global-${slug}.tar.gz"
          test -d "discovery/global/${{ matrix.source }}"
          tar -C "discovery/global/${{ matrix.source }}" -czf "$archive" .
          gh release upload "$RELEASE_TAG" "$archive" --clobber

  lux-pmp-discovery:
    needs: init-release
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests beautifulsoup4
      - name: Enumerate Luxembourg current opportunities
        env:
          DISCOVERY_OUT: discovery/global/LUX_PMP
          DISCOVERY_MODE: ${{ needs.init-release.outputs.mode }}
        run: python pipeline/discover_lux_pmp.py
      - name: Persist Luxembourg source durably
        env: {GH_TOKEN: '${{ github.token }}', RELEASE_TAG: '${{ needs.init-release.outputs.release_tag }}'}
        run: |
          tar -C discovery/global/LUX_PMP -czf discovery-global-lux-pmp.tar.gz .
          gh release upload "$RELEASE_TAG" discovery-global-lux-pmp.tar.gz --clobber

  global-official-discovery:
    needs: init-release
    name: official-${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        source: [CA_CANADABUYS, FR_BOAMP, QC_SEAO, AU_AUSTENDER, NZ_GETS, DE_DOE, ES_PLACSP, US_SAM_BULK, NL_TENDERNED_RSS, GR_KHMDHS, PL_BZP, LV_IUB, CH_SIMAP, NO_DOFFIN, FI_HILMA, PT_BASE_OPEN, DK_UDBUD_PUBLIC, CZ_ZAKAZKY_GOV, IT_ANAC_DELTA, SI_EJN, SK_UVO, EE_RHR, WORLD_BANK_PROCUREMENT, ZA_ETENDERS_OCDS, UK_PCS_OCDS, UK_FTS_OCDS, LT_CVP_API, UNGM_PUBLIC]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests beautifulsoup4 playwright
      - name: Reuse runner Chrome for browser-backed national lanes
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$chrome" ]; then echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"; else python -m playwright install --with-deps chromium; fi
      - name: Syntax gate
        run: python -m py_compile pipeline/discover_*.py pipeline/dce_worker_v6.py
      - name: Harvest official national source with delta/reconcile window
        env:
          DISCOVERY_MODE: ${{ needs.init-release.outputs.mode }}
          GLOBAL_SOURCE: ${{ matrix.source }}
          DISCOVERY_OUT: discovery/global/${{ matrix.source }}
        shell: bash
        run: |
          set +e
          if [ "$DISCOVERY_MODE" = reconcile ]; then export LOOKBACK_DAYS=14; else export LOOKBACK_DAYS=3; fi
          case '${{ matrix.source }}' in
            QC_SEAO) python pipeline/discover_qc_seao_latest.py ;;
            DE_DOE) python pipeline/discover_de_doe_csv.py ;;
            AU_AUSTENDER) python pipeline/discover_austender_browser.py ;;
            ES_PLACSP) python pipeline/discover_es_placsp_atom.py ;;
            US_SAM_BULK) python pipeline/discover_us_sam_bulk.py ;;
            NL_TENDERNED_RSS) python pipeline/discover_nl_tenderned_rss.py ;;
            GR_KHMDHS) python pipeline/discover_gr_khmdhs.py ;;
            PL_BZP) python pipeline/discover_pl_bzp.py ;;
            LV_IUB) python pipeline/discover_lv_iub.py ;;
            CH_SIMAP) python pipeline/discover_ch_simap.py ;;
            NO_DOFFIN) python pipeline/discover_no_doffin.py ;;
            FI_HILMA) python pipeline/discover_fi_hilma_public.py ;;
            PT_BASE_OPEN) python pipeline/discover_pt_base_open.py ;;
            DK_UDBUD_PUBLIC) python pipeline/discover_dk_udbud_public.py ;;
            CZ_ZAKAZKY_GOV) python pipeline/discover_cz_zakazky_public.py ;;
            IT_ANAC_DELTA) if [ "$DISCOVERY_MODE" = reconcile ]; then export ANAC_PVL_LOOKBACK_DAYS=1095; else export ANAC_PVL_LOOKBACK_DAYS=730; fi; python pipeline/discover_it_anac_pvl.py ;;
            SI_EJN) python pipeline/discover_si_ejn_browser.py ;;
            SK_UVO) python pipeline/discover_sk_uvo.py ;;
            EE_RHR) if [ "$DISCOVERY_MODE" = reconcile ]; then months=3; else months=2; fi; python pipeline/discover_ee_rhr.py --output "$DISCOVERY_OUT" --months "$months" ;;
            WORLD_BANK_PROCUREMENT) if [ "$DISCOVERY_MODE" = reconcile ]; then pages=80; else pages=20; fi; python pipeline/discover_worldbank_procurement.py --output "$DISCOVERY_OUT" --max-pages "$pages" --page-size 100 ;;
            ZA_ETENDERS_OCDS) if [ "$DISCOVERY_MODE" = reconcile ]; then days=365; pages=80; else days=90; pages=20; fi; python pipeline/discover_za_etenders_ocds.py --output "$DISCOVERY_OUT" --lookback-days "$days" --page-size 100 --max-pages "$pages" ;;
            UK_PCS_OCDS) python pipeline/discover_uk_pcs_current.py ;;
            UK_FTS_OCDS) if [ "$DISCOVERY_MODE" = reconcile ]; then days=30; pages=150; else days=5; pages=80; fi; python pipeline/discover_uk_fts_ocds.py --output "$DISCOVERY_OUT" --lookback-days "$days" --max-pages "$pages" --page-size 100 ;;
            LT_CVP_API) python -m pip install --disable-pip-version-check -q brotli; if [ "$DISCOVERY_MODE" = reconcile ]; then pages=200; else pages=40; fi; python pipeline/discover_lt_cvp_api.py --output "$DISCOVERY_OUT" --page-size 250 --max-pages "$pages" ;;
            UNGM_PUBLIC) python pipeline/discover_ungm_public.py ;;
            *) python pipeline/discover_global_official.py ;;
          esac
          rc=$?;echo "source_exit_code=$rc"
          mkdir -p "discovery/global/${{ matrix.source }}"
          echo "$rc" > "discovery/global/${{ matrix.source }}/adapter_exit_code.txt"
          test -f "discovery/global/${{ matrix.source }}/stats.json" || exit "$rc"
          exit 0
      - name: Persist official source durably
        env: {GH_TOKEN: '${{ github.token }}', RELEASE_TAG: '${{ needs.init-release.outputs.release_tag }}'}
        run: |
          set -euo pipefail
          slug="$(echo '${{ matrix.source }}' | tr '[:upper:]' '[:lower:]' | tr '_' '-')";archive="discovery-global-${slug}.tar.gz";tar -C "discovery/global/${{ matrix.source }}" -czf "$archive" .;gh release upload "$RELEASE_TAG" "$archive" --clobber

  wide-read-pack:
    needs: [init-release, ted-discovery, contracts-finder-discovery, etenders-ireland-delta, etenders-ireland-reconcile, epps-national-discovery, lux-pmp-discovery, global-official-discovery]
    if: always() && needs.init-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download durable discovery source packs
        env: {GH_TOKEN: '${{ github.token }}', RELEASE_TAG: '${{ needs.init-release.outputs.release_tag }}'}
        run: |
          set -euo pipefail
          mkdir -p release-download discovery-download;gh release download "$RELEASE_TAG" --pattern 'discovery-*.tar.gz' --dir release-download
          count=0;for archive in release-download/discovery-*.tar.gz; do [ -e "$archive" ] || continue;base="$(basename "$archive" .tar.gz)";mkdir -p "discovery-download/$base";tar -xzf "$archive" -C "discovery-download/$base";count=$((count + 1));done
          echo "source_packs=$count";[ "$count" -ge 2 ]
      - name: Measure configured world-source coverage before claiming worldwide scope
        env: {DISCOVERY_MODE: '${{ needs.init-release.outputs.mode }}'}
        run: python pipeline/source_coverage_guard.py --root discovery-download --out merged/source_coverage.json --mode "$DISCOVERY_MODE"
      - name: Canonical merge and dedupe
        run: python pipeline/merge_discovery.py --root discovery-download --out merged
      - name: Build mandatory GPT wide-read packets
        run: python pipeline/wide_read_packets.py --input merged/current_candidates.jsonl --out wide_read_packets --packet-size 250
      - name: Stamp discovery mode into canonical harvest
        env: {DISCOVERY_MODE: '${{ needs.init-release.outputs.mode }}'}
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          p='merged/stats.json';x=json.load(open(p));x['discovery_mode']=os.environ['DISCOVERY_MODE'];open(p,'w').write(json.dumps(x,indent=2))
          PY
      - name: Publish coverage truth to job summary
        shell: bash
        run: |
          echo "### Discovery mode: ${{ needs.init-release.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo '### Source coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat merged/source_coverage.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Persist consolidated discovery durably
        env: {GH_TOKEN: '${{ github.token }}', RELEASE_TAG: '${{ needs.init-release.outputs.release_tag }}'}
        run: |
          set -euo pipefail
          tar -czf "supergreen-wide-read-${GITHUB_RUN_ID}.tar.gz" merged wide_read_packets
          cp merged/stats.json "discovery-summary-${GITHUB_RUN_ID}.json"
          cp merged/source_coverage.json "discovery-coverage-${GITHUB_RUN_ID}.json"
          gh release upload "$RELEASE_TAG" "supergreen-wide-read-${GITHUB_RUN_ID}.tar.gz" "discovery-summary-${GITHUB_RUN_ID}.json" "discovery-coverage-${GITHUB_RUN_ID}.json" --clobber
