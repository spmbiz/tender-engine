name: Global Official Source Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'control/global_official_test.txt'

permissions:
  contents: read

jobs:
  source:
    name: ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        source: [CA_CANADABUYS, FR_BOAMP, QC_SEAO, AU_AUSTENDER, NZ_GETS, DE_DOE, ES_PLACSP, US_SAM_BULK, NL_TENDERNED_RSS, GR_KHMDHS, PL_BZP, LV_IUB, CH_SIMAP, NO_DOFFIN, FI_HILMA, BE_EPROC_PUBLIC, PT_BASE_OPEN, AT_DATAGV, DK_UDBUD_PUBLIC, CZ_ZAKAZKY_GOV, IT_ANAC_DELTA, IT_ANAC_OCDS_BULK]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests beautifulsoup4 playwright
      - name: Syntax gate
        run: python -m py_compile pipeline/discover_*.py pipeline/probe_*.py pipeline/dce_worker_v5.py
      - name: Run source probe
        env: {GLOBAL_SOURCE: '${{ matrix.source }}', DISCOVERY_OUT: 'discovery/global/${{ matrix.source }}', LOOKBACK_DAYS: '14'}
        shell: bash
        run: |
          set +e
          case '${{ matrix.source }}' in
            QC_SEAO) python pipeline/discover_qc_seao_latest.py ;;
            DE_DOE) python pipeline/discover_de_doe_csv.py ;;
            AU_AUSTENDER) python pipeline/discover_austender_browser.py ;;
            ES_PLACSP) python pipeline/discover_es_placsp_atom.py ;;
            US_SAM_BULK) python pipeline/discover_us_sam_bulk.py ;;
            NL_TENDERNED_RSS) python pipeline/discover_nl_tenderned_rss.py ;;
            GR_KHMDHS) python pipeline/discover_gr_khmdhs.py ;;
            PL_BZP) python pipeline/discover_pl_bzp.py ;;
            LV_IUB) python pipeline/discover_lv_iub.py ;;
            CH_SIMAP) python pipeline/discover_ch_simap.py ;;
            NO_DOFFIN) python pipeline/discover_no_doffin.py ;;
            FI_HILMA) python pipeline/discover_fi_hilma_public.py ;;
            BE_EPROC_PUBLIC) python pipeline/discover_be_eproc_public.py ;;
            PT_BASE_OPEN) python pipeline/discover_pt_base_open.py ;;
            AT_DATAGV) python pipeline/discover_at_datagv.py ;;
            DK_UDBUD_PUBLIC) python pipeline/probe_dk_udbud_public.py ;;
            CZ_ZAKAZKY_GOV) python pipeline/probe_cz_zakazky_public.py ;;
            IT_ANAC_DELTA) python pipeline/discover_it_anac_delta.py ;;
            IT_ANAC_OCDS_BULK) python pipeline/discover_it_anac_ocds_bulk.py ;;
            *) python pipeline/discover_global_official.py ;;
          esac
          rc=$?
          stats="discovery/global/${{ matrix.source }}/stats.json"
          echo "adapter_exit_code=$rc"
          cat "$stats" || true
          echo sample_current:
          head -n 2 "discovery/global/${{ matrix.source }}/current.jsonl" || true
          if [ ! -f "$stats" ]; then
            echo "missing stats.json"
            [ "$rc" -ne 0 ] && exit "$rc"
            exit 2
          fi
          python - "$stats" <<'PY'
          import json, sys
          s=json.load(open(sys.argv[1], encoding='utf-8'))
          if s.get('errors') or s.get('error'):
              print('source stats report errors', json.dumps(s.get('errors') or s.get('error'), ensure_ascii=False))
              raise SystemExit(3)
          PY
          exit "$rc"
