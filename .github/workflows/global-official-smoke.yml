name: Global Official Source Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'control/global_official_test.txt'

permissions:
  contents: read

jobs:
  source:
    name: ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        source: [CA_CANADABUYS, FR_BOAMP, QC_SEAO, AU_AUSTENDER, NZ_GETS, DE_DOE]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q requests beautifulsoup4 playwright
      - name: Reuse runner Chrome for AusTender browser fallback
        if: matrix.source == 'AU_AUSTENDER'
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$chrome" ]; then echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"; else python -m playwright install --with-deps chromium; fi
      - name: Run source probe
        env:
          GLOBAL_SOURCE: ${{ matrix.source }}
          DISCOVERY_OUT: discovery/global/${{ matrix.source }}
          LOOKBACK_DAYS: '14'
        shell: bash
        run: |
          set +e
          case '${{ matrix.source }}' in
            QC_SEAO) python pipeline/discover_qc_seao_latest.py ;;
            DE_DOE) python pipeline/discover_de_doe_csv.py ;;
            AU_AUSTENDER) python pipeline/discover_austender_browser.py ;;
            *) python pipeline/discover_global_official.py ;;
          esac
          rc=$?
          echo "adapter_exit_code=$rc"
          cat "discovery/global/${{ matrix.source }}/stats.json" || true
          exit 0
