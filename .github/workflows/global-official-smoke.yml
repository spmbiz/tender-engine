name: Global Official Source Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'control/global_official_test.txt'

permissions:
  contents: read

jobs:
  source:
    name: ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        source: [CA_CANADABUYS, FR_BOAMP, QC_SEAO, AU_AUSTENDER, NZ_GETS, DE_DOE]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q requests beautifulsoup4
      - name: Run source probe
        env:
          GLOBAL_SOURCE: ${{ matrix.source }}
          DISCOVERY_OUT: discovery/global/${{ matrix.source }}
          LOOKBACK_DAYS: '14'
        shell: bash
        run: |
          set +e
          python pipeline/discover_global_official.py
          rc=$?
          echo "adapter_exit_code=$rc"
          cat "discovery/global/${{ matrix.source }}/stats.json"
          exit 0
