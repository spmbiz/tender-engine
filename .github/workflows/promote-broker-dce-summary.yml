name: Promote Broker DCE Aggregate Summary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-broker-dce-summary.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Download broker DCE aggregate summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p control/broker_resell_latest/dce
          gh release download dce-harvest-31899175067 --repo "$GITHUB_REPOSITORY" \
            --pattern dce-summary-31899175067.json --dir control/broker_resell_latest/dce --clobber
          gh release download dce-harvest-31899175067 --repo "$GITHUB_REPOSITORY" \
            --pattern dce-candidate-queue-31899175067.jsonl --dir control/broker_resell_latest/dce --clobber
          gh release download dce-harvest-31899175067 --repo "$GITHUB_REPOSITORY" \
            --pattern dce-canonical-packs-manifest.json --dir control/broker_resell_latest/dce --clobber
      - name: Build readable broker DCE review
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('control/broker_resell_latest/dce')
          s=json.load(open(root/'dce-summary-31899175067.json',encoding='utf-8'))
          (root/'SUMMARY_PRETTY.json').write_text(json.dumps(s,ensure_ascii=False,indent=2),encoding='utf-8')
          lines=['# Broker DCE aggregate — run 31899175067','',
                 'This summary is downstream of title-anchored broker candidate selection and DCE evidence-quality classification. Transport success alone is not a DCE eligibility pass.','',
                 '```json',json.dumps(s,ensure_ascii=False,indent=2),'```','']
          (root/'REPORT.md').write_text('\n'.join(lines),encoding='utf-8')
          PY
      - name: Persist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/broker_resell_latest/dce/
          git commit -m 'tenders: persist broker DCE aggregate summary' || exit 0
          for i in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
