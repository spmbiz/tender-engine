name: Qwen DCE Triage Fresh Validation Kick

on:
  push:
    paths:
      - '.github/workflows/qwen-dce-triage-kick.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch fresh triage validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run qwen-dce-triage.yml \
            -R "$GITHUB_REPOSITORY" \
            --ref main \
            -f dce_run_id=31991049660 \
            -f workers=4
