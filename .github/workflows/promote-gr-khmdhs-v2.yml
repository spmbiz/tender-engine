name: Promote Greece KIMDIS V3

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Greece KIMDIS Future Deadline Proof']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'control/gr_khmdhs_promote_trigger.txt'

permissions:
  contents: write

jobs:
  promote:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1, fetch-tags: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests pytest
      - name: Require passing live proof
        run: |
          python - <<'PY'
          import json
          proof=json.load(open('control/gr_khmdhs_live_proof.json'))
          assert proof.get('schema')=='GR_KHMDHS_FUTURE_DEADLINE_PROOF_V3',proof
          assert proof.get('pass') is True,proof
          assert proof.get('enumeration_complete') is True,proof
          PY
          python -m py_compile pipeline/discover_gr_khmdhs_v2.py pipeline/discover_gr_khmdhs_v3.py
          pytest -q tests/test_gr_khmdhs_v2.py
      - name: Route global Greece lane to proven V3 wrapper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/supergreen-discovery-v2.yml')
          s=p.read_text()
          candidates=[
              'GR_KHMDHS) python pipeline/discover_gr_khmdhs.py ;;',
              'GR_KHMDHS) export GR_FINAL_HORIZON_YEAR=2100; python pipeline/discover_gr_khmdhs_v2.py ;;',
              'GR_KHMDHS) export GR_FINAL_HORIZON_YEAR=2100 GR_WORKERS=1 GR_RETRIES=7 GR_MIN_REQUEST_INTERVAL_SECONDS=0.50; python pipeline/discover_gr_khmdhs_v2.py ;;',
          ]
          new='GR_KHMDHS) export GR_FINAL_HORIZON_YEAR=2100 GR_WORKERS=1 GR_RETRIES=7 GR_MIN_REQUEST_INTERVAL_SECONDS=0.50; python pipeline/discover_gr_khmdhs_v3.py ;;'
          if new not in s:
              for old in candidates:
                  if old in s:
                      s=s.replace(old,new,1)
                      p.write_text(s)
                      break
              else:
                  raise SystemExit('Greece route marker missing')
          PY
          grep -F 'GR_KHMDHS) export GR_FINAL_HORIZON_YEAR=2100 GR_WORKERS=1 GR_RETRIES=7 GR_MIN_REQUEST_INTERVAL_SECONDS=0.50; python pipeline/discover_gr_khmdhs_v3.py ;;' .github/workflows/supergreen-discovery-v2.yml
      - name: Commit promotion
        shell: bash
        run: |
          git diff --quiet -- .github/workflows/supergreen-discovery-v2.yml && exit 0
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add .github/workflows/supergreen-discovery-v2.yml
          git commit -m 'gr: promote proven KIMDIS V3 lane'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
