name: Promote Greece KIMDIS V2

on:
  push:
    branches: [main]
    paths:
      - 'control/gr_khmdhs_live_proof.json'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1, fetch-tags: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests pytest
      - name: Require passing live proof
        run: |
          python - <<'PY'
          import json
          proof=json.load(open('control/gr_khmdhs_live_proof.json'))
          assert proof.get('schema')=='GR_KHMDHS_FUTURE_DEADLINE_PROOF_V2',proof
          assert proof.get('pass') is True,proof
          assert proof.get('enumeration_complete') is True,proof
          PY
          pytest -q tests/test_gr_khmdhs_v2.py
      - name: Route global Greece lane to V2
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/supergreen-discovery-v2.yml')
          s=p.read_text()
          old='GR_KHMDHS) python pipeline/discover_gr_khmdhs.py ;;'
          new="GR_KHMDHS) export GR_FINAL_HORIZON_YEAR=2100; python pipeline/discover_gr_khmdhs_v2.py ;;"
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('Greece route marker missing')
          PY
          grep -F 'GR_KHMDHS) export GR_FINAL_HORIZON_YEAR=2100; python pipeline/discover_gr_khmdhs_v2.py ;;' .github/workflows/supergreen-discovery-v2.yml
      - name: Commit promotion
        shell: bash
        run: |
          git diff --quiet -- .github/workflows/supergreen-discovery-v2.yml && exit 0
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add .github/workflows/supergreen-discovery-v2.yml
          git commit -m 'gr: promote future-deadline KIMDIS lane after live proof'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
