name: Qwen Preempt Stale Run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qwen-preempt-stale.yml'

permissions:
  actions: write
  contents: read

jobs:
  preempt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel stale opaque Qwen run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STALE_RUN: '31922632641'
        shell: bash
        run: |
          set -euo pipefail
          echo "Cancelling stale Qwen run ${STALE_RUN}"
          code="$(curl -sS -o /tmp/cancel.out -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPO}/actions/runs/${STALE_RUN}/cancel")"
          cat /tmp/cancel.out || true
          if [[ "$code" != '202' && "$code" != '409' ]]; then
            echo "Unexpected cancel HTTP status: $code" >&2
            exit 1
          fi
          echo "Cancel request accepted/status=$code"

      - name: Confirm stale run stopped
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STALE_RUN: '31922632641'
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            state="$(curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${REPO}/actions/runs/${STALE_RUN}" | python -c 'import json,sys; d=json.load(sys.stdin); print((d.get("status") or "")+"|"+(d.get("conclusion") or ""))')"
            echo "stale_run=$state"
            if [[ "$state" == completed* ]]; then exit 0; fi
            sleep 3
          done
          echo 'Stale run did not stop inside guard window' >&2
          exit 1

      - name: Dispatch latest observable Qwen pass
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPO}/actions/workflows/qwen-live-classification.yml/dispatches" \
            -d '{"ref":"main","inputs":{"per_shard":"240","auto_continue":"true","dce_limit":"160"}}')"
          cat /tmp/dispatch.out || true
          [[ "$code" == '204' ]] || { echo "Dispatch failed HTTP $code" >&2; exit 1; }
          echo 'Latest observable Qwen pass dispatched.'
