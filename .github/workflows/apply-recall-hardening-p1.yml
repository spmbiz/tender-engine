name: Apply Recall Hardening P1

on:
  push:
    branches: [main]
    paths:
      - 'control/recall_hardening_p1_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-recall-hardening-p1
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -q pytest requests pyyaml
      - name: Apply exact anchored patch
        run: python tools/apply_recall_hardening_p1.py
      - name: Compile changed Python and validate YAML
        run: |
          python -m py_compile \
            pipeline/discover_ted.py \
            pipeline/build_live_world_snapshot.py \
            pipeline/qwen_notice_batch_selfheal_core.py \
            pipeline/qwen_notice_batch_selfheal_rich.py \
            pipeline/qwen_notice_batch_selfheal.py
          python - <<'PY'
          import yaml
          from pathlib import Path
          p=Path('.github/workflows/qwen-live-classification.yml')
          x=yaml.safe_load(p.read_text(encoding='utf-8'))
          assert isinstance(x,dict) and isinstance(x.get('jobs'),dict)
          print('qwen workflow YAML OK')
          PY
      - name: Run recall regression tests
        run: |
          python -m pytest -q \
            tests/test_recall_hardening_p1.py \
            tests/test_live_universe_contract.py \
            tests/test_snapshot_carry_forward.py \
            tests/test_ted_checkpoint.py \
            tests/test_recall_workflow_contract.py
      - name: Commit only verified changes
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            pipeline/discover_ted.py
            pipeline/build_live_world_snapshot.py
            pipeline/qwen_notice_batch_selfheal_rich.py
            .github/workflows/qwen-live-classification.yml
          )
          git diff --quiet -- "${paths[@]}" && { echo 'P1 already applied'; exit 0; }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${paths[@]}"
          git commit -m 'tenders: enrich geography and semantic recall context'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*3))
          done
          exit 1
