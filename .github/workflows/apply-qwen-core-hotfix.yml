name: Apply Qwen Core Hotfix (Legacy Retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo 'QWEN_CORE_HOTFIX_RETIRED'
          echo 'The audited Qwen V3 control plane is canonical.'
          echo 'This legacy workflow has no write permission and cannot restore obsolete 480-row/hourly scheduling.'
