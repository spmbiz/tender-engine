name: DCE Selection Smoke

on:
  workflow_dispatch:
    inputs:
      discovery_run_id:
        description: Durable Discovery Harvest run ID
        required: true
  push:
    branches: [main]
    paths:
      - 'control/selector_smoke_trigger.txt'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: resolve
        shell: bash
        env:
          INPUT_RUN: ${{ github.event.inputs.discovery_run_id }}
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ] && [[ "${INPUT_RUN:-}" =~ ^[0-9]+$ ]]; then
            rid="$INPUT_RUN"
          else
            rid="$(sed -nE 's/^discovery_run_id=([0-9]+).*$/\1/p' control/selector_smoke_trigger.txt | tail -1)"
          fi
          [[ "$rid" =~ ^[0-9]+$ ]] || { echo "Invalid discovery run id: $rid" >&2; exit 1; }
          echo "id=$rid" >> "$GITHUB_OUTPUT"
      - name: Download canonical discovery, controller state and rolling yield state
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ steps.resolve.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/discovery
          if gh release view "discovery-harvest-$RID" --json assets --jq '.assets[].name' | grep -Fxq "supergreen-wide-read-$RID-repaired.tar.gz"; then
            asset="supergreen-wide-read-$RID-repaired.tar.gz"
          else
            asset="supergreen-wide-read-$RID.tar.gz"
          fi
          gh release download "discovery-harvest-$RID" --pattern "$asset" --dir smoke
          tar -xzf "smoke/$asset" -C smoke/discovery
          gh release download fleet-state --pattern controller-state.json --dir smoke
          if gh release view fleet-state --json assets --jq '.assets[].name' | grep -Fxq 'portal-performance.json'; then
            gh release download fleet-state --pattern portal-performance.json --dir smoke
          else
            echo '{"schema_version":1,"run_ids":[],"portals":{}}' > smoke/portal-performance.json
          fi
          candidate_file="$(find smoke/discovery -type f -name current_candidates.jsonl -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -s "$candidate_file"
          cp "$candidate_file" smoke/current_candidates.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('smoke/controller-state.json').read_text())
          ids=list(state.get('processed_candidate_ids') or [])
          ids.extend((state.get('pending_dce_batch') or {}).get('candidate_ids') or [])
          seen=set()
          with Path('smoke/blocked.jsonl').open('w',encoding='utf-8') as f:
              for cid in ids:
                  cid=str(cid).strip()
                  if not cid or cid in seen: continue
                  seen.add(cid)
                  f.write(json.dumps({'candidate_id':cid},separators=(',',':'))+'\n')
          perf=json.loads(Path('smoke/portal-performance.json').read_text())
          print(json.dumps({'processed':len(state.get('processed_candidate_ids') or []),'pending':len((state.get('pending_dce_batch') or {}).get('candidate_ids') or []),'blocked_unique':len(seen),'history_run_ids':perf.get('run_ids') or []}))
          PY
      - name: Run yield-aware selector without dispatching DCE
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/auto_select_dce.py \
            --input smoke/current_candidates.jsonl \
            --blocked smoke/blocked.jsonl \
            --performance smoke/portal-performance.json \
            --out smoke/selection.jsonl \
            --minimum 34 \
            --limit 320
          test "$(wc -l < smoke/selection.jsonl)" -eq 320
      - name: Assert controller-requested parallel capacity beats legacy fallback
        env:
          DCE_REQUESTED_MAX_PARALLEL: '19'
          DCE_MAX_PARALLEL: '10'
          DCE_MAX_SHARDS: '256'
          DCE_TARGET_JOBS_PER_SHARD: '0'
          DCE_TARGET_WAVES: '1'
          DCE_BROWSER_MAX_JOBS_PER_SHARD: '12'
          DCE_HTTP_MAX_JOBS_PER_SHARD: '32'
          DCE_BROWSER_LOCAL_CONCURRENCY: '2'
          DCE_HTTP_LOCAL_CONCURRENCY: '8'
          MAX_DCE_JOBS: '320'
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/materialize_dce_selection.py \
            --candidates smoke/current_candidates.jsonl \
            --selection smoke/selection.jsonl \
            --out smoke/dce_candidates.jsonl
          python pipeline/build_dce_shards.py \
            --queue smoke/dce_candidates.jsonl \
            --out smoke/dce_shards.json
          python - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('dce_plan.json').read_text())
          if plan['candidate_count'] != 320: raise SystemExit(f"Expected 320, got {plan['candidate_count']}")
          if plan['skipped_count'] != 0: raise SystemExit(f"Expected zero skips, got {plan['skipped_count']}")
          if plan['max_parallel'] != 19: raise SystemExit(f"Expected parallel=19, got {plan['max_parallel']}")
          print(json.dumps({'candidate_count':plan['candidate_count'],'max_parallel':plan['max_parallel'],'shard_count':plan['shard_count'],'skipped_count':plan['skipped_count']},indent=2))
          PY
      - name: Regression assertions and yield comparison
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          rows=[json.loads(x) for x in Path('smoke/selection.jsonl').read_text().splitlines() if x.strip()]
          counts=Counter(str(x.get('selection_portal') or 'UNKNOWN') for x in rows)
          buckets=Counter(str(x.get('selection_bucket') or 'UNKNOWN') for x in rows)
          total=len(rows)
          sam=counts.get('US_SAM',0)+counts.get('US_SAM_BULK',0)
          selector=json.loads(Path('smoke/selection.jsonl.summary.json').read_text())
          plan=json.loads(Path('dce_plan.json').read_text())
          modeled=(selector.get('modeled_yield') or {}).get('modeled_expected_useful')
          report={
              'selected':total,
              'portal_counts':dict(counts),
              'bucket_counts':dict(buckets),
              'unique_portals':len(counts),
              'max_portal_share':round(max(counts.values(),default=0)/max(1,total),6),
              'sam_count':sam,
              'sam_share':round(sam/max(1,total),6),
              'history_run_ids':selector.get('history_run_ids') or [],
              'modeled_expected_useful':modeled,
              'previous_realized_baseline_useful':64,
              'modeled_delta_vs_64':round(float(modeled or 0)-64,3),
              'dce_materialized':plan.get('candidate_count'),
              'dce_skipped':plan.get('skipped_count'),
              'dynamic_max_parallel':plan.get('max_parallel'),
          }
          Path('smoke/regression-report.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps(report,indent=2))
          if total != 320: raise SystemExit('Selector regression: not 320')
          if sam > 40: raise SystemExit('Selector regression: SAM hard cap violated')
          if len(selector.get('history_run_ids') or []) < 2: raise SystemExit('Canary invalid: need >=2 rolling performance runs')
          PY
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat smoke/regression-report.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
