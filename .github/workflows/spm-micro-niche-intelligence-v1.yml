name: SPM Micro-Niche Intelligence v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/build_spm_micro_niche_intelligence_v1.py'
      - '.github/workflows/spm-micro-niche-intelligence-v1.yml'

permissions:
  contents: write

concurrency:
  group: spm-micro-niche-intelligence-v1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q duckdb

      - name: Download canonical Global Core v4
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source out
          for asset in historical_tenders.parquet awards.parquet award_suppliers.parquet; do
            gh release download tender-normalized-global-core-v4 \
              --repo walidgdg1-ai/coldemailtool \
              --pattern "$asset" --dir source --clobber
          done

      - name: Build route-aware micro-niche intelligence
        run: |
          python pipeline/build_spm_micro_niche_intelligence_v1.py \
            --historical source/historical_tenders.parquet \
            --awards source/awards.parquet \
            --bridge source/award_suppliers.parquet \
            --out out

      - name: Persist compact authority files to repository
        shell: bash
        run: |
          set -euo pipefail
          rm -f out/work.duckdb out/work.duckdb.wal
          mkdir -p control/micro_niche_intelligence_v1
          cp out/REPORT.md control/micro_niche_intelligence_v1/REPORT.md
          cp out/manifest.json control/micro_niche_intelligence_v1/manifest.json
          cp out/micro_niche_rank.csv control/micro_niche_intelligence_v1/micro_niche_rank.csv
          cp out/open_bid_micro_niche_rank.csv control/micro_niche_intelligence_v1/open_bid_micro_niche_rank.csv
          cp out/direct_buyer_micro_niche_rank.csv control/micro_niche_intelligence_v1/direct_buyer_micro_niche_rank.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/micro_niche_intelligence_v1/
          git commit -m 'tenders: persist micro-niche intelligence v1' || true
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then break; fi
            git rebase --abort >/dev/null 2>&1 || true
            if [ "$i" = 5 ]; then exit 1; fi
            sleep $((i*3))
          done

      - name: Publish full derived bundle durably
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='market-intelligence-micro-niche-v1'
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target main \
              --title 'SPM Market Intelligence — Micro-Niche v1' \
              --notes 'Derived full-corpus Global Core v4 notice-first micro-niche intelligence. Historical/retrieval prior only; no live DCE gate is satisfied by this release.'
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" \
            out/REPORT.md out/manifest.json out/micro_niche_rank.csv \
            out/open_bid_micro_niche_rank.csv out/direct_buyer_micro_niche_rank.csv \
            out/repeat_buyers_micro_niche.csv out/top_winners_micro_niche.csv \
            out/representative_examples.csv --clobber
