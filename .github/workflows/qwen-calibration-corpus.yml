name: Qwen Calibration Corpus

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'control/adjudications/*.json'
      - 'benchmarks/qwen_recall_golden_v1.json'
      - 'pipeline/build_qwen_calibration_corpus.py'

permissions:
  contents: write

concurrency:
  group: qwen-calibration-corpus
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download newest frozen live notice universe
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p calibration-input
          gh release download live-world-snapshot-latest \
            --pattern live-open-tenders-latest.jsonl.gz \
            --dir calibration-input --clobber
          test -s calibration-input/live-open-tenders-latest.jsonl.gz
      - name: Accumulate only DCE/GPT-grounded truth
        run: |
          python pipeline/build_qwen_calibration_corpus.py \
            --snapshot calibration-input/live-open-tenders-latest.jsonl.gz \
            --adjudications control/adjudications \
            --manual benchmarks/qwen_recall_golden_v1.json \
            --existing benchmarks/qwen_recall_golden_auto.json \
            --out benchmarks/qwen_recall_golden_auto.json \
            --target-cases 500 \
            --target-positives 100
      - name: Persist corpus monotonically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tender-engine-bot'
          git config user.email 'tender-engine-bot@users.noreply.github.com'
          git add benchmarks/qwen_recall_golden_auto.json
          git diff --cached --quiet && exit 0
          git commit -m 'qwen: grow adjudicated recall calibration corpus'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*3))
          done
          exit 1
