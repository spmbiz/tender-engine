name: Restart DCE Drainer Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restart-dce-drainer-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch fresh DCE queue drainer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dce-queue-drainer.yml --repo spmbiz/tender-engine --ref main
