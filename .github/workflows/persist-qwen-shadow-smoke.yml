name: Persist Qwen Shadow Smoke

on:
  workflow_run:
    workflows: ["Qwen Notice Shadow Smoke"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Qwen Notice Shadow Smoke workflow run ID to persist
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: persist-qwen-shadow-smoke-${{ github.event.workflow_run.id || github.event.inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve source run
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = 'workflow_run' ]; then
            run_id='${{ github.event.workflow_run.id }}'
            conclusion='${{ github.event.workflow_run.conclusion }}'
            head_sha='${{ github.event.workflow_run.head_sha }}'
          else
            run_id='${{ github.event.inputs.source_run_id }}'
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // "unknown"')"
            head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.head_sha')"
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "SOURCE_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "SOURCE_CONCLUSION=$conclusion" >> "$GITHUB_ENV"
          echo "SOURCE_HEAD_SHA=$head_sha" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download temporary smoke artifact before expiry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          name="qwen3-4b-shadow-smoke-${SOURCE_RUN_ID}"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$name" --dir evidence
          find evidence -maxdepth 2 -type f -print
          test -s evidence/qwen-shadow-summary.json || true
          python - <<'PY'
          import json, os, pathlib, datetime
          p=pathlib.Path('evidence/PERSISTENCE_METADATA.json')
          p.write_text(json.dumps({
            'schema':'QWEN_SHADOW_SMOKE_PERSISTENCE_V1',
            'source_workflow_run_id':os.environ['SOURCE_RUN_ID'],
            'source_conclusion':os.environ['SOURCE_CONCLUSION'],
            'source_head_sha':os.environ['SOURCE_HEAD_SHA'],
            'persisted_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'storage_contract':'Immutable GitHub Release is durable canonical evidence; Actions artifact is temporary transport only.',
            'destructive_rejection_enabled':False,
          },indent=2)+'\n',encoding='utf-8')
          PY
          (cd evidence && sha256sum * > SHA256SUMS.txt)

      - name: Publish immutable durable smoke evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="qwen-shadow-smoke-${SOURCE_RUN_ID}"
          notes="Qwen3-4B shadow smoke evidence persisted from temporary Actions transport. source_run=${SOURCE_RUN_ID} conclusion=${SOURCE_CONCLUSION}; no automatic destructive reject is enabled."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" evidence/* --clobber
          else
            gh release create "$tag" --target "$SOURCE_HEAD_SHA" --title "Qwen Shadow Smoke ${SOURCE_RUN_ID} — ${SOURCE_CONCLUSION}" --notes "$notes"
            gh release upload "$tag" evidence/*
          fi
          echo "IMMUTABLE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Refresh stable latest pointer for successful smoke
        if: ${{ env.SOURCE_CONCLUSION == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=qwen-shadow-smoke-latest
          mkdir -p latest
          [ -s evidence/qwen-shadow-results.jsonl ] && cp evidence/qwen-shadow-results.jsonl latest/qwen-shadow-results-latest.jsonl || true
          [ -s evidence/qwen-shadow-summary.json ] && cp evidence/qwen-shadow-summary.json latest/qwen-shadow-summary-latest.json || true
          cp evidence/PERSISTENCE_METADATA.json latest/PERSISTENCE_METADATA-latest.json
          cp evidence/SHA256SUMS.txt latest/SHA256SUMS-latest.txt
          gh release view "$latest" >/dev/null 2>&1 || gh release create "$latest" --target "$SOURCE_HEAD_SHA" --title 'Qwen Shadow Smoke — LATEST' --notes 'Stable pointer; immutable generations remain authoritative.'
          gh release edit "$latest" --title "Qwen Shadow Smoke — LATEST (${SOURCE_RUN_ID})" --notes "immutable=${IMMUTABLE_TAG}; successful shadow smoke only; no destructive reject enabled."
          gh release upload "$latest" latest/* --clobber
