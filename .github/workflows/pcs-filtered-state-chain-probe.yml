name: PCS Filtered State Chain Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pcs-filtered-state-chain-probe.yml'
      - 'control/pcs_filtered_state_chain_trigger.txt'
      - 'tools/probe_pcs_filtered_state_chain.py'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q 'playwright>=1.46,<2' beautifulsoup4
      - name: Reuse runner Chrome
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$chrome" ]; then
            echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Probe filtered WebForms state chain
        shell: bash
        run: |
          set +e
          python tools/probe_pcs_filtered_state_chain.py
          rc=$?
          echo "probe_exit_code=$rc"
          exit 0
      - name: Persist verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f control/pcs_filtered_state_chain_probe.json || printf '%s\n' '{"schema":"PCS_FILTERED_STATE_CHAIN_WORKFLOW_FAILURE","state_chain_proven":false}' > control/pcs_filtered_state_chain_probe.json
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add control/pcs_filtered_state_chain_probe.json
          git diff --cached --quiet && exit 0
          git commit -m "diag: persist PCS filtered state-chain probe ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*3))
          done
          exit 1
