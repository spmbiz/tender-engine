name: Italy ANAC PVL Bundle Contract Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'control/it_anac_pvl_bundle_trigger.txt'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1, fetch-tags: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests
      - name: Inspect official public frontend bundles
        shell: bash
        run: |
          set +e
          python pipeline/probe_it_anac_pvl_bundle_contract.py
          rc=$?
          echo "probe_rc=$rc"
          exit 0
      - name: Persist bundle contract probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f control/it_anac_pvl_bundle_probe.json || printf '%s\n' '{"schema":"IT_ANAC_PVL_BUNDLE_PROBE_WORKFLOW_FAILURE","pass":false}' > control/it_anac_pvl_bundle_probe.json
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add control/it_anac_pvl_bundle_probe.json
          git diff --cached --quiet && exit 0
          git commit -m "diag: persist ANAC PVL bundle contract ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
