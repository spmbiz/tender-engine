name: Live Coverage Status

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-coverage-status.yml'
      - 'pipeline/build_live_coverage_status.py'
      - 'control/live_coverage_status_trigger.txt'

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1, fetch-tags: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build compact durable status
        run: python pipeline/build_live_coverage_status.py
      - name: Persist status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add control/live_coverage_status.json
          git diff --cached --quiet && exit 0
          git commit -m "diag: refresh live coverage status ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
