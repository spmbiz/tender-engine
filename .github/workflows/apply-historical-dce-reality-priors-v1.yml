name: Apply Historical DCE Reality Priors v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/apply_historical_dce_reality_priors_v1.py'
      - '.github/workflows/apply-historical-dce-reality-priors-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply DCE reality-check refinement
        run: python pipeline/apply_historical_dce_reality_priors_v1.py
      - name: Smoke test build vs AMO separation
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pipeline.historical_market_priors import load,adjustment
          p=load('control/historical_market_priors.json');assert p
          cases=[
            ({'country':'FRANCE','title':"Refonte du site internet de l'Office de Tourisme"},4,'real web redesign'),
            ({'country':'FRANCE','title':"Assistance à maîtrise d'ouvrage pour la refonte du site internet de la collectivité"},0,'AMO not implementation'),
            ({'country':'FRANCE','title':"Construction du Site Internet institutionnel avec prestations d'hébergement et maintenance"},5,'web support still promoted'),
          ]
          out=[]
          for rec,exp,label in cases:
            got,reasons=adjustment(rec,p);assert got==exp,(label,got,exp,reasons);out.append({'case':label,'delta':got,'reasons':reasons})
          meta=p.get('historical_dce_reality_check_v1') or {};assert meta.get('downloaded_gate_ready')==17,meta
          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY
      - name: Persist verified priors
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/historical_market_priors.json
          git commit -m 'tenders: apply historical DCE reality-check priors v1' || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*3))
          done
          exit 1
