name: Deploy AusTender Cloudflare Bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-austender-cloudflare-worker.yml'

permissions:
  contents: write

jobs:
  deploy-verify-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q requests
      - name: Credential preflight
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo 'Missing repository secrets CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID.' >&2
            exit 2
          fi
      - name: Wrangler dry-run validation
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bridges/austender-worker
          wranglerVersion: '4'
          command: deploy --dry-run
      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bridges/austender-worker
          wranglerVersion: '4'
          command: deploy --keep-vars
      - name: Verify exact relay contract and persist deployment record
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from pipeline.austender_bridge_transport import fetch_verified_bridge

          base=(os.environ.get('DEPLOYMENT_URL') or '').strip().rstrip('/')
          if not base.startswith('https://'):
              raise SystemExit(f'Wrangler did not return an https deployment URL: {base!r}')
          rss_url=base + '/rss.xml'
          body, telemetry, warnings = fetch_verified_bridge(
              rss_url,
              user_agent='Tender-Engine-AusTender-Deploy-Probe/1.0',
              timeout=90,
          )
          if body is None or telemetry.get('bridge_contract_verified') is not True or warnings:
              raise SystemExit('bridge verification failed: '+json.dumps({'telemetry':telemetry,'warnings':warnings},ensure_ascii=False))
          payload={
              'schema':'AUSTENDER_CLOUDFLARE_BRIDGE_DEPLOYMENT_V1',
              'deployment_url':rss_url,
              'worker_base_url':base,
              'verified':True,
              'official_upstream':telemetry.get('bridge_claimed_upstream'),
              'official_upstream_status':telemetry.get('bridge_claimed_upstream_status'),
              'payload_sha256_at_deploy':telemetry.get('bridge_actual_sha256'),
              'payload_bytes_at_deploy':telemetry.get('bridge_bytes'),
              'verified_at':datetime.now(timezone.utc).isoformat(),
              'semantics':'Deployment URL is persisted only after the deployed Worker relays the official AusTender current-ATM RSS with expected upstream identity/status and a matching SHA-256 header. Runtime harvests re-verify the same contract on every fetch.',
          }
          p=Path('control/austender_bridge_deployment.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(payload,indent=2,ensure_ascii=False))
          PY
      - name: Commit verified bridge endpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add control/austender_bridge_deployment.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'austender: persist verified Cloudflare bridge deployment'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
