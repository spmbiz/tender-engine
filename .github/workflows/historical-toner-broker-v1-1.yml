name: Historical Toner Broker v1.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - historical_lab/toner_broker_precision_v1_1.py
      - .github/workflows/historical-toner-broker-v1-1.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q duckdb
      - name: Download canonical Global Core facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source out
          for a in historical_tenders.parquet awards.parquet award_suppliers.parquet; do
            gh release download tender-normalized-global-core-v4 --repo walidgdg1-ai/coldemailtool --pattern "$a" --dir source --clobber
          done
      - name: Run strict toner correction
        run: python historical_lab/toner_broker_precision_v1_1.py --historical source/historical_tenders.parquet --awards source/awards.parquet --bridge source/award_suppliers.parquet --out out
      - name: Persist authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=historical-toner-broker-v1-1
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main --title 'Historical Toner Broker v1.1' --notes 'Strict historical toner/ink consumables correction using lexical boundaries. Supersedes only toner portions of office-consumables v1.'
          gh release upload "$TAG" out/summary.json out/REPORT.md out/market_matrix.csv out/candidate_cohorts.csv out/examples.csv --repo "$GITHUB_REPOSITORY" --clobber
          mkdir -p control/historical_toner_broker_v1_1
          cp out/summary.json out/REPORT.md control/historical_toner_broker_v1_1/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/historical_toner_broker_v1_1/
          git commit -m 'historical: persist strict toner broker v1.1' || exit 0
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*3))
          done
          exit 1
