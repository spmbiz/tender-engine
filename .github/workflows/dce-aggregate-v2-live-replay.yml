name: DCE Aggregate V2 Live Replay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/aggregate_dce.py'
      - 'tests/test_aggregate_dce_evidence_contract.py'
      - '.github/workflows/dce-aggregate-v2-live-replay.yml'

permissions:
  contents: write
  actions: read

# Real replay target: immutable pre-fix shard-0 from DCE run 32098369885.
concurrency:
  group: dce-aggregate-v2-live-replay
  cancel-in-progress: true

jobs:
  replay-real-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run contract unit regression
        run: python -m pytest -q tests/test_aggregate_dce_evidence_contract.py
      - name: Recover real immutable DCE shard artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p replay-transport replay-root
          gh run download 32098369885 -n dce-shard-0 -D replay-transport
          test -s replay-transport/handoff-shard-0.tar.gz
          tar -xzf replay-transport/handoff-shard-0.tar.gz -C replay-root
          test "$(find replay-root -type f -name evidence_quality.json | wc -l)" -eq 6
      - name: Replay current aggregate on pre-fix real shard
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/aggregate_dce.py --root replay-root --out replay-aggregate
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          s=json.loads(Path('replay-aggregate/summary.json').read_text())
          assert s['candidates'] == 6, s
          # Evidence V2 must no longer fall through to the legacy unknown-document
          # bucket. Candidate-specific relevance remains a separate stricter guard.
          assert s['content_unverified'] == 0, s
          assert s['gate_ready_substantive_dce'] == 3, s
          assert s['candidate_relevance_unproven'] == 3, s
          rows=[json.loads(x) for x in Path('replay-aggregate/deep_review_queue.jsonl').read_text().splitlines() if x.strip()]
          by={r['candidate_id']:r for r in rows}
          bord=by['IE:8825829']
          assert bord['content_quality'] == 'SUBSTANTIVE_DCE_PRESENT', bord
          assert bord['gate_readiness'] is True, bord
          assert bord['candidate_document_relevance']['proven'] is True, bord
          report={
            'schema':'DCE_AGGREGATE_V2_LIVE_REPLAY_V1',
            'generated_at':datetime.now(timezone.utc).isoformat(),
            'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),
            'source_dce_run_id':32098369885,
            'source_shard':0,
            'status':'PASS',
            'real_candidates':s['candidates'],
            'gate_ready':s['gate_ready_substantive_dce'],
            'candidate_relevance_unproven':s['candidate_relevance_unproven'],
            'content_unverified':s['content_unverified'],
            'bord_bia':{
              'candidate_id':'IE:8825829',
              'quality':bord['content_quality'],
              'gate_ready':bord['gate_readiness'],
              'relevance':bord['candidate_document_relevance']['status'],
            },
            'safety':'Evidence V1/V2 only; unknown future contracts remain legacy-blocked; candidate-specific relevance guard remains active.',
          }
          Path('control/dce_aggregate_v2_replay_latest.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - name: Persist replay proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tender-engine-bot'
          git config user.email 'tender-engine-bot@users.noreply.github.com'
          git add control/dce_aggregate_v2_replay_latest.json
          git commit -m "ci: persist DCE aggregate V2 replay ${GITHUB_RUN_ID}"
          for n in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$((n*2))"
          done
          exit 1
