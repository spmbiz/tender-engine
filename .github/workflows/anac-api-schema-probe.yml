name: ANAC API Schema Probe

on:
  push:
    branches: [main]
    paths:
      - 'control/anac_api_schema_probe_trigger.txt'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q requests
      - name: Fetch official ANAC avvisi page 0
        run: |
          python - <<'PY'
          import json,requests
          from datetime import datetime,timezone
          from pathlib import Path
          today=datetime.now(timezone.utc).strftime('%d/%m/%Y')
          url='https://pubblicitalegale.anticorruzione.it/api/v0/avvisi'
          params={'dataPubblicazioneStart':today,'dataPubblicazioneEnd':today,'page':0,'size':10,'codiceScheda':'2,4'}
          s=requests.Session();s.headers.update({'User-Agent':'Mozilla/5.0','Accept':'application/json'})
          r=s.get(url,params=params,timeout=45); r.raise_for_status()
          data=r.json()
          payload={'schema':'ANAC_AVVISI_API_SCHEMA_PROBE_V1','generated_at':datetime.now(timezone.utc).isoformat(),'request_url':r.url,'status':r.status_code,'json_type':type(data).__name__,'json':data}
          Path('control/anac_api_schema_probe.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':r.status_code,'type':type(data).__name__,'top_keys':list(data)[:50] if isinstance(data,dict) else None,'items':len(data) if isinstance(data,list) else None},indent=2))
          PY
      - name: Persist schema sample
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/anac_api_schema_probe.json
          git diff --cached --quiet && exit 0
          git commit -m "diag: persist ANAC avvisi API schema ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
