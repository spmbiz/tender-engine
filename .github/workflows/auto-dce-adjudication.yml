name: Auto DCE Adjudication

on:
  workflow_dispatch:
    inputs:
      dce_run_id:
        description: Canonical successful DCE Fanout V2 run ID
        required: true
  push:
    branches: [main]
    paths:
      - 'control/auto_adjudication_trigger.txt'

permissions:
  contents: read
  actions: write

concurrency:
  group: auto-dce-adjudication-${{ github.event.inputs.dce_run_id || github.sha }}
  cancel-in-progress: false

jobs:
  route-to-qwen:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: resolve
        name: Resolve canonical DCE run
        shell: bash
        env:
          INPUT_RUN: ${{ github.event.inputs.dce_run_id }}
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ] && [[ "${INPUT_RUN:-}" =~ ^[0-9]+$ ]]; then
            rid="$INPUT_RUN"
          else
            rid="$(sed -nE 's/^dce_run_id=([0-9]+).*$/\1/p' control/auto_adjudication_trigger.txt | tail -1)"
          fi
          [[ "$rid" =~ ^[0-9]+$ ]] || { echo "Invalid DCE run id: $rid" >&2; exit 1; }
          echo "id=$rid" >> "$GITHUB_OUTPUT"
      - name: Dispatch API-free local Qwen DCE gate triage
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ steps.resolve.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run qwen-dce-triage.yml --ref main -f dce_run_id="$RID" -f workers=4
          echo "Legacy adjudication request routed to Qwen DCE triage for run $RID. No OpenAI API is used." >> "$GITHUB_STEP_SUMMARY"
