name: Auto DCE Adjudication

on:
  workflow_dispatch:
    inputs:
      dce_run_id:
        description: Canonical successful DCE Fanout V2 run ID
        required: true
  push:
    branches: [main]
    paths:
      - 'control/auto_adjudication_trigger.txt'

permissions:
  contents: read
  actions: write

concurrency:
  group: auto-dce-adjudication-${{ github.event.inputs.dce_run_id || github.sha }}
  cancel-in-progress: true

jobs:
  route-to-qwen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: resolve
        name: Resolve canonical DCE run
        shell: bash
        env:
          INPUT_RUN: ${{ github.event.inputs.dce_run_id }}
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ] && [[ "${INPUT_RUN:-}" =~ ^[0-9]+$ ]]; then
            rid="$INPUT_RUN"
          else
            rid="$(sed -nE 's/^dce_run_id=([0-9]+).*$/\1/p' control/auto_adjudication_trigger.txt | tail -1)"
          fi
          [[ "$rid" =~ ^[0-9]+$ ]] || { echo "Invalid DCE run id: $rid" >&2; exit 1; }
          echo "id=$rid" >> "$GITHUB_OUTPUT"
      - name: Wake canonical Qwen DCE drainer
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ steps.resolve.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          # Single-owner invariant: legacy requests no longer dispatch Qwen DCE
          # workers themselves. The drainer dedupes completed DCE runs, applies
          # shared fleet admission, and dispatches the missing triage pass.
          gh workflow run qwen-dce-drainer.yml --ref main
          echo "Legacy adjudication request for DCE run $RID routed through canonical Qwen DCE drainer." >> "$GITHUB_STEP_SUMMARY"
