name: Czech NIPEZ Source Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/probe_cz_zakazky_public.py'
      - 'pipeline/discover_cz_zakazky_public.py'
      - 'control/cz_zakazky_test.txt'
      - '.github/workflows/cz-zakazky-smoke.yml'

permissions:
  contents: read

jobs:
  czechia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests
      - run: python -m py_compile pipeline/probe_cz_zakazky_public.py
      - env: {DISCOVERY_OUT: 'discovery/global/CZ_ZAKAZKY_GOV'}
        run: python pipeline/probe_cz_zakazky_public.py
