name: Cyprus Public CfT Workspaces Full Proof

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Cyprus National Published Notices Full Proof']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/cy-workspaces-full-proof.yml'
      - 'pipeline/resolve_cy_epps_workspaces.py'
      - 'pipeline/merge_cy_epps_workspace_shards.py'
      - 'control/cy_workspaces_full_trigger.txt'

permissions:
  contents: write

jobs:
  init:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      resource_count: ${{ steps.plan.outputs.resource_count }}
      source_release: ${{ steps.plan.outputs.source_release }}
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1, fetch-tags: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Require green full Published registry proof and download its queue
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          source_release="$(python - <<'PY'
          import json
          p=json.load(open('control/cy_global_published_full_proof.json'))
          assert p.get('schema')=='CY_EPPS_NATIONAL_PUBLISHED_FULL_PROOF_V4',p
          assert p.get('pass') is True,p
          assert p.get('exact_registry_reconciliation') is True,p
          print(p['release_tag'])
          PY
          )"
          echo "$source_release" > /tmp/source_release
          mkdir -p source-pack
          gh release download "$source_release" --pattern 'cy-published-full-merged.tar.gz' --dir source-pack
          tar -xzf source-pack/cy-published-full-merged.tar.gz
          test -s cy-merged/competition_resources.jsonl
      - id: plan
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,math
          from pathlib import Path
          count=sum(1 for line in Path('cy-merged/competition_resources.jsonl').open() if line.strip())
          assert count>0,count
          target_shards=min(24,max(1,math.ceil(count/400)))
          per=math.ceil(count/target_shards)
          include=[]
          start=0; shard=0
          while start<count:
              end=min(count,start+per)
              include.append({'shard':shard,'start':start,'end':end})
              shard+=1; start=end
          print('matrix='+json.dumps({'include':include},separators=(',',':')))
          print('resource_count='+str(count))
          print('source_release='+Path('/tmp/source_release').read_text().strip())
          PY
      - id: release
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          tag="cy-workspaces-full-${GITHUB_RUN_ID}"
          gh release create "$tag" --title "Cyprus public CfT workspace full proof ${GITHUB_RUN_ID}" --notes "All unique competition resourceIds from the fully reconciled national Published Notices registry, resolved through public CfT workspaces."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  shard:
    needs: init
    if: needs.init.result == 'success'
    name: cy-cft-${{ matrix.start }}-${{ matrix.end }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1, fetch-tags: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests beautifulsoup4
      - name: Download authoritative resource queue
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RELEASE: ${{ needs.init.outputs.source_release }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-pack
          gh release download "$SOURCE_RELEASE" --pattern 'cy-published-full-merged.tar.gz' --dir source-pack
          tar -xzf source-pack/cy-published-full-merged.tar.gz
          test -s cy-merged/competition_resources.jsonl
      - name: Resolve exact public workspace shard
        id: run
        env:
          CY_EPPS_WORKSPACE_RETRIES: '6'
          CY_EPPS_WORKSPACE_DELAY_SECONDS: '0.20'
        shell: bash
        run: |
          set +e
          python pipeline/resolve_cy_epps_workspaces.py --input cy-merged/competition_resources.jsonl --output "cy-workspace-shard-${{ matrix.shard }}" --start-index '${{ matrix.start }}' --end-index '${{ matrix.end }}'
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Enforce transport only; UNKNOWN remains durable for merge verdict
        env: {RUN_RC: '${{ steps.run.outputs.rc }}'}
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          p=json.load(open('cy-workspace-shard-${{ matrix.shard }}/stats.json'))
          try: rc=int(os.environ.get('RUN_RC') or 999)
          except Exception: rc=999
          # Resolver may return zero even with UNKNOWN, and only transport failure is
          # fatal at shard level. Final merge decides currentness completeness.
          ok=bool(
              p.get('listing_contract')=='CY_EPPS_PUBLIC_CFT_WORKSPACE_RESOLVER_V1'
              and p.get('transport_complete') is True
              and not (p.get('errors') or [])
              and int(p.get('resources_requested') or -1)==int(p.get('resources_resolved') or -2)
          )
          raise SystemExit(0 if ok else 3)
          PY
      - name: Persist workspace shard durably
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.init.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "cy-workspace-shard-${{ matrix.shard }}/stats.json"
          tar -czf "cy-workspace-shard-${{ matrix.shard }}.tar.gz" "cy-workspace-shard-${{ matrix.shard }}"
          gh release upload "$RELEASE_TAG" "cy-workspace-shard-${{ matrix.shard }}.tar.gz" --clobber

  merge:
    needs: [init, shard]
    if: always() && needs.init.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1, fetch-tags: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download durable workspace shards
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.init.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads cy-workspace-shards
          gh release download "$RELEASE_TAG" --pattern 'cy-workspace-shard-*.tar.gz' --dir downloads
          for archive in downloads/cy-workspace-shard-*.tar.gz; do
            [ -e "$archive" ] || continue
            tar -xzf "$archive" -C cy-workspace-shards
          done
      - name: Merge transport and currentness verdicts
        id: merge
        env:
          RESOURCE_COUNT: ${{ needs.init.outputs.resource_count }}
          RELEASE_TAG: ${{ needs.init.outputs.release_tag }}
          SOURCE_RELEASE: ${{ needs.init.outputs.source_release }}
        shell: bash
        run: |
          set +e
          python pipeline/merge_cy_epps_workspace_shards.py --root cy-workspace-shards --output cy-workspaces-merged --expected-resources "$RESOURCE_COUNT"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=json.load(open('cy-workspaces-merged/stats.json')) if Path('cy-workspaces-merged/stats.json').exists() else {}
          pass_live=bool(
              s.get('listing_contract')=='CY_EPPS_PUBLIC_CFT_WORKSPACE_SHARDED_V2'
              and s.get('exact_transport_reconciliation') is True
              and s.get('currentness_complete') is True
              and s.get('enumeration_complete') is True
              and s.get('live_coverage_credit_allowed') is True
              and not (s.get('errors') or [])
              and int(s.get('unknown_currentness') or 0)==0
              and int(s.get('resources_resolved') or -1)==int(s.get('expected_resources') or -2)
          )
          proof={
              'schema':'CY_EPPS_FULL_CURRENT_UNIVERSE_PROOF_V1',
              'release_tag':os.environ.get('RELEASE_TAG'),
              'source_published_release':os.environ.get('SOURCE_RELEASE'),
              'expected_resources':s.get('expected_resources'),
              'resources_resolved':s.get('resources_resolved'),
              'current_materialized':s.get('current_materialized'),
              'non_current_materialized':s.get('non_current_materialized'),
              'unknown_currentness':s.get('unknown_currentness'),
              'index_manifest_complete':s.get('index_manifest_complete'),
              'exact_transport_reconciliation':s.get('exact_transport_reconciliation'),
              'currentness_complete':s.get('currentness_complete'),
              'enumeration_complete':s.get('enumeration_complete'),
              'live_coverage_credit_allowed':s.get('live_coverage_credit_allowed'),
              'errors':s.get('errors') or [],
              'pass':pass_live,
          }
          Path('control/cy_epps_full_current_proof.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps(proof,indent=2))
          PY
          exit 0
      - name: Preserve final current universe durably
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.init.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -f control/cy_epps_full_current_proof.json
          tar -czf cy-epps-current-full-merged.tar.gz cy-workspaces-merged control/cy_epps_full_current_proof.json
          gh release upload "$RELEASE_TAG" cy-epps-current-full-merged.tar.gz --clobber
      - name: Persist compact verdict on main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f control/cy_epps_full_current_proof.json || printf '%s\n' '{"schema":"CY_EPPS_CURRENT_FULL_WORKFLOW_FAILURE","pass":false}' > control/cy_epps_full_current_proof.json
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add control/cy_epps_full_current_proof.json
          git diff --cached --quiet && exit 0
          git commit -m "diag: persist Cyprus full current-universe proof ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
      - name: Enforce final live verdict
        if: always()
        run: python -c "import json; p=json.load(open('control/cy_epps_full_current_proof.json')); raise SystemExit(0 if p.get('pass') is True else 3)"
