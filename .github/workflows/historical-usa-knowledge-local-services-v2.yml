name: Historical USA Knowledge Local Services v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - historical_lab/usa_knowledge_local_services_v2_precision.py
      - .github/workflows/historical-usa-knowledge-local-services-v2.yml

permissions:
  contents: write

concurrency:
  group: historical-usa-knowledge-local-services-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q duckdb
      - name: Download canonical USAspending facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source out
          for f in historical_tenders.csv.gz awards.csv.gz; do gh release download tender-normalized-usa-awards-v1 --repo walidgdg1-ai/coldemailtool --pattern "$f" --dir source --clobber; done
      - name: Run precision knowledge/local-services scan
        run: python historical_lab/usa_knowledge_local_services_v2_precision.py --historical source/historical_tenders.csv.gz --awards source/awards.csv.gz --out out
      - name: Persist v2 outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=historical-usa-knowledge-local-services-v2
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main --title 'Historical USA Knowledge Local Services v2' --notes 'Precision historical decomposition fixing court-reporting and language-interpretation false positives; expert supplier-shape analysis included.'
          for f in summary.json REPORT.md family_summary.csv market_matrix.csv expert_supplier_shape.csv top_winners.csv top_buyers.csv examples.csv; do gh release upload "$TAG" "out/$f" --repo "$GITHUB_REPOSITORY" --clobber; done
          mkdir -p control/historical_usa_knowledge_local_services_v2
          cp out/summary.json out/REPORT.md control/historical_usa_knowledge_local_services_v2/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/historical_usa_knowledge_local_services_v2/
          git commit -m 'historical: persist USA knowledge/local services precision v2' || exit 0
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*3))
          done
          exit 1
