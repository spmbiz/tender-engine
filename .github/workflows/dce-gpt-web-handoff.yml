name: DCE GPT Web Handoff

on:
  workflow_run:
    workflows: ["DCE Fanout V2"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run:
        description: DCE Fanout V2 run ID; leave blank to use the newest complete deep-review release
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/workflows/dce-gpt-web-handoff.yml'
      - 'pipeline/build_gpt_web_review_bank.py'
      - 'pipeline/rebuild_gpt_web_review_bank_v4.py'
      - 'pipeline/post_dce_scope_gate.py'

permissions:
  contents: write

concurrency:
  group: dce-gpt-web-handoff
  cancel-in-progress: false

jobs:
  build-handoff:
    # A workflow_run handoff is valid only when the aggregate DCE run succeeded and
    # therefore published a complete deep-review tarball. Failed DCE runs still feed
    # the live inbox shard-by-shard through final_verdict_guard/publish_supergreen_hot.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve source DCE run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_SOURCE_RUN: ${{ github.event.inputs.source_run || '' }}
          WORKFLOW_SOURCE_RUN: ${{ github.event.workflow_run.id || '' }}
        shell: bash
        run: |
          set -euo pipefail

          resolve_latest_complete() {
            local page releases run_id
            run_id=''
            for page in 1 2 3 4 5; do
              releases="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100&page=${page}")"
              run_id="$(jq -r '
                [ .[]
                  | select(.tag_name | startswith("dce-harvest-"))
                  | . as $release
                  | ($release.tag_name | sub("^dce-harvest-"; "")) as $id
                  | select(any($release.assets[]?; .name == ("dce-deep-review-" + $id + ".tar.gz")))
                  | $id
                ][0] // empty
              ' <<<"$releases")"
              if [ -n "$run_id" ]; then
                printf '%s' "$run_id"
                return 0
              fi
            done
            return 1
          }

          reason=''
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            run_id="$WORKFLOW_SOURCE_RUN"
            reason='successful_dce_workflow_run'
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$MANUAL_SOURCE_RUN" ]; then
            run_id="$MANUAL_SOURCE_RUN"
            reason='explicit_manual_source_run'
          else
            run_id="$(resolve_latest_complete || true)"
            reason='latest_complete_dce_release'
          fi

          if [ -z "$run_id" ]; then
            echo '::error::No complete DCE deep-review release could be resolved.'
            exit 3
          fi

          tag="dce-harvest-${run_id}"
          asset="dce-deep-review-${run_id}.tar.gz"
          if ! gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
            echo "::error::Resolved DCE run ${run_id} has no complete ${asset}; refusing stale/partial handoff."
            exit 4
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Recovering complete DCE run $run_id ($reason)"
      - name: Download existing deep-review pack only
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.source.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          tag="dce-harvest-${SOURCE_RUN}"
          asset="dce-deep-review-${SOURCE_RUN}.tar.gz"
          mkdir -p recovered
          gh release download "$tag" --pattern "$asset" --dir recovered
          test -s "recovered/$asset"
          mkdir -p recovered/extracted
          tar -xzf "recovered/$asset" -C recovered/extracted
          queue="$(find recovered/extracted -type f -name deep_review_queue.jsonl -print -quit)"
          test -n "$queue"
          echo "REVIEW_QUEUE=$queue" >> "$GITHUB_ENV"
          echo "Found existing review queue: $queue"
      - name: Rebuild persistent GPT Web review bank without any model API
        env:
          SOURCE_RUN: ${{ steps.source.outputs.run_id }}
          SOURCE_REASON: ${{ steps.source.outputs.reason }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Handoff source: ${SOURCE_RUN} (${SOURCE_REASON})"
          python pipeline/rebuild_gpt_web_review_bank_v4.py \
            --queue "$REVIEW_QUEUE" \
            --existing control/gpt_review_pending.json \
            --out control/gpt_review_pending.json \
            --top-out control/gpt_review_pending_top.json \
            --index-out control/gpt_review_pending_index.json \
            --top-items 30 \
            --run-id "$SOURCE_RUN" \
            --max-items 240
          python - <<'PY'
          import json
          p='control/gpt_review_pending.json'
          x=json.load(open(p,encoding='utf-8'))
          print(json.dumps({
              'schema':x.get('schema'),
              'latest_source_dce_run_id':x.get('latest_source_dce_run_id'),
              'incoming_gate_ready':x.get('incoming_gate_ready'),
              'incoming_scope_eligible':x.get('incoming_scope_eligible'),
              'incoming_scope_auto_rejected':x.get('incoming_scope_auto_rejected'),
              'scope_auto_rejected_this_rebuild':x.get('scope_auto_rejected_this_rebuild'),
              'incoming_open':x.get('incoming_open'),
              'incoming_with_gate_evidence':x.get('incoming_with_gate_evidence'),
              'pending_total':x.get('count'),
          }, indent=2))
          if x.get('incoming_gate_ready') and not x.get('incoming_with_gate_evidence'):
              raise SystemExit('Gate-ready rows exist but zero gate evidence was packed; refusing silent empty handoff')
          PY
      - name: Persist handoff for GPT Web
        env:
          SOURCE_RUN: ${{ steps.source.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tender-engine-bot'
          git config user.email 'tender-engine-bot@users.noreply.github.com'
          git add control/gpt_review_pending.json control/gpt_review_pending_top.json control/gpt_review_pending_index.json
          if git diff --cached --quiet; then
            echo 'No handoff delta to persist.'
            exit 0
          fi
          git commit -m "Persist GPT Web DCE review bank from ${SOURCE_RUN}"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep "$((attempt * 2))"
          done
          echo 'Unable to persist GPT Web handoff after retries' >&2
          exit 1
