name: Promote Germany DOE Production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Germany DOE Monthly Shards Proof']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'control/de_doe_production_promote_trigger.txt'

permissions:
  contents: write

jobs:
  promote:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1, fetch-tags: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests pytest
      - name: Require green monthly-shard proof
        run: |
          python - <<'PY'
          import json
          p=json.load(open('control/de_doe_month_shards_proof.json'))
          assert p.get('schema')=='DE_DOE_MONTH_SHARDS_FULL_PROOF_V2',p
          assert p.get('pass') is True,p
          assert p.get('enumeration_complete') is True,p
          assert p.get('live_coverage_credit_allowed') is True,p
          assert p.get('months_requested')==p.get('months_completed'),p
          PY
      - name: Validate proof-backed production adapter live
        env:
          DISCOVERY_OUT: de-production-smoke
          DE_DOE_CACHE_MAX_AGE_HOURS: '72'
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile pipeline/github_release_cache.py pipeline/discover_de_doe_ocds.py pipeline/discover_de_doe_production.py
          python pipeline/discover_de_doe_production.py
          python - <<'PY'
          import json
          s=json.load(open('de-production-smoke/stats.json'))
          assert s.get('listing_contract')=='DE_DOE_PROVEN_FULL_BASELINE_PLUS_LIVE_MONTH_DELTA_V3',s
          assert s.get('enumeration_complete') is True,s
          assert s.get('live_coverage_credit_allowed') is True,s
          assert not (s.get('errors') or []),s
          assert int(s.get('current_materialized') or 0)>0,s
          PY
      - name: Preserve old CSV adapter and install stable production wrapper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          old=Path('pipeline/discover_de_doe_csv.py')
          legacy=Path('pipeline/discover_de_doe_csv_legacy.py')
          wrapper='''from __future__ import annotations\n\ntry:\n    from pipeline.discover_de_doe_production import main\nexcept ModuleNotFoundError:\n    from discover_de_doe_production import main\n\nif __name__ == "__main__":\n    main()\n'''
          if not legacy.exists():
              legacy.write_text(old.read_text())
          old.write_text(wrapper)
          PY
          python -m py_compile pipeline/discover_de_doe_csv.py pipeline/discover_de_doe_csv_legacy.py pipeline/discover_de_doe_production.py
      - name: Commit production routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add pipeline/discover_de_doe_csv.py pipeline/discover_de_doe_csv_legacy.py
          git diff --cached --quiet && exit 0
          git commit -m 'de: promote proof-backed official OCDS production lane'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
