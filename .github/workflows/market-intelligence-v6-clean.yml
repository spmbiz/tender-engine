name: SPM Market Intelligence v6 Clean

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/build_market_intelligence_v6_clean.py'
      - '.github/workflows/market-intelligence-v6-clean.yml'

permissions:
  contents: write

concurrency:
  group: spm-market-intelligence-v6-clean
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DuckDB
        run: python -m pip install --disable-pip-version-check -q duckdb
      - name: Download canonical Global Core v4
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p core clean-v6
          for asset in historical_tenders.parquet awards.parquet award_suppliers.parquet data_quality.json; do
            gh release download tender-normalized-global-core-v4 --repo walidgdg1-ai/coldemailtool --pattern "$asset" --dir core --clobber
            test -s "core/$asset"
          done
          python - <<'PY'
          import json
          q=json.load(open('core/data_quality.json',encoding='utf-8'))
          assert q.get('status')=='PASS',q
          assert q['counts_notice_first']['historical_tenders']==2250547,q
          print('GLOBAL_CORE_V4_PASS')
          PY
      - name: Build strict clean-lane intelligence
        run: |
          set -euo pipefail
          python pipeline/build_market_intelligence_v6_clean.py \
            --historical core/historical_tenders.parquet \
            --awards core/awards.parquet \
            --award-suppliers core/award_suppliers.parquet \
            --out clean-v6
      - name: QA outputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,csv
          s=json.load(open('clean-v6/clean_summary.json',encoding='utf-8'))
          assert s['version']=='SPM_MARKET_INTELLIGENCE_V6_CLEAN',s
          assert len(s['top_50'])>=20,len(s['top_50'])
          for f in ['clean_lane_rank.csv','clean_examples.csv','clean_repeat_buyers.csv','clean_winners.csv','clean_cpv_codes.csv','clean_seasonality_monthly.csv','clean_summary.json','REPORT.md']:
              assert os.path.isfile('clean-v6/'+f) and os.path.getsize('clean-v6/'+f)>0,f
          with open('clean-v6/clean_lane_rank.csv',encoding='utf-8-sig') as fh:
              n=sum(1 for _ in csv.DictReader(fh))
          assert n>=20,n
          print(json.dumps({'ranked_lanes':n,'top10':[x['cohort'] for x in s['top_50'][:10]]},ensure_ascii=False,indent=2,default=str))
          PY
      - name: Publish v6 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='market-intelligence-v6-clean'
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title 'SPM Market Intelligence v6 — Clean lanes' --notes 'Strict multilingual lean-service reclassification of Global Core v4. Generic communication/balayage/interpretation false positives removed; frameworks/DPS separated from direct-like metrics. Historical derived evidence only.'
          fi
          find clean-v6 -maxdepth 1 -type f -print0 | while IFS= read -r -d '' f; do gh release upload "$TAG" "$f" --clobber; done
      - name: Persist GPT-readable report to main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p control/market_intelligence_v6
          cp clean-v6/REPORT.md control/market_intelligence_v6/REPORT.md
          cp clean-v6/clean_summary.json control/market_intelligence_v6/snapshot.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/market_intelligence_v6/REPORT.md control/market_intelligence_v6/snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'tenders: persist clean Market Intelligence v6 snapshot'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$((attempt*3))"
          done
          exit 1
