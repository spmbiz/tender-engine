name: Autonomous Tender Fleet

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'control/fleet_trigger.txt'

permissions:
  actions: write
  contents: write

concurrency:
  group: autonomous-tender-fleet-controller
  cancel-in-progress: false

jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install controller dependency only
        run: python -m pip install --disable-pip-version-check -q requests
      - id: controller
        name: Reconcile fresh discovery, leased DCE batches, post-processing and broker-aware live capacity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python pipeline/fleet_controller_v5.py
      - name: Trigger isolated CircleCI fleet branch only after an intentional tick
        if: success() && steps.controller.outputs.circleci_tick_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TICK_SHA: ${{ steps.controller.outputs.circleci_tick_sha }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          if gh api "repos/$repo/git/ref/heads/circleci-fleet" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$repo/git/refs/heads/circleci-fleet" -f sha="$TICK_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/$repo/git/refs" -f ref="refs/heads/circleci-fleet" -f sha="$TICK_SHA" >/dev/null
          fi
          echo "CircleCI fleet branch synced to exact tick commit $TICK_SHA"
      - name: Controller summary
        if: always()
        run: |
          echo 'Controller schema: v5 broker-aware + v4 freshness/transactional core.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Persistent desired state: control/desired_state.json' >> "$GITHUB_STEP_SUMMARY"
          echo 'Durable live status: Release fleet-state / fleet-status-latest.json' >> "$GITHUB_STEP_SUMMARY"
          echo 'GPT handoff: Release fleet-state / gpt-latest-summary.json' >> "$GITHUB_STEP_SUMMARY"
          echo 'Fresh usable discovery Releases preempt stale active backlogs; older harvests are deferred, not dropped.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Sibling workload minimums are protected as virtual occupancy until satisfied by live jobs.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Successful DCE batches automatically dispatch GPT-readable handoff + guarded adjudication.' >> "$GITHUB_STEP_SUMMARY"
          echo 'DCE batches are leased transactionally and committed only after successful workflow completion.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Failed/expired batches return to the durable queue automatically.' >> "$GITHUB_STEP_SUMMARY"
          echo 'CircleCI is only triggered when explicitly enabled in desired_state.json.' >> "$GITHUB_STEP_SUMMARY"
