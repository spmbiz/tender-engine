name: Cyprus Public CfT Workspace Contract Probe V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cy-epps-workspace-contract-probe-v2.yml'
      - 'pipeline/probe_cy_epps_workspace_contract_v2.py'
      - 'pipeline/discover_cy_epps_published_global_v2.py'
      - 'control/cy_epps_workspace_probe_v2_trigger.txt'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1, fetch-tags: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests beautifulsoup4
      - name: Probe first and last page CfT workspaces through V2 pager
        shell: bash
        run: |
          set +e
          CY_WORKSPACE_PROBE_OUT=control/cy_epps_workspace_contract_probe_v2.json python pipeline/probe_cy_epps_workspace_contract_v2.py
          rc=$?
          echo "probe_rc=$rc"
          exit 0
      - name: Persist workspace contract probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f control/cy_epps_workspace_contract_probe_v2.json || printf '%s\n' '{"schema":"CY_EPPS_WORKSPACE_PROBE_V2_WORKFLOW_FAILURE","pass":false}' > control/cy_epps_workspace_contract_probe_v2.json
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add control/cy_epps_workspace_contract_probe_v2.json
          git diff --cached --quiet && exit 0
          git commit -m "diag: persist Cyprus CfT workspace contract V2 ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
