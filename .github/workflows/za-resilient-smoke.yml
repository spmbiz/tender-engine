name: ZA Resilient OCDS Smoke

on:
  push:
    branches: [main]
    paths:
      - 'control/za_resilient_smoke_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1, fetch-tags: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests
      - name: Harvest 14 days with Kingfisher links-next contract
        env:
          DISCOVERY_OUT: lane-out/ZA_ETENDERS_OCDS
        shell: bash
        run: |
          set +e
          python pipeline/discover_za_etenders_ocds_resilient.py --output "$DISCOVERY_OUT" --lookback-days 14 --window-days 7
          rc=$?
          export ADAPTER_RC="$rc"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('lane-out/ZA_ETENDERS_OCDS/stats.json')
          s=json.loads(p.read_text()) if p.exists() else {'errors':[{'type':'STATS_MISSING'}]}
          t=s.get('telemetry') or []
          pages=[p for w in t for p in (w.get('pages') or [])]
          failed=[x for x in t if x.get('status')=='FAILED_SINGLE_DAY']
          payload={
            'schema':'ZA_KINGFISHER_LINKS_NEXT_SMOKE_V4_HALO',
            'adapter_exit_code':int(os.environ['ADAPTER_RC']),
            'listing_contract':s.get('listing_contract'),
            'raw_materialized':s.get('raw_materialized'),
            'current_materialized':s.get('current_materialized'),
            'awards_materialized':s.get('awards_materialized'),
            'enumeration_complete':s.get('enumeration_complete'),
            'complete_windows':sum(1 for x in t if x.get('status')=='COMPLETE'),
            'bisected_windows':sum(1 for x in t if x.get('status')=='BISECT'),
            'halo_recoveries':s.get('halo_recoveries'),
            'halo_failures':s.get('halo_failures'),
            'failed_single_days':len(failed),
            'failed_day_detail':failed[:10],
            'official_next_pages':sum(1 for x in pages if x.get('request_mode')=='OFFICIAL_LINKS_NEXT'),
            'synthesized_first_pages':sum(1 for x in pages if x.get('request_mode')=='SYNTHESIZED_FIRST_PAGE'),
            'errors':s.get('errors') or [],
          }
          payload['pass_recall']=bool(payload['current_materialized']) and payload['enumeration_complete'] is True and not payload['failed_single_days']
          Path('control/za_resilient_smoke.json').write_text(json.dumps(payload,indent=2)+'\n')
          print(json.dumps(payload,indent=2))
          PY
          exit 0
      - name: Persist smoke
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f control/za_resilient_smoke.json ]; then
            printf '%s\n' '{"schema":"ZA_KINGFISHER_LINKS_NEXT_SMOKE_WORKFLOW_FAILURE","pass_recall":false}' > control/za_resilient_smoke.json
          fi
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add control/za_resilient_smoke.json
          git diff --cached --quiet && exit 0
          git commit -m "diag: persist ZA resilient smoke ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; git rebase --abort >/dev/null 2>&1 || true; sleep $((i*2)); done
          exit 1
