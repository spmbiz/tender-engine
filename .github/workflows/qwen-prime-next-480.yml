name: Qwen Merge Completed Shards Now

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qwen-prime-next-480.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: qwen-merge-completed-shards-now
  cancel-in-progress: true

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake continuous conveyor to ingest completed Qwen artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run qwen-live-conveyor.yml --ref main
          echo 'Continuous Qwen conveyor dispatched to ingest completed semantic shard artifacts.'
