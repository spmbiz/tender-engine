name: PCS Full Reconcile Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pcs-full-reconcile-proof.yml'
      - 'control/pcs_full_reconcile_trigger.txt'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q requests beautifulsoup4 'playwright>=1.46,<2'
      - name: Reuse runner Chrome
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$chrome" ]; then echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"; else python -m playwright install --with-deps chromium; fi
      - name: Create durable proof Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="pcs-reconcile-proof-${GITHUB_RUN_ID}"
          gh release create "$tag" --title "PCS full reconcile proof ${GITHUB_RUN_ID}" --notes "Official PCS bulk plus independent Current Opportunity V13 exact reconciliation."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Run full official PCS reconcile
        id: run
        shell: bash
        env:
          DISCOVERY_MODE: reconcile
          DISCOVERY_OUT: pcs-reconcile
          PCS_BULK_WORKERS: '6'
          PCS_DIRECT_POST_TIMEOUT_MS: '120000'
        run: |
          set +e
          python pipeline/discover_uk_pcs_current.py
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preserve full proof pack in Release
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          test -d pcs-reconcile
          tar -C pcs-reconcile -czf pcs-full-reconcile-proof.tar.gz .
          gh release upload "$RELEASE_TAG" pcs-full-reconcile-proof.tar.gz --clobber
      - name: Build compact durable verdict
        if: always()
        shell: bash
        env:
          ADAPTER_RC: ${{ steps.run.outputs.rc }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('pcs-reconcile/stats.json')
          s=json.loads(p.read_text()) if p.exists() else {'errors':[{'type':'PCS_RECONCILE_STATS_MISSING'}]}
          rec=s.get('current_universe_reconciliation') if isinstance(s.get('current_universe_reconciliation'),dict) else {}
          payload={
            'schema':'PCS_FULL_RECONCILE_PROOF_V1',
            'release_tag':os.environ.get('RELEASE_TAG'),
            'adapter_exit_code':int(os.environ.get('ADAPTER_RC') or 99),
            'listing_contract':s.get('listing_contract'),
            'month_manifest':s.get('month_manifest'),
            'months_requested':s.get('months_requested'),
            'notice_types':s.get('notice_types'),
            'requests_expected':s.get('requests_expected'),
            'requests_completed':s.get('requests_completed'),
            'source_releases_seen':s.get('source_releases_seen'),
            'bulk_current_materialized_before_reconcile':s.get('bulk_current_materialized_before_reconcile'),
            'current_materialized':s.get('current_materialized'),
            'publication_window_enumeration_complete':s.get('publication_window_enumeration_complete'),
            'enumeration_complete':s.get('enumeration_complete'),
            'live_coverage_credit_allowed':s.get('live_coverage_credit_allowed'),
            'current_universe_reconciliation':rec,
            'errors':s.get('errors') or [],
            'warnings':s.get('warnings') or [],
          }
          payload['pass']=(
            payload['adapter_exit_code']==0
            and payload['publication_window_enumeration_complete'] is True
            and payload['enumeration_complete'] is True
            and payload['live_coverage_credit_allowed'] is True
            and rec.get('coverage_complete') is True
            and int(rec.get('direct_missing_from_bulk') or 0)==0
            and not payload['errors']
          )
          Path('control').mkdir(exist_ok=True)
          Path('control/pcs_full_reconcile_proof.json').write_text(json.dumps(payload,indent=2)+'\n')
          print(json.dumps(payload,indent=2))
          PY
      - name: Persist verdict to main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f control/pcs_full_reconcile_proof.json || printf '%s\n' '{"schema":"PCS_FULL_RECONCILE_WORKFLOW_FAILURE","pass":false}' > control/pcs_full_reconcile_proof.json
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add control/pcs_full_reconcile_proof.json
          git diff --cached --quiet && exit 0
          git commit -m "diag: persist full PCS reconcile proof ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*3))
          done
          exit 1
