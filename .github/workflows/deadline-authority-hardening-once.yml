name: Deadline Authority Hardening Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deadline-authority-hardening-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deadline-authority-hardening-once
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch deadline labels and add strict regression tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('pipeline/authority_conflicts.py')
          s=p.read_text(encoding='utf-8')
          if '(?:rfq|rfp|bid|tender|quotation|proposal)\\s+closing date' not in s:
              old='    r"deadline for receipt of quotations|deadline for receipt of bids|submission deadline|tender deadline|bid deadline|"\n'
              new=old+'    r"(?:rfq|rfp|bid|tender|quotation|proposal)\\s+closing date|"\n'
              if old not in s:
                  raise SystemExit('submission-pattern anchor not found; refusing blind patch')
              s=s.replace(old,new,1)
          old2="def labelled_deadline_dates(text: str) -> list[dict]:\n    dates=extract_dates(text)\n    labelled=[]; seen=set()\n    for label,rx in (('SUBMISSION',SUBMISSION_WORDS),('QUERY',QUERY_WORDS)):\n        for kw in rx.finditer(text or ''):\n"
          new2="def labelled_deadline_dates(text: str) -> list[dict]:\n    # Procurement PDFs/HTML frequently use NBSP/narrow-NBSP between words.\n    # Replace them one-for-one so regex labels match while every date/span offset\n    # remains valid against the original text used for evidence context.\n    scan_text=(text or '').replace('\\u00a0',' ').replace('\\u202f',' ')\n    dates=extract_dates(scan_text)\n    labelled=[]; seen=set()\n    for label,rx in (('SUBMISSION',SUBMISSION_WORDS),('QUERY',QUERY_WORDS)):\n        for kw in rx.finditer(scan_text):\n"
          if old2 in s:
              s=s.replace(old2,new2,1)
          elif 'scan_text=(text or \'\').replace' not in s:
              raise SystemExit('labelled_deadline_dates anchor not found; refusing blind patch')
          p.write_text(s,encoding='utf-8')
          PY
          cat > tests/test_authority_conflicts_deadline_labels.py <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path(__file__).resolve().parents[1] / 'pipeline'))
          from authority_conflicts import labelled_deadline_dates


          def dates_for(label, text):
              return {x['date'] for x in labelled_deadline_dates(text) if x['label'] == label}


          def test_etenders_nbsp_submission_and_query_stay_separate():
              text=(
                  'Deadline\u00a0for\u00a0requesting\u00a0additional\u00a0information: 04/08/2026 12:00 +01:00. '
                  'Deadline\u00a0for\u00a0receipt\u00a0of\u00a0tenders: 18/08/2026 17:00 +01:00.'
              )
              assert dates_for('QUERY', text) == {'2026-08-04'}
              assert dates_for('SUBMISSION', text) == {'2026-08-18'}


          def test_rfq_closing_date_is_submission_authority():
              text='Request for Quotation Date 13 August 2026. RFQ Closing Date 28 August 2026. RFQ Closing Time 16h30.'
              assert dates_for('SUBMISSION', text) == {'2026-08-28'}


          def test_clarification_closing_date_is_not_submission_authority():
              text='Clarification Closing Date 20 August 2026. Responses will follow later.'
              assert dates_for('SUBMISSION', text) == set()
          PY
          python -m py_compile pipeline/authority_conflicts.py tests/test_authority_conflicts_deadline_labels.py
          python -m pytest -q tests/test_authority_conflicts_deadline_labels.py
      - name: Commit focused patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'tender-engine-bot'
          git config user.email 'tender-engine-bot@users.noreply.github.com'
          git add pipeline/authority_conflicts.py tests/test_authority_conflicts_deadline_labels.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(dce): resolve NBSP and RFQ submission deadlines safely'
          for n in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$((n*2))"
          done
          exit 1
