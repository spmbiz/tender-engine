name: DCE V21 Czech NEN Smoke

on:
  pull_request:
    paths:
      - 'pipeline/dce_worker_v21.py'
      - 'pipeline/dce_batch_worker.py'
      - 'pipeline/dce_batch_worker_v20.py'
      - 'pipeline/test_dce_worker_v21_routes.py'
      - '.github/workflows/dce-v21-czech-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nen-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install resolver dependencies
        run: python -m pip install --disable-pip-version-check -q requests pypdf python-docx openpyxl python-pptx 'playwright>=1.46,<2'
      - name: Reuse runner Chromium
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$chrome" ]; then
            echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Compile V21 contracts
        run: |
          python -m py_compile pipeline/dce_worker_v21.py pipeline/dce_batch_worker.py pipeline/dce_batch_worker_v20.py
          python pipeline/test_dce_worker_v21_routes.py
      - name: Build real NEN document corpus
        shell: bash
        run: |
          mkdir -p generated
          cat > generated/cz-nen-v21-smoke.jsonl <<'JSONL'
          {"candidate_id":"CZ-NEN:SMOKE:N006-24-V00026710","portal":"CZ_NIPEZ","notice_url":"https://nen.nipez.cz/verejne-zakazky/detail-zakazky/N006-24-V00026710","route":{"detail_url":"https://nen.nipez.cz/verejne-zakazky/detail-zakazky/N006-24-V00026710"},"status":"QUEUED"}
          {"candidate_id":"CZ-NEN:SMOKE:N006-26-V00009433","portal":"CZ_NIPEZ","notice_url":"https://nen.nipez.cz/verejne-zakazky/detail-zakazky/N006-26-V00009433","route":{"detail_url":"https://nen.nipez.cz/verejne-zakazky/detail-zakazky/N006-26-V00009433"},"status":"QUEUED"}
          JSONL
      - name: Resolve both public NEN cases through active V21 batch
        env:
          DCE_BROWSER_INLINE_RETRIES: '0'
          DCE_HTTP_INLINE_RETRIES: '0'
          DCE_BROWSER_FAST_TIMEOUT_SECONDS: '125'
          DCE_HTTP_FAST_TIMEOUT_SECONDS: '90'
        run: |
          python pipeline/dce_batch_worker.py \
            --queue generated/cz-nen-v21-smoke.jsonl \
            --lines 1,2 \
            --out cz-out \
            --concurrency 2 \
            --http-probe-concurrency 2 \
            --http-probe-timeout-seconds 5 \
            --retries 0 \
            --timeout-seconds 125
      - name: Require a real public procurement file and summarize
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifests=[]
          for p in Path('cz-out').rglob('manifest.json'):
              m=json.loads(p.read_text(encoding='utf-8',errors='replace'))
              manifests.append({
                  'candidate_id':m.get('candidate_id'),
                  'status':m.get('status'),
                  'files':len(m.get('files') or []),
                  'documents_url':m.get('cz_nen_documents_url'),
                  'methods':[a.get('method') for a in (m.get('dce_method_attempts') or [])],
              })
          manifests.sort(key=lambda x:x.get('candidate_id') or '')
          print(json.dumps(manifests,indent=2,ensure_ascii=False))
          if len(manifests) != 2:
              raise SystemExit(f'expected 2 manifests, got {len(manifests)}')
          downloaded=[m for m in manifests if m['status']=='DOWNLOADED_PUBLIC' and m['files']>0]
          if not downloaded:
              raise SystemExit('V21 did not download a public NEN procurement file on either real case')
          Path('cz-v21-summary.json').write_text(json.dumps(manifests,indent=2,ensure_ascii=False),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dce-v21-czech-smoke-${{ github.run_id }}
          path: |
            cz-v21-summary.json
            cz-out/batch_results.json
            cz-out/batch_summary.json
            cz-out/http_probe_summary.json
            cz-out/**/manifest.json
            cz-out/**/portal_page*.txt
          retention-days: 5
          if-no-files-found: warn
