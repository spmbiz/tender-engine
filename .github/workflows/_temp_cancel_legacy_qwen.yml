name: Temp Cancel Legacy Qwen
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_temp_cancel_legacy_qwen.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-slim
    steps:
      - name: Cancel pre-admission Qwen run only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(gh api repos/$GITHUB_REPOSITORY/actions/runs/31939562433 --jq .status)"
          if [ "$status" = in_progress ] || [ "$status" = queued ] || [ "$status" = pending ]; then
            gh api --method POST repos/$GITHUB_REPOSITORY/actions/runs/31939562433/cancel
            echo 'cancel requested for legacy run 31939562433'
          else
            echo "legacy run already terminal: $status"
          fi
