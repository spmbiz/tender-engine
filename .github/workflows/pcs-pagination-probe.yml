name: PCS Pagination Probe

on:
  push:
    branches: [main]
    paths:
      - 'control/pcs_pagination_probe_trigger.txt'

permissions:
  contents: write

concurrency:
  group: pcs-pagination-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q playwright
      - name: Reuse runner Chrome
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$chrome" ]; then echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"; else python -m playwright install --with-deps chromium; fi
      - name: Traverse five PCS pages and record result
        env:
          DISCOVERY_OUT: pcs-probe
          PCS_CURRENT_MAX_PAGES: '5'
          PCS_CURRENT_PAGE_WAIT_MS: '300'
        shell: bash
        run: |
          set +e
          python pipeline/discover_uk_pcs_current.py
          rc=$?
          export RC="$rc"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('pcs-probe/stats.json')
          stats=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          rows=[]
          cur=Path('pcs-probe/current.jsonl')
          if cur.exists():
              for line in cur.read_text(encoding='utf-8').splitlines():
                  try: rows.append(json.loads(line))
                  except Exception: pass
          ids=[r.get('candidate_id') for r in rows if r.get('candidate_id')]
          pages=[x.get('page') for x in (stats.get('telemetry') or {}).get('pages',[]) if x.get('page') is not None]
          payload={
              'schema':'PCS_PAGINATION_PROBE_V2_ALWAYS_PERSIST',
              'adapter_exit_code':int(os.environ.get('RC') or 0),
              'listing_contract':stats.get('listing_contract'),
              'pages_fetched':stats.get('pages_fetched'),
              'page_numbers_seen':pages,
              'current_materialized':stats.get('current_materialized'),
              'unique_candidate_ids':len(set(ids)),
              'total_reported':stats.get('total_reported'),
              'errors':stats.get('errors') or [],
              'warnings':stats.get('warnings') or [],
              'telemetry':stats.get('telemetry') or {},
              'pagination_progress_proven': len(set(pages)) >= 3 and len(set(ids)) >= 20,
          }
          Path('control/pcs_pagination_probe.json').write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(payload,indent=2,ensure_ascii=False))
          PY
      - name: Persist probe even when pagination is not proven
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f control/pcs_pagination_probe.json || exit 1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/pcs_pagination_probe.json
          git diff --cached --quiet && exit 0
          git commit -m "diag: persist PCS pagination probe ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
