name: Denmark Udbud Source Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/probe_dk_udbud_public.py'
      - 'control/dk_udbud_test.txt'
      - '.github/workflows/dk-udbud-smoke.yml'

permissions:
  contents: read

jobs:
  denmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q playwright
      - run: python -m py_compile pipeline/probe_dk_udbud_public.py
      - env: {DISCOVERY_OUT: 'discovery/global/DK_UDBUD_PUBLIC'}
        run: python pipeline/probe_dk_udbud_public.py
