name: Freshness Conveyor CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/freshness_conveyor_watchdog.py'
      - 'pipeline/build_qwen_shadow_shards.py'
      - 'pipeline/build_qwen_dce_selection.py'
      - 'tests/test_freshness_conveyor.py'
      - '.github/workflows/freshness-conveyor-ci.yml'
  pull_request:
    paths:
      - 'pipeline/freshness_conveyor_watchdog.py'
      - 'pipeline/build_qwen_shadow_shards.py'
      - 'pipeline/build_qwen_dce_selection.py'
      - 'tests/test_freshness_conveyor.py'
      - '.github/workflows/freshness-conveyor-ci.yml'

permissions:
  contents: read

concurrency:
  group: freshness-conveyor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q requests pytest
      - name: Compile freshness hot path
        run: python -m py_compile pipeline/freshness_conveyor_watchdog.py pipeline/build_qwen_shadow_shards.py pipeline/build_qwen_dce_selection.py
      - name: Run freshness regression contracts
        run: python -m pytest -q tests/test_freshness_conveyor.py
