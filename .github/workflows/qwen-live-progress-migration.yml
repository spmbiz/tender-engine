name: Qwen Live Progress Migration (Legacy Disabled)

# Retired one-shot migration. Live progress checkpointing is already present in
# pipeline/qwen_notice_batch_selfheal.py. This file is kept only as an audit
# marker and must never cancel or restart active Qwen classification runs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo 'QWEN_LIVE_PROGRESS_MIGRATION_RETIRED'
          echo 'No workflow is patched, cancelled or restarted.'
