name: Qwen Live Checkpoint Conveyor

on:
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/qwen-live-checkpoint-conveyor.yml'
      - 'pipeline/qwen_live_checkpoint_publisher.py'
      - 'pipeline/qwen_notice_batch_selfheal.py'
      - 'pipeline/qwen_notice_post_guard.py'
      - 'pipeline/qwen_semantic_controller.py'
      - 'pipeline/merge_qwen_classification_state.py'

permissions:
  actions: read
  contents: write

# Deliberately shares the canonical conveyor lock. Checkpoint publication and
# completed-artifact publication can never mutate qwen-incremental-state-latest
# simultaneously.
concurrency:
  group: qwen-live-continuous-conveyor
  cancel-in-progress: false

env:
  QWEN_CLASSIFIER_VERSION: qwen3-4b-q4km-batch-selfheal-v1
  INCREMENTAL_RELEASE: qwen-incremental-state-latest

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - id: select
        name: Select the controller-authorized running semantic generation
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/run work/checkpoints work/base work/publish control/qwen_live
          python pipeline/qwen_semantic_controller.py \
            --summary control/qwen_live/classification_summary.json \
            --out work/controller-decision.json >/tmp/qwen-checkpoint-controller.log
          cat /tmp/qwen-checkpoint-controller.log
          rid="$(python - <<'PY'
          import json
          d=json.load(open('work/controller-decision.json',encoding='utf-8'))
          k=d.get('running_keeper') or {}
          print(k.get('id') or '')
          PY
          )"
          if ! [[ "$rid" =~ ^[0-9]+$ ]]; then
            echo 'usable=false' >> "$GITHUB_OUTPUT"
            echo 'No controller-authorized running semantic generation; checkpoint ingest is a no-op.'
            exit 0
          fi

          if ! gh run download "$rid" -n "qwen-live-input-$rid" -D work/run; then
            echo 'usable=false' >> "$GITHUB_OUTPUT"
            echo "Running Qwen generation $rid has no reusable input transport yet."
            exit 0
          fi
          manifest="$(find work/run -type f -name snapshot-manifest-latest.json -print -quit)"
          ledger="$(find work/run -type f -name notice-intelligence-ledger-latest.jsonl.gz -print -quit)"
          queue="$(find work/run -type f -name notice-classification-queue-latest.jsonl.gz -print -quit)"
          snapshot="$(find work/run -type f -name live-open-tenders-latest.jsonl.gz -print -quit)"
          [ -n "$manifest" ] && [ -n "$ledger" ] && [ -n "$queue" ] && [ -n "$snapshot" ] || {
            echo 'usable=false' >> "$GITHUB_OUTPUT"
            echo 'Running Qwen input transport is incomplete.'
            exit 0
          }
          source_run="$(MANIFEST="$manifest" python - <<'PY'
          import json,os
          print(json.load(open(os.environ['MANIFEST'],encoding='utf-8')).get('source_discovery_run') or '')
          PY
          )"
          [[ "$source_run" =~ ^[0-9]+$ ]] || { echo 'invalid source generation' >&2; exit 1; }

          tag="qwen-live-progress-$rid"
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          checkpoint_count="$(grep -Ec '^qwen-live-.*-guarded-checkpoint\.jsonl$' <<< "$assets" || true)"
          if [ "$checkpoint_count" -eq 0 ]; then
            echo 'usable=false' >> "$GITHUB_OUTPUT"
            echo "Qwen run $rid is alive but has no guarded checkpoint asset yet."
            exit 0
          fi
          gh release download "$tag" \
            --pattern 'qwen-live-*-guarded-checkpoint.jsonl' \
            --dir work/checkpoints --clobber

          echo 'usable=true' >> "$GITHUB_OUTPUT"
          echo "rid=$rid" >> "$GITHUB_OUTPUT"
          echo "source_run=$source_run" >> "$GITHUB_OUTPUT"
          echo "ledger=$ledger" >> "$GITHUB_OUTPUT"
          echo "queue=$queue" >> "$GITHUB_OUTPUT"
          echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"
          echo "checkpoint_count=$checkpoint_count" >> "$GITHUB_OUTPUT"
          echo "Selected live Qwen run=$rid source=$source_run checkpoint_assets=$checkpoint_count"

      - id: merge
        name: Merge only novel exact-context checkpoint rows
        if: steps.select.outputs.usable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ steps.select.outputs.rid }}
          SOURCE_RUN: ${{ steps.select.outputs.source_run }}
          LEDGER: ${{ steps.select.outputs.ledger }}
          QUEUE: ${{ steps.select.outputs.queue }}
          SNAPSHOT: ${{ steps.select.outputs.snapshot }}
        shell: bash
        run: |
          set -euo pipefail
          base='work/base/qwen-state-base.jsonl.gz'
          inc_body="$(gh release view "$INCREMENTAL_RELEASE" --json body --jq '.body' 2>/dev/null || true)"
          inc_source="$(grep -oE 'source_run=[0-9]+' <<< "$inc_body" | head -n1 | cut -d= -f2 || true)"
          inc_run="$(grep -oE 'qwen_run=[0-9]+' <<< "$inc_body" | head -n1 | cut -d= -f2 || true)"
          if [ "$inc_source" = "$SOURCE_RUN" ] && [ "$inc_run" = "$RID" ]; then
            gh release download "$INCREMENTAL_RELEASE" \
              --pattern qwen-incremental-state-latest.jsonl.gz \
              --dir work/base --clobber
            mv work/base/qwen-incremental-state-latest.jsonl.gz "$base"
            echo "Checkpoint merge continues cumulative state for qwen_run=$RID."
          else
            gh release download qwen-classification-state-latest \
              --pattern qwen-classification-state-latest.jsonl.gz \
              --dir work/base --clobber
            mv work/base/qwen-classification-state-latest.jsonl.gz "$base"
            echo 'Checkpoint merge starts from authoritative stable Qwen state.'
          fi
          test -s "$base"

          BASE="$base" CHECKPOINT_DIR=work/checkpoints OUT=work/novel-checkpoints.jsonl python - <<'PY'
          import gzip,json,os
          from pathlib import Path

          def cid(r):
              n=r.get('notice') if isinstance(r.get('notice'),dict) else {}
              return str(r.get('canonical_notice_id') or r.get('candidate_id') or r.get('id') or n.get('candidate_id') or n.get('i') or '').strip()
          def mh(r):
              return str(r.get('input_material_fields_hash') or r.get('material_fields_hash') or '').strip()
          known=set()
          with gzip.open(os.environ['BASE'],'rt',encoding='utf-8') as f:
              for raw in f:
                  raw=raw.strip()
                  if not raw: continue
                  r=json.loads(raw)
                  known.add((cid(r),mh(r)))
          chosen={}
          for p in sorted(Path(os.environ['CHECKPOINT_DIR']).glob('qwen-live-*-guarded-checkpoint.jsonl')):
              for lineno,raw in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
                  raw=raw.strip()
                  if not raw: continue
                  r=json.loads(raw)
                  key=(cid(r),mh(r))
                  if not key[0] or not key[1]:
                      raise SystemExit(f'checkpoint row missing id/hash: {p}:{lineno}')
                  if key in known:
                      continue
                  prior=chosen.get(key)
                  if prior is not None and json.dumps(prior,sort_keys=True,separators=(',',':')) != json.dumps(r,sort_keys=True,separators=(',',':')):
                      raise SystemExit(f'conflicting duplicate live checkpoint: {key[0]}')
                  chosen[key]=r
          out=Path(os.environ['OUT'])
          out.write_text(''.join(json.dumps(r,ensure_ascii=False,separators=(',',':'))+'\n' for _,r in sorted(chosen.items())),encoding='utf-8')
          print(json.dumps({'known_state_rows':len(known),'novel_checkpoint_rows':len(chosen)},sort_keys=True))
          PY
          novel="$(grep -cve '^\s*$' work/novel-checkpoints.jsonl || true)"
          echo "novel=$novel" >> "$GITHUB_OUTPUT"
          if [ "$novel" -eq 0 ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No novel checkpoint rows beyond cumulative state.'
            exit 0
          fi

          python pipeline/merge_qwen_classification_state.py \
            --ledger "$LEDGER" \
            --classification-queue "$QUEUE" \
            --previous-state "$base" \
            --results work/novel-checkpoints.jsonl \
            --target-classifier-version "$QWEN_CLASSIFIER_VERSION" \
            --state-out work/publish/qwen-incremental-state-latest.jsonl.gz \
            --queue-out work/publish/qwen-classification-remaining-latest.jsonl.gz \
            --summary-out work/publish/classification_summary.json

          accepted="$(python -c "import json;print(int(json.load(open('work/publish/classification_summary.json')).get('stats',{}).get('results_accepted',0)))")"
          remaining="$(python -c "import json;print(int(json.load(open('work/publish/classification_summary.json'))['remaining_classification_queue']))")"
          state_rows="$(python -c "import json;print(int(json.load(open('work/publish/classification_summary.json'))['state_rows_after_merge']))")"
          echo "accepted=$accepted" >> "$GITHUB_OUTPUT"
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
          echo "state_rows=$state_rows" >> "$GITHUB_OUTPUT"
          if [ "$accepted" -gt 0 ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
          echo "Live checkpoint merge: novel=$novel accepted=$accepted state=$state_rows remaining=$remaining"

      - name: Publish cumulative checkpoint state mirror
        if: steps.select.outputs.usable == 'true' && steps.merge.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ steps.select.outputs.rid }}
          SOURCE_RUN: ${{ steps.select.outputs.source_run }}
        shell: bash
        run: |
          set -euo pipefail
          notes="source_run=$SOURCE_RUN qwen_run=$RID writer=qwen-live-checkpoint-conveyor-v1 authoritative=false exact_hash_merge=true live_checkpoints=true"
          retry_cmd() {
            local label="$1"; shift
            local delays=(0 10 30 60)
            local out rc
            for delay in "${delays[@]}"; do
              [ "$delay" -eq 0 ] || sleep "$delay"
              set +e
              out="$("$@" 2>&1)"; rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then return 0; fi
              echo "::warning::${label} failed rc=${rc}: ${out: -400}"
            done
            return 1
          }
          if ! retry_cmd 'incremental release metadata' gh release edit "$INCREMENTAL_RELEASE" --notes "$notes"; then
            echo '::warning::Incremental release mirror unavailable; main summary will still be persisted and next checkpoint cycle will reconstruct from durable source/checkpoint assets.'
            exit 1
          fi
          retry_cmd 'incremental release assets' gh release upload "$INCREMENTAL_RELEASE" \
            work/publish/qwen-incremental-state-latest.jsonl.gz \
            work/publish/qwen-classification-remaining-latest.jsonl.gz \
            work/publish/classification_summary.json --clobber

      - name: Persist live checkpoint summary transactionally
        if: steps.select.outputs.usable == 'true' && steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RID: ${{ steps.select.outputs.rid }}
          SOURCE_RUN: ${{ steps.select.outputs.source_run }}
          CHECKPOINTS: ${{ steps.select.outputs.checkpoint_count }}
          NOVEL: ${{ steps.merge.outputs.novel }}
          ACCEPTED: ${{ steps.merge.outputs.accepted }}
          REMAINING: ${{ steps.merge.outputs.remaining }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime,json,os
          payload={
            'schema':'QWEN_LIVE_GUARDED_CHECKPOINT_INGEST_V1',
            'generated_at':datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat(),
            'qwen_run_id':int(os.environ['RID']),
            'source_run':int(os.environ['SOURCE_RUN']),
            'checkpoint_assets':int(os.environ['CHECKPOINTS']),
            'novel_checkpoint_rows':int(os.environ['NOVEL']),
            'accepted_checkpoint_rows':int(os.environ['ACCEPTED']),
            'remaining_classification_queue':int(os.environ['REMAINING']),
            'exact_context_guarded':True,
            'writer':'qwen-live-checkpoint-conveyor-v1',
          }
          open('work/publish/checkpoint_ingest.json','w',encoding='utf-8').write(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(json.dumps(payload,indent=2,sort_keys=True))
          PY
          persist_file() {
            local path="$1" file="$2" message="$3" sha
            for delay in 0 5 15 30 60 120; do
              [ "$delay" -eq 0 ] || sleep "$delay"
              sha="$(gh api "repos/${REPO}/contents/${path}?ref=main" --jq '.sha' 2>/dev/null || true)"
              TARGET="$path" FILE="$file" SHA="$sha" MESSAGE="$message" python - <<'PY'
          import base64,json,os
          from pathlib import Path
          body={'message':os.environ['MESSAGE'],'content':base64.b64encode(Path(os.environ['FILE']).read_bytes()).decode(),'branch':'main'}
          if os.environ.get('SHA','').strip(): body['sha']=os.environ['SHA'].strip()
          Path('/tmp/checkpoint-content.json').write_text(json.dumps(body),encoding='utf-8')
          PY
              if gh api --method PUT "repos/${REPO}/contents/${path}" --input /tmp/checkpoint-content.json >/dev/null 2>&1; then return 0; fi
            done
            echo "Failed to persist ${path} after bounded backoff" >&2
            return 1
          }
          persist_file control/qwen_live/classification_summary.json work/publish/classification_summary.json "qwen: persist live guarded checkpoint classification ${GITHUB_RUN_ID}"
          persist_file control/qwen_live/checkpoint_ingest.json work/publish/checkpoint_ingest.json "qwen: persist live guarded checkpoint ingest ${GITHUB_RUN_ID}"

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '### Qwen live guarded checkpoint conveyor' >> "$GITHUB_STEP_SUMMARY"
          echo "- running keeper: ${{ steps.select.outputs.rid }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- checkpoint assets: ${{ steps.select.outputs.checkpoint_count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- novel checkpoint rows: ${{ steps.merge.outputs.novel }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- accepted checkpoint rows: ${{ steps.merge.outputs.accepted }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- remaining queue: ${{ steps.merge.outputs.remaining }}" >> "$GITHUB_STEP_SUMMARY"
          echo '- release mirroring is best-effort; durable main summary persistence continues through release rate limits.' >> "$GITHUB_STEP_SUMMARY"
          echo '- no semantic dispatch, no DCE dispatch, and no final-artifact authority is changed by this workflow.' >> "$GITHUB_STEP_SUMMARY"
