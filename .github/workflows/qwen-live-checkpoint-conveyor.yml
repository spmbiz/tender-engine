name: Qwen Live Checkpoint Conveyor (Retired)

# Retained as an audit marker only. Live guarded checkpoints are now ingested by
# qwen-live-conveyor.yml, the single writer for incremental semantic state.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo 'QWEN_CHECKPOINT_CONVEYOR_RETIRED'
          echo 'qwen-live-conveyor.yml owns both guarded checkpoints and final artifacts.'
          echo 'No state write or semantic dispatch occurs here.'
