name: Qwen API Safety Patch Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qwen-api-safety-patch-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qwen-api-safety-patch-once
  cancel-in-progress: false

# One-shot trigger: 2026-08-18 API-pressure hardening.
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make per-request Release checkpoints opt-in
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('pipeline/qwen_notice_batch_selfheal.py')
          s=p.read_text(encoding='utf-8')
          old='    live_release_tag = f"qwen-live-progress-{run_id}" if os.environ.get("GITHUB_ACTIONS") == "true" and run_id != "local" else None\n'
          new=(
              '    # Release uploads are intentionally opt-in. Publishing after every recursive\\n'
              '    # split/output can consume hundreds of GitHub API calls per pass and starve\\n'
              '    # the authoritative aggregate writer. Local checkpoints and final workflow\\n'
              '    # artifacts remain enabled regardless.\\n'
              '    external_progress_enabled = str(os.environ.get("QWEN_EXTERNAL_PROGRESS_RELEASES") or "").strip().lower() in {"1", "true", "yes"}\\n'
              '    live_release_tag = (\\n'
              '        f"qwen-live-progress-{run_id}"\\n'
              '        if external_progress_enabled and os.environ.get("GITHUB_ACTIONS") == "true" and run_id != "local"\\n'
              '        else None\\n'
              '    )\\n'
          ).replace('\\\\n','\\n')
          if old not in s:
              if 'QWEN_EXTERNAL_PROGRESS_RELEASES' in s:
                  print('Patch already present; no-op')
                  raise SystemExit(0)
              raise SystemExit('Expected live_release_tag line not found; refusing blind patch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile pipeline/qwen_notice_batch_selfheal.py
          grep -n 'QWEN_EXTERNAL_PROGRESS_RELEASES' pipeline/qwen_notice_batch_selfheal.py
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pipeline/qwen_notice_batch_selfheal.py; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'tender-engine-bot'
          git config user.email 'tender-engine-bot@users.noreply.github.com'
          git add pipeline/qwen_notice_batch_selfheal.py
          git commit -m 'fix(qwen): stop Release API checkpoint amplification'
          for n in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$((n*2))"
          done
          exit 1
