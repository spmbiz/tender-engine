name: Belgium BDA Paginator Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/probe_be_paginator.py'
      - '.github/workflows/be-paginator-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q playwright
      - run: python -m py_compile pipeline/probe_be_paginator.py
      - env: {DISCOVERY_OUT: 'discovery/global/BE_EPROC_PAGINATOR'}
        run: python pipeline/probe_be_paginator.py
