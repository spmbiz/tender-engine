name: SAM Public Attachment Canary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sam-public-canary.yml'
      - 'control/sam_public_canary_trigger.txt'
      - 'pipeline/dce_worker_v7.py'
      - 'pipeline/discover_us_sam_bulk.py'

permissions:
  contents: read

jobs:
  sam-public-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install resolver dependencies
        run: python -m pip install --disable-pip-version-check -q requests pypdf python-docx openpyxl python-pptx playwright
      - name: Reuse runner Chrome
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$chrome" ]; then echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"; else python -m playwright install --with-deps chromium; fi
      - name: Build real digital SAM canary queue
        shell: bash
        run: |
          mkdir -p canary
          cat > canary/queue.jsonl <<'JSONL'
          {"candidate_id":"US-SAM:7686bd844b36486a882c70d5a5436545","portal":"US_SAM","notice_id":"7686bd844b36486a882c70d5a5436545","opportunity_id":"7686bd844b36486a882c70d5a5436545","notice_url":"https://sam.gov/opp/7686bd844b36486a882c70d5a5436545/view","title":"Social Media Management"}
          {"candidate_id":"US-SAM:2b927753a4d2479a8dc6e209a20d577b","portal":"US_SAM","notice_id":"2b927753a4d2479a8dc6e209a20d577b","opportunity_id":"2b927753a4d2479a8dc6e209a20d577b","solicitation_number":"36C25626Q1008","notice_url":"https://sam.gov/opp/2b927753a4d2479a8dc6e209a20d577b/view","title":"VR Application Development"}
          {"candidate_id":"US-SAM:f85cdbffe2df41bcacfa2970787bcc79","portal":"US_SAM","notice_id":"f85cdbffe2df41bcacfa2970787bcc79","opportunity_id":"f85cdbffe2df41bcacfa2970787bcc79","notice_url":"https://sam.gov/opp/f85cdbffe2df41bcacfa2970787bcc79/view","title":"Instructional Video Series for Advanced Vascular Repair Techniques"}
          JSONL
      - name: Resolve public SAM attachments
        env:
          DCE_ITEM_RETRIES: '1'
          DCE_ITEM_TIMEOUT_SECONDS: '150'
        run: python pipeline/dce_batch_worker.py --queue canary/queue.jsonl --lines 1,2,3 --out canary/out --concurrency 3
      - name: Extract and classify
        run: |
          python pipeline/extract_corpus.py --root canary/out
          python pipeline/dce_evidence_quality.py --root canary/out
      - name: Report SAM canaries
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          for root in sorted(pathlib.Path('canary/out').glob('*')):
              if not root.is_dir(): continue
              m=json.loads((root/'manifest.json').read_text()) if (root/'manifest.json').exists() else {}
              q=json.loads((root/'evidence_quality.json').read_text()) if (root/'evidence_quality.json').exists() else {}
              print(root.name,json.dumps({'status':m.get('status'),'files':m.get('files'),'attempts':m.get('dce_method_attempts'),'quality':q.get('content_quality'),'gate_ready':q.get('gate_readiness')},ensure_ascii=False,indent=2)[:40000])
          PY
      - name: Assert supplier-side public routing works
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          roots=list(pathlib.Path('canary/out').glob('*'))
          assert len(roots)==3, roots
          statuses=[]; downloaded=0
          for root in roots:
              m=json.loads((root/'manifest.json').read_text())
              status=str(m.get('status') or '')
              statuses.append((root.name,status))
              assert status != 'AUTH_REQUIRED', (root.name,m)
              if status=='DOWNLOADED_PUBLIC' and m.get('files'): downloaded += 1
          assert downloaded >= 1, {'statuses':statuses,'reason':'public SAM resolver found no downloadable attachment on three known attachment-backed digital solicitations'}
          print('SAM_PUBLIC_CANARY_OK',statuses,'downloaded',downloaded)
          PY
      - name: Upload SAM canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sam-public-canary-${{ github.run_id }}
          path: canary/out/
          retention-days: 2
          compression-level: 9
          if-no-files-found: warn
