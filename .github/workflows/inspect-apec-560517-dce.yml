name: Inspect APEC 560517 DCE Pack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-apec-560517-dce.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download durable candidate pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pack extracted control/dce_reviews/560517-2026
          gh release download curated-dce-31898292715 --repo walidgdg1-ai/tender-engine \
            --pattern 'candidate-TED-560517-2026.tar.gz' --dir pack --clobber
          tar -xzf pack/candidate-TED-560517-2026.tar.gz -C extracted
          find extracted -maxdepth 6 -type f -printf '%P\t%s bytes\n' | sort > control/dce_reviews/560517-2026/FILE_INVENTORY.txt
      - name: Persist all compact evidence and readable extracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, shutil
          root=Path('extracted'); out=Path('control/dce_reviews/560517-2026'); out.mkdir(parents=True,exist_ok=True)
          copied=[]
          for p in root.rglob('*'):
              if not p.is_file(): continue
              rel=p.relative_to(root)
              low=p.name.lower()
              size=p.stat().st_size
              if size <= 600000 and (p.suffix.lower() in {'.json','.txt','.md','.csv','.xml'} or low in {'manifest.json','gate_snippets.json','evidence_quality.json'}):
                  dest=out/('EXTRACTED__' + '__'.join(rel.parts))
                  shutil.copyfile(p,dest); copied.append(str(rel))
          summary={'source_release':'curated-dce-31898292715','candidate':'TED:560517-2026','copied_compact_files':copied}
          (out/'INSPECTION_INDEX.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/dce_reviews/560517-2026/
          git commit -m 'tenders: persist APEC 560517 DCE evidence inspection' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
