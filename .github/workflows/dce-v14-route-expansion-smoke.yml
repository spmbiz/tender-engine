name: DCE V14 Route Expansion Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pipeline/dce_worker_v11.py'
      - 'pipeline/dce_worker_v12.py'
      - 'pipeline/dce_worker_v13.py'
      - 'pipeline/dce_worker_v14.py'
      - 'pipeline/dce_batch_worker.py'
      - 'pipeline/build_matrix.py'
      - 'pipeline/test_dce_worker_v11_routes.py'
      - 'pipeline/test_dce_worker_v13_routes.py'
      - 'pipeline/test_dce_worker_v14_routes.py'
      - '.github/workflows/dce-v14-route-expansion-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'pipeline/dce_worker_v14.py'
      - 'pipeline/dce_batch_worker.py'
      - 'pipeline/build_matrix.py'
      - 'pipeline/test_dce_worker_v14_routes.py'
      - '.github/workflows/dce-v14-route-expansion-smoke.yml'

permissions:
  contents: read

jobs:
  route-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install resolver dependencies
        run: python -m pip install --disable-pip-version-check -q requests 'playwright>=1.46,<2'
      - name: Reuse runner Chromium
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$chrome" ]; then
            echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Compile full resolver chain and mapping tests
        run: |
          python -m py_compile \
            pipeline/build_matrix.py \
            pipeline/dce_worker_v11.py \
            pipeline/dce_worker_v12.py \
            pipeline/dce_worker_v13.py \
            pipeline/dce_worker_v14.py \
            pipeline/dce_batch_worker.py
          python pipeline/test_dce_worker_v11_routes.py
          python pipeline/test_dce_worker_v13_routes.py
          python pipeline/test_dce_worker_v14_routes.py
      - name: Assert production fanout actually points at v14
        shell: bash
        run: |
          grep -F 'pipeline/dce_worker_v14.py' pipeline/dce_batch_worker.py
          python - <<'PY'
          from pipeline.build_matrix import BROWSER_PORTALS, SUPPORTED
          required={'UK_PROCONTRACT','UK_ATAMIS','UK_DELTA','UK_INTEND','UK_JAGGAER','NZ_TENDERLINK'}
          missing=required-SUPPORTED
          assert not missing, f'missing from SUPPORTED: {sorted(missing)}'
          assert required <= BROWSER_PORTALS
          print({'v14_matrix_routes': sorted(required), 'status':'ok'})
          PY
      - name: Build representative live route corpus
        shell: bash
        run: |
          mkdir -p generated
          cat > generated/v14_route_smoke.jsonl <<'JSONL'
          {"candidate_id":"V14:CA","portal":"CA_CANADABUYS","notice_url":"https://canadabuys.canada.ca/en/tender-opportunities/tender-notice/cb-829-24574370","route":{"detail_url":"https://canadabuys.canada.ca/en/tender-opportunities/tender-notice/cb-829-24574370"}}
          {"candidate_id":"V14:NZ","portal":"NZ_GETS","notice_url":"https://www.gets.govt.nz/NPDC/ExternalTenderDetails.htm?id=34344329","route":{"detail_url":"https://www.gets.govt.nz/NPDC/ExternalTenderDetails.htm?id=34344329"}}
          {"candidate_id":"V14:PROCONTRACT","portal":"UK_PROCONTRACT","notice_url":"https://procontract.due-north.com/SupplierRegistration/GridViewOpportunities","route":{"detail_url":"https://procontract.due-north.com/SupplierRegistration/GridViewOpportunities"}}
          {"candidate_id":"V14:DELTA","portal":"UK_DELTA","notice_url":"https://www.delta-esourcing.com/delta/loginRespondToList.html","route":{"detail_url":"https://www.delta-esourcing.com/delta/loginRespondToList.html"}}
          {"candidate_id":"V14:INTEND","portal":"UK_INTEND","notice_url":"https://ucl.in-tendhost.co.uk/ucl/aspx/FAQ","route":{"detail_url":"https://ucl.in-tendhost.co.uk/ucl/aspx/FAQ"}}
          {"candidate_id":"V14:JAGGAER","portal":"UK_JAGGAER","notice_url":"https://ministryofjusticecommercial.ukp.app.jaggaer.com/web/login.html","route":{"detail_url":"https://ministryofjusticecommercial.ukp.app.jaggaer.com/web/login.html"}}
          {"candidate_id":"V14:ATAMIS","portal":"UK_ATAMIS","notice_url":"https://atamis-9529.my.salesforce-sites.com/?SearchType=Projects","route":{"detail_url":"https://atamis-9529.my.salesforce-sites.com/?SearchType=Projects"}}
          {"candidate_id":"V14:SK","portal":"SK_UVO_PUBLIC","notice_url":"https://www.uvo.gov.sk/vyhladavanie/vyhladavanie-zakaziek/detail/558849","route":{"detail_url":"https://www.uvo.gov.sk/vyhladavanie/vyhladavanie-zakaziek/detail/558849","documents_url":"https://www.uvo.gov.sk/vyhladavanie/vyhladavanie-zakaziek/dokumenty/558849"}}
          {"candidate_id":"V14:DE-NRW","portal":"DE_EVERGABE_NRW","notice_url":"https://www.evergabe.nrw.de/VMPSatellite/notice/CXS7YDGYT8D4LQ59/documents","route":{"detail_url":"https://www.evergabe.nrw.de/VMPSatellite/notice/CXS7YDGYT8D4LQ59/documents"}}
          {"candidate_id":"V14:BG","portal":"BG_EOP_PUBLIC","notice_url":"https://app.eop.bg/today/584841","route":{"detail_url":"https://app.eop.bg/today/584841"}}
          {"candidate_id":"V14:CAT","portal":"ES_CATALONIA_PUBLIC","notice_url":"https://contractaciopublica.cat/ca/detall-publicacio/04a024a4-0945-467b-9689-66fa0e0b05c0/300786198","route":{"detail_url":"https://contractaciopublica.cat/ca/detall-publicacio/04a024a4-0945-467b-9689-66fa0e0b05c0/300786198"}}
          {"candidate_id":"V14:HU","portal":"HU_EKR_PUBLIC","notice_url":"https://ekr.gov.hu/portal/kozbeszerzes/eljarasok/EKR000199982025/reszletek","route":{"detail_url":"https://ekr.gov.hu/portal/kozbeszerzes/eljarasok/EKR000199982025/reszletek"}}
          JSONL
      - name: Exercise live routes without bypassing gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          for line in $(seq 1 12); do
            echo "=== v14 route $line ==="
            timeout 170s python pipeline/dce_worker_v14.py \
              --queue generated/v14_route_smoke.jsonl \
              --line "$line" \
              --out out || true
          done
      - name: Validate manifests and summarize outcomes
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in Path('out').rglob('manifest.json'):
              m=json.loads(p.read_text(encoding='utf-8'))
              rows.append({
                  'candidate_id':m.get('candidate_id'),
                  'portal':m.get('portal'),
                  'status':m.get('status'),
                  'files':len(m.get('files') or []),
                  'attempts':len(m.get('dce_method_attempts') or []),
              })
          rows.sort(key=lambda r:r['candidate_id'] or '')
          print(json.dumps(rows, indent=2, ensure_ascii=False))
          if len(rows) < 12:
              raise SystemExit(f'expected 12 manifests, got {len(rows)}')
          bad=[r for r in rows if r['status'] in {None,'STARTED','WORKER_ERROR','ADAPTER_PENDING'}]
          if bad:
              raise SystemExit(f'incomplete/unwired v14 results: {bad}')
          Path('v14-route-smoke-summary.json').write_text(json.dumps(rows, indent=2, ensure_ascii=False), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dce-v14-route-smoke-${{ github.run_id }}
          path: |
            v14-route-smoke-summary.json
            out/**/manifest.json
            out/**/portal_page*.txt
          retention-days: 3
          if-no-files-found: warn
