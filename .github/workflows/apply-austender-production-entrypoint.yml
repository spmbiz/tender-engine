name: Apply AusTender Production Entrypoint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-austender-production-entrypoint.yml'

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q requests pytest
      - name: Validate AU verified transport and production entrypoint
        run: |
          python -m py_compile pipeline/austender_bridge_transport.py pipeline/discover_austender_production.py pipeline/discover_austender_browser.py
          pytest -q tests/test_austender_bridge_transport.py
      - name: Route global production lane
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/supergreen-discovery-v2.yml')
          s=p.read_text()
          old='AU_AUSTENDER) python pipeline/discover_austender_browser.py ;;'
          new='AU_AUSTENDER) python pipeline/discover_austender_production.py ;;'
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('AusTender workflow route marker missing')
          PY
          grep -F 'AU_AUSTENDER) python pipeline/discover_austender_production.py ;;' .github/workflows/supergreen-discovery-v2.yml
      - name: Commit route if changed
        shell: bash
        run: |
          if git diff --quiet -- .github/workflows/supergreen-discovery-v2.yml; then
            echo 'route already patched'
            exit 0
          fi
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add .github/workflows/supergreen-discovery-v2.yml
          git commit -m 'austender: route global lane through verified production transport'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
