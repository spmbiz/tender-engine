name: Qwen Backlog Watchdog

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Notice Intelligence Ledger"
      - "Qwen Live Notice Classification"
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/qwen-backlog-watchdog.yml'
      - 'pipeline/qwen_semantic_controller.py'

permissions:
  actions: write
  contents: read

concurrency:
  group: qwen-backlog-watchdog
  cancel-in-progress: true

env:
  QWEN_PER_SHARD: '480'
  QWEN_SEMANTIC_MIN_CONTROL_PLANE_SHA: '7aa7dcff7de9122800632193f558095df8e05f0d'

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - id: inspect
        name: Inspect semantic lane with tested controller
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qwen-watchdog
          python pipeline/qwen_semantic_controller.py \
            --repo "$REPO" \
            --summary control/qwen_live/classification_summary.json \
            --out /tmp/qwen-watchdog/decision.json
          echo "remaining=$(jq -r '.remaining' /tmp/qwen-watchdog/decision.json)" >> "$GITHUB_OUTPUT"
          echo "ledger_source=$(jq -r '.ledger_source // "unknown"' /tmp/qwen-watchdog/decision.json)" >> "$GITHUB_OUTPUT"
          echo "semantic_source=$(jq -r '.semantic_source // "unknown"' /tmp/qwen-watchdog/decision.json)" >> "$GITHUB_OUTPUT"
          echo "source_gap=$(jq -r '.source_gap' /tmp/qwen-watchdog/decision.json)" >> "$GITHUB_OUTPUT"
          echo "superseded_count=$(jq -r '.cancel_count' /tmp/qwen-watchdog/decision.json)" >> "$GITHUB_OUTPUT"
          echo "authorized_queued=$(jq '[.queued[] | select(.controller_authorized == true)] | length' /tmp/qwen-watchdog/decision.json)" >> "$GITHUB_OUTPUT"
          echo "need_dispatch=$(jq -r '.need_dispatch' /tmp/qwen-watchdog/decision.json)" >> "$GITHUB_OUTPUT"
          echo "lane_covered=$(jq -r '.lane_covered' /tmp/qwen-watchdog/decision.json)" >> "$GITHUB_OUTPUT"

      - id: recover
        name: Queue exactly one fresh replacement without preempting compute
        if: steps.inspect.outputs.need_dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AUTHORIZED_QUEUED: ${{ steps.inspect.outputs.authorized_queued }}
        shell: bash
        run: |
          set -euo pipefail
          # Never kill a running or queued semantic generation. If the controller
          # says the lane is unhealthy/stale, enqueue one current replacement and
          # let workflow concurrency (cancel-in-progress:false) start it naturally.
          if [ "${AUTHORIZED_QUEUED:-0}" -gt 0 ]; then
            echo 'A controller-authorized replacement is already queued; no duplicate dispatch.'
            echo 'dispatched=false' >> "$GITHUB_OUTPUT"
            echo 'replacement_already_queued=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh workflow run qwen-live-classification.yml --repo "$REPO" --ref main \
            -f per_shard="$QWEN_PER_SHARD" \
            -f auto_continue=true \
            -f dce_limit=160
          echo 'dispatched=true' >> "$GITHUB_OUTPUT"
          echo 'replacement_already_queued=false' >> "$GITHUB_OUTPUT"

      - name: Confirm replacement is visible
        if: steps.recover.outputs.dispatched == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 12); do
            fresh="$(gh run list --repo "$REPO" --workflow qwen-live-classification.yml --limit 20 --json status,event --jq '[.[] | select(.event=="workflow_dispatch") | select(.status=="queued" or .status=="waiting" or .status=="pending" or .status=="requested" or .status=="in_progress")] | length')"
            [ "$fresh" -gt 0 ] && exit 0
            sleep 5
          done
          echo 'Fresh semantic dispatch was not visible after 60s.' >&2
          exit 1

      - name: Controller summary
        if: always()
        run: |
          echo '### Qwen semantic controller' >> "$GITHUB_STEP_SUMMARY"
          echo "- durable remaining: ${{ steps.inspect.outputs.remaining }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- latest ledger source: ${{ steps.inspect.outputs.ledger_source }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- stable semantic source: ${{ steps.inspect.outputs.semantic_source }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- lane covered: ${{ steps.inspect.outputs.lane_covered }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- superseded/stale runs observed (not cancelled): ${{ steps.inspect.outputs.superseded_count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- replacement dispatched: ${{ steps.recover.outputs.dispatched }}" >> "$GITHUB_STEP_SUMMARY"
          echo '- recovery is non-preemptive: stale/duplicate runs are observed but never cancelled by this watchdog.' >> "$GITHUB_STEP_SUMMARY"
          echo '- productivity heartbeat is the guarded checkpoint asset; split/log churn cannot fake health.' >> "$GITHUB_STEP_SUMMARY"
