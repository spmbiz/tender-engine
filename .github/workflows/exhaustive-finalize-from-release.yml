name: Finalize Exhaustive Every-Record Master

on:
  workflow_run:
    workflows: ["SPM Exhaustive Every-Record Historical Read v1"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download validated source summaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=market-intelligence-exhaustive-every-record-v1
          mkdir -p all
          for p in global_core australia usa; do
            for suffix in summary.json REPORT.md; do
              gh release download "$TAG" --repo walidgdg1-ai/tender-engine --pattern "${p}_${suffix}" --dir all --clobber
            done
          done
      - name: Reconcile whole canonical structured corpus
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('all')
          prefixes=['global_core','australia','usa']
          ss=[json.load(open(root/f'{p}_summary.json',encoding='utf-8')) for p in prefixes]
          for s in ss:
            assert s['integrity']['status']=='PASS',s
            assert s['integrity']['all_rows_materialized'] is True,s
            assert s['integrity']['no_row_filter_before_scoring'] is True,s
            assert s['integrity']['scan_ordinal_min']==1,s
            assert s['integrity']['scan_ordinal_max']==s['counts']['procurement_records'],s
            assert sum(s['discovery_bucket_counts'].values())==s['counts']['procurement_records'],s
            assert sum(s['route_counts'].values())==s['counts']['procurement_records'],s
          totals={k:sum(s['counts'][k] for s in ss) for k in ['procurement_records','award_rows','award_supplier_links']}
          assert totals=={'procurement_records':18271075,'award_rows':20307312,'award_supplier_links':19958191},totals
          by_grain={s['grain']:by_grain.get(s['grain'],0)+s['counts']['procurement_records'] if False else 0 for s in []}
          master={
            'version':'SPM_EXHAUSTIVE_EVERY_RECORD_MASTER_V1_FINAL',
            'status':'PASS',
            'source_summaries':ss,
            'totals':totals,
            'canonical_procurement_grains':{
              'notice_first_global_core_v4':2250547,
              'award_first_usaspending_v1':15842317,
              'award_first_austender_v1':178211
            },
            'reconciliation_checks':{
              'procurement_total_expected':18271075,
              'award_total_expected':20307312,
              'supplier_link_total_expected':19958191,
              'all_source_integrity_pass':True,
              'all_source_discovery_buckets_sum_to_rows':True,
              'all_source_routes_sum_to_rows':True,
              'all_source_ordinals_contiguous':True
            },
            'interpretation':[
              'Global Core v4 is the overlap-aware notice-first corpus. Do not add national component releases again.',
              'USAspending and AusTender are award-first evidence lanes, not reconstructed original tender notices.',
              'Every structured procurement row was individually materialized and scored before aggregation; every award and award-supplier link row was scanned.',
              'This does not mean every underlying DCE/PDF attachment was fetched or manually read. DCE/PDF review remains selective at the live/final qualification stage.',
              'Named-lane and open-world semantic labels are analytical classifications and require QA before commercial promotion; raw record accounting is exhaustive.'
            ]
          }
          out=Path('control/exhaustive_every_record_v1');out.mkdir(parents=True,exist_ok=True)
          (out/'MASTER_SUMMARY.json').write_text(json.dumps(master,ensure_ascii=False,indent=2),encoding='utf-8')
          lines=['# SPM Exhaustive Every-Record Historical Read — FINAL MASTER','', '**STATUS: PASS**','',
                 f"- Structured procurement records individually materialized/scored: **{totals['procurement_records']:,}**",
                 f"- Award rows scanned: **{totals['award_rows']:,}**",
                 f"- Award↔supplier links scanned: **{totals['award_supplier_links']:,}**",'',
                 '## Canonical grains','',
                 '- Global Core v4 notice-first: **2,250,547**',
                 '- USAspending award-first: **15,842,317**',
                 '- AusTender award-first: **178,211**','',
                 '## Integrity','']
          for s in ss:
            d=s['discovery_bucket_counts'];c=s['counts']
            lines += [f"### {s['label']}",
                      f"- PASS — ordinal 1..{c['procurement_records']:,}; distinct IDs {c['distinct_procurement_ids']:,}",
                      f"- Known lane {d.get('KNOWN_LANE',0):,}; open-world candidate {d.get('OPEN_WORLD_CANDIDATE',0):,}; residual {d.get('RESIDUAL',0):,}",
                      f"- Procurement fingerprint `{s['fingerprints']['procurement_hash_sum']}`",'']
          lines += ['## Boundary of the claim','',
                    'This is an exhaustive read of the **canonical structured rows**, not a claim that millions of external DCE/PDF attachments were manually opened. Attachments are intentionally resolved selectively for live/final candidates because eligibility, references, turnover, insurance, language, onsite burden, pricing forms, and contractual obligations often exist only there.','',
                    'Semantic lane labels are analytical classifications. They are not allowed to override source facts or convert UNKNOWN eligibility into PASS.','']
          (out/'MASTER_REPORT.md').write_text('\n'.join(lines),encoding='utf-8')
          PY
      - name: Publish and persist final master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=market-intelligence-exhaustive-every-record-v1
          gh release upload "$TAG" control/exhaustive_every_record_v1/MASTER_SUMMARY.json control/exhaustive_every_record_v1/MASTER_REPORT.md --repo walidgdg1-ai/tender-engine --clobber
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/exhaustive_every_record_v1/MASTER_SUMMARY.json control/exhaustive_every_record_v1/MASTER_REPORT.md
          git commit -m 'tenders: persist final exhaustive every-record master' || exit 0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*3))
          done
          exit 1
