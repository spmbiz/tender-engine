name: Historical Open World Untagged Full v3.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - historical_lab/open_world_untagged_full_v3_1.py
      - .github/workflows/historical-open-world-untagged-full-v3-1.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download full v2 review queues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input out
          gh release download historical-open-world-unknowns-v2 --repo "$GITHUB_REPOSITORY" --pattern semantic_review_queue.jsonl --dir input --clobber
          gh release download historical-open-world-unknowns-v2 --repo "$GITHUB_REPOSITORY" --pattern code_only_review_queue.jsonl --dir input --clobber
      - name: Persist all remaining unknown clusters
        run: python historical_lab/open_world_untagged_full_v3_1.py --semantic input/semantic_review_queue.jsonl --code-only input/code_only_review_queue.jsonl --semantic-start 1000 --semantic-end 3000 --out out
      - name: Persist authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=historical-open-world-untagged-full-v3-1
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main --title 'Historical Open World Untagged Full v3.1' --notes 'Complete persistence of the remaining open-world unknown cluster queue; no top-1000 truncation.'
          gh release upload "$TAG" out/summary.json out/REPORT.md out/untagged_all.jsonl out/tagged_all.jsonl --repo "$GITHUB_REPOSITORY" --clobber
          mkdir -p control/historical_open_world_untagged_full_v3_1
          cp out/summary.json out/REPORT.md control/historical_open_world_untagged_full_v3_1/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/historical_open_world_untagged_full_v3_1/
          git commit -m 'historical: persist full open-world unknown queue v3.1' || exit 0
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*3))
          done
          exit 1
