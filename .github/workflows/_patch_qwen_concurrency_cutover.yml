name: One-shot Qwen concurrency cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_patch_qwen_concurrency_cutover.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Qwen concurrency safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/qwen-live-classification.yml')
          s=p.read_text(encoding='utf-8')
          old="concurrency:\n  group: qwen-live-notice-classification\n  cancel-in-progress: false\n"
          expr='$' + "{{ github.event_name == 'push' }}"
          new=("concurrency:\n"
               "  group: qwen-live-notice-classification\n"
               "  # A code push supersedes stale architecture runs; scheduled/self-continued passes stay serialized.\n"
               f"  cancel-in-progress: {expr}\n")
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one Qwen concurrency block, found {s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          grep -A4 '^concurrency:' .github/workflows/qwen-live-classification.yml
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_patch_qwen_concurrency_cutover.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/qwen-live-classification.yml .github/workflows/_patch_qwen_concurrency_cutover.yml
          git commit -m 'qwen: let code pushes supersede stale fleet runs'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Cancel stale Qwen runs and launch fresh main pass
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run list --workflow qwen-live-classification.yml --limit 50 --json databaseId,status \
            --jq '.[] | select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested") | .databaseId' \
            | while read -r id; do
                [ -n "$id" ] || continue
                echo "Cancelling stale Qwen run $id"
                gh run cancel "$id" || true
              done
          sleep 3
          gh workflow run qwen-live-classification.yml --ref main
          echo 'Fresh Qwen main pass dispatched.'
