name: Qwen DCE Kick Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qwen-dce-kick-now.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch persisted Qwen semantic DCE lane if free
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow dce-fanout-v2.yml --limit 30 --json status --jq '[.[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending")] | length')"
          if [ "$active" -gt 0 ]; then
            echo "DCE fleet busy ($active); refusing duplicate dispatch"
            exit 0
          fi
          gh workflow run dce-fanout-v2.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f selection_path=queues/qwen_live_selection_latest.jsonl \
            -f source_discovery_run=31923649637 \
            -f max_jobs=120 \
            -f max_parallel=6 \
            -f jobs_per_shard=0
          echo "DISPATCHED_QWEN_DCE selection=queues/qwen_live_selection_latest.jsonl max_jobs=120 max_parallel=6 source=31923649637"
