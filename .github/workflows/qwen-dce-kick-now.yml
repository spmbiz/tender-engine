name: Qwen DCE Kick Now (Controller Wake)

# Legacy operator shortcut retained only as a manual wake. Candidate selection,
# source generation, backlog caps and DCE admission are owned by the canonical
# Qwen DCE drainer; this workflow must never dispatch DCE Fanout directly.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: qwen-dce-kick-controller-wake
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake canonical Qwen DCE controller
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run qwen-dce-drainer.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'Canonical Qwen DCE drainer woken. No direct DCE Fanout dispatch occurred.'
