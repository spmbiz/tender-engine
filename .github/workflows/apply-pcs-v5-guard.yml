name: Apply PCS V5 Registry Guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-pcs-v5-guard.yml'

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch PCS V5 guard contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pipeline/source_coverage_guard.py')
          s=p.read_text()
          marker='    source=str(obj.get("source") or "").upper()\n'
          block='''    if listing.startswith("PCS_CURRENT_OPPORTUNITY_REGISTRY_V5_AUTHORITATIVE_PLUS_BULK_ENRICHMENT"):\n        rec=obj.get("current_universe_reconciliation") if isinstance(obj.get("current_universe_reconciliation"),dict) else {}\n        if rec.get("direct_current_contract_complete") is not True:\n            bad.append({"path":str(path),"reason":"PCS_DIRECT_CURRENT_CONTRACT_INCOMPLETE","source":source})\n        if rec.get("coverage_complete") is not True:\n            bad.append({"path":str(path),"reason":"PCS_CURRENT_REGISTRY_COVERAGE_INCOMPLETE","source":source})\n        try:\n            direct_rows=int(rec.get("direct_current_rows"))\n            final_rows=int(rec.get("final_current_rows"))\n            reported=int(rec.get("direct_official_total_reported"))\n        except Exception:\n            direct_rows=final_rows=reported=-1\n        if direct_rows <= 0 or final_rows != direct_rows or reported != direct_rows:\n            bad.append({"path":str(path),"reason":"PCS_CURRENT_REGISTRY_COUNT_MISMATCH","source":source,"reported":rec.get("direct_official_total_reported"),"direct_rows":rec.get("direct_current_rows"),"final_rows":rec.get("final_current_rows")})\n        if obj.get("enumeration_complete") is not True or obj.get("live_coverage_credit_allowed") is not True:\n            bad.append({"path":str(path),"reason":"PCS_V5_LIVE_COVERAGE_CREDIT_MISSING","source":source})\n        return\n'''
          if 'PCS_CURRENT_OPPORTUNITY_REGISTRY_V5_AUTHORITATIVE_PLUS_BULK_ENRICHMENT' not in s:
              if marker not in s:
                  raise SystemExit('guard insertion marker not found')
              s=s.replace(marker, marker+block, 1)
              p.write_text(s)
          PY
      - name: Syntax and synthetic contract tests
        run: |
          python -m py_compile pipeline/source_coverage_guard.py pipeline/reconcile_uk_pcs_registry_authoritative.py pipeline/discover_uk_pcs_current.py
          python - <<'PY'
          from pipeline.source_coverage_guard import pcs_contract_health
          from pathlib import Path
          good={
            'source':'UK_PCS_OCDS',
            'listing_contract':'PCS_CURRENT_OPPORTUNITY_REGISTRY_V5_AUTHORITATIVE_PLUS_BULK_ENRICHMENT',
            'enumeration_complete':True,
            'live_coverage_credit_allowed':True,
            'current_universe_reconciliation':{
              'direct_current_contract_complete':True,
              'coverage_complete':True,
              'direct_official_total_reported':586,
              'direct_current_rows':586,
              'final_current_rows':586,
            },
          }
          bad=[]; pcs_contract_health(good,Path('x'),bad); assert bad==[],bad
          broken={**good,'current_universe_reconciliation':{**good['current_universe_reconciliation'],'final_current_rows':585}}
          bad=[]; pcs_contract_health(broken,Path('x'),bad); assert bad and bad[0]['reason']=='PCS_CURRENT_REGISTRY_COUNT_MISMATCH',bad
          print('PCS_V5_GUARD_TEST_PASS')
          PY
      - name: Commit guard if changed
        shell: bash
        run: |
          if git diff --quiet -- pipeline/source_coverage_guard.py; then
            echo 'guard already patched'
            exit 0
          fi
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add pipeline/source_coverage_guard.py
          git commit -m 'pcs: accept exhaustive Current Opportunity registry as live truth'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
