name: Force Stop Prepatch Qwen Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-stop-prepatch-qwen-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel pre-patch Qwen run again after always-aggregate started
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 32069021831 --repo "$GITHUB_REPOSITORY" || true
