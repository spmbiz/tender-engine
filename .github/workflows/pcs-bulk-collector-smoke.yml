name: PCS Bulk Collector Smoke

on:
  push:
    branches: [main]
    paths:
      - 'control/pcs_bulk_collector_smoke_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1, fetch-tags: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests beautifulsoup4
      - name: Run two-month official bulk reconstruction
        shell: bash
        run: |
          set +e
          DISCOVERY_OUT=lane-out/UK_PCS_OCDS python pipeline/discover_uk_pcs_bulk_current.py --months 2 --workers 3
          rc=$?
          export ADAPTER_RC="$rc"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('lane-out/UK_PCS_OCDS/stats.json')
          s=json.loads(p.read_text()) if p.exists() else {'errors':[{'type':'STATS_MISSING'}]}
          payload={
            'schema':'PCS_BULK_COLLECTOR_SMOKE_V2_TYPE101',
            'adapter_exit_code':int(os.environ['ADAPTER_RC']),
            'listing_contract':s.get('listing_contract'),
            'notice_types':s.get('notice_types'),
            'requests_expected':s.get('requests_expected'),
            'requests_completed':s.get('requests_completed'),
            'source_releases_seen':s.get('source_releases_seen'),
            'current_materialized':s.get('current_materialized'),
            'publication_window_enumeration_complete':s.get('publication_window_enumeration_complete'),
            'errors':s.get('errors') or [],
            'pass_recall':int(os.environ['ADAPTER_RC'])==0 and bool(s.get('current_materialized')) and s.get('requests_completed')==s.get('requests_expected'),
          }
          Path('control/pcs_bulk_collector_smoke.json').write_text(json.dumps(payload,indent=2)+'\n')
          print(json.dumps(payload,indent=2))
          PY
          exit 0
      - name: Persist smoke
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f control/pcs_bulk_collector_smoke.json ]; then
            printf '%s\n' '{"schema":"PCS_BULK_COLLECTOR_SMOKE_WORKFLOW_FAILURE","pass_recall":false}' > control/pcs_bulk_collector_smoke.json
          fi
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add control/pcs_bulk_collector_smoke.json
          git diff --cached --quiet && exit 0
          git commit -m "diag: persist PCS bulk collector smoke ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; git rebase --abort >/dev/null 2>&1 || true; sleep $((i*2)); done
          exit 1
