name: Audit TED Downstream Coverage

on:
  workflow_dispatch:
    inputs:
      dce_run:
        description: DCE Fanout run ID whose canonical Release should be audited
        required: false
        default: '31844708410'
  push:
    branches: [main]
    paths:
      - 'benchmarks/ted-downstream-audit-trigger.json'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DCE_RUN: ${{ github.event.inputs.dce_run || '31844708410' }}
    steps:
      - uses: actions/checkout@v4
      - name: Download all compact handoffs from canonical Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="dce-harvest-${DCE_RUN}"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          mkdir -p handoffs extracted
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'handoff-shard-*.tar.gz' --dir handoffs
          count=0
          for a in handoffs/handoff-shard-*.tar.gz; do
            [ -e "$a" ] || continue
            b="$(basename "$a" .tar.gz)"
            mkdir -p "extracted/$b"
            tar -xzf "$a" -C "extracted/$b"
            count=$((count+1))
          done
          echo "handoffs=$count"
          test "$count" -gt 0
      - name: Audit statuses and downstream domains
        run: python pipeline/audit_ted_downstream.py --root extracted --out "ted-downstream-audit-${DCE_RUN}.json"
      - name: Persist audit durably
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset="ted-downstream-audit-${DCE_RUN}.json"
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$asset" --clobber
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$asset"
