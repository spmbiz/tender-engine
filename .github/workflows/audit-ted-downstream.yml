name: Audit TED Downstream Coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmarks/ted-downstream-audit-trigger.json'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: dce-harvest-31844139173
    steps:
      - uses: actions/checkout@v4
      - name: Download all compact handoffs from canonical Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoffs extracted
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'handoff-shard-*.tar.gz' --dir handoffs
          count=0
          for a in handoffs/handoff-shard-*.tar.gz; do
            [ -e "$a" ] || continue
            b="$(basename "$a" .tar.gz)"
            mkdir -p "extracted/$b"
            tar -xzf "$a" -C "extracted/$b"
            count=$((count+1))
          done
          echo "handoffs=$count"
          test "$count" -eq 64
      - name: Audit statuses and downstream domains
        run: python pipeline/audit_ted_downstream.py --root extracted --out ted-downstream-audit-31844139173.json
      - name: Persist audit durably
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" ted-downstream-audit-31844139173.json --clobber
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq ted-downstream-audit-31844139173.json
