name: PCS V6 Isolated Probe

on:
  push:
    branches: [main]
    paths:
      - 'control/pcs_v6_isolated_probe_trigger.txt'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q playwright
      - name: Reuse runner Chrome
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$chrome" ]; then echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"; else python -m playwright install --with-deps chromium; fi
      - name: Traverse five pages with isolated V6 advance
        env:
          DISCOVERY_OUT: pcs-v6-probe
        shell: bash
        run: |
          set +e
          python tools/run_pcs_v6_probe.py
          rc=$?
          export RC="$rc"
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads(Path('pcs-v6-probe/stats.json').read_text(encoding='utf-8')) if Path('pcs-v6-probe/stats.json').exists() else {}
          rows=[]
          if Path('pcs-v6-probe/current.jsonl').exists():
              for line in Path('pcs-v6-probe/current.jsonl').read_text(encoding='utf-8').splitlines():
                  try: rows.append(json.loads(line))
                  except Exception: pass
          pages=[x.get('page') for x in (s.get('telemetry') or {}).get('pages',[]) if x.get('page') is not None]
          payload={'schema':'PCS_V6_ISOLATED_PROBE_V1','adapter_exit_code':int(os.environ.get('RC') or 0),'pages_fetched':s.get('pages_fetched'),'page_numbers_seen':pages,'current_materialized':s.get('current_materialized'),'unique_candidate_ids':len({r.get('candidate_id') for r in rows if r.get('candidate_id')}),'total_reported':s.get('total_reported'),'errors':s.get('errors') or [],'warnings':s.get('warnings') or [],'pagination_progress_proven':len(set(pages))>=3 and len({r.get('candidate_id') for r in rows if r.get('candidate_id')})>=20}
          Path('control/pcs_v6_isolated_probe.json').write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(payload,indent=2,ensure_ascii=False))
          PY
      - name: Persist probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f control/pcs_v6_isolated_probe.json || exit 1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add control/pcs_v6_isolated_probe.json
          git diff --cached --quiet && exit 0
          git commit -m "diag: persist PCS V6 isolated probe ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
