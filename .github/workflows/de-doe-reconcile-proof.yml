name: Germany DOE Full Reconcile Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'control/de_doe_reconcile_trigger.txt'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests pytest
      - name: Unit and syntax gate
        run: |
          python -m py_compile pipeline/discover_de_doe_ocds.py pipeline/ocds_release_normalizer.py
          pytest -q tests/test_de_doe_ocds.py
      - name: Create durable proof Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="de-doe-reconcile-proof-${GITHUB_RUN_ID}"
          gh release create "$tag" --title "Germany DOE reconcile proof ${GITHUB_RUN_ID}" --notes "Official Bekanntmachungsservice monthly OCDS traversal from 2022-12 through current month."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Exhaust official monthly publication history
        id: run
        env:
          DISCOVERY_MODE: reconcile
          DISCOVERY_OUT: de-reconcile
          DE_DOE_WORKERS: '4'
          DE_DOE_RETRIES: '6'
        shell: bash
        run: |
          set +e
          python pipeline/discover_de_doe_ocds.py
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build compact fail-closed verdict
        if: always()
        env:
          RUN_RC: ${{ steps.run.outputs.rc }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('de-reconcile/stats.json')
          s=json.loads(p.read_text()) if p.exists() else {}
          try: rc=int(os.environ.get('RUN_RC') or 999)
          except Exception: rc=999
          requested=s.get('months_requested')
          completed=s.get('months_completed')
          passed=bool(
              rc==0
              and s.get('listing_contract')=='DE_DOE_OFFICIAL_MONTHLY_OCDS_V1'
              and s.get('full_publication_history_requested') is True
              and s.get('publication_window_enumeration_complete') is True
              and s.get('enumeration_complete') is True
              and s.get('enumeration_exhausted') is True
              and s.get('live_coverage_credit_allowed') is True
              and not (s.get('errors') or [])
              and requested is not None and completed==requested
              and int(s.get('current_materialized') or 0)>0
          )
          proof={
              'schema':'DE_DOE_FULL_RECONCILE_PROOF_V1',
              'release_tag':os.environ.get('RELEASE_TAG'),
              'adapter_exit_code':rc,
              'listing_contract':s.get('listing_contract'),
              'first_official_month':s.get('first_official_month'),
              'last_requested_month':s.get('last_requested_month'),
              'months_requested':requested,
              'months_completed':completed,
              'source_releases_seen':s.get('source_releases_seen'),
              'raw_materialized':s.get('raw_materialized'),
              'current_materialized':s.get('current_materialized'),
              'publication_window_enumeration_complete':s.get('publication_window_enumeration_complete'),
              'enumeration_complete':s.get('enumeration_complete'),
              'live_coverage_credit_allowed':s.get('live_coverage_credit_allowed'),
              'errors':s.get('errors') or [],
              'pass':passed,
          }
          Path('control/de_doe_reconcile_proof.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps(proof,indent=2))
          PY
      - name: Preserve proof pack durably
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          test -f de-reconcile/stats.json
          tar -czf de-doe-reconcile-proof.tar.gz de-reconcile/stats.json de-reconcile/current.jsonl control/de_doe_reconcile_proof.json
          gh release upload "$RELEASE_TAG" de-doe-reconcile-proof.tar.gz --clobber
      - name: Persist compact verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f control/de_doe_reconcile_proof.json || printf '%s\n' '{"schema":"DE_DOE_RECONCILE_WORKFLOW_FAILURE","pass":false}' > control/de_doe_reconcile_proof.json
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add control/de_doe_reconcile_proof.json
          git diff --cached --quiet && exit 0
          git commit -m "diag: persist Germany DOE reconcile proof ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
      - name: Enforce verdict
        if: always()
        run: python -c "import json; s=json.load(open('control/de_doe_reconcile_proof.json')); raise SystemExit(0 if s.get('pass') is True else 3)"
