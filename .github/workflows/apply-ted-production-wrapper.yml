name: Apply TED Production Wrapper

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ted-production-wrapper.yml'

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply narrow production patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          ted = Path('pipeline/discover_ted.py')
          text = ted.read_text(encoding='utf-8')
          old = '''if __name__ == "__main__":\n    run()\n'''
          new = '''if __name__ == "__main__":\n    mode = os.getenv("DISCOVERY_MODE", "").strip().lower()\n    explicit_query = bool(os.getenv("TED_QUERY", "").strip())\n    orchestrator_disabled = os.getenv("TED_DISABLE_PRODUCTION_ORCHESTRATOR", "").strip().lower() in {"1", "true", "yes"}\n    if mode in {"delta", "reconcile"} and not explicit_query and not orchestrator_disabled:\n        # Production global runs use a fast actionable delta and a deep,\n        # independently year-sharded reconcile. Explicit TED_QUERY runs (smokes,\n        # probes, regression tests) keep the single-query collector unchanged.\n        from ted_production import run_production\n        raise SystemExit(run_production(mode, OUT))\n    run()\n'''
          if old not in text:
              if new not in text:
                  raise SystemExit('discover_ted.py entrypoint shape changed; refusing blind patch')
          else:
              ted.write_text(text.replace(old, new, 1), encoding='utf-8')

          guard = Path('pipeline/source_coverage_guard.py')
          g = guard.read_text(encoding='utf-8')
          old_guard = 'STRICT_EXHAUSTION_SOURCES={"TED","LT_CVP_API","AU_AUSTENDER","CYPRUS_EPPS","MALTA_EPPS","UNGM_PUBLIC","UK_PCS_OCDS"}'
          new_guard = 'STRICT_EXHAUSTION_SOURCES={"TED","LT_CVP_API","AU_AUSTENDER","CYPRUS_EPPS","MALTA_EPPS","UNGM_PUBLIC","UK_PCS_OCDS","ZA_ETENDERS_OCDS"}'
          if old_guard in g:
              guard.write_text(g.replace(old_guard, new_guard, 1), encoding='utf-8')
          elif new_guard not in g:
              raise SystemExit('source_coverage_guard strict set changed; refusing blind patch')
          PY
      - name: Compile and run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest requests
          python -m py_compile pipeline/discover_ted.py pipeline/ted_production.py pipeline/merge_ted_year_shards.py pipeline/source_coverage_guard.py
          pytest -q tests/test_ted_transport_resilience.py tests/test_ted_production_orchestrator.py
      - name: Publish patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git rm .github/workflows/apply-ted-production-wrapper.yml
          git add pipeline/discover_ted.py pipeline/source_coverage_guard.py
          git commit -m "ted: promote sharded production discovery and ZA exhaustion guard"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*3))
          done
          exit 1
