name: Canonicalize Current Mega DCE Run

on:
  push:
    branches: [main]
    paths:
      - 'state/canonicalize_trigger.txt'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download source artifact from previous run
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9233483215'
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o source_artifact.zip
          mkdir -p source
          unzip -q source_artifact.zip -d source
          echo "source_zip_bytes=$(stat -c%s source_artifact.zip)"
      - name: Repack exact canonical data into Drive-sized chunks
        run: |
          python pipeline/repack_canonical_chunks.py \
            --root source \
            --out canonical_chunks \
            --chunks 5 \
            --source-artifact-id 9233483215 \
            --source-artifact-sha256 0ff9dd6c94b09bd56d458f401b91fa5d88a188bc485b5be790086a734096a487
          cat canonical_chunks/canonical_manifest.json
          for f in canonical_chunks/canonical_chunk_*.zip; do stat -c '%n %s bytes' "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-31838467001-chunk-00
          path: canonical_chunks/canonical_chunk_00.zip
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-31838467001-chunk-01
          path: canonical_chunks/canonical_chunk_01.zip
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-31838467001-chunk-02
          path: canonical_chunks/canonical_chunk_02.zip
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-31838467001-chunk-03
          path: canonical_chunks/canonical_chunk_03.zip
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-31838467001-chunk-04
          path: canonical_chunks/canonical_chunk_04.zip
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-31838467001-manifest
          path: canonical_chunks/canonical_manifest.json
          retention-days: 1
