name: Canonicalize Current Mega DCE Run (Legacy Manual)

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact source artifact from previous run
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9233483215'
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o source_artifact.zip
          mkdir -p source
          unzip -q source_artifact.zip -d source
          echo "source_zip_bytes=$(stat -c%s source_artifact.zip)"
      - name: Repack exact canonical data into durable chunks
        run: |
          python pipeline/repack_canonical_chunks.py \
            --root source \
            --out canonical_chunks \
            --chunks 5 \
            --source-artifact-id 9233483215 \
            --source-artifact-sha256 0ff9dd6c94b09bd56d458f401b91fa5d88a188bc485b5be790086a734096a487
          cat canonical_chunks/canonical_manifest.json
      - name: Persist canonical chunks durably and verify
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="canonical-dce-31838467001-${GITHUB_RUN_ID}"
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" \
            --notes "Durable canonical repack of legacy DCE run 31838467001. No Actions artifact is used as canonical storage."
          assets=(canonical_chunks/canonical_chunk_*.zip canonical_chunks/canonical_manifest.json)
          gh release upload "$tag" "${assets[@]}"
          gh release view "$tag" --json assets --jq '.assets[].name' > /tmp/assets.txt
          for asset in "${assets[@]}"; do
            grep -Fxq "$(basename "$asset")" /tmp/assets.txt
          done
