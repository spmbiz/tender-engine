name: PCS V6 Validated Self-Heal

on:
  push:
    branches: [main]
    paths:
      - 'control/pcs_v6_selfheal_trigger.txt'

permissions:
  contents: write

concurrency:
  group: pcs-v6-validated-selfheal
  cancel-in-progress: false

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply proposed V6 patch locally
        run: python tools/apply_pcs_postback_v6.py
      - run: python -m pip install --disable-pip-version-check -q playwright
      - name: Reuse runner Chrome
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$chrome" ]; then echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"; else python -m playwright install --with-deps chromium; fi
      - name: Prove PCS page progression on patched core
        env:
          DISCOVERY_OUT: pcs-v6-selfheal
          PCS_CURRENT_MAX_PAGES: '5'
          PCS_CURRENT_PAGE_WAIT_MS: '300'
        shell: bash
        run: |
          set +e
          python pipeline/discover_uk_pcs_current.py > pcs-v6-selfheal.log 2>&1
          rc=$?
          cat pcs-v6-selfheal.log
          export RC="$rc"
          python - <<'PY'
          import json,os
          from pathlib import Path
          stats=json.loads(Path('pcs-v6-selfheal/stats.json').read_text(encoding='utf-8')) if Path('pcs-v6-selfheal/stats.json').exists() else {}
          rows=[]
          cur=Path('pcs-v6-selfheal/current.jsonl')
          if cur.exists():
              for line in cur.read_text(encoding='utf-8').splitlines():
                  try: rows.append(json.loads(line))
                  except Exception: pass
          pages=[x.get('page') for x in (stats.get('telemetry') or {}).get('pages',[]) if x.get('page') is not None]
          ids={r.get('candidate_id') for r in rows if r.get('candidate_id')}
          log=Path('pcs-v6-selfheal.log').read_text(encoding='utf-8',errors='replace') if Path('pcs-v6-selfheal.log').exists() else ''
          proven=len(set(pages))>=3 and len(ids)>=20 and pages[:3]==[1,2,3]
          payload={
            'schema':'PCS_V6_VALIDATED_SELFHEAL_V1',
            'adapter_exit_code':int(os.environ.get('RC') or 0),
            'listing_contract':stats.get('listing_contract'),
            'pages_fetched':stats.get('pages_fetched'),
            'page_numbers_seen':pages,
            'current_materialized':stats.get('current_materialized'),
            'unique_candidate_ids':len(ids),
            'total_reported':stats.get('total_reported'),
            'errors':stats.get('errors') or [],
            'warnings':stats.get('warnings') or [],
            'log_tail':log[-12000:],
            'pagination_progress_proven':proven,
          }
          Path('control/pcs_v6_selfheal_result.json').write_text(json.dumps(payload,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          Path('/tmp/pcs_v6_proven').write_text('1' if proven else '0')
          print(json.dumps(payload,indent=2,ensure_ascii=False))
          PY
      - name: Commit only if live progression proved; always persist diagnosis
        shell: bash
        run: |
          set -euo pipefail
          proven="$(cat /tmp/pcs_v6_proven)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$proven" = 1 ]; then
            git add pipeline/discover_uk_pcs_current.py control/pcs_v6_selfheal_result.json
            msg='discovery: validate and enable PCS ASP.NET pager V6'
          else
            git checkout -- pipeline/discover_uk_pcs_current.py
            git add control/pcs_v6_selfheal_result.json
            msg='diag: persist failed PCS V6 self-heal'
          fi
          git diff --cached --quiet && exit 0
          git commit -m "$msg"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
