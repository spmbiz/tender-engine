name: Repair Discovery 31840648379 (Manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: discovery-harvest-31840648379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q requests
      - name: Re-harvest only TED with corrected complete fresh window
        env:
          TED_SCOPE: ACTIVE
          TED_MAX_PAGES: '80'
          TED_LOOKBACK_DAYS: '10'
          DISCOVERY_OUT: discovery/ted-fixed
        run: python pipeline/discover_ted.py
      - name: Persist TED harvest durably BEFORE completeness validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar -C discovery/ted-fixed -czf discovery-ted-fixed-attempt-${GITHUB_RUN_ID}.tar.gz .
          gh release upload "$RELEASE_TAG" "discovery-ted-fixed-attempt-${GITHUB_RUN_ID}.tar.gz" --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "discovery-ted-fixed-attempt-${GITHUB_RUN_ID}.tar.gz"
      - name: Require complete non-truncated TED harvest
        run: |
          python - <<'PY'
          import json
          s=json.load(open('discovery/ted-fixed/stats.json'))
          print(json.dumps(s,indent=2))
          assert s['materialized_unique'] > 1000, s
          assert not s['errors'], s
          assert not s['truncated_by_page_cap'], s
          if s.get('total_reported') is not None:
              assert s['source_items_seen'] >= s['total_reported'], s
          PY
      - name: Publish canonical corrected TED alias after validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "discovery-ted-fixed-attempt-${GITHUB_RUN_ID}.tar.gz" discovery-ted-fixed.tar.gz
          gh release upload "$RELEASE_TAG" discovery-ted-fixed.tar.gz --clobber
      - name: Download every durable source pack for original run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-download discovery-download
          gh release download "$RELEASE_TAG" --pattern 'discovery-*.tar.gz' --dir release-download
          for archive in release-download/discovery-*.tar.gz; do
            base="$(basename "$archive" .tar.gz)"
            mkdir -p "discovery-download/$base"
            tar -xzf "$archive" -C "discovery-download/$base"
          done
      - name: Rebuild canonical merge and GPT wide-read packets
        run: |
          python pipeline/merge_discovery.py --root discovery-download --out merged-repaired
          python pipeline/wide_read_packets.py --input merged-repaired/current_candidates.jsonl --out wide_read_packets_repaired --packet-size 250
          cat merged-repaired/stats.json
      - name: Persist repaired consolidated pack durably and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar -czf supergreen-wide-read-31840648379-repaired.tar.gz merged-repaired wide_read_packets_repaired
          cp merged-repaired/stats.json discovery-summary-31840648379-repaired.json
          gh release upload "$RELEASE_TAG" \
            supergreen-wide-read-31840648379-repaired.tar.gz \
            discovery-summary-31840648379-repaired.json --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > /tmp/assets.txt
          grep -Fxq supergreen-wide-read-31840648379-repaired.tar.gz /tmp/assets.txt
          grep -Fxq discovery-summary-31840648379-repaired.json /tmp/assets.txt
      - name: Temporary transport copy for GPT consumption only
        uses: actions/upload-artifact@v4
        with:
          name: repaired-wide-read-31840648379
          path: |
            merged-repaired/
            wide_read_packets_repaired/
          retention-days: 1
          compression-level: 9
