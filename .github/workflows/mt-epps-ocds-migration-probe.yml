name: Malta ePPS OCDS Migration Continuity Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mt-epps-ocds-migration-probe.yml'
      - 'pipeline/probe_mt_epps_ocds_migration.py'
      - 'control/mt_epps_ocds_migration_trigger.txt'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1, fetch-tags: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests
      - name: Inspect January 2023 production OCDS continuity
        shell: bash
        run: |
          set +e
          python pipeline/probe_mt_epps_ocds_migration.py
          rc=$?
          echo "probe_rc=$rc"
          exit 0
      - name: Persist continuity probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f control/mt_epps_ocds_migration_probe.json || printf '%s\n' '{"schema":"MALTA_EPPS_OCDS_MIGRATION_PROBE_WORKFLOW_FAILURE","pass":false}' > control/mt_epps_ocds_migration_probe.json
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add control/mt_epps_ocds_migration_probe.json
          git diff --cached --quiet && exit 0
          git commit -m "diag: persist Malta ePPS OCDS migration continuity ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
