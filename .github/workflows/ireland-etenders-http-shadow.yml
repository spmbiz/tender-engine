name: Ireland eTenders HTTP Shadow Canary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ireland-etenders-http-shadow.yml'

permissions:
  contents: write

concurrency:
  group: ireland-etenders-http-shadow
  cancel-in-progress: true

jobs:
  http-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        resource_id: ['8825829','8803742','8787124']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe anonymous ZIP endpoint over plain HTTP client
        shell: bash
        env:
          RESOURCE_ID: ${{ matrix.resource_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, zipfile
          from pathlib import Path
          import requests
          rid=os.environ['RESOURCE_ID']
          url=f'https://www.etenders.gov.ie/epps/cft/prepareAnonymousDownload.do?resourceId={rid}&isContract=null'
          s=requests.Session(); s.headers.update({'User-Agent':'Tender-Engine/ireland-http-shadow'})
          t=time.monotonic()
          r=s.get(url,timeout=60,allow_redirects=True)
          elapsed=time.monotonic()-t
          body=r.content or b''
          out=Path(f'http-shadow-{rid}.zip'); out.write_bytes(body)
          is_zip=body[:4]==b'PK\x03\x04' and zipfile.is_zipfile(out)
          names=[]
          if is_zip:
              with zipfile.ZipFile(out) as z: names=z.namelist()[:100]
          report={
            'schema':'IRELAND_ETENDERS_HTTP_SHADOW_V1','resource_id':rid,'url':url,
            'http_status':r.status_code,'final_url':r.url,'bytes':len(body),
            'elapsed_seconds':round(elapsed,3),'content_type':r.headers.get('content-type'),
            'content_disposition':r.headers.get('content-disposition'),'is_zip':is_zip,
            'zip_entries':names,'safe_for_http_first':bool(r.ok and is_zip and len(body)>1000),
          }
          Path(f'http-shadow-{rid}.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          if not report['safe_for_http_first']:
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ireland-http-shadow-${{ matrix.resource_id }}-${{ github.run_id }}
          path: http-shadow-${{ matrix.resource_id }}.json
          retention-days: 14

  aggregate:
    needs: http-shadow
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: ireland-http-shadow-*-${{ github.run_id }}
          path: shadow
          merge-multiple: true
      - name: Persist only if all three probes passed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, glob, os
          from datetime import datetime, timezone
          rows=[json.load(open(p)) for p in sorted(glob.glob('shadow/http-shadow-*.json'))]
          status='PASS' if len(rows)==3 and all(r.get('safe_for_http_first') for r in rows) else 'FAIL'
          out={'schema':'IRELAND_ETENDERS_HTTP_SHADOW_AGG_V1','generated_at':datetime.now(timezone.utc).isoformat(),'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),'status':status,'rows':rows,'production_enabled':False,'rule':'Shadow only. Production remains browser-capable until this canary passes and rollback A/B validates the adapter change.'}
          open('control/ireland_etenders_http_shadow_latest.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          if status!='PASS': raise SystemExit(1)
          PY
          git config user.name 'tender-engine-bot'
          git config user.email 'tender-engine-bot@users.noreply.github.com'
          git add control/ireland_etenders_http_shadow_latest.json
          git commit -m "bench(dce): persist Ireland HTTP shadow ${GITHUB_RUN_ID}"
          for n in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep "$((n*2))"
          done
          exit 1
