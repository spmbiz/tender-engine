name: Apply Proven Green Compatibility Entrypoints

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-green-compat-entrypoints.yml'
      - 'control/apply_green_compat_entrypoints_trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1, fetch-tags: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests beautifulsoup4 pytest
      - name: Require durable green proofs
        run: |
          python - <<'PY'
          import json
          proofs={
            'ES':json.load(open('control/es_placsp_live_proof.json')),
            'GR':json.load(open('control/gr_khmdhs_live_proof.json')),
            'IT':json.load(open('control/it_anac_pvl_full_reconcile_proof.json')),
          }
          assert proofs['ES'].get('pass') is True and proofs['ES'].get('publication_window_enumeration_complete') is True,proofs['ES']
          assert proofs['GR'].get('pass') is True and proofs['GR'].get('enumeration_complete') is True,proofs['GR']
          assert proofs['IT'].get('pass') is True and proofs['IT'].get('enumeration_complete') is True,proofs['IT']
          PY
      - name: Preserve legacy implementations and install wrappers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def preserve(path, legacy):
              p=Path(path); l=Path(legacy)
              if not l.exists():
                  l.write_text(p.read_text())

          # Spain V2 does not depend on the legacy entrypoint.
          preserve('pipeline/discover_es_placsp_atom.py','pipeline/discover_es_placsp_atom_legacy.py')
          Path('pipeline/discover_es_placsp_atom.py').write_text('''from __future__ import annotations\n\ntry:\n    from pipeline.discover_es_placsp_atom_v2 import main\nexcept ModuleNotFoundError:\n    from discover_es_placsp_atom_v2 import main\n\nif __name__ == "__main__":\n    main()\n''')

          # Greece V3 depends on V2, not the historical adapter.
          preserve('pipeline/discover_gr_khmdhs.py','pipeline/discover_gr_khmdhs_legacy.py')
          Path('pipeline/discover_gr_khmdhs.py').write_text('''from __future__ import annotations\n\ntry:\n    from pipeline.discover_gr_khmdhs_v3 import main\nexcept ModuleNotFoundError:\n    from discover_gr_khmdhs_v3 import main\n\nif __name__ == "__main__":\n    main()\n''')

          # Italy V4 imports parser helpers from the former entrypoint. Preserve it
          # first, retarget V4 to the immutable legacy helper module, then wrap the
          # historical filename around V4.
          preserve('pipeline/discover_it_anac_pvl.py','pipeline/discover_it_anac_pvl_legacy.py')
          v4=Path('pipeline/discover_it_anac_pvl_v4.py')
          text=v4.read_text()
          text=text.replace('from pipeline.discover_it_anac_pvl import analyse_template, clean, parse_iso','from pipeline.discover_it_anac_pvl_legacy import analyse_template, clean, parse_iso')
          text=text.replace('from discover_it_anac_pvl import analyse_template, clean, parse_iso','from discover_it_anac_pvl_legacy import analyse_template, clean, parse_iso')
          v4.write_text(text)
          Path('pipeline/discover_it_anac_pvl.py').write_text('''from __future__ import annotations\n\ntry:\n    from pipeline.discover_it_anac_pvl_v4 import main\nexcept ModuleNotFoundError:\n    from discover_it_anac_pvl_v4 import main\n\nif __name__ == "__main__":\n    main()\n''')
          PY
      - name: Regression gate wrappers and proven implementations
        run: |
          python -m py_compile \
            pipeline/discover_es_placsp_atom.py pipeline/discover_es_placsp_atom_legacy.py pipeline/discover_es_placsp_atom_v2.py \
            pipeline/discover_gr_khmdhs.py pipeline/discover_gr_khmdhs_legacy.py pipeline/discover_gr_khmdhs_v2.py pipeline/discover_gr_khmdhs_v3.py \
            pipeline/discover_it_anac_pvl.py pipeline/discover_it_anac_pvl_legacy.py pipeline/discover_it_anac_pvl_v4.py
          pytest -q tests/test_es_placsp_atom_v2.py tests/test_gr_khmdhs_v2.py tests/test_it_anac_pvl_v4.py tests/test_anac_pvl_api_contract.py
      - name: Commit compatibility routing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add pipeline/discover_es_placsp_atom.py pipeline/discover_es_placsp_atom_legacy.py pipeline/discover_gr_khmdhs.py pipeline/discover_gr_khmdhs_legacy.py pipeline/discover_it_anac_pvl.py pipeline/discover_it_anac_pvl_legacy.py pipeline/discover_it_anac_pvl_v4.py
          git diff --cached --quiet && exit 0
          git commit -m 'coverage: route proven ES GR IT through stable compatibility entrypoints'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
