name: DCE Fanout V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'queues/dce_candidates.jsonl'
      - 'pipeline/build_matrix.py'
      - 'pipeline/dce_worker.py'
      - 'pipeline/dce_worker_v2.py'
      - 'pipeline/ted_resolver.py'
      - 'pipeline/extract_corpus.py'
      - 'pipeline/extract_gates.py'
      - 'pipeline/aggregate_dce.py'
      - '.github/workflows/dce-fanout-v2.yml'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: matrix
        name: Compile candidate matrix from queue
        run: python pipeline/build_matrix.py --queue queues/dce_candidates.jsonl --max-jobs 80
      - uses: actions/upload-artifact@v4
        with:
          name: dce-matrix-${{ github.run_id }}
          path: |
            matrix.json
            matrix_skipped.json
          retention-days: 7

  dce-worker:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document extraction dependencies
        run: pip install requests pypdf python-docx openpyxl python-pptx
      - name: Install browser runtime when adapter needs it
        if: ${{ matrix.needs_browser }}
        run: |
          pip install 'playwright>=1.46,<2'
          python -m playwright install --with-deps chromium
      - name: Ensure 7z exists
        run: command -v 7z >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full)
      - name: Resolve route and retrieve authoritative DCE
        run: python pipeline/dce_worker_v2.py --queue queues/dce_candidates.jsonl --line ${{ matrix.line_no }} --out out
      - name: Recursively unpack and extract corpus
        run: python pipeline/extract_corpus.py --root out
      - name: Extract mandatory-gate evidence snippets
        run: python pipeline/extract_gates.py --root out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dce-${{ matrix.slug }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  aggregate:
    needs: [prepare, dce-worker]
    if: always() && needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dce-*
          path: dce-artifacts
          merge-multiple: true
      - name: Build GPT deep-review queue
        run: python pipeline/aggregate_dce.py --root dce-artifacts --out dce-aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: dce-deep-review-${{ github.run_id }}
          path: |
            dce-aggregate/
            dce-artifacts/
          if-no-files-found: error
          retention-days: 7
