name: DCE Fanout V2

on:
  workflow_dispatch:
    inputs:
      selection_path:
        description: Repo path to compact candidate selection manifest
        required: false
        default: 'queues/dce_selection_31840648379.jsonl'
      source_discovery_run:
        description: Canonical discovery run ID containing selected candidates
        required: false
        default: '31840648379'
      max_jobs:
        description: Maximum queue candidates to materialize
        required: false
        default: '500'
      max_parallel:
        description: Maximum GitHub shard runners in parallel; Team hard-cap 60 and normally supplied by the live fleet controller
        required: false
        default: '24'
      max_shards:
        description: Maximum queued matrix shards (1-256)
        required: false
        default: '256'
      jobs_per_shard:
        description: '0/1/2 = streaming kind-aware defaults; >2 = manual fixed target'
        required: false
        default: '0'
  push:
    branches: [main]
    paths:
      - 'benchmarks/dce-throughput-trigger.json'

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      shard_count: ${{ steps.matrix.outputs.shard_count }}
      max_parallel: ${{ steps.matrix.outputs.max_parallel }}
      release_tag: ${{ steps.release.outputs.tag }}
      queue_asset: ${{ steps.materialize.outputs.queue_asset }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: materialize
        name: Materialize selected queue from durable canonical discovery harvest
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.inputs.source_discovery_run || '31840648379' }}
          SELECTION_PATH: ${{ github.event.inputs.selection_path || 'queues/dce_selection_31840648379.jsonl' }}
        shell: bash
        run: |
          set -euo pipefail
          source_tag="discovery-harvest-${SOURCE_RUN}"
          mkdir -p source-release source-discovery generated queue-transport
          repaired="supergreen-wide-read-${SOURCE_RUN}-repaired.tar.gz"
          normal="supergreen-wide-read-${SOURCE_RUN}.tar.gz"
          assets="$(gh release view "$source_tag" --json assets --jq '.assets[].name')"
          if grep -Fxq "$repaired" <<< "$assets"; then
            source_asset="$repaired"
          elif grep -Fxq "$normal" <<< "$assets"; then
            source_asset="$normal"
          else
            echo "No canonical wide-read asset found in $source_tag" >&2
            exit 1
          fi
          gh release download "$source_tag" --pattern "$source_asset" --dir source-release
          tar -xzf "source-release/$source_asset" -C source-discovery
          candidates="$(find source-discovery -type f -name current_candidates.jsonl -print -quit)"
          [ -n "$candidates" ] || { echo 'current_candidates.jsonl missing from canonical source harvest'; exit 1; }
          python pipeline/materialize_dce_selection.py \
            --candidates "$candidates" \
            --selection "$SELECTION_PATH" \
            --out generated/dce_candidates.jsonl
          queue_asset="dce-candidate-queue-${GITHUB_RUN_ID}.jsonl"
          cp generated/dce_candidates.jsonl "$queue_asset"
          cp generated/dce_candidates.jsonl.summary.json "${queue_asset}.summary.json"
          cp "$SELECTION_PATH" "dce-selection-${GITHUB_RUN_ID}.jsonl"
          cp "$queue_asset" queue-transport/
          echo "queue_asset=$queue_asset" >> "$GITHUB_OUTPUT"
      - id: matrix
        name: Compile short browser/HTTP shard queue
        env:
          DCE_REQUESTED_MAX_PARALLEL: ${{ github.event.inputs.max_parallel || '24' }}
          DCE_MAX_SHARDS: ${{ github.event.inputs.max_shards || '256' }}
          DCE_TARGET_JOBS_PER_SHARD: ${{ github.event.inputs.jobs_per_shard || '0' }}
          DCE_BROWSER_TARGET_JOBS_PER_SHARD: '2'
          DCE_HTTP_TARGET_JOBS_PER_SHARD: '8'
          DCE_BROWSER_MAX_JOBS_PER_SHARD: '12'
          DCE_HTTP_MAX_JOBS_PER_SHARD: '32'
          MAX_DCE_JOBS: ${{ github.event.inputs.max_jobs || '500' }}
          DCE_BROWSER_LOCAL_CONCURRENCY: '2'
          DCE_HTTP_LOCAL_CONCURRENCY: '8'
        shell: bash
        run: |
          set -euo pipefail
          DCE_MAX_PARALLEL="$(python - <<'PY'
          import os
          try:
              requested=int(os.environ.get('DCE_REQUESTED_MAX_PARALLEL') or 24)
          except Exception:
              requested=24
          print(max(1,min(60,requested)))
          PY
          )"
          export DCE_MAX_PARALLEL
          echo "Dynamic runner safety clamp: DCE max_parallel=$DCE_MAX_PARALLEL (Team hard cap 60)"
          python pipeline/build_dce_shards.py --queue generated/dce_candidates.jsonl
      - id: release
        name: Create durable canonical harvest release
        if: steps.matrix.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="dce-harvest-${GITHUB_RUN_ID}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "DCE Harvest ${GITHUB_RUN_ID}" \
            --notes "Canonical durable DCE harvest. Shards publish guarded hot verdicts as soon as authoritative evidence is ready; canonical DCE packs are still aggregated durably. DOWNLOADED_PUBLIC is transport success only; evidence_quality.json determines whether retrieved material is authoritative enough for gate review."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Persist exact materialized queue and provenance durably
        if: steps.matrix.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          QUEUE_ASSET: ${{ steps.materialize.outputs.queue_asset }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "$QUEUE_ASSET" \
            "${QUEUE_ASSET}.summary.json" \
            "dce-selection-${GITHUB_RUN_ID}.jsonl" --clobber
      - name: Publish exact queue for worker transport
        if: steps.matrix.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: dce-queue-${{ github.run_id }}
          path: queue-transport/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Publish plan to job summary
        run: |
          cat dce_plan.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat dce_plan.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  dce-shard:
    name: shard-${{ matrix.shard }}-${{ matrix.kind }}-${{ matrix.count }}jobs
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover exact candidate queue from short-lived workflow transport
        uses: actions/download-artifact@v4
        with:
          name: dce-queue-${{ github.run_id }}
          path: generated
      - name: Normalize worker queue path
        env:
          QUEUE_ASSET: ${{ needs.prepare.outputs.queue_asset }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "generated/$QUEUE_ASSET"
          mv "generated/$QUEUE_ASSET" generated/dce_candidates.jsonl
      - name: Install only dependencies required by this shard
        shell: bash
        run: |
          set -euo pipefail
          deps=(requests pypdf python-docx openpyxl python-pptx)
          if [ '${{ matrix.needs_browser }}' = 'true' ]; then
            deps+=('playwright>=1.46,<2')
          fi
          python -m pip install --disable-pip-version-check -q "${deps[@]}"
      - name: Reuse runner Chrome for browser shards
        if: ${{ matrix.needs_browser }}
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$chrome" ]; then
            echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
            echo "Using preinstalled browser: $chrome"
          else
            echo "No system Chromium found; installing Playwright Chromium fallback"
            python -m playwright install --with-deps chromium
          fi
      - name: Ensure 7z only when missing
        shell: bash
        run: command -v 7z >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full)
      - name: Resolve DCE candidates
        env:
          DCE_LOCAL_CONCURRENCY: ${{ matrix.local_concurrency }}
          DCE_ITEM_RETRIES: '2'
          DCE_ITEM_TIMEOUT_SECONDS: '180'
        run: >-
          python pipeline/dce_batch_worker.py
          --queue generated/dce_candidates.jsonl
          --lines '${{ matrix.lines }}'
          --out out
          --concurrency '${{ matrix.local_concurrency }}'
      - name: Extract candidate corpora in parallel
        env:
          DCE_EXTRACT_WORKERS: '4'
        run: python pipeline/extract_corpus.py --root out
      - name: Classify whether retrieved material is authoritative DCE evidence
        run: python pipeline/dce_evidence_quality.py --root out
      - name: Extract mandatory-gate snippets only from gate-ready DCE corpora
        env:
          DCE_GATE_WORKERS: '4'
        run: python pipeline/extract_gates.py --root out
      - name: Build immediate per-shard review queue
        run: python pipeline/aggregate_dce.py --root out --out fast-aggregate
      - name: Prepare gate-ready DCE rows for GPT Web adjudication (API-free)
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/auto_adjudicate_dce.py \
            --queue fast-aggregate/deep_review_queue.jsonl \
            --out fast-adjudication \
            --max-model-reviews 0
      - name: Enforce deterministic final-verdict guard on hot verdicts
        run: python pipeline/final_verdict_guard.py --review fast-adjudication/adjudication.jsonl
      - name: Publish guarded shard verdict and refresh ChatGPT hot feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RUN_ID: ${{ github.run_id }}
          SHARD_ID: ${{ matrix.shard }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cp fast-adjudication/adjudication.jsonl "fast-adjudication-shard-${SHARD_ID}.jsonl"
          cp fast-adjudication/summary.json "fast-adjudication-summary-shard-${SHARD_ID}.json"
          cp fast-adjudication/supergreen_shortlist.json "fast-supergreen-shortlist-shard-${SHARD_ID}.json"
          for attempt in 1 2 3 4; do
            if gh release upload "$RELEASE_TAG" \
              "fast-adjudication-shard-${SHARD_ID}.jsonl" \
              "fast-adjudication-summary-shard-${SHARD_ID}.json" \
              "fast-supergreen-shortlist-shard-${SHARD_ID}.json" --clobber; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Failed to publish hot shard verdict assets" >&2
              exit 1
            fi
            sleep "$((attempt * 3))"
          done
          python pipeline/publish_supergreen_hot.py \
            --review fast-adjudication/adjudication.jsonl \
            --run-id "$RUN_ID" \
            --shard "$SHARD_ID" \
            --repo "$REPO"
          # Commits made by GITHUB_TOKEN do not create downstream push runs. The
          # hot shard therefore dispatches the user-facing inbox refresh explicitly.
          gh workflow run gpt-inbox-live-refresh.yml --ref main
      - name: Build canonical immutable packs and compact handoff
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/durable_dce_pack.py --root out --out-dir durable
          python pipeline/slim_dce_output.py --root out --out slim
          mv durable/canonical_index.json "canonical-index-shard-${{ matrix.shard }}.json"
          tar -C slim -czf "handoff-shard-${{ matrix.shard }}.tar.gz" .
          mkdir -p shard-transport
          cp durable/candidate-*.tar.gz shard-transport/
          cp "canonical-index-shard-${{ matrix.shard }}.json" shard-transport/
          cp "handoff-shard-${{ matrix.shard }}.tar.gz" shard-transport/
      - name: Publish shard output as short-lived immutable transport
        uses: actions/upload-artifact@v4
        with:
          name: dce-shard-${{ matrix.shard }}
          path: shard-transport/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  aggregate:
    needs: [prepare, dce-shard]
    if: always() && needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Recover every shard from short-lived workflow transport
        uses: actions/download-artifact@v4
        with:
          pattern: dce-shard-*
          path: shard-transport
          merge-multiple: true
      - name: Verify shard completeness and unpack compact handoffs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dce-artifacts
          count=0
          for archive in shard-transport/handoff-shard-*.tar.gz; do
            [ -e "$archive" ] || continue
            base="$(basename "$archive" .tar.gz)"
            mkdir -p "dce-artifacts/$base"
            tar -xzf "$archive" -C "dce-artifacts/$base"
            count=$((count + 1))
          done
          expected='${{ needs.prepare.outputs.shard_count }}'
          echo "expected_shards=$expected recovered_shards=$count"
          if [ "$count" -ne "$expected" ]; then
            echo "Expected $expected shard handoffs, got $count"
            exit 1
          fi
      - name: Canonical aggregate and benchmark metrics
        run: python pipeline/aggregate_dce.py --root dce-artifacts --out dce-aggregate
      - name: Build bounded durable Release bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-bundles
          python pipeline/bundle_dce_release.py --root shard-transport --out release-bundles --max-bytes 1200000000
          cp dce-aggregate/summary.json "dce-summary-${GITHUB_RUN_ID}.json"
          tar -C dce-aggregate -czf "dce-deep-review-${GITHUB_RUN_ID}.tar.gz" .
          indexes=(shard-transport/canonical-index-shard-*.json)
          if [ -e "${indexes[0]}" ]; then
            tar -cf "release-bundles/dce-shard-indexes-${GITHUB_RUN_ID}.tar" "${indexes[@]}"
          fi
      - name: Persist all DCE data through the single durable Release writer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          assets=(release-bundles/* "dce-summary-${GITHUB_RUN_ID}.json" "dce-deep-review-${GITHUB_RUN_ID}.tar.gz")
          for attempt in 1 2 3 4 5; do
            if gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Single-writer Release upload failed after bounded retries" >&2
              exit 1
            fi
            sleep "$((attempt * attempt * 15))"
          done
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > /tmp/release-assets.txt
          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            grep -Fxq "$name" /tmp/release-assets.txt || { echo "Durability verification failed for $name"; exit 1; }
          done
          echo "Durable canonical release: $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          cat "dce-summary-${GITHUB_RUN_ID}.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Wake the canonical Qwen DCE triage controller after durable persistence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run qwen-dce-drainer.yml --ref main
          echo "Canonical Qwen DCE drainer woken for durable DCE run $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Persist this exact attempt set and continue the unseen DCE queue immediately
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run dce-progress-ledger.yml --ref main \
            -f dce_run_id="$GITHUB_RUN_ID"
          echo "Direct DCE progress handoff dispatched for run $GITHUB_RUN_ID; no workflow_run event is required for continuation." >> "$GITHUB_STEP_SUMMARY"
