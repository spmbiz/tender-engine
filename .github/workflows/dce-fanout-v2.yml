name: DCE Fanout V2

on:
  workflow_dispatch:
    inputs:
      max_jobs:
        description: Maximum queue candidates to materialize
        required: false
        default: '320'
      max_parallel:
        description: Maximum GitHub shard runners in parallel (1-20)
        required: false
        default: '16'
      max_shards:
        description: Maximum dynamic shards (1-20)
        required: false
        default: '20'
      jobs_per_shard:
        description: Target candidates per shard before the 20-shard cap
        required: false
        default: '2'
  push:
    branches: [main]
    paths:
      - 'benchmarks/dce-throughput-trigger.json'

permissions:
  contents: read
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      shard_count: ${{ steps.matrix.outputs.shard_count }}
      max_parallel: ${{ steps.matrix.outputs.max_parallel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: matrix
        name: Compile dynamic browser/HTTP shards
        env:
          DCE_MAX_SHARDS: ${{ github.event.inputs.max_shards || '20' }}
          DCE_MAX_PARALLEL: ${{ github.event.inputs.max_parallel || '16' }}
          DCE_TARGET_JOBS_PER_SHARD: ${{ github.event.inputs.jobs_per_shard || '2' }}
          MAX_DCE_JOBS: ${{ github.event.inputs.max_jobs || '320' }}
          DCE_BROWSER_LOCAL_CONCURRENCY: '1'
          DCE_HTTP_LOCAL_CONCURRENCY: '4'
        run: python pipeline/build_dce_shards.py --queue queues/dce_candidates.jsonl
      - name: Publish plan to job summary only
        run: |
          cat dce_plan.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat dce_plan.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  dce-shard:
    name: shard-${{ matrix.shard }}-${{ matrix.kind }}-${{ matrix.count }}jobs
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only dependencies required by this shard
        shell: bash
        run: |
          set -euo pipefail
          deps=(requests pypdf python-docx openpyxl python-pptx)
          if [ '${{ matrix.needs_browser }}' = 'true' ]; then
            deps+=('playwright>=1.46,<2')
          fi
          python -m pip install --disable-pip-version-check -q "${deps[@]}"
      - name: Reuse runner Chrome for browser shards
        if: ${{ matrix.needs_browser }}
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$chrome" ]; then
            echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
            echo "Using preinstalled browser: $chrome"
          else
            echo "No system Chromium found; installing Playwright Chromium fallback"
            python -m playwright install --with-deps chromium
          fi
      - name: Ensure 7z only when missing
        shell: bash
        run: command -v 7z >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full)
      - name: Resolve DCE candidates
        env:
          DCE_LOCAL_CONCURRENCY: ${{ matrix.local_concurrency }}
          DCE_ITEM_RETRIES: '1'
          DCE_ITEM_TIMEOUT_SECONDS: '150'
        run: >-
          python pipeline/dce_batch_worker.py
          --queue queues/dce_candidates.jsonl
          --lines '${{ matrix.lines }}'
          --out out
          --concurrency '${{ matrix.local_concurrency }}'
      - name: Extract candidate corpora in parallel
        env:
          DCE_EXTRACT_WORKERS: '2'
        run: python pipeline/extract_corpus.py --root out
      - name: Extract mandatory-gate snippets in parallel
        env:
          DCE_GATE_WORKERS: '2'
        run: python pipeline/extract_gates.py --root out
      - name: Build compact inter-job handoff
        run: python pipeline/slim_dce_output.py --root out --out slim
      - uses: actions/upload-artifact@v4
        with:
          name: dce-shard-${{ github.run_id }}-${{ matrix.shard }}
          path: slim/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  aggregate:
    needs: [prepare, dce-shard]
    if: always() && needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dce-shard-${{ github.run_id }}-*
          path: dce-artifacts
          merge-multiple: true
      - name: Canonical aggregate and benchmark metrics
        run: python pipeline/aggregate_dce.py --root dce-artifacts --out dce-aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: dce-deep-review-${{ github.run_id }}
          path: |
            dce-aggregate/
            dce-artifacts/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
      - name: Delete current shard artifacts after successful consolidation
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.workflow_run.id == (env.GITHUB_RUN_ID | tonumber)) | [.id,.name,.size_in_bytes] | @tsv' > /tmp/current-artifacts.tsv
          deleted=0
          deleted_bytes=0
          while IFS=$'\t' read -r id name bytes; do
            case "$name" in
              dce-shard-${GITHUB_RUN_ID}-*)
                gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" >/dev/null
                deleted=$((deleted + 1))
                deleted_bytes=$((deleted_bytes + bytes))
                ;;
            esac
          done < /tmp/current-artifacts.tsv
          echo "Deleted $deleted temporary shard artifacts ($deleted_bytes bytes)"
          echo "temporary_artifacts_deleted=$deleted" >> "$GITHUB_STEP_SUMMARY"
          echo "temporary_bytes_deleted=$deleted_bytes" >> "$GITHUB_STEP_SUMMARY"
