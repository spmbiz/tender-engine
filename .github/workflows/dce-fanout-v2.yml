name: DCE Fanout V2

on:
  workflow_dispatch:
    inputs:
      selection_path:
        description: Repo path to compact candidate selection manifest
        required: false
        default: 'queues/dce_selection_31840648379.jsonl'
      source_discovery_run:
        description: Canonical discovery run ID containing selected candidates
        required: false
        default: '31840648379'
      max_jobs:
        description: Maximum queue candidates to materialize
        required: false
        default: '320'
      max_parallel:
        description: Maximum GitHub shard runners in parallel (1-20)
        required: false
        default: '20'
      max_shards:
        description: Maximum queued matrix shards (1-256)
        required: false
        default: '256'
      jobs_per_shard:
        description: '0 = adaptive sizing from candidate count and live runner budget; positive value = manual target'
        required: false
        default: '0'
  push:
    branches: [main]
    paths:
      - 'benchmarks/dce-throughput-trigger.json'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      shard_count: ${{ steps.matrix.outputs.shard_count }}
      max_parallel: ${{ steps.matrix.outputs.max_parallel }}
      release_tag: ${{ steps.release.outputs.tag }}
      queue_asset: ${{ steps.materialize.outputs.queue_asset }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: materialize
        name: Materialize selected queue from durable canonical discovery harvest
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.inputs.source_discovery_run || '31840648379' }}
          SELECTION_PATH: ${{ github.event.inputs.selection_path || 'queues/dce_selection_31840648379.jsonl' }}
        shell: bash
        run: |
          set -euo pipefail
          source_tag="discovery-harvest-${SOURCE_RUN}"
          mkdir -p source-release source-discovery generated
          repaired="supergreen-wide-read-${SOURCE_RUN}-repaired.tar.gz"
          normal="supergreen-wide-read-${SOURCE_RUN}.tar.gz"
          assets="$(gh release view "$source_tag" --json assets --jq '.assets[].name')"
          if grep -Fxq "$repaired" <<< "$assets"; then
            source_asset="$repaired"
          elif grep -Fxq "$normal" <<< "$assets"; then
            source_asset="$normal"
          else
            echo "No canonical wide-read asset found in $source_tag" >&2
            exit 1
          fi
          gh release download "$source_tag" --pattern "$source_asset" --dir source-release
          tar -xzf "source-release/$source_asset" -C source-discovery
          candidates="$(find source-discovery -type f -name current_candidates.jsonl -print -quit)"
          [ -n "$candidates" ] || { echo 'current_candidates.jsonl missing from canonical source harvest'; exit 1; }
          python pipeline/materialize_dce_selection.py \
            --candidates "$candidates" \
            --selection "$SELECTION_PATH" \
            --out generated/dce_candidates.jsonl
          queue_asset="dce-candidate-queue-${GITHUB_RUN_ID}.jsonl"
          cp generated/dce_candidates.jsonl "$queue_asset"
          cp generated/dce_candidates.jsonl.summary.json "${queue_asset}.summary.json"
          cp "$SELECTION_PATH" "dce-selection-${GITHUB_RUN_ID}.jsonl"
          echo "queue_asset=$queue_asset" >> "$GITHUB_OUTPUT"
      - id: matrix
        name: Compile adaptive browser/HTTP shard queue
        env:
          DCE_MAX_SHARDS: ${{ github.event.inputs.max_shards || '256' }}
          DCE_MAX_PARALLEL: ${{ github.event.inputs.max_parallel || '20' }}
          DCE_TARGET_JOBS_PER_SHARD: ${{ github.event.inputs.jobs_per_shard || '0' }}
          DCE_TARGET_WAVES: '1'
          DCE_BROWSER_MAX_JOBS_PER_SHARD: '12'
          DCE_HTTP_MAX_JOBS_PER_SHARD: '32'
          MAX_DCE_JOBS: ${{ github.event.inputs.max_jobs || '320' }}
          DCE_BROWSER_LOCAL_CONCURRENCY: '2'
          DCE_HTTP_LOCAL_CONCURRENCY: '8'
        run: python pipeline/build_dce_shards.py --queue generated/dce_candidates.jsonl
      - id: release
        name: Create durable canonical harvest release
        if: steps.matrix.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="dce-harvest-${GITHUB_RUN_ID}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "DCE Harvest ${GITHUB_RUN_ID}" \
            --notes "Canonical durable DCE harvest. DOWNLOADED_PUBLIC is transport success only; evidence_quality.json determines whether retrieved material is authoritative enough for gate review. Original public procurement files and extracted evidence are persisted as Release assets."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Persist exact materialized queue and provenance durably
        if: steps.matrix.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          QUEUE_ASSET: ${{ steps.materialize.outputs.queue_asset }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "$QUEUE_ASSET" \
            "${QUEUE_ASSET}.summary.json" \
            "dce-selection-${GITHUB_RUN_ID}.jsonl" --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > /tmp/assets.txt
          grep -Fxq "$QUEUE_ASSET" /tmp/assets.txt
          grep -Fxq "${QUEUE_ASSET}.summary.json" /tmp/assets.txt
          grep -Fxq "dce-selection-${GITHUB_RUN_ID}.jsonl" /tmp/assets.txt
      - name: Publish plan to job summary
        run: |
          cat dce_plan.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat dce_plan.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  dce-shard:
    name: shard-${{ matrix.shard }}-${{ matrix.kind }}-${{ matrix.count }}jobs
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover exact durable candidate queue
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          QUEUE_ASSET: ${{ needs.prepare.outputs.queue_asset }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated
          gh release download "$RELEASE_TAG" --pattern "$QUEUE_ASSET" --dir generated
          mv "generated/$QUEUE_ASSET" generated/dce_candidates.jsonl
      - name: Install only dependencies required by this shard
        shell: bash
        run: |
          set -euo pipefail
          deps=(requests pypdf python-docx openpyxl python-pptx)
          if [ '${{ matrix.needs_browser }}' = 'true' ]; then
            deps+=('playwright>=1.46,<2')
          fi
          python -m pip install --disable-pip-version-check -q "${deps[@]}"
      - name: Reuse runner Chrome for browser shards
        if: ${{ matrix.needs_browser }}
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$chrome" ]; then
            echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
            echo "Using preinstalled browser: $chrome"
          else
            echo "No system Chromium found; installing Playwright Chromium fallback"
            python -m playwright install --with-deps chromium
          fi
      - name: Ensure 7z only when missing
        shell: bash
        run: command -v 7z >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full)
      - name: Resolve DCE candidates
        env:
          DCE_LOCAL_CONCURRENCY: ${{ matrix.local_concurrency }}
          DCE_ITEM_RETRIES: '2'
          DCE_ITEM_TIMEOUT_SECONDS: '180'
        run: >-
          python pipeline/dce_batch_worker.py
          --queue generated/dce_candidates.jsonl
          --lines '${{ matrix.lines }}'
          --out out
          --concurrency '${{ matrix.local_concurrency }}'
      - name: Extract candidate corpora in parallel
        env:
          DCE_EXTRACT_WORKERS: '4'
        run: python pipeline/extract_corpus.py --root out
      - name: Classify whether retrieved material is authoritative DCE evidence
        run: python pipeline/dce_evidence_quality.py --root out
      - name: Extract mandatory-gate snippets only from gate-ready DCE corpora
        env:
          DCE_GATE_WORKERS: '4'
        run: python pipeline/extract_gates.py --root out
      - name: Build canonical durable packs and compact aggregate handoff
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/durable_dce_pack.py --root out --out-dir durable
          python pipeline/slim_dce_output.py --root out --out slim
          mv durable/canonical_index.json "canonical-index-shard-${{ matrix.shard }}.json"
          tar -C slim -czf "handoff-shard-${{ matrix.shard }}.tar.gz" .
      - name: Persist shard data durably to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          assets=(durable/candidate-*.tar.gz "canonical-index-shard-${{ matrix.shard }}.json" "handoff-shard-${{ matrix.shard }}.tar.gz")
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > /tmp/release-assets.txt
          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            grep -Fxq "$name" /tmp/release-assets.txt || { echo "Durability verification failed for $name"; exit 1; }
          done
          echo "Verified durable release upload for shard ${{ matrix.shard }}"

  aggregate:
    needs: [prepare, dce-shard]
    if: always() && needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download compact shard handoffs from durable Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p release-handoff dce-artifacts
          gh release download "$RELEASE_TAG" --pattern 'handoff-shard-*.tar.gz' --dir release-handoff
          count=0
          for archive in release-handoff/handoff-shard-*.tar.gz; do
            [ -e "$archive" ] || continue
            base="$(basename "$archive" .tar.gz)"
            mkdir -p "dce-artifacts/$base"
            tar -xzf "$archive" -C "dce-artifacts/$base"
            count=$((count + 1))
          done
          expected='${{ needs.prepare.outputs.shard_count }}'
          if [ "$count" -ne "$expected" ]; then
            echo "Expected $expected shard handoffs, got $count"
            exit 1
          fi
      - name: Canonical aggregate and benchmark metrics
        run: python pipeline/aggregate_dce.py --root dce-artifacts --out dce-aggregate
      - name: Persist consolidated deep-review pack durably
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          cp dce-aggregate/summary.json "dce-summary-${GITHUB_RUN_ID}.json"
          tar -C dce-aggregate -czf "dce-deep-review-${GITHUB_RUN_ID}.tar.gz" .
          gh release upload "$RELEASE_TAG" \
            "dce-summary-${GITHUB_RUN_ID}.json" \
            "dce-deep-review-${GITHUB_RUN_ID}.tar.gz" --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > /tmp/release-assets.txt
          grep -Fxq "dce-summary-${GITHUB_RUN_ID}.json" /tmp/release-assets.txt
          grep -Fxq "dce-deep-review-${GITHUB_RUN_ID}.tar.gz" /tmp/release-assets.txt
          echo "Durable canonical release: $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          cat "dce-summary-${GITHUB_RUN_ID}.json" >> "$GITHUB_STEP_SUMMARY"
