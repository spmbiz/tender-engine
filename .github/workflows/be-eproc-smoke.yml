name: Belgium eProc Source Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pipeline/discover_be_eproc_public.py'
      - 'control/be_eproc_test.txt'
      - '.github/workflows/be-eproc-smoke.yml'

permissions:
  contents: read

jobs:
  belgium:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q playwright
      - name: Syntax gate
        run: python -m py_compile pipeline/discover_be_eproc_public.py
      - name: Harvest Belgian public e-Procurement
        env:
          DISCOVERY_OUT: discovery/global/BE_EPROC_PUBLIC
          LOOKBACK_DAYS: '14'
          BE_SCAN_DAYS: '120'
          BE_MAX_PAGES: '220'
        run: python pipeline/discover_be_eproc_public.py
      - name: Verify materialization
        run: |
          python - <<'PY'
          import json
          s=json.load(open('discovery/global/BE_EPROC_PUBLIC/stats.json'))
          print(json.dumps(s,indent=2,ensure_ascii=False))
          assert not s.get('errors'), s
          assert s.get('raw_materialized',0)>0, s
          assert s.get('current_materialized',0)>0, s
          assert s.get('buyer_parsed',0)>0, s
          PY
          echo sample_current:
          head -n 3 discovery/global/BE_EPROC_PUBLIC/current.jsonl
