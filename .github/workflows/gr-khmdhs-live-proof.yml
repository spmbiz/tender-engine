name: Greece KIMDIS Future Deadline Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gr-khmdhs-live-proof.yml'
      - 'pipeline/discover_gr_khmdhs_v2.py'
      - 'pipeline/discover_gr_khmdhs_v3.py'
      - 'tests/test_gr_khmdhs_v2.py'
      - 'control/gr_khmdhs_live_trigger.txt'

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1, fetch-tags: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q requests pytest
      - name: Unit and syntax gate
        run: |
          python -m py_compile pipeline/discover_gr_khmdhs_v2.py pipeline/discover_gr_khmdhs_v3.py
          pytest -q tests/test_gr_khmdhs_v2.py
      - name: Enumerate future deadline windows
        id: run
        env:
          DISCOVERY_OUT: gr-live-proof
          GR_FINAL_HORIZON_YEAR: '2028'
          GR_FINAL_WINDOW_DAYS: '180'
          GR_WORKERS: '1'
          GR_RETRIES: '7'
          GR_MIN_REQUEST_INTERVAL_SECONDS: '0.50'
          GR_MAX_RETRY_AFTER_SECONDS: '90'
        shell: bash
        run: |
          set +e
          python pipeline/discover_gr_khmdhs_v3.py
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build compact verdict
        if: always()
        env:
          RUN_RC: ${{ steps.run.outputs.rc }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('gr-live-proof/stats.json')
          s=json.loads(p.read_text()) if p.exists() else {}
          try: rc=int(os.environ.get('RUN_RC') or 999)
          except Exception: rc=999
          passed=bool(
              rc==0
              and s.get('listing_contract')=='GR_KHMDHS_FUTURE_DEADLINE_WINDOWS_V3_PACED'
              and s.get('enumeration_complete') is True
              and s.get('enumeration_exhausted') is True
              and s.get('live_coverage_credit_allowed') is True
              and not (s.get('errors') or [])
              and s.get('windows_expected')==s.get('windows_completed')
              and int(s.get('current_materialized') or 0)>0
          )
          proof={
              'schema':'GR_KHMDHS_FUTURE_DEADLINE_PROOF_V3',
              'adapter_exit_code':rc,
              'listing_contract':s.get('listing_contract'),
              'deadline_horizon_end':s.get('deadline_horizon_end'),
              'window_days':s.get('window_days'),
              'workers':s.get('workers'),
              'min_request_interval_seconds':s.get('min_request_interval_seconds'),
              'windows_expected':s.get('windows_expected'),
              'windows_completed':s.get('windows_completed'),
              'verified_empty_404_windows':s.get('verified_empty_404_windows'),
              'source_rows_seen':s.get('source_rows_seen'),
              'current_materialized':s.get('current_materialized'),
              'enumeration_complete':s.get('enumeration_complete'),
              'errors':s.get('errors') or [],
              'pass':passed,
          }
          Path('control/gr_khmdhs_live_proof.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps(proof,indent=2))
          PY
      - name: Persist verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f control/gr_khmdhs_live_proof.json || printf '%s\n' '{"schema":"GR_KHMDHS_LIVE_PROOF_WORKFLOW_FAILURE","pass":false}' > control/gr_khmdhs_live_proof.json
          git config user.name tender-engine-bot
          git config user.email tender-engine-bot@users.noreply.github.com
          git add control/gr_khmdhs_live_proof.json
          git diff --cached --quiet && exit 0
          git commit -m "diag: persist Greece KIMDIS live proof ${GITHUB_RUN_ID}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*2))
          done
          exit 1
      - name: Enforce verdict
        if: always()
        run: python -c "import json; s=json.load(open('control/gr_khmdhs_live_proof.json')); raise SystemExit(0 if s.get('pass') is True else 3)"
