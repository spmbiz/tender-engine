name: Historical Australia Review Deliverables v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - historical_lab/australia_review_deliverable_decomposition_v1.py
      - .github/workflows/historical-australia-review-deliverables-v1.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q duckdb
      - name: Download canonical AusTender facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source out
          for a in historical_tenders.csv.gz awards.csv.gz; do
            gh release download tender-normalized-austender-v1 --repo walidgdg1-ai/coldemailtool --pattern "$a" --dir source --clobber
          done
      - name: Decompose review/evaluation deliverables
        run: python historical_lab/australia_review_deliverable_decomposition_v1.py --historical source/historical_tenders.csv.gz --awards source/awards.csv.gz --out out
      - name: Persist authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=historical-australia-review-deliverables-v1
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main --title 'Historical Australia Review Deliverables v1' --notes 'Historical component decomposition of policy evaluation, independent review, monitoring/evaluation and assurance work. Missing cues remain unknown.'
          gh release upload "$TAG" out/summary.json out/REPORT.md out/deliverable_matrix.csv out/component_prevalence.csv out/repeat_suppliers.csv out/examples.csv --repo "$GITHUB_REPOSITORY" --clobber
          mkdir -p control/historical_australia_review_deliverables_v1
          cp out/summary.json out/REPORT.md control/historical_australia_review_deliverables_v1/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/historical_australia_review_deliverables_v1/
          git commit -m 'historical: persist Australia review deliverables v1' || exit 0
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*3))
          done
          exit 1
