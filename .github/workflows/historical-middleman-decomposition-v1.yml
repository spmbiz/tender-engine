name: Historical Middleman Decomposition v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical-middleman-decomposition-v1.yml'
      - 'historical_lab/decompose_middleman_v1.py'
      - 'historical_lab/pipeline/**'

permissions:
  contents: write

concurrency:
  group: historical-middleman-decomposition-v1
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check -q duckdb
      - name: Download canonical Global Core facts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source out
          for a in historical_tenders.parquet awards.parquet award_suppliers.parquet; do
            gh release download tender-normalized-global-core-v4 --repo walidgdg1-ai/coldemailtool --pattern "$a" --dir source --clobber
          done
      - name: Decompose explicit intermediary markets
        run: |
          python historical_lab/decompose_middleman_v1.py \
            --historical source/historical_tenders.parquet \
            --awards source/awards.parquet \
            --bridge source/award_suppliers.parquet \
            --out out
      - name: Persist durable historical outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=historical-middleman-decomposition-v1
          if ! gh release view "$TAG" --repo walidgdg1-ai/tender-engine >/dev/null 2>&1; then
            gh release create "$TAG" --repo walidgdg1-ai/tender-engine --target main --title 'Historical Middleman Decomposition v1' --notes 'Historical-only decomposition of explicit intermediary/resale/staffing/fulfilment/standard-goods markets with buyer recurrence and fractionalized historical winner concentration.'
          fi
          rm -rf out/work.duckdb*
          for f in summary.json REPORT.md submarket_matrix.csv top_winners.csv top_buyers.csv examples.csv; do
            gh release upload "$TAG" "out/$f" --repo walidgdg1-ai/tender-engine --clobber
          done
          mkdir -p control/historical_middleman_decomposition_v1
          cp out/summary.json out/REPORT.md control/historical_middleman_decomposition_v1/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add control/historical_middleman_decomposition_v1/
          git commit -m 'historical: persist middleman decomposition v1' || exit 0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((i*3))
          done
          exit 1
